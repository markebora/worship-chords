<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Disciples</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f5f6f7;font-family:Arial,sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;background:#11151a}
header{padding:14px 18px;border-bottom:1px solid #293039;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.sub,.muted{color:#929ca6;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#272e36;color:#fff;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}.btn.primary,.btn.active{background:#fff;color:#111}
nav{display:flex;background:#151a20;border-bottom:1px solid #293039}nav button{flex:1;border:0;background:none;color:#8f99a4;padding:14px;font-weight:700;cursor:pointer}nav button.active{color:#fff;border-bottom:2px solid #fff}
main{padding:18px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.card,.item{background:#171c22;border:1px solid #293039;border-radius:14px;padding:15px;margin:9px 0}.item{display:flex;align-items:center;gap:10px}.itemmain{flex:1;min-width:0}.itemmain b{display:block}.itemmain span{display:block;color:#8e98a3;font-size:12px;margin-top:3px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:#11151a;padding:12px 0;z-index:10;border-bottom:1px solid #293039}.tabs button{white-space:nowrap;flex-shrink:0}.tabs button.sectionActive{background:#cfe8d5;color:#111}.card.sectionActive{background:#cfe8d5;border-color:#9ac9a5;color:#111}.card.sectionActive .part-title{color:#315c3b}.card.sectionActive .chordInput{color:#2f6b3d}
#content .card{scroll-margin-top:75px;height:auto!important;min-height:0!important}.editBanner{display:none;background:#fff;color:#111;padding:10px 13px;border-radius:10px;font-weight:800;margin:10px 0}.editMode .editBanner{display:block}.editSectionBtn{cursor:grab;touch-action:none}.editSectionBtn.dragging{opacity:.45;outline:2px dashed #72b7ff}.part-title{text-transform:uppercase;letter-spacing:1px;color:#aeb6bf;font-size:12px;margin-bottom:7px}.line{display:block;margin:0 0 4px}.chordInput{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:7px;color:#72b7ff;font:bold 16px monospace;padding:1px 5px;line-height:1.05;margin:0}.editMode .chordInput{border-color:#3a424c;background:#0e1115}.chordRow{min-height:18px}.lyricText{font-size:18px;padding:0 5px;line-height:1.1}.chordOnlyLine{display:block!important;margin:2px 0!important;padding:2px 7px!important;border-radius:8px;height:auto!important;min-height:0!important;line-height:1!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em!important}.editMode .chordOnlyLine{background:#0e1115;border:1px solid #3a424c}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#171c22;border-radius:20px 20px 0 0;padding:20px}.modal h2{margin-top:0}.input,.modal input,.modal textarea{width:100%;background:#0e1115;color:#fff;border:1px solid #343c45;border-radius:9px;padding:12px;font:inherit}.searchbox{display:flex;gap:8px;margin:15px 0}.searchbox input{flex:1}.keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.keybtn{padding:13px 5px;border:1px solid #343c45;border-radius:9px;background:#20262d;color:#fff;font-weight:800;cursor:pointer}.keybtn.selected{background:#cfe8d5;color:#111;border-color:#9ac9a5}.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#27303a;color:#aeb8c2;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:10px;font-weight:700;display:none;z-index:30}
.chordOnlyInner{display:flex!important;align-items:center!important;flex-wrap:nowrap!important}.chordOnlyInner .chordInput{display:inline-block!important;width:auto!important;flex:0 0 auto!important}.chordGroup{display:flex!important;align-items:center!important;gap:0!important;flex-wrap:nowrap!important}.chordGroupChord{font:bold 18px monospace;color:#72b7ff;white-space:nowrap}.chordSpace{white-space:pre}.chordGroupInput{display:inline-block!important;width:auto!important;min-width:2.2em!important}.chordOnlySection{display:table!important;width:100%!important;height:1px!important;min-height:0!important;max-height:none!important;padding:15px!important;overflow:visible!important}
nav{display:none!important}header>button[onclick="openSearch()"]{display:none!important}#songs>.row>button[onclick="openSearch()"]{display:none!important}#songs>.row .muted{display:none!important}#songs>.card>b,#songs>.card>.item{display:none!important}#songs>.row h1{font-size:0;margin:4px 0!important}#songs>.row h1:after{content:'Home';font-size:28px}
#song .row>div:first-child:before{content:'The Disciples';display:block;font-size:20px;font-weight:800;margin-bottom:2px}#song .row>div:first-child:after{content:'Soli Deo Gloria';display:block;color:#929ca6;font-size:13px;margin-bottom:8px}#song .row>div:first-child h1{margin-top:0!important}
@media(max-width:500px){.keygrid{grid-template-columns:repeat(3,1fr)}.lyricText{font-size:16px}.tabs{padding:10px 0}#content .card{scroll-margin-top:65px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">The Disciples</div><div class="sub">Soli Deo Gloria</div></div><button type="button" class="btn" onclick="openSearch()">🔎 Search Song</button></header>
<nav><button type="button" id="songsNav" class="active" onclick="showTab('songs')">Songs</button><button type="button" id="setlistsNav" onclick="showTab('setlists')">Setlists</button></nav>
<main id="songs"><div class="row"><div><h1 style="margin:4px 0">Song Library</h1></div><button type="button" class="btn primary" onclick="openSearch()">＋ Add / Search Song</button></div><div class="card"><b>Current song</b><div class="item" style="padding:10px 0;border:0"><div class="itemmain"><b id="libraryTitle">Way Maker</b><span id="libraryArtist">Sinach • Key C</span></div><button type="button" class="btn" onclick="openSong()">Open</button></div></div></main>
<main id="setlists" class="hidden"><div class="row"><div><h1 style="margin:4px 0">Setlists</h1><div class="muted">Your worship service songs</div></div><button type="button" class="btn primary" onclick="addSetSong()">＋ Add Song</button></div><div class="card" id="setlistBox"></div></main>
<main id="song" class="hidden"><div class="row"><div><h1 id="songTitle" style="margin:4px 0">Way Maker</h1><div class="muted"><span id="songArtist">Sinach</span> • Key: <span id="key">C</span></div></div><div class="controls"><button type="button" class="btn" onclick="showTab('songs')">← Home</button><button type="button" class="btn" id="editBtn" onclick="toggleEdit()">✎ Edit</button></div></div><div class="editBanner">✎ EDIT MODE — Drag the section buttons above to reorder them. Only chords are editable below.</div><div class="tabs" id="tabs"></div><div class="controls" style="margin:10px 0"><button type="button" class="btn" onclick="font(-1)">A−</button><button type="button" class="btn" onclick="font(1)">A+</button><button type="button" class="btn" onclick="autoScroll()">▶ Auto Scroll</button><button type="button" class="btn" onclick="transpose()">Transpose</button><button type="button" class="btn" id="saveBtn" onclick="saveLocal()" style="display:none">💾 Save</button></div><div id="content"></div></main>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
</div>
<script>
(function(){
 const scripts=['core-app.js','transpose-chord-bank.js','search-module.js','song-import.js','chord-families.js','song-manager.js','merge-songs.js','section-controls.js','key-consistency.js','analyzer-chord-fix.js','focused-chord-mode.js','analyzer-focused.js','analyzed-song-bridge.js','library-search-ui.js','app-navigation.js'];
 const version='20260820-architecture-1';
 let i=0;
 function loadNext(){
   if(i>=scripts.length){window.dispatchEvent(new Event('worship-app-ready'));return;}
   const s=document.createElement('script');
   s.src='./'+scripts[i++]+'?v='+version;
   s.onload=loadNext;
   s.onerror=()=>{console.error('Failed to load',s.src);loadNext();};
   document.body.appendChild(s);
 }
 loadNext();
})();
</script>
</body>
</html>
