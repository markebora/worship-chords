<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

/*
  "Liquid glass" press feedback — a soft, translucent water-like
  sheen (bright highlight fading to almost nothing) plus a light
  blur, used on every button/card's :active state instead of a
  flat gray tint. Two variants: the light one for elements that
  already sit on a dark, bordered surface (buttons), and a
  slightly stronger one for flatter surfaces (cards, rows) that
  need a touch more contrast to read as "pressed".
*/
:root{
  --liquid-press:
    radial-gradient(120% 140% at 30% -10%, rgba(255,255,255,.30), rgba(255,255,255,.06) 55%, rgba(255,255,255,0) 80%),
    rgba(255,255,255,.05);
  --liquid-press-soft:
    radial-gradient(120% 140% at 30% -10%, rgba(255,255,255,.20), rgba(255,255,255,.04) 55%, rgba(255,255,255,0) 80%),
    rgba(255,255,255,.03);
  --liquid-press-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 0 0 1px rgba(255,255,255,.06);
}

html,
body{
  margin:0;
  min-height:100%;

  background:#000000;
  color:#f7f7f7;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:920px;
  min-height:100vh;
  min-height:100dvh;

  background:#000000;

  position:relative;

  padding-top:calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px));
}


/* =========================================================
   STARTUP SPLASH

   Plain wordmark, no logo image — fades/rises in once, then a
   soft band of light keeps sweeping through the letters like a
   slow wave of color until the home screen is ready.
========================================================= */

#startupSplash{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000000;

  opacity:1;
  transition:opacity 0.9s ease;
}

#startupSplash.splashHidden{
  opacity:0;
  pointer-events:none;
}

#startupSplash #lockup{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#startupSplash #wordText{
  font-family:'Poppins', sans-serif;
  font-weight:800;
  font-size:56px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  white-space:nowrap;

  background:linear-gradient(
    90deg,
    #f7f4ee 0%,
    #f7f4ee 42%,
    #fffef9 50%,
    #f7f4ee 58%,
    #f7f4ee 100%
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  opacity:0;
  transform:translateY(14px);
  animation:
    splashWordIn .6s cubic-bezier(.2,.8,.3,1) forwards .2s,
    splashColorWave 3.4s linear infinite 1s;
}

@keyframes splashWordIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes splashColorWave{
  0%{ background-position:220% 0; }
  100%{ background-position:-220% 0; }
}

#startupSplash #tagline{
  margin-top:14px;

  font-family:'Poppins', sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#8a8a92;

  opacity:0;
  animation:splashTaglineIn .7s ease forwards 1.0s;
}

@keyframes splashTaglineIn{
  to{ opacity:1; }
}


/* =========================================================
   HEADER
========================================================= */

.top{
  padding:24px 22px 0;
}

.top.topHidden{
  display:none;
}

.welcome{
  font-size:15px;
  color:#a7a7ad;
  font-weight:600;
}

.hero{
  text-align:center;
  padding:42px 20px 48px;

  max-height:260px;

  opacity:1;

  overflow:hidden;

  transition:
    max-height .32s ease,
    padding .32s ease,
    opacity .22s ease;
}

.hero.heroHidden{
  max-height:0;

  padding-top:0;
  padding-bottom:0;

  opacity:0;
}

.hero h1{
  margin:0;

  font-size:42px;
  line-height:1.05;

  font-weight:800;
}

.hero p{
  margin:10px 0 0;

  color:#a7a7ad;
  font-size:15px;
}


/* =========================================================
   MAIN
========================================================= */

.content{
  padding:0 22px;
}

.content.screenTransition{
  animation:screenFadeIn .32s cubic-bezier(.22,.8,.36,1);
}

@keyframes screenFadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.placeholder{
  min-height:280px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#66666d;

  font-size:14px;
  text-align:center;
}


/* =========================================================
   COMMON BUTTONS
========================================================= */

.toolbarBtn,
.smallBtn,
.editorBtn,
.backBtn,
.goBtn,
.searchBtn,
.closeBtn{
  cursor:pointer;
}

.toolbarBtn{
  border:1px solid #303036;

  background:#1a1a1d;

  color:#eee;

  border-radius:10px;

  padding:9px 11px;

  font-size:12px;
  font-weight:700;
}

.toolbarBtn:hover{
  background:#222226;
}

.toolbarBtn.primary{
  background:#fff;
  color:#111;
}


/* =========================================================
   OPEN-SONG NAV INDICATOR (bouncing dots)
========================================================= */

.nav .icon{
  position:relative;
}

.navDots{
  display:none;

  position:absolute;
  inset:0;

  align-items:center;
  justify-content:center;

  gap:4px;
}

.navDots i{
  width:5px;
  height:5px;

  border-radius:50%;

  background:currentColor;

  animation:navDotBounce 1.1s ease-in-out infinite;
}

.navDots i:nth-child(2){
  animation-delay:.18s;
}

.navDots i:nth-child(3){
  animation-delay:.36s;
}

@keyframes navDotBounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

.nav button.songOpen .icon svg{
  display:none;
}

.nav button.songOpen .navDots{
  display:flex;
}


/* =========================================================
   FLOATING NAVIGATION
========================================================= */

.nav{
  position:fixed;

  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 24px);
  max-width:620px;

  height:60px;

  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  z-index:100;

  background:rgba(0,0,0,.48);

  border:1px solid rgba(255,255,255,.12);

  border-radius:20px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.nav button{
  flex:1;

  min-width:0;

  height:48px;

  border:0;
  border-radius:15px;

  background:transparent;

  color:rgba(255,255,255,.38);

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease,
    box-shadow .25s ease,
    backdrop-filter .25s ease;
}

.nav button.active{
  color:#fff;

  background:rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 0 14px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.nav .icon{
  width:24px;
  height:24px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:currentColor;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.30))
    drop-shadow(0 0 7px rgba(255,255,255,.12));
}

.nav .icon svg{
  width:22px;
  height:22px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.6;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button.active .icon{
  color:#fff;

  filter:
    drop-shadow(0 0 4px rgba(255,255,255,1))
    drop-shadow(0 0 9px rgba(255,255,255,.75))
    drop-shadow(0 0 18px rgba(255,255,255,.35));

  transform:translateY(-1px);
}

.nav button.active .icon svg{
  stroke-width:1.85;
}

.nav button:active{
  transform:scale(.94);

  background:var(--liquid-press-soft);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:var(--liquid-press-shadow);
}


/* =========================================================
   HOME
========================================================= */

.homePage{
  padding-bottom:30px;
}

.homeActions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.homeCard{
  padding:18px;

  border:1px solid #29292e;

  border-radius:15px;

  background:#18181b;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .2s ease,
    box-shadow .2s ease,
    backdrop-filter .2s ease;
}

.homeCard:active{
  transform:scale(.98);

  background:var(--liquid-press), #18181b;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--liquid-press-shadow);
}

.homeCardIcon{
  width:26px;
  height:26px;

  margin-bottom:12px;

  color:#fff;
}

.homeCardIcon svg{

  stroke:currentColor;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.homeCardTitle{

  font-weight:800;
}

.homeCardText{

  font-size:12px;

  line-height:1.5;
}


/* =========================================================
   PROFILE
========================================================= */

  font-weight:800;

.profileAvatar img{

}

  font-weight:800;

.profileEmail{

  font-size:12.5px;

  text-overflow:ellipsis;

}

.profileSection{

}

.profileStats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));

}

.profileStatCard{
  border:1px solid #303036;
  border-radius:14px;
  background:#18181b;
  padding:13px 10px;
  text-align:center;
}

.profileStatValue{

  font-weight:800;
  line-height:1.1;
}

.profileStatLabel{
  margin-top:4px;
  font-size:10.5px;
  color:#85858c;

  letter-spacing:.06em;

}

.settingsCard{

.settingsRow{

.stepper{

.stepperBtn{

.toolbarBtn.danger{

}

.settingsCardPad{

}

.googleClientIdInput{

  margin-top:10px;

  padding:11px 12px;

  border-radius:10px;

  color:#eee;

}

.profileAbout{
  text-align:center;

  margin-top:26px;

  color:#5c5c63;

  font-size:11.5px;

  line-height:1.7;
}


/* =========================================================
   LYRICS WORKSPACE
========================================================= */

.lyricsWorkspace{
  padding:4px 0 30px;
}

.lyricsWorkspaceHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:18px;
}

.lyricsWorkspaceTitle{

}

.lyricsWorkspaceSub{

}

.lyricsActions{

  grid-template-columns:

.lyricsAction{

.lyricsActionIcon{

.lyricsActionIcon.importIcon{

}

  padding:6px;
  border-radius:10px;

.lyricsActionIcon svg{
  width:100%;

  stroke:currentColor;

  stroke-width:1.7;

  stroke-linejoin:round;
}

.lyricsActionTitle{
  margin-top:7px;

  font-weight:800;
}

.lyricsActionSub{
  margin-top:3px;

  color:#777780;

  font-size:11px;
}

.recentTitle{
  margin:20px 0 9px;

  color:#777780;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.09em;

  font-weight:800;
}


/* =========================================================
   LIBRARY
========================================================= */

.libraryHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.libraryTitle{
  font-size:28px;
  font-weight:800;
}

.searchBtn{
  width:44px;
  height:44px;

  border:1px solid #303036;

  border-radius:14px;

  background:#1a1a1d;

  color:#fff;

  display:grid;
  place-items:center;
}

.searchBtn svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.librarySection{
  margin:22px 0;
}

.sectionLabel{

  letter-spacing:.09em;

    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease,
    backdrop-filter .2s ease;
}

.songCard:active{

}

.songIcon{

  height:38px;

  flex-shrink:0;

  border-radius:10px;

  background:#232328;

  display:grid;
  place-items:center;

  color:#fff;
}

.songIcon svg{
  width:17px;
  height:17px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.songInfo{
  flex:1;

  min-width:0;
}

.songName{
  font-weight:750;

  display:flex;
  align-items:center;
  min-width:0;
}

.songNameText{
  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  min-width:0;
}

.songMeta{
  font-size:12px;

  color:#777780;

  margin-top:3px;
}

.unsavedDot{

  width:6px;
  height:6px;

.homeSection{

}

.mergedPill{

  flex-direction:column;

  padding:32px 20px;

  border:1px dashed #303036;

  font-size:13px;

.emptyIcon{

  place-items:center;

  border-radius:50%;

  color:#4d4d55;

  margin-bottom:2px;
}

.emptyIcon svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.emptyAction{
  margin-top:4px;

  border:0;
  border-radius:11px;

  background:#fff;
  color:#111;

  font-size:13px;
  font-weight:800;

  padding:9px 18px;

  cursor:pointer;
}


/* =========================================================
   SEARCH MODAL
========================================================= */

.modalBack{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,0);

  z-index:500;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear .25s;
}

.modalBack.open{
  opacity:1;

  visibility:visible;

  pointer-events:auto;

  background:rgba(0,0,0,.68);

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear 0s;
}

.modal{
  width:min(920px,100%);

  max-height:88vh;

  overflow:auto;

  background:#151518;

  border:1px solid #2d2d32;

  border-radius:22px 22px 0 0;

  padding:20px;

  transform:translateY(28px);

  transition:transform .3s cubic-bezier(.22,.8,.36,1);
}

.modalBack.open .modal{
  transform:translateY(0);
}

.modalTop{
  display:flex;

  align-items:center;

  gap:12px;
}

.modalTop h2{
  margin:0;

  font-size:20px;

  flex:1;
}

.closeBtn{
  border:0;

  background:#242429;

  color:#ddd;

  border-radius:10px;

  padding:9px 12px;
}

.searchBox{
  display:flex;

  gap:8px;

  margin:16px 0 12px;
}

.searchInput{
  flex:1;

  min-width:0;

  background:#0e0e10;

  border:1px solid #34343a;

  color:#fff;

  border-radius:12px;

  padding:13px 14px;

  outline:none;
}

.goBtn{
  border:0;

  border-radius:12px;

  padding:0 16px;

  background:#fff;

  color:#111;

  font-weight:800;
}

.sourceTabs{
  display:flex;

  gap:8px;

  margin-bottom:14px;
}

.sourceTabs button{
  flex:1;

  border:1px solid #303036;

  background:#1b1b1f;

  color:#9999a2;

  border-radius:10px;

  padding:10px;

  font-size:12px;

  font-weight:750;

  cursor:pointer;
}

.sourceTabs button.active{
  background:#29292e;

  color:#fff;

  border-color:#44444b;
}

.result{
  padding:13px 0;

  border-top:1px solid #29292e;
}

.result:first-child{
  border-top:0;
}

.resultTitle{
  font-weight:750;
}

.resultMeta,
.hint{
  font-size:12px;

  color:#777780;

  line-height:1.5;

  margin-top:5px;
}

.ugPasteHint{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:11px;
  padding:11px 12px;
  background:#15201c;
  border:1px solid #234a3a;
  border-radius:12px;
  animation:songCheckPop .18s ease;
}

.ugPasteHintText{
  flex:1;
  min-width:0;
  font-size:12px;
  color:#a9d9c4;
  line-height:1.5;
}

.ugPasteBtn{
  flex:0 0 auto;
  white-space:nowrap;
}

.resultActions{
  display:flex;

  gap:7px;

  margin-top:9px;

  flex-wrap:wrap;
}

.driveStatus{
  padding:12px;

  background:#1a1a1d;

  border-radius:12px;

  color:#aaa;

  font-size:13px;

  line-height:1.5;

  margin-top:10px;
}


/* =========================================================
   SONG VIEWER
========================================================= */

.songPage{
  padding:4px 0 30px;
}

.songTop{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.backBtn{
  border:0;

  background:#25252a;

  color:#fff;

  border-radius:10px;

  padding:9px 12px;
}

.songHeading{
  flex:1;

  min-width:0;
}

.songHeading h1{
  margin:0;

  font-size:26px;

  line-height:1.15;
}

.songHeading p{
  margin:5px 0 0;

  color:#85858c;

  font-size:13px;
}

.songToolbar{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-bottom:14px;
}

.toolbarRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  flex-wrap:wrap;
}

.toolbarRow.secondaryRow{
  justify-content:flex-start;
}

.viewModeGroup{
  display:flex;

  width:100%;

  gap:4px;

  background:#1b1b1f;

  border:1px solid #303036;

  border-radius:13px;

  padding:4px;
}

.viewModeBtn{
  flex:1;

  border:0;

  background:transparent;

  color:#9999a2;

  border-radius:9px;

  padding:9px 10px;

  font-size:13px;
  font-weight:800;

  cursor:pointer;

  touch-action:manipulation;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:background .18s ease,color .18s ease;
}

.viewModeBtn.active{
  background:#fff;
  color:#111;
}

.mdModeBadge{
  display:inline-block;
  vertical-align:top;

  margin-left:5px;

  background:#7aa2f7;
  color:#0d0d0f;

  border-radius:5px;

  padding:1px 5px;

  font-size:9px;
  font-weight:900;
  letter-spacing:.03em;
}

.viewModeBtn.mdActive:not(.active){
  color:#7aa2f7;
}

.mdAvailableDot{
  display:inline-block;
  vertical-align:top;

  width:6px;
  height:6px;

  margin-left:5px;
  margin-top:2px;

  background:#7aa2f7;
  border-radius:50%;

  animation:mdAvailablePulse 2.2s ease-in-out infinite;
}

@keyframes mdAvailablePulse{
  0%,100%{opacity:.5;}
  50%{opacity:1;}
}


/* =========================================================
   SONG FLOW
========================================================= */

.flowView{
  padding:6px 16px 14px;
}

.flowList{
  display:flex;
  flex-direction:column;
  gap:0;

  margin-bottom:10px;
}

/* Section cards — deliberately reuse .songSection/.songSectionName/
   .songLine so Flow mode looks like the real chart, not a form. */

.flowSectionCard{
  position:relative;

  padding:4px 4px;

  border-bottom:1px solid #1e1e21;

  cursor:pointer;
  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.flowSectionCard:last-child{
  border-bottom:0;
}

.flowSectionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.flowSectionNameGroup{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:2px;

  flex:1;
  min-width:0;
}

.flowSideNoteSlot:empty{
  display:none;
}

.flowSideNote{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-left:6px;

  background:rgba(231,201,138,.1);
  border:1px dashed rgba(231,201,138,.4);
  border-radius:999px;

  padding:3px 5px 3px 10px;

  font-size:11.5px;
  font-style:italic;
  color:#e6c98a;

  max-width:44vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.flowSideNoteDelete{
  width:16px;
  height:16px;
  flex:0 0 auto;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.08);
  color:#ff9b9b;

  font-size:9px;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.flowSideNoteEditWrap{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-left:6px;
}

.flowSideNoteInput{
  margin-left:0;

  min-width:100px;
  max-width:40vw;

  background:rgba(231,201,138,.08);
  border:1px dashed rgba(231,201,138,.5);
  border-radius:999px;

  color:#e6c98a;
  font-style:italic;
  font-size:12px;

  padding:4px 11px;
}

.flowSideNoteInput::placeholder{
  color:#8a7c58;
}

.flowSideNoteConfirm{
  width:22px;
  height:22px;
  flex:0 0 auto;

  border:1px solid rgba(158,231,132,.5);
  border-radius:50%;

  background:rgba(158,231,132,.12);
  color:#9ee784;

  font-size:11px;
  font-weight:800;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.flowKeyChangeBadge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-left:6px;

  background:rgba(122,162,247,.12);
  border:1px dashed rgba(122,162,247,.5);
  border-radius:999px;

  padding:3px 10px;

  font-size:11.5px;
  font-weight:700;
  color:#7aa2f7;

  cursor:pointer;
  white-space:nowrap;
}

.flowKeyChangePanel[hidden]{
  display:none;
}

.flowKeyChangePanel:not([hidden]){
  margin-top:8px;
}

.flowKeyChangeControls{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;

  padding:8px 10px;

  background:rgba(122,162,247,.07);
  border:1px dashed rgba(122,162,247,.35);
  border-radius:10px;

  cursor:default;
}

.flowKeyChangeLabel{
  font-size:11.5px;
  line-height:1.4;
  color:#9aa5d1;

  flex:1 1 160px;
  min-width:140px;
}

.flowKeyChangeClear{
  border:0;
  background:transparent;

  color:#ff8b8b;
  font-size:11.5px;

  cursor:pointer;
}

/* Hidden until the card is long-pressed. */

.flowItemControls{
  display:flex;
  align-items:center;
  gap:4px;

  flex:0 0 auto;

  opacity:0;
  transform:translateX(4px);

  pointer-events:none;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.flowSectionCard.controlsRevealed .flowItemControls{
  opacity:1;
  transform:translateX(0);

  pointer-events:auto;
}

.flowSectionCard.controlsRevealed{
  background:rgba(255,255,255,.035);
  border-radius:10px;
}

/* Notes keep their controls visible as before — only section
   cards hide theirs behind a long-press. */

.flowItemControlsStatic{
  opacity:.55;
  transform:none;
  pointer-events:auto;
}

.flowMoveBtn,
.flowDupBtn,
.flowAddNoteInlineBtn,
.flowDeleteBtn{
  width:24px;
  height:24px;

  border:1px solid #303036;
  border-radius:7px;

  background:#1a1a1d;
  color:#c9c9ce;

  font-size:11px;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.flowMoveBtn:disabled{
  opacity:.3;
}

.flowDeleteBtn{
  color:#ff8b8b;
}

.flowDupBtn{
  font-size:13px;
}

.flowAddNoteInlineBtn{
  font-size:12px;
  color:#e6c98a;
}

.flowKeyChangeBtn{
  width:24px;
  height:24px;

  border:1px solid #303036;
  border-radius:7px;

  background:#1a1a1d;
  color:#7aa2f7;

  font-size:12px;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.flowDragHandle{
  width:22px;
  height:24px;

  border:0;
  background:transparent;
  color:#8a8a92;

  font-size:15px;
  line-height:1;

  display:grid;
  place-items:center;

  cursor:grab;
  touch-action:none;
}

.flowSectionCard.dragging,
.flowBetweenNote.dragging{
  opacity:.4;
}

.flowSectionDot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:7px;

  border-radius:50%;

  vertical-align:middle;
}

.flowRepeatBadge{
  margin-left:7px;

  font-size:10.5px;
  font-weight:800;
  color:#a7a7ad;

  background:rgba(255,255,255,.08);
  border-radius:999px;

  padding:1px 7px;

  vertical-align:middle;
}

@keyframes flowJumpFlash{
  0%{ background:rgba(255,255,255,.16); }
  100%{ background:transparent; }
}

.flowJumpFlash{
  animation:flowJumpFlash 1.1s ease;
  border-radius:10px;
}

.flowSectionLines{
  border-left:2px solid #2d2d32;
  padding-left:12px;
}

.flowLineWrap{
  position:relative;

  display:flex;
  align-items:baseline;
  flex-wrap:wrap;

  cursor:pointer;

  border-radius:6px;

  transition:background .15s ease,backdrop-filter .15s ease;
}

.flowView .flowLineWrap:active{
  background:var(--liquid-press-soft);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

/* Note attached above a line — its own row, tucked between the
   previous line and this one, like a margin cue written in. */

.flowLineNoteAbove{
  display:flex;
  align-items:center;
  gap:6px;

  margin:4px 0;
}

.flowLineNoteInput{
  flex:1;

  resize:none;

  background:rgba(231,201,138,.08);
  border:1px dashed rgba(231,201,138,.4);
  border-radius:8px;

  color:#e6c98a;
  font-style:italic;
  font-size:12.5px;
  line-height:1.4;

  padding:5px 9px;

  min-height:30px;
}

/* Note attached beside a line — an inline tag right after the
   line's own text, same row. */

.flowLineNoteBeside{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-left:8px;

  background:rgba(231,201,138,.1);
  border:1px dashed rgba(231,201,138,.4);
  border-radius:999px;

  padding:2px 4px 2px 9px;
}

.flowLineNoteBesideInput{
  background:transparent;
  border:0;

  color:#e6c98a;
  font-style:italic;
  font-size:12px;

  width:90px;
}

.flowLineNoteInput::placeholder,
.flowLineNoteBesideInput::placeholder{
  color:#8a7c58;
}

.flowLineNoteDelete{
  width:18px;
  height:18px;

  flex:0 0 auto;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.08);
  color:#ff9b9b;

  font-size:10px;

  display:grid;
  place-items:center;

  cursor:pointer;
}

/* Note sitting between two whole sections in the arrangement. */

.flowBetweenNote{
  display:flex;
  align-items:flex-start;
  gap:10px;

  background:rgba(231,201,138,.06);
  border:1px dashed rgba(231,201,138,.35);
  border-radius:12px;

  padding:8px 12px;
  margin:4px 0;
}

.flowNoteInput{
  flex:1;

  min-height:38px;

  resize:vertical;

  background:transparent;
  border:0;

  color:#e6c98a;
  font-style:italic;

  font-size:13.5px;
  line-height:1.5;

  padding:2px 0;
}

.flowNoteInput::placeholder{
  color:#6b6b72;
  font-style:italic;
}

.flowAddRow{
  display:flex;
  gap:8px;
}

.flowAddRow .toolbarBtn{
  flex:1;
}

/* Shared shape for every translucent "pill" chip in the app —
   flowSideNote, flowKeyChangeBadge, mdNotePill, and this base
   class all use the same dashed-border, fully-rounded shape.
   New pill/badge additions should add "pillNote" alongside
   their own class and only define background/border-color/
   color for their accent — everything else comes from here,
   so new chips automatically stay visually locked in sync with
   the existing ones instead of redefining the shape by hand. */

.pillNote{
  display:inline-block;

  border-style:dashed;
  border-width:1px;
  border-radius:999px;

  padding:4px 11px;

  font-style:italic;
  font-size:11.5px;
  line-height:1.3;
}

/* Read-only rendering of MD-Mode notes, inside the actual
   Chords/Lyrics view once a custom flow exists for a song.
   Each note stays right beside whatever it annotates — the
   section name, or the line — but as its own separated pill
   with a highlighted, translucent background, rather than
   blended into that text. */

.mdNotePill{
  display:inline-block;

  background:rgba(231,201,138,.14);
  border:1px dashed rgba(231,201,138,.45);
  border-radius:999px;

  padding:4px 11px;

  color:#e6c98a;
  font-style:italic;
  font-weight:500;
  font-size:12px;
  line-height:1.3;

  white-space:pre-wrap;
}

.mdNotePillSection{
  font-size:11.5px;
}

.mdNotePillAbove{
  margin:4px 0;
}

.mdNotePillBeside{
  margin-left:8px;
  vertical-align:middle;
}

.flowNoteBlock{
  margin:14px 0;
  padding:12px 14px;

  background:rgba(231,201,138,.08);
  border:1px dashed rgba(231,201,138,.4);
  border-radius:12px;

  color:#e6c98a;
  font-style:italic;
  font-size:13.5px;
  line-height:1.5;

  white-space:pre-wrap;
}

.flowNoteCheckBtn{
  width:24px;
  height:24px;

  border:1px solid rgba(158,231,132,.5);
  border-radius:7px;

  background:rgba(158,231,132,.12);
  color:#9ee784;

  font-size:12px;
  font-weight:800;

  display:grid;
  place-items:center;

  cursor:pointer;
}

.flowNoteConfirmed{
  align-items:center;
  background:rgba(231,201,138,.1);
}

.flowNoteConfirmedText{
  flex:1;

  color:#e6c98a;
  font-style:italic;
  font-size:13.5px;
  line-height:1.5;

  white-space:pre-wrap;
  cursor:text;
}

/* Divider shown in the read-only Chords/Lyrics view at the
   point a key change takes effect. */

.flowKeyChangeDivider{
  display:flex;
  align-items:center;
  gap:8px;

  margin:18px 0 10px;

  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#7aa2f7;
}

.flowKeyChangeDivider::before,
.flowKeyChangeDivider::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(122,162,247,.35);
}

.flowKeyChangeDivider.keyChangeFlash{
  border-radius:8px;
  animation:keyChangeFlashPulse .9s ease-out;
}

@keyframes keyChangeFlashPulse{
  0%{
    background:rgba(122,162,247,.24);
    box-shadow:0 0 0 0 rgba(122,162,247,.5);
  }
  100%{
    background:rgba(122,162,247,0);
    box-shadow:0 0 0 14px rgba(122,162,247,0);
  }
}

.longPressHintBanner{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top, 0px));
  left:50%;
  z-index:500;

  display:flex;
  align-items:center;
  gap:10px;

  max-width:calc(100% - 32px);
  width:420px;

  background:rgba(122,162,247,.16);
  border:1px solid rgba(122,162,247,.4);
  border-radius:14px;

  padding:10px 12px;

  color:#dfe6ff;
  font-size:12.5px;
  line-height:1.4;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 10px 26px rgba(0,0,0,.4);

  opacity:0;
  transform:translateX(-50%) translateY(-12px);
  transition:opacity .26s ease, transform .26s ease;
}

.longPressHintBanner.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.longPressHintClose{
  flex:0 0 auto;

  width:22px;
  height:22px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.14);
  color:#fff;

  font-size:11px;

  cursor:pointer;
}

.transposeGroup,
.autoScrollGroup{
  display:flex;

  align-items:center;

  gap:8px;
}

.songMenuWrap{
  position:relative;

  margin-left:auto;
}

.songMenuBtn{
  width:40px;

  font-size:18px;

  line-height:1;

  padding:9px 0;
}

.songMenuDropdown{
  position:absolute;

  top:calc(100% + 6px);
  right:0;

  min-width:180px;

  background:#1b1b1f;

  border:1px solid #303036;

  border-radius:13px;

  padding:6px;

  display:none;

  flex-direction:column;

  gap:2px;

  z-index:60;

  box-shadow:0 14px 34px rgba(0,0,0,.55);
}

.songMenuDropdown.open{
  display:flex;
}

.songMenuItem{
  border:0;

  background:transparent;

  color:#f7f7f7;

  text-align:left;

  padding:11px 12px;

  border-radius:9px;

  font-size:13px;
  font-weight:750;

  cursor:pointer;

  transition:background .15s ease,backdrop-filter .15s ease;
}

.songMenuItem:active{
  background:var(--liquid-press-soft);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.autoScrollGroup .toolbarBtn,
.asArrowBtn{
  touch-action:none;
}

.asToggleWrap{
  display:inline-flex;

  align-items:center;

  gap:0;
}

.asToggleBtn{
  min-width:40px;

  text-align:center;

  user-select:none;
  -webkit-user-select:none;

  outline:none;
}

.asPlayIcon{
  display:inline-block;

  width:0;
  height:0;

  margin-left:2px;

  border-style:solid;
  border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent currentColor;
}

.asPauseIcon{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:3px;
}

.asPauseIcon i{
  display:block;

  width:3px;
  height:12px;

  background:currentColor;
  border-radius:1px;
}

.asArrowBtn{
  width:0;

  height:40px;

  padding:0;

  border:0;
  background:transparent;

  color:#cfcfd4;

  font-size:15px;
  line-height:1;

  cursor:pointer;

  opacity:0;

  overflow:hidden;

  transition:width .2s ease,opacity .2s ease,margin .2s ease;

  pointer-events:none;
}

.asToggleWrap.speedMode .asArrowBtn{
  width:24px;

  opacity:1;

  pointer-events:auto;
}

.asToggleWrap.speedMode .asArrowUp{
  margin-right:2px;
}

.asToggleWrap.speedMode .asArrowDown{
  margin-left:2px;
}

.asArrowBtn:active{
  color:#fff;
}

.asToggleWrap.speedMode .asToggleBtn{
  background:#fff;
  color:#111;

  border-color:#fff;
}

.lyricsView{
  background:#0e0e10;

  border:1px solid #29292e;

  border-radius:14px;

  padding:12px 6px 12px 8px;

  white-space:pre-wrap;

  font:
    15px/1.75
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  overflow:auto;

  min-height:300px;

  text-align:left;
}


/* =========================================================
   STRUCTURED SONG DISPLAY
========================================================= */

.songFixedHeader{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0 -1px 14px;padding:10px 0;border-bottom:1px solid #29292e;}
.songHeaderTop{display:flex;align-items:center;gap:10px;min-width:0;padding:0 1px;}
.songBackBtn{flex:0 0 auto;width:34px;height:34px;border:1px solid #303036;background:#18181b;color:#f7f7f7;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,border-color .18s ease,backdrop-filter .18s ease;}
.songBackBtn:active{background:var(--liquid-press),#18181b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:rgba(255,255,255,.3);}
.songBackBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}

<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

const screen =
  document.getElementById('screen');

const modal =
  document.getElementById('searchModal');

const query =
  document.getElementById('libraryQuery');


/* =========================================================
   FIREBASE CLIENT

   The config used to be hardcoded here, which meant it was
   baked straight into this file's source — visible to anyone
   who could read the GitHub repo. It's now fetched at runtime
   from a small serverless endpoint (/api/firebase-config,
   see that file) that reads the real values out of Vercel
   environment variables instead, so the repo's source no
   longer contains them.

   That said: a signed-in browser still has to receive this
   config to talk to Firebase at all, so it's still visible in
   the Network tab once the app is running — that's expected.
   Firebase's own docs say the apiKey isn't meant to be a
   secret; what actually gates access is Firestore Security
   Rules (see firestore.rules), never this value.

   Before using the app:
     1. Create a Firebase project → add a Web app → copy the
        config Firebase gives you.
     2. In Vercel → Project → Settings → Environment Variables,
        add FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN,
        FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET,
        FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID with
        those values (see api/firebase-config.js).
     3. Build → Firestore Database → Create database.
     4. Build → Authentication → Sign-in method → enable
        Email/Password, and add your team's accounts manually
        under Authentication → Users (sign-up is disabled in
        this app on purpose — see handleAuthSignUp).
     5. Paste the rules from firestore.rules into
        Firestore Database → Rules, and Publish.
========================================================= */

/*
  Every device reads/writes this one document — that's what
  makes it a shared library instead of a per-person one.
  Firestore Security Rules (not this constant) are what
  actually keep randoms off it; see firestore.rules.
*/
const SYNC_LIBRARY_DOC_ID = 'shared';

/*
  Same idea as SYNC_LIBRARY_DOC_ID, but for the "Sunday Worship"
  lineup — one shared doc everyone reads/writes at
  lineups/{SYNC_LINEUP_DOC_ID}. See downloadLineup/uploadLineup.
*/
const SYNC_LINEUP_DOC_ID = 'current';

/*
  When this page is served normally from the web, relative paths
  like fetch('/api/firebase-config') resolve against the site's
  own domain automatically. But once this HTML is bundled as a
  local file inside a native app shell (Capacitor/Cordova), the
  page has no server behind it at all — those relative paths
  would resolve to nothing and every /api/ call would fail.

  Set this to your deployed backend's real URL (the Vercel
  domain this project deploys to, e.g.
  'https://your-project.vercel.app') so every /api/ call below
  goes there explicitly instead of relying on same-origin.
  Leave it as '' when running as a normal website — relative
  paths still work fine in that case.
*/
const API_BASE_URL = 'https://worship-chords-rho.vercel.app';

let FIREBASE_CONFIGURED = false;
let firebaseApp = null;
let firebaseAuth = null;
let firestoreDb = null;

/*
  Every entry point that touches Firebase (sign-in/up, sign-out,
  sync, initSyncOnLoad) awaits this before using firebaseAuth/
  firestoreDb, since fetching the config is now async instead
  of being available immediately at page load.
*/
const firebaseReadyPromise = (async () => {

  if(!window.firebase)return;

  try{

    const response =
      await fetch(API_BASE_URL + '/api/firebase-config');

    if(!response.ok)return;

    const firebaseConfig =
      await response.json();

    const configured =
      !!(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId);

    if(!configured)return;

    FIREBASE_CONFIGURED = true;

    firebaseApp =
      window.firebase.initializeApp(firebaseConfig);

    firebaseAuth =
      window.firebase.auth();

    firestoreDb =
      window.firebase.firestore();

  }catch(error){

    console.error(
      'Firebase config fetch failed:',
      error
    );

  }

})();

/*
  Shared secret for /api/notify-new-song (the "New song added"
  push notification) — must match the NOTIFY_SECRET environment
  variable set on your backend deploy (e.g. Vercel → Project →
  Settings → Environment Variables). Not related to Firebase;
  this only protects that one notification endpoint.
*/
const NOTIFY_SECRET =
  '4DFzmCxM1j6yM-7SepDpGYDCoqnRTJBy';


/* =========================================================
   TOASTS + CONFIRM DIALOG

   Lightweight in-app replacements for the browser's native
   alert()/confirm(), which look and feel out of place once the
   app is wrapped as a native shell. showToast() is fire-and-
   forget; showConfirmDialog() returns a Promise<boolean> so
   call sites just `await` it instead of using confirm().
========================================================= */

/*
  Generic idle-fade for floating controls that sit on top of
  scrollable content (the auto-scroll FAB, the section-jump
  pill bar, ...). Give the element the "idleFade" class plus
  its own CSS for what ".idle" should look like, then call this
  once after it's in the DOM. It fades to that idle state a
  couple seconds after the last touch anywhere on the element,
  and snaps back to full strength on the next tap. Any future
  floating widget should reuse this instead of writing its own
  timer.
*/

const IDLE_FADE_DEFAULT_MS = 2200;

function attachIdleFade(el, delayMs){

  if(!el)return null;

  let timer = null;

  const schedule = () => {

    clearTimeout(timer);

    el.classList.remove('idle');

    timer = setTimeout(() => {
      el.classList.add('idle');
    }, delayMs || IDLE_FADE_DEFAULT_MS);

  };

  el.addEventListener('pointerdown', schedule);

  schedule();

  return schedule;

}


/*
  Gives the "Key change" divider a brief glow the moment it
  scrolls into view — a little extra heads-up for whoever's
  reading/playing along, on top of the divider text itself.
  Fires once per divider per render (unobserves after firing),
  so scrolling back up and down again doesn't keep re-flashing
  it.
*/

function attachKeyChangeFlash(){

  if(!('IntersectionObserver' in window))return;

  const dividers =
    document.querySelectorAll('#songStructure .flowKeyChangeDivider');

  if(!dividers.length)return;

  const observer =
    new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        if(!entry.isIntersecting)return;

        entry.target.classList.add('keyChangeFlash');

        setTimeout(() => {
          entry.target.classList.remove('keyChangeFlash');
        }, 900);

        observer.unobserve(entry.target);

      });

    }, { threshold: 0.6 });

  dividers.forEach(div => observer.observe(div));

}


/*
  A one-time tip shown the first time the song viewer opens,
  since long-press now does three different things (Flow
  section controls, Change Key, MD Mode) and none of them are
  otherwise discoverable. Tracked in settings so it only ever
  shows once.
*/

function maybeShowLongPressHint(){

  if(getSettings().hasSeenLongPressHint)return;

  writeSettings({ hasSeenLongPressHint: true });

    <button type="button" class="longPressHintClose" aria-label="Dismiss">✕</button>
  `;

  document.body.appendChild(banner);

  requestAnimationFrame(() => {
    banner.classList.add('show');
  });

  const remove = () => {
    banner.classList.remove('show');
    setTimeout(() => banner.remove(), 260);
  };

  banner.querySelector('.longPressHintClose').onclick = remove;

  setTimeout(remove, 6000);

}


/* Small shared icon set for empty states — keeps the "icon +
   one line + next action" pattern consistent everywhere it's
   used instead of every call site inlining its own SVG. */

function emptyStateIconHTML(type){

  const icons = {

    music: '<svg viewBox="0 0 24 24"><path d="M9 18V5"/><path d="M9 5l10-2" style="stroke-width:3.1;"/><path d="M19 3v13"/><circle cx="6" cy="18" r="3" style="fill:currentColor;stroke:none;"/><circle cx="16" cy="16" r="3" style="fill:currentColor;stroke:none;"/></svg>',

    list: '<svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',

    search: '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5 15.2 15.2"/></svg>',

    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',

    layers: '<svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>'

  };

  return `<div class="emptyIcon">${icons[type] || icons.music}</div>`;

}


function showToast(message, type, opts){

  const stack =
    document.getElementById('toastStack');

  if(!stack){
    return;
  }

  opts = opts || {};
  const id = typeof opts === 'string' ? opts : opts.id;
  const small = !!(opts && opts.small);

  /* If this toast has an id and one with the same id is already
     showing, just update its text and reset its timer instead of
     stacking a new one on top — this is what stops rapid repeated
     calls (e.g. holding the transpose button) from piling up. */

  if(id){

    const existing =
      stack.querySelector(`.toast[data-toast-id="${id}"]`);

    if(existing){

      existing.textContent =
        String(message == null ? '' : message);

      if(existing._dismiss){
        clearTimeout(existing._dismissTimer);
        existing._dismissTimer =
          setTimeout(existing._dismiss, small ? 1100 : 3200);
      }

      return;

    }

  }

  const toast =
    document.createElement('div');

  toast.className =
    'toast' +
    (type === 'error' ? ' toastError' : '') +
    (type === 'success' ? ' toastSuccess' : '') +
    (small ? ' toastSmall' : '');

  if(id){
    toast.dataset.toastId = id;
  }

  toast.textContent =
    String(message == null ? '' : message);

  stack.appendChild(toast);

  requestAnimationFrame(() => {
    toast.classList.add('toastShow');
  });

  let dismissed = false;
  let dismissTimer = null;

  const dismiss = () => {

    if(dismissed)return;
    dismissed = true;

    clearTimeout(dismissTimer);

    toast.classList.remove('toastShow');

    setTimeout(() => {
      toast.remove();
    }, 250);

  };

  toast._dismiss = dismiss;

  dismissTimer = setTimeout(dismiss, small ? 1100 : 3200);
  toast._dismissTimer = dismissTimer;

  /* Swipe left or right to dismiss early — handy when a
     second toast is about to stack on top of one that's
     sitting over something you need to tap. */

  let dragging = false;
  let startX = 0;
  let dx = 0;

  toast.addEventListener('pointerdown', (event) => {

    if(dismissed)return;

    dragging = true;
    startX = event.clientX;

    toast.classList.add('toastDragging');

    clearTimeout(dismissTimer);
    clearTimeout(toast._dismissTimer);

  });

  toast.addEventListener('pointermove', (event) => {

    if(!dragging)return;

    dx = event.clientX - startX;

    toast.style.transform = `translateX(${dx}px)`;
    toast.style.opacity = String(Math.max(0, 1 - Math.abs(dx) / 140));

  });

  const endDrag = () => {

    if(!dragging)return;
    dragging = false;

    toast.classList.remove('toastDragging');

    if(Math.abs(dx) > 60){

      dismissed = true;

      toast.style.transform = `translateX(${dx > 0 ? 260 : -260}px)`;
      toast.style.opacity = '0';

      setTimeout(() => {
        toast.remove();
      }, 180);

    }else{

      toast.style.transform = '';
      toast.style.opacity = '';

      dismissTimer = setTimeout(dismiss, 1800);
      toast._dismissTimer = dismissTimer;

    }

    dx = 0;

  };

  toast.addEventListener('pointerup', endDrag);
  toast.addEventListener('pointercancel', endDrag);

}


function showConfirmDialog(message, options){

  const opts =
    options || {};

  const confirmLabel =
    opts.confirmLabel || 'Confirm';

  const cancelLabel =
    opts.cancelLabel || 'Cancel';

  const danger =
    !!opts.danger;

  return new Promise((resolve) => {

    const host =
      document.getElementById('confirmOverlay');

    if(!host){
      resolve(window.confirm(message));
      return;
    }

    host.innerHTML = `

      <div class="confirmBack" id="confirmBack">
        <div class="confirmBox">

          <p class="confirmMessage">${esc(String(message == null ? '' : message))}</p>

          <div class="confirmBtnRow">
            <button class="toolbarBtn" id="confirmCancelBtn" type="button">${esc(cancelLabel)}</button>
            <button class="toolbarBtn${danger ? ' danger' : ' primary'}" id="confirmOkBtn" type="button">${esc(confirmLabel)}</button>
          </div>

        </div>
      </div>

    `;

    const back =
      document.getElementById('confirmBack');

    const finish = (result) => {
      back.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 200);
      resolve(result);
    };

    document.getElementById('confirmCancelBtn').onclick = () => finish(false);
    document.getElementById('confirmOkBtn').onclick = () => finish(true);

    back.onclick = (event) => {
      if(event.target === back){
        finish(false);
      }
    };

    requestAnimationFrame(() => {
      back.classList.add('open');
    });

  });

}


/*
  Replacement for window.prompt(), which — per the note on the
  older analysis rename flow — is unreliable inside mobile
  webviews and installed PWAs (it can silently no-op). Returns
  Promise<string|null>: null if cancelled, otherwise the
  trimmed text (which may be an empty string).
*/

function showPromptDialog(message, defaultValue, options){

  const opts =
    options || {};

  const confirmLabel =
    opts.confirmLabel || 'OK';

  const cancelLabel =
    opts.cancelLabel || 'Cancel';

  return new Promise((resolve) => {

    const host =
      document.getElementById('confirmOverlay');

    if(!host){
      resolve(window.prompt(message, defaultValue || ''));
      return;
    }

    host.innerHTML = `

      <div class="confirmBack" id="confirmBack">
        <div class="confirmBox">

          <p class="confirmMessage">${esc(String(message == null ? '' : message))}</p>

          <input
            class="confirmInput"
            id="confirmPromptInput"
            type="text"
            value="${esc(defaultValue || '')}"
          >

          <div class="confirmBtnRow">
            <button class="toolbarBtn" id="confirmCancelBtn" type="button">${esc(cancelLabel)}</button>
            <button class="toolbarBtn primary" id="confirmOkBtn" type="button">${esc(confirmLabel)}</button>
          </div>

        </div>
      </div>

    `;

    const back =
      document.getElementById('confirmBack');

    const input =
      document.getElementById('confirmPromptInput');

    const finish = (result) => {
      back.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 200);
      resolve(result);
    };

    document.getElementById('confirmCancelBtn').onclick = () => finish(null);
    document.getElementById('confirmOkBtn').onclick = () => finish(input.value.trim());

    input.onkeydown = (event) => {
      if(event.key === 'Enter'){
        finish(input.value.trim());
      }else if(event.key === 'Escape'){
        finish(null);
      }
    };

    back.onclick = (event) => {
      if(event.target === back){
        finish(null);
      }
    };

    requestAnimationFrame(() => {
      back.classList.add('open');
      input.focus();
      input.select();
    });

  });

}


/*
  First-run onboarding modal — name AND photo together in one
  popup, shown over the Home screen right after someone's very
  first sign-in (see onAuthReady). Resolves to {name, photo}
  (photo is '' if they didn't pick one); never rejects, and
  always falls back to the email prefix if the name is left
  blank.
*/
function showOnboardingModal(user){

  const emailPrefix =
    (user.email || 'Account').split('@')[0];

  return new Promise((resolve) => {

    const host =
      document.getElementById('confirmOverlay');

    if(!host){
      resolve({ name: emailPrefix, photo:'' });
      return;
    }

    let pickedPhoto = '';

    host.innerHTML = `

      <div class="confirmBack" id="confirmBack">
        <div class="confirmBox">

          <p class="confirmMessage">
            Welcome! What should we call you, disciple?
          </p>

          <div style="display:flex; justify-content:center; margin:0 0 18px;">
            <div
              class="profileAvatar"
              id="onboardAvatarBtn"
              style="cursor:pointer;"
              title="Tap to add a photo"
            >
              ${esc(profileInitials(emailPrefix))}
            </div>
          </div>

          <input
            type="file"
            id="onboardPhotoFile"
            accept="image/*"
            style="display:none;"
          >

          <input
            class="confirmInput"
            id="onboardNameInput"
            type="text"
            placeholder="Your name"
            value="${esc(emailPrefix)}"
          >

          <div class="confirmBtnRow">
            <button class="toolbarBtn primary" id="onboardContinueBtn" type="button">
              Continue
            </button>
          </div>

        </div>
      </div>

    `;

    const back =
      document.getElementById('confirmBack');

    const nameInput =
      document.getElementById('onboardNameInput');

    const avatarBtn =
      document.getElementById('onboardAvatarBtn');

    const photoFileInput =
      document.getElementById('onboardPhotoFile');

    avatarBtn.onclick = () => photoFileInput.click();

    photoFileInput.onchange = async () => {

      const file =
        photoFileInput.files && photoFileInput.files[0];

      if(!file)return;

      const dataUrl =
        await resizeImageToDataUrl(file, 200, 200, 0.75);

      if(!dataUrl)return;

      pickedPhoto = dataUrl;

      avatarBtn.innerHTML =
        `<img src="${esc(dataUrl)}" alt="">`;

    };

    const finish = () => {

      const finalName =
        nameInput.value.trim() || emailPrefix;

      back.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 200);

      resolve({ name: finalName, photo: pickedPhoto });

    };

    document.getElementById('onboardContinueBtn').onclick = finish;

    nameInput.onkeydown = (event) => {

      if(event.key === 'Enter'){

        finish();

      }

    };

    requestAnimationFrame(() => {
      back.classList.add('open');
      nameInput.focus();
      nameInput.select();
    });

  });

}


/*
  Replays a soft fade/slide-in animation on #screen every time
  its content is swapped out, so navigating between tabs/pages
  (and opening the song viewer, editor, etc.) always feels
  smooth instead of an abrupt content jump.

  Small in-place tweaks — transpose, font size — also go through
  a full renderSongViewer() re-render, but replaying this fade
  on every single tap reads as an ugly blink rather than a
  transition. Setting skipNextScreenTransition = true right
  before one of those calls lets this one mutation through
  without the animation, then resets itself automatically.
*/

let skipNextScreenTransition = false;

(function attachScreenTransition(){

  if(!screen)return;

  const replay=()=>{

    if(skipNextScreenTransition){
      skipNextScreenTransition = false;
      return;
    }

    screen.classList.remove('screenTransition');
    void screen.offsetWidth;
    screen.classList.add('screenTransition');
  };

  new MutationObserver(replay).observe(
    screen,
    {childList:true}
  );

})();

/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


/*
  Pasted or imported lyrics sometimes already contain literal
  HTML entities (e.g. "that&#039;s" instead of "that's") because
  the source page had them baked into its raw text. Decoding them
  once, up front, means esc() never has to re-escape an entity
  that was never a real character to begin with.
*/

function decodeHtmlEntities(text){

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.innerHTML =
    String(text ?? '');


  return textarea.value;

}


/*
  "Smart"/typographic punctuation — en dashes, em dashes, curly
  quotes, ellipses, non-breaking spaces — round-trips fine
  inside the app (real UTF-8 strings in memory), but breaks on
  export: jsPDF's built-in fonts don't reliably map these
  characters, and a plain .txt file with no encoding marker can
  get opened by another app as the wrong character set. Either
  way the symptom is the same mojibake — "–" turning into
  "â€“". Normalizing to plain ASCII equivalents right before
  writing the file sidesteps the problem entirely, since plain
  ASCII is safe under every encoding. Only used at export time —
  the saved song text and in-app viewer are untouched.
*/

function sanitizeForPlainExport(text){

  return String(text ?? '')

    .replace(/[\u2013\u2014\u2212]/g, '-')   /* – — − */
    .replace(/[\u2018\u2019\u201A\u2032]/g, "'")  /* ‘ ’ ‚ ′ */
    .replace(/[\u201C\u201D\u201E\u2033]/g, '"')  /* “ ” „ ″ */
    .replace(/\u2026/g, '...')               /* … */
    .replace(/[\u00A0\u202F]/g, ' ');        /* nbsp, narrow nbsp */

}


/* =========================================================
   STORAGE
========================================================= */

/*
  Local storage keeps the library small enough to stay fast and
  fit comfortably under a browser's per-origin storage limit.
  500 songs is a generous ceiling for a church's working set —
  well past what most congregations keep on rotation — and the
  Export Library backup (Profile → Data) plus Drive sync are the
  real safety net if a library ever needs to grow past this.
*/
const MAX_SONGS = 500;


function getSongs(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsSongs'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeSongs(songs){

  /*
    No automatic Drive push here on purpose — a save, rename,
    or delete on one phone should never silently overwrite
    someone else's in-progress edits (different key/transpose,
    etc.) on the same song. Brand-new songs are auto-uploaded
    explicitly from saveCurrentSong(); everything else only
    reaches Drive when someone taps that song's Sync button,
    or Profile → Sync Now.

    Exception: a song that's on the shared Sunday Worship
    lineup auto-syncs on every edit — see scheduleLineupAutoSync
    below. That's the one list everyone on the team is expected
    to be looking at the same live version of, so it shouldn't
    depend on the editor remembering to tap Sync. Every other
    song stays opt-in/manual, same as before.
  */

  const previousById =
    new Map(
      getSongs().map(item => [item.id, item])
    );

  localStorage.setItem(
    'worshipChordsSongs',
    JSON.stringify(songs.slice(0, MAX_SONGS))
  );

  try{

    const lineupIds =
      new Set(
        getLocalLineup().songs.map(item => item.id)
      );

    if(lineupIds.size){

      songs.forEach(song => {

        if(!lineupIds.has(song.id))return;

        const prev =
          previousById.get(song.id);

        if(!prev || prev.updatedAt !== song.updatedAt){

          scheduleLineupAutoSync(song.id);

        }

      });

    }

  }catch(error){

    console.error(error);

  }

}


/*
  Debounced per-song trigger for the Sunday Worship auto-sync
  exception above. Coalesces bursts of edits (dragging the flow
  around, typing out chord fixes) into a single upload instead
  of hammering Firestore on every keystroke, and runs silently —
  no toast — so it doesn't turn into the same notification spam
  the manual Sync button would cause if it fired on every edit.
*/

const lineupAutoSyncTimers = new Map();

function scheduleLineupAutoSync(songId){

  if(lineupAutoSyncTimers.has(songId)){

    clearTimeout(
      lineupAutoSyncTimers.get(songId)
    );

  }

  const timer = setTimeout(async () => {

    lineupAutoSyncTimers.delete(songId);

    const song =
      getSongs().find(item => item.id === songId);

    if(!song)return;

    await syncOneSong(song, { silent:true });

  }, 1200);

  lineupAutoSyncTimers.set(songId, timer);

}

   SETLISTS

   A setlist is just a named, ordered list of song IDs — the
   songs themselves still live only in the main Library. Deleting
   a setlist never touches the songs in it; deleting a song
   just leaves a dangling ID that setlist views quietly skip.
========================================================= */

function writeSetlists(setlists){

  );

async function createSetlist(){

  const name =
    await showPromptDialog(
      'Setlist name:',
      ''
    );

  if(name === null)return null;

  const trimmed =
    name.trim();

  if(!trimmed)return null;

  const setlists =
    getSetlists();

  const newSetlist = {
    id:
      (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2),
    name: trimmed,
    songIds: [],
    createdAt: new Date().toISOString()
  };

  setlists.unshift(newSetlist);

  writeSetlists(setlists);

  return newSetlist.id;

}


async function renameSetlist(setlistId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const name =
    await showPromptDialog(
      'Setlist name:',
      setlist.name || ''
    );

  if(name === null)return;

  const trimmed =
    name.trim();

  if(!trimmed)return;

  setlist.name = trimmed;

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}


async function deleteSetlist(setlistId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const confirmed =
    await showConfirmDialog(
      `Delete the setlist "${setlist.name}"? The songs in it stay in your Library.`,
      { confirmLabel:'Delete', danger:true }
    );

  if(!confirmed)return;

  writeSetlists(
    setlists.filter(item => item.id !== setlistId)
  );

  showToast(`"${setlist.name}" deleted.`);

  renderLibrary();

}


function addSongToSetlist(setlistId, songId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  if(setlist.songIds.includes(songId)){

    showToast('Already in that setlist.');
    return;

  }

  setlist.songIds.push(songId);

  writeSetlists(setlists);

  showToast(`Added to "${setlist.name}".`, 'success');

}


function removeSongFromSetlist(setlistId, songId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  setlist.songIds =
    setlist.songIds.filter(id => id !== songId);

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}


function moveSongInSetlist(setlistId, songId, direction){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const index =
    setlist.songIds.indexOf(songId);

  if(index === -1)return;

  const nextIndex =
    index + direction;

  if(nextIndex < 0 || nextIndex >= setlist.songIds.length)return;

  const ids = setlist.songIds;
  const temp = ids[index];
  ids[index] = ids[nextIndex];
  ids[nextIndex] = temp;

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}

/* =========================================================
   SYNC ACCOUNT (Firebase Auth)
   Each of the ~10 people on the team signs into their own
   account (email + password) via Firebase Auth. Everyone who's
   signed in reads/writes the same single shared library
   document — see downloadLibrary()/uploadLibrary() below — so
   it behaves like a shared library, not a personal one, while
   every user still has their own credentials instead of
   sharing one Google account. That's what a previous
   Drive-based version of this app did, and sharing one
   consumer Google account across many devices is exactly the
   pattern Google's abuse detection flags — this avoids it
   entirely.
========================================================= */


function getGoogleUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsGoogleUser'
      ) || 'null'
    );

  }catch(error){

  if(user){

    localStorage.setItem(
      'worshipChordsGoogleUser',
      JSON.stringify(user)
    );

    );

  }

/*
  Swaps the static "Welcome!" header for a time-of-day greeting,
  plus the signed-in person's first name once they've signed in.
  Persistent chrome above #screen, so this runs once at boot and
  again anytime sign-in state changes — not on every render.
*/
function updateWelcomeHeader(){

  const el =
    document.querySelector('.welcome');

  if(!el)return;

  const hour =
    new Date().getHours();

  let greeting = 'Welcome';

  if(hour < 5){
    greeting = 'Good night';
  }else if(hour < 12){
    greeting = 'Good morning';
  }else if(hour < 17){
    greeting = 'Good afternoon';
  }else if(hour < 22){
    greeting = 'Good evening';
  }else{
    greeting = 'Good night';
  }

  const user =
    getGoogleUser();

  const firstName =
    (user && user.name)
      ? user.name.trim().split(/\s+/)[0]
      : '';

  el.textContent =
    firstName
      ? `${greeting}, ${firstName}!`
      : `${greeting}!`;

}

/* =========================================================
   FIREBASE LIBRARY SYNC
   One shared document (SYNC_LIBRARY_DOC_ID, in the `libraries`
   collection) holds the whole library plus a short "recently
   deleted" list (tombstones). Nothing syncs automatically
   except a brand-new song being saved — everything else (a
   changed key, an edited line, a rename, a delete) stays local
   until someone deliberately taps that song's Sync button, or
   Profile → Sync Now for the whole library. That way one
   person's in-progress edits never jump onto everyone else's
   copy uninvited.
========================================================= */

let driveSyncInFlight = false;
let driveSyncQueued = false;


function getTombstones(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsTombstones'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeTombstones(list){

  localStorage.setItem(
    'worshipChordsTombstones',
    JSON.stringify(list)
  );

}


function recordDeletedSongs(ids){

  if(!ids.length){

    return;

  }

  const now =
    new Date().toISOString();

  const list =
    getTombstones().filter(
      item => !ids.includes(item.id)
    );

  ids.forEach(id => {

    list.push({ id, deletedAt: now });

  });

  writeTombstones(list);

}


/*
  Duplicate detection — two saves of the exact same song (e.g.
  the same song added independently on two phones, then merged
  together by the team sync) end up as two separate Library
  entries with different ids but identical title + lyrics/chords.
  This finds those and quietly keeps only the most recently
  updated copy, remapping any Setlist or the Sunday Worship
  lineup that pointed at the one being removed so nothing breaks.
  Merged songs (mergeParts) are left alone — being a *combination*
  of songs, they're never "the same song" as a single one.
*/

function normalizeForDuplicateCheck(value){

  return String(value || '')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();

}

function dedupeLibrarySongs(){

  const songs =
    getSongs();

  const isMerged =
    song =>
      Array.isArray(song.mergeParts) &&
      song.mergeParts.length > 1;

  const groups =
    new Map();

  songs.forEach(song => {

    if(isMerged(song))return;

    const key =
      normalizeForDuplicateCheck(song.title) +
      '::' +
      normalizeForDuplicateCheck(song.originalText || song.text);

    if(!key.trim())return;

    if(!groups.has(key)){
      groups.set(key, []);
    }

    groups.get(key).push(song);

  });

  const idsToRemove = [];
  const idRemap = new Map(); /* removed id -> survivor id */

  groups.forEach(group => {

    if(group.length < 2)return;

    const sorted =
      [...group].sort((a, b) => {

        const aTime =
          new Date(a.updatedAt || a.savedAt || 0).getTime();

        const bTime =
          new Date(b.updatedAt || b.savedAt || 0).getTime();

        return bTime - aTime;

      });

    const survivor = sorted[0];

    sorted.slice(1).forEach(dupe => {

      idsToRemove.push(dupe.id);
      idRemap.set(dupe.id, survivor.id);

    });

  });

  if(!idsToRemove.length){

    return 0;

  }

  writeSongs(
    songs.filter(
      song => !idsToRemove.includes(song.id)
    )
  );

  recordDeletedSongs(idsToRemove);

  /* Point any Setlist entries at the surviving copy */

  const setlists =
    getSetlists();

  let setlistsChanged = false;

  setlists.forEach(setlist => {

    setlist.songIds =
      setlist.songIds.map(id => {

        if(idRemap.has(id)){

          setlistsChanged = true;
          return idRemap.get(id);

        }

        return id;

      });

  });

  if(setlistsChanged){

    writeSetlists(setlists);

  }

  /* Point the local Sunday Worship lineup at the survivor too */

  const lineup =
    getLocalLineup();

  let lineupChanged = false;

  if(lineup && Array.isArray(lineup.songs)){

    lineup.songs.forEach(entry => {

      if(entry && idRemap.has(entry.id)){

        entry.id = idRemap.get(entry.id);
        lineupChanged = true;

      }

    });

    if(lineupChanged){

      setLocalLineup(lineup);

    }

  }

  return idsToRemove.length;

}

function formatRelativeTime(isoString){

  if(!isoString)return null;

  const then =
    new Date(isoString).getTime();

  if(Number.isNaN(then))return null;

  const diffSeconds =
    Math.round((Date.now() - then) / 1000);

  if(diffSeconds < 60)return 'just now';

  const diffMinutes =
    Math.round(diffSeconds / 60);

  if(diffMinutes < 60)return `${diffMinutes}m ago`;

  const diffHours =
    Math.round(diffMinutes / 60);

  if(diffHours < 24)return `${diffHours}h ago`;

  const diffDays =
    Math.round(diffHours / 24);

  if(diffDays < 30)return `${diffDays}d ago`;

  return new Date(isoString).toLocaleDateString();

}


function formatSyncStatus(detail){

  if(!getGoogleUser()){

    return 'Not connected';

  }

  if(detail.status === 'syncing'){

    return 'Syncing…';

  }

  if(detail.status === 'error'){

    return 'Sync failed — will retry';

  }

  if(detail.status === 'synced' && detail.at){

    return (
      'Synced ' +
      new Date(detail.at).toLocaleString()
    );

  }

  return 'Not synced yet';

}


/* Merge two song lists + two tombstone lists into one. */

function mergeLibraryState(
  localSongs,
  localTombstones,
  remoteSongs,
  remoteTombstones
){

  const tombstoneMap = new Map();

  [...localTombstones, ...remoteTombstones].forEach(item => {

    if(!item || !item.id)return;

    const existing =
      tombstoneMap.get(item.id);

    if(
      !existing ||
      new Date(item.deletedAt) >
      new Date(existing.deletedAt)
    ){

      tombstoneMap.set(item.id, item);

    }

  });


  const songMap = new Map();

  [...localSongs, ...remoteSongs].forEach(song => {

    if(!song || !song.id)return;

    const existing =
      songMap.get(song.id);

    const songTime =
      new Date(
        song.updatedAt ||
        song.savedAt ||
        0
      );

    const existingTime =
      existing
        ? new Date(
            existing.updatedAt ||
            existing.savedAt ||
            0
          )
        : null;

    if(!existing || songTime > existingTime){

      songMap.set(song.id, song);

    }

  });


  const mergedSongs =
    [...songMap.values()].filter(song => {

      const tomb =
        tombstoneMap.get(song.id);

      if(!tomb){

        return true;

      }

      const songTime =
        new Date(
          song.updatedAt ||
          song.savedAt ||
          0
        );

      /*
        Only keep it if it was edited/re-saved AFTER the
        delete — otherwise the delete wins.
      */

      return new Date(tomb.deletedAt) < songTime;

    });

  mergedSongs.sort(
    (a,b) =>
      new Date(b.savedAt || 0) -
      new Date(a.savedAt || 0)
  );


  /* Keep tombstones from growing forever — 90 days is plenty. */

  const cutoff =
    Date.now() - 90*24*60*60*1000;

  const prunedTombstones =
    [...tombstoneMap.values()].filter(
      item =>
        new Date(item.deletedAt).getTime() >
        cutoff
    );


  return {

    songs: mergedSongs.slice(0,MAX_SONGS),

    tombstones: prunedTombstones

  };

}


/*
  Being "signed in" (a saved profile) and having a live session
  are two different things — Firebase's session restore runs
  asynchronously in the background right after page load, which
  can occasionally lag. Any sync action calls this first so it
  self-heals instead of surfacing "sign in" to someone who
  already has.
*/
/*
  Firebase restores a signed-in session asynchronously in the
  background — firebaseAuth.currentUser can still be null for a
  moment right after page load even though the person is signed
  in. This waits for Firebase's first "here's the real auth
  state" callback instead of trusting currentUser too early.
*/
let firebaseAuthReadyPromise = null;

function waitForFirebaseAuthReady(){

  if(!firebaseAuth){

    return Promise.resolve(null);

  }

  if(!firebaseAuthReadyPromise){

    firebaseAuthReadyPromise =
      new Promise(resolve => {

        const unsubscribe =
          firebaseAuth.onAuthStateChanged(user => {

            unsubscribe();
            resolve(user);

          });

      });

  }

  return firebaseAuthReadyPromise;

}


async function ensureSyncSession(){

  if(!await requireFirebaseConfigured())return false;

  const user =
    firebaseAuth.currentUser ||
    await waitForFirebaseAuthReady();

  return !!user;

}


/* =========================================================
   USER PROFILE (display name + photo)

   One small doc per person at profiles/{uid} — separate from
   the big shared libraries/shared doc, and locked down so each
   person can only read/write their own (see firestore.rules).
   This is what lets "what should we call you" and a profile
   photo follow someone's account across every device they sign
   into, instead of just living in this one browser's storage.
========================================================= */

async function loadUserProfile(uid){

  if(!await requireFirebaseConfigured())return null;

  try{

    const docSnap =
      await firestoreDb
        .collection('profiles')
        .doc(uid)
        .get();

    return docSnap.exists ? docSnap.data() : null;

  }catch(error){

    console.error(error);

    return null;

  }

}


async function saveUserProfile(uid, profile){

      .collection('profiles')
      .doc(uid)

        name: profile.name || '',
        photo: profile.photo || '',

  }catch(error){

    console.error(error);

    showToast(

    );

  }

}


/*
  Shrinks + compresses a picked photo client-side before it ever
  touches Firestore, so a profile photo stays a small handful of
  KB instead of whatever multi-MB size a phone camera produces.
  Resolves to a JPEG data URL, or null if the file couldn't be
  read as an image.
*/
function resizeImageToDataUrl(file, maxWidth, maxHeight, quality){

  return new Promise((resolve) => {

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => {

        const scale =
          Math.min(1, maxWidth / img.width, maxHeight / img.height);

        const width =
          Math.max(1, Math.round(img.width * scale));

        const height =
          Math.max(1, Math.round(img.height * scale));

        const canvas =
          document.createElement('canvas');

        canvas.width = width;
        canvas.height = height;

        canvas
          .getContext('2d')
          .drawImage(img, 0, 0, width, height);

        resolve(
          canvas.toDataURL('image/jpeg', quality)
        );

      };

      img.onerror = () => resolve(null);

      img.src = reader.result;

    };

    reader.onerror = () => resolve(null);

    reader.readAsDataURL(file);

  });

}

/*
  Auto-upload path — used only right after a brand-new song
  is saved. Adds it to the shared library without touching
  any other song already in there.
*/

async function uploadNewSongToDrive(song){

  if(!getGoogleUser()){

    return;

  }

  if(!(await ensureSyncSession())){

    return;

  }

  try{

    const remote =
      await downloadLibrary();

    const alreadyThere =
      remote.songs.some(
        item => item.id === song.id
      );

    if(!alreadyThere){

      remote.songs.unshift(song);

      await uploadLibrary(
        {

          songs: remote.songs.slice(0,MAX_SONGS),

          tombstones: remote.tombstones

        }
      );

      notifyNewSong(song.title);

    }

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

  }catch(error){

    console.error(error);

    setSyncStatus('error');

  }

}


/*
  Additive-only pull — used on sign-in and app open. Brings in
  any song that exists in Drive but not locally yet (so new
  songs from teammates show up), but never overwrites a song
  that's already in the local Library. That's what keeps a
  quiet app-open or sign-in from clobbering someone's in-
  progress key change on a song they already have.
*/

async function pullNewSongsFromDrive(){

  if(!getGoogleUser()){

    return { ok:false, reason:'signed-out' };

  }

  if(!(await ensureSyncSession())){

    return { ok:false, reason:'signed-out' };

  }

  try{

    const remote =
      await downloadLibrary();

    const localSongs =
      getSongs();

    const localIds =
      new Set(
        localSongs.map(item => item.id)
      );

    const newOnes =
      remote.songs.filter(
        item => item && item.id && !localIds.has(item.id)
      );

    if(newOnes.length){

      localStorage.setItem(
        'worshipChordsSongs',
        JSON.stringify(
          [...newOnes, ...localSongs].slice(0,MAX_SONGS)
        )
      );

      const libraryOnScreen =
        document.getElementById('screen') &&
        screen.querySelector('.librarySection');

      if(libraryOnScreen){

        /*
          Let the re-render below run its own dedupe pass so the
          "removed duplicates" toast (if any) actually reaches
          the person, instead of firing silently before they can
          see it.
        */
        renderLibrary();

      }else{

        /*
          Nobody's looking at the Library right now — clean up
          silently so it's already tidy whenever they do open it.
          (The next manual Library visit will show the toast if
          this actually found something, via its own dedupe call.)
        */
        dedupeLibrarySongs();

      }

    }

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

    return { ok:true, added:newOnes.length };

  }catch(error){

    console.error(error);

    setSyncStatus('error');

    return { ok:false, reason:'error', error };

  }

}


/* =========================================================

/*
  Reached from the song viewer's ⋮ menu → "Send to Team". Makes
  sure the song itself is in the shared library first (harmless
  if it already is), then adds it to the shared lineup doc if
  it isn't already on there, and notifies the team.
*/
async function sendCurrentSongToLineup(song){

  if(!song)return;

  if(String(song.id).startsWith('preview-')){

    showToast(
      'Save this song first, then send it to the team.',
      'error'
    );

    return;

  }

  if(!await requireFirebaseConfigured())return;

  if(!(await ensureSyncSession())){

    showToast(
      'Sign in first to send this to the team.',
      'error'
    );

    return;

  }

  const confirmed =
    await showConfirmDialog(
      `Add "${song.title}" to the Sunday Worship lineup for the whole team to see?`,
      { confirmLabel:'Send to Team' }
    );

  if(!confirmed)return;

  try{

    await uploadNewSongToDrive(song);

    const remote =
      await downloadLineup();

    const alreadyIn =
      remote.songs.some(item => item.id === song.id);

    if(!alreadyIn){

      remote.songs.push({

        id: song.id,
        title: song.title

      });

    }

    const user =
      getGoogleUser();

    remote.updatedBy =
      (user && user.name) || '';

    await uploadLineup(remote);

    setLocalLineup(remote);

    if(!alreadyIn){

      notifyLineupUpdate(song.title);

    }

    showToast('Added to the Sunday Worship lineup.', 'success');

  }catch(error){

    console.error(error);

    showToast(
      'Could not send to the team: ' + error.message,
      'error'
    );

  }

}
