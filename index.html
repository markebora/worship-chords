<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worship Chords</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f5f6f7;font-family:Arial,sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;background:#11151a}header{padding:14px 18px;border-bottom:1px solid #293039;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.sub,.muted{color:#929ca6;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#272e36;color:#fff;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}.btn.primary,.btn.active{background:#fff;color:#111}nav{display:flex;background:#151a20;border-bottom:1px solid #293039}nav button{flex:1;border:0;background:none;color:#8f99a4;padding:14px;font-weight:700;cursor:pointer}nav button.active{color:#fff;border-bottom:2px solid #fff}main{padding:18px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.card,.item{background:#171c22;border:1px solid #293039;border-radius:14px;padding:15px;margin:9px 0}.item{display:flex;align-items:center;gap:10px}.itemmain{flex:1;min-width:0}.itemmain b{display:block}.itemmain span{display:block;color:#8e98a3;font-size:12px;margin-top:3px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:#11151a;padding:12px 0;z-index:10;border-bottom:1px solid #293039}.tabs button{white-space:nowrap;flex-shrink:0}.tabs button.sectionActive{background:#cfe8d5;color:#111}.card.sectionActive{background:#cfe8d5;border-color:#9ac9a5;color:#111}.card.sectionActive .part-title{color:#315c3b}.card.sectionActive .chordInput{color:#2f6b3d}#content .card{scroll-margin-top:75px}.editBanner{display:none;background:#fff;color:#111;padding:10px 13px;border-radius:10px;font-weight:800;margin:10px 0}.editMode .editBanner{display:block}.editSectionBtn{cursor:grab;touch-action:none}.editSectionBtn.dragging{opacity:.45;outline:2px dashed #72b7ff}.part-title{text-transform:uppercase;letter-spacing:1px;color:#aeb6bf;font-size:12px;margin-bottom:7px}.line{display:block;margin:0 0 4px}.chordInput{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:7px;color:#72b7ff;font:bold 16px monospace;padding:1px 5px;line-height:1.05;margin:0}.editMode .chordInput{border-color:#3a424c;background:#0e1115}.chordRow{min-height:18px}.lyricText{font-size:18px;padding:0 5px;line-height:1.1}.chordOnlyLine{display:block;margin:4px 0;padding:3px 7px;border-radius:8px}.chordOnlyInner{font:bold 18px monospace;color:#72b7ff;white-space:nowrap;letter-spacing:0}.editMode .chordOnlyLine{background:#0e1115;border:1px solid #3a424c}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#171c22;border-radius:20px 20px 0 0;padding:20px}.modal h2{margin-top:0}.input,.modal input,.modal textarea{width:100%;background:#0e1115;color:#fff;border:1px solid #343c45;border-radius:9px;padding:12px;font:inherit}.searchbox{display:flex;gap:8px;margin:15px 0}.searchbox input{flex:1}.keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keybtn{padding:13px 5px;border:1px solid #343c45;border-radius:9px;background:#20262d;color:#fff;font-weight:800;cursor:pointer}.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#27303a;color:#aeb8c2;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:10px;font-weight:700;display:none;z-index:30}@media(max-width:500px){.keygrid{grid-template-columns:repeat(3,1fr)}.lyricText{font-size:16px}.tabs{padding:10px 0}#content .card{scroll-margin-top:65px}}
.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">Worship Chords</div><div class="sub">Lyrics • Chords • Setlists</div></div><button type="button" class="btn" onclick="openSearch()">🔎 Search Song</button></header>
<nav><button type="button" id="songsNav" class="active" onclick="showTab('songs')">Songs</button><button type="button" id="setlistsNav" onclick="showTab('setlists')">Setlists</button></nav>
<main id="songs"><div class="row"><div><h1 style="margin:4px 0">Song Library</h1><div class="muted">Search, import and analyze your worship songs</div></div><button type="button" class="btn primary" onclick="openSearch()">＋ Add / Search Song</button></div><div class="card"><b>Current song</b><div class="item" style="padding:10px 0;border:0"><div class="itemmain"><b id="libraryTitle">Way Maker</b><span id="libraryArtist">Sinach • Key C</span></div><button type="button" class="btn" onclick="openSong()">Open</button></div></div></main>
<main id="setlists" class="hidden"><div class="row"><div><h1 style="margin:4px 0">Setlists</h1><div class="muted">Your worship service songs</div></div><button type="button" class="btn primary" onclick="addSetSong()">＋ Add Song</button></div><div class="card" id="setlistBox"></div></main>
<main id="song" class="hidden"><div class="row"><div><h1 id="songTitle" style="margin:4px 0">Way Maker</h1><div class="muted"><span id="songArtist">Sinach</span> • Key: <span id="key">C</span></div></div><div class="controls"><button type="button" class="btn" onclick="showTab('songs')">← Songs</button><button type="button" class="btn" id="editBtn" onclick="toggleEdit()">✎ Edit</button></div></div><div class="editBanner">✎ EDIT MODE — Drag the section buttons above to reorder them. Only chords are editable below.</div><div class="tabs" id="tabs"></div><div class="controls" style="margin:10px 0"><button type="button" class="btn" onclick="font(-1)">A−</button><button type="button" class="btn" onclick="font(1)">A+</button><button type="button" class="btn" onclick="autoScroll()">▶ Auto Scroll</button><button type="button" class="btn" onclick="transpose()">Transpose</button><button type="button" class="btn" id="saveBtn" onclick="saveLocal()" style="display:none">💾 Save</button></div><div id="content"></div></main>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
</div>
<script>
'use strict';
const base={Intro:[['C',''],['G',''],['Am',''],['F','']], 'Verse 1':[['C','You are here, moving in our midst'],['G','I worship You, I worship You'],['Am','You are here, working in this place'],['F','I worship You, I worship You']], Chorus:[['C','Way Maker, Miracle Worker'],['G','Promise Keeper, Light in the darkness'],['Am','My God, that is who You are'],['F','That is who You are']], 'Verse 2':[['C','You are here, touching every heart'],['G','I worship You, I worship You'],['Am','You are here, healing every heart'],['F','I worship You, I worship You']], Bridge:[['Am',"Even when I don't see it, You're working"],['F',"Even when I don't feel it, You're working"],['C','You never stop, You never stop working'],['G','You never stop, You never stop working']], Tag:[['C','That is who You are'],['G','That is who You are']], Adlib:[['Am','You are here'],['F','You are here']], Interlude:[['C',''],['G','']], Outro:[['C','That is who You are'],['G','That is who You are'],['Am','That is who You are'],['F','That is who You are']]};
let arrangement=Object.keys(base),size=18,editMode=false,scrollTimer=null,activeSection='Intro',currentSongTitle='Way Maker',currentArtist='Sinach',currentKey='C',sectionDrag=null,setlist=['Way Maker','Goodness of God','What a Beautiful Name'];
const keyNames=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const pitch={C:0,'C#':1,D:2,Eb:3,'D#':3,E:4,F:5,'F#':6,Gb:6,G:7,Ab:8,'G#':8,A:9,Bb:10,'A#':10,B:11,Db:1};
function showTab(t){['songs','setlists','song'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==t));document.getElementById('songsNav').classList.toggle('active',t==='songs');document.getElementById('setlistsNav').classList.toggle('active',t==='setlists');if(t==='setlists')renderSetlist();if(t==='song')renderSong()}
function openSong(){showTab('song')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function compactChordOnlyLines(){
  for(const part of Object.keys(base)){
    const source=Array.isArray(base[part])?base[part]:[];
    const out=[]; let chords=[];
    const flush=()=>{if(chords.length){out.push([chords.join(' '),'']);chords=[]}};
    for(const row of source){
      const chord=String(row?.[0]??'').trim();
      const lyric=String(row?.[1]??'').trim();
      if(chord && !lyric) chords.push(chord);
      else {flush();out.push(row)}
    }
    flush();
    base[part]=out;
  }
}
function renderSong(){if(!arrangement.length)arrangement=Object.keys(base);if(!arrangement.includes(activeSection))activeSection=arrangement[0]||'';document.getElementById('songTitle').textContent=currentSongTitle;document.getElementById('songArtist').textContent=currentArtist;document.getElementById('key').textContent=currentKey;document.getElementById('libraryTitle').textContent=currentSongTitle;document.getElementById('libraryArtist').textContent=currentArtist+' • Key '+currentKey;document.getElementById('editBtn').textContent=editMode?'✓ Done Editing':'✎ Edit';document.getElementById('saveBtn').style.display=editMode?'inline-block':'none';document.getElementById('tabs').innerHTML=arrangement.map((p,i)=>'<button type="button" class="btn '+(p===activeSection?'sectionActive ':'')+(editMode?'editSectionBtn':'')+'" '+(editMode?'draggable="true" ondragstart="sectionDragStart(event,'+i+')" ondragover="sectionDragOver(event)" ondrop="sectionDrop(event,'+i+')" ondragend="sectionDragEnd(event)"':'')+' onclick="jump('+i+')">'+esc(p)+'</button>').join('');document.getElementById('content').innerHTML=arrangement.map((p,i)=>'<section class="card '+(p===activeSection?'sectionActive':'')+'" id="part'+i+'"><div class="part-title">'+esc(p)+'</div>'+base[p].map((x,j)=>lineHTML(i,j,x)).join('')+(editMode?'<div class="controls"><button type="button" class="btn" onclick="addLine('+i+')">＋ Add lyric line</button><button type="button" class="btn" onclick="addChordLine('+i+')">＋ Add chord line</button></div>':'')+'</section>').join('');applyFont();document.getElementById('song').classList.toggle('editMode',editMode)}
function lineHTML(pi,li,x){if(!x[1]&&x[0])return '<div class="chordOnlyLine"><div class="chordOnlyInner">'+(editMode?'<input class="chordInput" value="'+esc(x[0])+'" onchange="updateLine('+pi+','+li+',0,this.value)" aria-label="Chord line">':'<span>'+esc(x[0])+'</span>')+'</div></div>';return '<div class="line"><div class="chordRow"><input class="chordInput" value="'+esc(x[0])+'" '+(editMode?'':'readonly')+' onchange="updateLine('+pi+','+li+',0,this.value)" aria-label="Chord"></div><div class="lyricText">'+esc(x[1])+'</div></div>'}
function applyFont(){document.querySelectorAll('#content .lyricText').forEach(e=>e.style.fontSize=size+'px');document.querySelectorAll('#content .chordInput').forEach(e=>e.style.fontSize=Math.max(12,size-2)+'px');document.querySelectorAll('#content .chordOnlyInner').forEach(e=>e.style.fontSize=Math.max(14,size)+'px')}
function font(n){size=Math.max(14,Math.min(30,size+n));applyFont()}
function jump(i){if(!arrangement[i])return;activeSection=arrangement[i];document.querySelectorAll('#tabs button').forEach((b,n)=>b.classList.toggle('sectionActive',n===i));document.querySelectorAll('#content .card').forEach((c,n)=>c.classList.toggle('sectionActive',n===i));const target=document.getElementById('part'+i),tabs=document.getElementById('tabs');if(target)window.scrollTo({top:Math.max(0,target.getBoundingClientRect().top+window.scrollY-tabs.offsetHeight-10),behavior:'smooth'})}
function updateLine(pi,li,field,val){const p=arrangement[pi];if(base[p]&&base[p][li]){base[p][li][field]=val;saveLocal(false)}}
function toggleEdit(){editMode=!editMode;renderSong();toast(editMode?'Edit mode on':'Edit mode closed')}
function addLine(pi){base[arrangement[pi]].push(['','']);renderSong();saveLocal(false)}
function addChordLine(pi){base[arrangement[pi]].push(['C','']);renderSong();saveLocal(false);toast('Chord line added')}
function sectionDragStart(e,i){sectionDrag=i;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging')}
function sectionDragOver(e){if(editMode)e.preventDefault()}
function sectionDrop(e,target){e.preventDefault();if(sectionDrag===null||sectionDrag===target)return;const moved=arrangement.splice(sectionDrag,1)[0];arrangement.splice(target,0,moved);sectionDrag=null;renderSong();saveLocal(false);toast('Section order updated')}
function sectionDragEnd(e){sectionDrag=null;e.currentTarget.classList.remove('dragging')}
function autoScroll(){if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;toast('Auto-scroll stopped');return}scrollTimer=setInterval(()=>window.scrollBy(0,1),45);toast('Auto-scroll started')}
function transpose(){document.getElementById('modal').style.display='flex';document.getElementById('modalBody').innerHTML='<div class="row"><h2>Transpose</h2><button type="button" class="btn" onclick="closeModal()">Close</button></div><div class="muted" style="margin-bottom:12px">Current key: <b>'+esc(currentKey)+'</b></div><div class="keygrid">'+keyNames.map(k=>'<button type="button" class="keybtn" onclick="applyTranspose(\''+k+'\')">'+k+'</button>').join('')+'</div>'}
function transposeRoot(root,interval){const p=pitch[root];if(p===undefined)return root;return keyNames[(p+interval+12)%12]}
function transposeChord(ch,interval){if(!ch)return ch;const m=String(ch).trim().match(/^([A-G](?:#|b)?)(.*)$/);if(!m||pitch[m[1]]===undefined)return ch;let result=transposeRoot(m[1],interval)+m[2];result=result.replace(/\/([A-G](?:#|b)?)(?=\b)/g,(full,bass)=>'/'+transposeRoot(bass,interval));return result}
function applyTranspose(target){const from=pitch[currentKey],to=pitch[target];if(from===undefined||to===undefined)return;const interval=(to-from+12)%12;Object.keys(base).forEach(p=>{base[p]=base[p].map(x=>[transposeChord(x[0],interval),x[1]])});currentKey=target;closeModal();renderSong();saveLocal(false);toast('Transposed to '+target)}
function normalizeKey(k){if(k==='A#')return 'Bb';if(k==='D#')return 'Eb';if(k==='Db')return 'C#';if(k==='G#')return 'Ab';return keyNames.includes(k)?k:'C'}
function detectKey(){for(const p of arrangement){for(const x of base[p]||[]){const m=String(x[0]||'').match(/^([A-G](?:#|b)?)/);if(m&&pitch[m[1]]!==undefined)return normalizeKey(m[1])}}return 'C'}
function openSearch(){document.getElementById('modal').style.display='flex';document.getElementById('modalBody').innerHTML='<div class="row"><div><h2>Search / Import Song</h2><div class="muted">Search a song title or paste chord/lyric text.</div></div><button type="button" class="btn" onclick="closeModal()">Close</button></div><div class="searchbox"><input class="input" id="searchTerm" placeholder="Song title — e.g. Way Maker"><button type="button" class="btn primary" onclick="searchSongs()">Search</button></div><div id="searchResults"></div><hr style="border-color:#293039;margin:18px 0"><textarea id="songText" rows="10" placeholder="Paste lyrics/chords here..."></textarea><div class="controls" style="margin-top:8px"><input class="input" id="importTitle" placeholder="Song title"><input class="input" id="importArtist" placeholder="Artist"></div><button type="button" class="btn primary" style="width:100%;margin-top:8px" onclick="analyzeSong()">Analyze Pasted Text</button><div id="analysisResult"></div>'}
function closeModal(){document.getElementById('modal').style.display='none'}
async function searchSongs(){const q=(document.getElementById('searchTerm').value||'').trim(),box=document.getElementById('searchResults');if(!q){box.innerHTML='<div class="muted">Enter a song title.</div>';return}box.innerHTML='<div class="muted">Searching…</div>';try{const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=song&limit=8'),d=await r.json();box.innerHTML=d.results&&d.results.length?d.results.map(x=>'<div class="item"><div class="itemmain"><b>'+esc(x.trackName)+'</b><span>'+esc(x.artistName)+'</span></div><button type="button" class="btn" onclick="selectSearch('+JSON.stringify(x.trackName)+','+JSON.stringify(x.artistName)+')">Use</button></div>').join(''):'<div class="muted">No songs found.</div>'}catch(e){box.innerHTML='<div class="muted">Search unavailable. You can paste chord/lyric text below.</div>'}}
function selectSearch(title,artist){document.getElementById('importTitle').value=title;document.getElementById('importArtist').value=artist;document.getElementById('songText').focus()}
function analyzeSong(){const title=(document.getElementById('importTitle').value||'').trim()||'Imported Song',artist=(document.getElementById('importArtist').value||'').trim()||'Unknown Artist',text=(document.getElementById('songText').value||'').trim();if(!text){document.getElementById('analysisResult').innerHTML='<div class="card">Paste lyrics/chords first.</div>';return}const allowed=/^(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|bridge|tag|ad[- ]?lib|adlib|interlude|outro)$/i,lines=text.split(/\r?\n/),sections=[];let current='Verse 1',bucket=[];function flush(){if(bucket.length){base[current]=bucket;sections.push(current);bucket=[]}}for(const raw of lines){const line=raw.replace(/\t/g,' ').trim();if(!line)continue;const marker=line.replace(/^\[|\]$/g,'').replace(/:$/,'').trim();if(allowed.test(marker)){flush();current=marker.toLowerCase().replace(/^./,c=>c.toUpperCase()).replace(/^Verse$/,'Verse 1').replace(/^Pre chorus$/i,'Pre-Chorus').replace(/^Prechorus$/i,'Pre-Chorus').replace(/^Ad lib$/i,'Adlib');continue}const m=line.match(/^([A-G](?:#|b)?(?:m|maj|min|sus|add|dim|aug|7|9|11|13|6|2|4)?(?:\/[A-G](?:#|b)?)?)(?:\s+|$)/i),chord=m?m[1]:'';bucket.push([chord,chord?line.slice(chord.length).trim():line])}flush();if(!sections.length){base['Verse 1']=lines.filter(Boolean).map(x=>['',x.trim()]);sections.push('Verse 1')}arrangement=sections;activeSection=arrangement[0];currentSongTitle=title;currentArtist=artist;currentKey=detectKey();document.getElementById('analysisResult').innerHTML='<div class="card"><b>Detected structure</b><div class="muted" style="margin:7px 0 12px">'+sections.length+' sections • '+sections.map(esc).join(' • ')+'</div><button type="button" class="btn primary" style="width:100%" onclick="finishImport()">✓ Open Analyzed Song</button></div>'}
function finishImport(){closeModal();openSong();saveLocal(false);toast('Song imported')}
function renderSetlist(){document.getElementById('setlistBox').innerHTML=setlist.map((s,i)=>'<div class="item"><div class="itemmain"><b>'+(i+1)+'. '+esc(s)+'</b></div><button type="button" class="btn" onclick="openSetSong('+JSON.stringify(s)+')">Open</button></div>').join('')}
function addSetSong(){const n=prompt('Song title:');if(n){setlist.push(n);renderSetlist();saveLocal(false)}}
function openSetSong(s){if(s===currentSongTitle)openSong();else toast('This song is not loaded yet')}
function saveLocal(show=true){try{localStorage.setItem('worshipChordsApp',JSON.stringify({base,arrangement,size,setlist,currentSongTitle,currentArtist,currentKey,activeSection}));if(show)toast('Saved locally')}catch(e){if(show)toast('Could not save')}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('worshipChordsApp')||'null');if(!d)return;if(d.base)Object.assign(base,d.base);if(Array.isArray(d.arrangement)&&d.arrangement.length)arrangement=d.arrangement;if(Array.isArray(d.setlist))setlist=d.setlist;if(d.size)size=d.size;if(d.currentSongTitle)currentSongTitle=d.currentSongTitle;if(d.currentArtist)currentArtist=d.currentArtist;if(d.currentKey)currentKey=normalizeKey(d.currentKey);activeSection=d.activeSection&&arrangement.includes(d.activeSection)?d.activeSection:(arrangement[0]||'')}catch(e){console.warn('Load failed',e)}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',1700)}
loadLocal();renderSong();
</script>
</body>
</html>
