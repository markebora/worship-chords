<script>
// Legacy service-worker cleanup. The app no longer depends on a service worker.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(keys=>keys.filter(k=>k.startsWith('worship-chords-')).forEach(k=>caches.delete(k))).catch(()=>{});
}
</script>
