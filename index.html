<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b0b0c"
>

<title>Worship Chords</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Disciples">

<!-- Elegant serif font for the startup splash -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  background:#0b0b0c;
  color:#f7f7f7;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:920px;
  min-height:100vh;

  background:#111113;

  position:relative;

  padding-bottom:110px;
}


/* =========================================================
   HEADER
========================================================= */

.top{
  padding:24px 22px 0;
}

.top.topHidden{
  display:none;
}

.welcome{
  font-size:15px;
  color:#a7a7ad;
  font-weight:600;
}

.hero{
  text-align:center;
  padding:42px 20px 48px;

  max-height:260px;

  opacity:1;

  overflow:hidden;

  transition:
    max-height .32s ease,
    padding .32s ease,
    opacity .22s ease;
}

.hero.heroHidden{
  max-height:0;

  padding-top:0;
  padding-bottom:0;

  opacity:0;
}

.hero h1{
  margin:0;

  font-size:42px;
  line-height:1.05;

  font-weight:800;
}

.hero p{
  margin:10px 0 0;

  color:#a7a7ad;
  font-size:15px;
}


/* =========================================================
   MAIN
========================================================= */

.content{
  padding:0 22px;
}

.content.screenTransition{
  animation:screenFadeIn .32s cubic-bezier(.22,.8,.36,1);
}

@keyframes screenFadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.placeholder{
  min-height:280px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#66666d;

  font-size:14px;
  text-align:center;
}


/* =========================================================
   COMMON BUTTONS
========================================================= */

.toolbarBtn,
.smallBtn,
.editorBtn,
.backBtn,
.goBtn,
.searchBtn,
.closeBtn{
  cursor:pointer;
}

.toolbarBtn{
  border:1px solid #303036;

  background:#1a1a1d;

  color:#eee;

  border-radius:10px;

  padding:9px 11px;

  font-size:12px;
  font-weight:700;
}

.toolbarBtn:hover{
  background:#222226;
}

.toolbarBtn.primary{
  background:#fff;
  color:#111;
}


/* =========================================================
   OPEN-SONG NAV INDICATOR (bouncing dots)
========================================================= */

.nav .icon{
  position:relative;
}

.navDots{
  display:none;

  position:absolute;
  inset:0;

  align-items:center;
  justify-content:center;

  gap:4px;
}

.navDots i{
  width:5px;
  height:5px;

  border-radius:50%;

  background:currentColor;

  animation:navDotBounce 1.1s ease-in-out infinite;
}

.navDots i:nth-child(2){
  animation-delay:.18s;
}

.navDots i:nth-child(3){
  animation-delay:.36s;
}

@keyframes navDotBounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

.nav button.songOpen .icon svg{
  display:none;
}

.nav button.songOpen .navDots{
  display:flex;
}


/* =========================================================
   FLOATING NAVIGATION
========================================================= */

.nav{
  position:fixed;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 24px);
  max-width:620px;

  height:60px;

  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  z-index:100;

  background:rgba(0,0,0,.48);

  border:1px solid rgba(255,255,255,.12);

  border-radius:20px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.nav button{
  flex:1;

  min-width:0;

  height:48px;

  border:0;
  border-radius:15px;

  background:transparent;

  color:rgba(255,255,255,.38);

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.nav button.active{
  color:#fff;

  background:rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 0 14px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.nav .icon{
  width:24px;
  height:24px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:currentColor;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.30))
    drop-shadow(0 0 7px rgba(255,255,255,.12));
}

.nav .icon svg{
  width:22px;
  height:22px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.6;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button.active .icon{
  color:#fff;

  filter:
    drop-shadow(0 0 4px rgba(255,255,255,1))
    drop-shadow(0 0 9px rgba(255,255,255,.75))
    drop-shadow(0 0 18px rgba(255,255,255,.35));

  transform:translateY(-1px);
}

.nav button.active .icon svg{
  stroke-width:1.85;
}

.nav button:active{
  transform:scale(.94);
}


/* =========================================================
   HOME
========================================================= */

.homePage{
  padding-bottom:30px;
}

.homeActions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.homeCard{
  padding:18px;

  border:1px solid #29292e;

  border-radius:15px;

  background:#18181b;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .2s ease;
}

.homeCard:active{
  transform:scale(.98);
}

.homeCardIcon{
  width:26px;
  height:26px;

  margin-bottom:12px;

  color:#fff;
}

.homeCardIcon svg{
  width:100%;
  height:100%;

  fill:none;
  stroke:currentColor;

  stroke-width:1.6;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.homeCardTitle{
  font-size:15px;
  font-weight:800;
}

.homeCardText{
  margin-top:5px;

  color:#777780;

  font-size:12px;

  line-height:1.5;
}


/* =========================================================
   PROFILE
========================================================= */

.profilePage{
  padding:4px 0 30px;
}

.profileHead{
  display:flex;

  align-items:center;

  gap:14px;

  padding:6px 2px 24px;
}

.profileAvatar{
  width:56px;
  height:56px;

  flex:0 0 auto;

  border-radius:50%;

  background:#1a1a1d;
  border:1px solid #303036;

  display:grid;
  place-items:center;

  overflow:hidden;

  font-size:19px;
  font-weight:800;

  color:#eee;
}

.profileAvatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.profileHeadInfo{
  min-width:0;
}

.profileName{
  font-size:19px;
  font-weight:800;
}

.profileEmail{
  margin-top:3px;

  color:#85858c;

  font-size:12.5px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profileSection{
  margin:22px 0;
}

.settingsCard{
  border:1px solid #303036;

  border-radius:14px;

  background:#151517;

  overflow:hidden;
}

.settingsRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:14px 15px;
}

.settingsRow + .settingsRow{
  border-top:1px solid #232327;
}

.settingsRowLabel{
  font-size:13.5px;
  font-weight:700;
}

.settingsRowSub{
  margin-top:3px;

  color:#77777f;

  font-size:11.5px;

  line-height:1.5;
}

.settingsRowValue{
  color:#a7a7ad;

  font-size:13px;
  font-weight:700;
}

.stepper{
  display:flex;

  align-items:center;

  gap:2px;

  flex:0 0 auto;
}

.stepperBtn{
  width:30px;
  height:30px;

  border:1px solid #303036;

  border-radius:9px;

  background:#1a1a1d;

  color:#eee;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.stepperValue{
  min-width:44px;

  text-align:center;

  font-size:13px;
  font-weight:700;

  color:#eee;
}

.toolbarBtn.danger{
  background:#3a2020;
  color:#ff8b8b;
}

.settingsCardPad{
  padding:14px 15px;
}

.googleClientIdInput{
  width:100%;

  margin-top:10px;

  padding:11px 12px;

  border:1px solid #303036;
  border-radius:10px;

  background:#0f0f11;
  color:#eee;

  font-size:12.5px;
}

.profileAbout{
  text-align:center;

  margin-top:26px;

  color:#5c5c63;

  font-size:11.5px;

  line-height:1.7;
}


/* =========================================================
   LYRICS WORKSPACE
========================================================= */

.lyricsWorkspace{
  padding:4px 0 30px;
}

.lyricsWorkspaceHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:18px;
}

.lyricsWorkspaceTitle{
  font-size:28px;
  font-weight:800;
}

.lyricsWorkspaceSub{
  margin-top:4px;

  color:#85858c;

  font-size:12px;
}

.lyricsActions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

  margin-bottom:18px;
}

.lyricsAction{
  border:1px solid #303036;

  background:#18181b;

  color:#fff;

  border-radius:14px;

  padding:15px;

  text-align:left;

  cursor:pointer;
}

.lyricsAction:hover{
  background:#202024;
}

.lyricsActionIcon{
  width:22px;
  height:22px;

  margin-bottom:2px;

  color:#fff;
}

.lyricsActionIcon svg{
  width:100%;
  height:100%;

  fill:none;
  stroke:currentColor;

  stroke-width:1.7;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.lyricsActionTitle{
  margin-top:7px;

  font-size:13px;
  font-weight:800;
}

.lyricsActionSub{
  margin-top:3px;

  color:#777780;

  font-size:11px;
}

.recentTitle{
  margin:20px 0 9px;

  color:#777780;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.09em;

  font-weight:800;
}


/* =========================================================
   LIBRARY
========================================================= */

.libraryHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.libraryTitle{
  font-size:28px;
  font-weight:800;
}

.searchBtn{
  width:44px;
  height:44px;

  border:1px solid #303036;

  border-radius:14px;

  background:#1a1a1d;

  color:#fff;

  display:grid;
  place-items:center;
}

.searchBtn svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.librarySection{
  margin:22px 0;
}

.sectionLabel{
  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.09em;

  color:#77777f;

  font-weight:800;

  margin-bottom:9px;
}

.songCard{
  display:flex;

  align-items:center;

  gap:12px;

  padding:14px 15px;

  margin:8px 0;

  background:#18181b;

  border:1px solid #29292e;

  border-radius:14px;

  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:
    background .2s ease,
    transform .15s ease;
}

.songCard:active{
  transform:scale(.985);

  background:#1d1d21;
}

.songIcon{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:10px;

  background:#232328;

  display:grid;
  place-items:center;

  color:#fff;
}

.songIcon svg{
  width:17px;
  height:17px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.songInfo{
  flex:1;

  min-width:0;
}

.songName{
  font-weight:750;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.songMeta{
  font-size:12px;

  color:#777780;

  margin-top:3px;
}

.empty{
  padding:18px;

  border:1px dashed #303036;

  border-radius:14px;

  color:#707078;

  font-size:13px;

  text-align:center;
}


/* =========================================================
   SEARCH MODAL
========================================================= */

.modalBack{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,0);

  z-index:500;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear .25s;
}

.modalBack.open{
  opacity:1;

  visibility:visible;

  pointer-events:auto;

  background:rgba(0,0,0,.68);

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear 0s;
}

.modal{
  width:min(920px,100%);

  max-height:88vh;

  overflow:auto;

  background:#151518;

  border:1px solid #2d2d32;

  border-radius:22px 22px 0 0;

  padding:20px;

  transform:translateY(28px);

  transition:transform .3s cubic-bezier(.22,.8,.36,1);
}

.modalBack.open .modal{
  transform:translateY(0);
}

.modalTop{
  display:flex;

  align-items:center;

  gap:12px;
}

.modalTop h2{
  margin:0;

  font-size:20px;

  flex:1;
}

.closeBtn{
  border:0;

  background:#242429;

  color:#ddd;

  border-radius:10px;

  padding:9px 12px;
}

.searchBox{
  display:flex;

  gap:8px;

  margin:16px 0 12px;
}

.searchInput{
  flex:1;

  min-width:0;

  background:#0e0e10;

  border:1px solid #34343a;

  color:#fff;

  border-radius:12px;

  padding:13px 14px;

  outline:none;
}

.goBtn{
  border:0;

  border-radius:12px;

  padding:0 16px;

  background:#fff;

  color:#111;

  font-weight:800;
}

.sourceTabs{
  display:flex;

  gap:8px;

  margin-bottom:14px;
}

.sourceTabs button{
  flex:1;

  border:1px solid #303036;

  background:#1b1b1f;

  color:#9999a2;

  border-radius:10px;

  padding:10px;

  font-size:12px;

  font-weight:750;

  cursor:pointer;
}

.sourceTabs button.active{
  background:#29292e;

  color:#fff;

  border-color:#44444b;
}

.result{
  padding:13px 0;

  border-top:1px solid #29292e;
}

.result:first-child{
  border-top:0;
}

.resultTitle{
  font-weight:750;
}

.resultMeta,
.hint{
  font-size:12px;

  color:#777780;

  line-height:1.5;

  margin-top:5px;
}

.ugPasteHint{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:11px;
  padding:11px 12px;
  background:#15201c;
  border:1px solid #234a3a;
  border-radius:12px;
  animation:songCheckPop .18s ease;
}

.ugPasteHintText{
  flex:1;
  min-width:0;
  font-size:12px;
  color:#a9d9c4;
  line-height:1.5;
}

.ugPasteBtn{
  flex:0 0 auto;
  white-space:nowrap;
}

.resultActions{
  display:flex;

  gap:7px;

  margin-top:9px;

  flex-wrap:wrap;
}

.driveStatus{
  padding:12px;

  background:#1a1a1d;

  border-radius:12px;

  color:#aaa;

  font-size:13px;

  line-height:1.5;

  margin-top:10px;
}


/* =========================================================
   SONG VIEWER
========================================================= */

.songPage{
  padding:4px 0 30px;
}

.songTop{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.backBtn{
  border:0;

  background:#25252a;

  color:#fff;

  border-radius:10px;

  padding:9px 12px;
}

.songHeading{
  flex:1;

  min-width:0;
}

.songHeading h1{
  margin:0;

  font-size:26px;

  line-height:1.15;
}

.songHeading p{
  margin:5px 0 0;

  color:#85858c;

  font-size:13px;
}

.songToolbar{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-bottom:14px;
}

.toolbarRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  flex-wrap:wrap;
}

.toolbarRow.secondaryRow{
  justify-content:flex-start;
}

.viewModeGroup{
  display:flex;

  width:100%;

  gap:4px;

  background:#1b1b1f;

  border:1px solid #303036;

  border-radius:13px;

  padding:4px;
}

.viewModeBtn{
  flex:1;

  border:0;

  background:transparent;

  color:#9999a2;

  border-radius:9px;

  padding:9px 10px;

  font-size:13px;
  font-weight:800;

  cursor:pointer;

  transition:background .18s ease,color .18s ease;
}

.viewModeBtn.active{
  background:#fff;
  color:#111;
}

.transposeGroup,
.autoScrollGroup{
  display:flex;

  align-items:center;

  gap:8px;
}

.songMenuWrap{
  position:relative;

  margin-left:auto;
}

.songMenuBtn{
  width:40px;

  font-size:18px;

  line-height:1;

  padding:9px 0;
}

.songMenuDropdown{
  position:absolute;

  top:calc(100% + 6px);
  right:0;

  min-width:180px;

  background:#1b1b1f;

  border:1px solid #303036;

  border-radius:13px;

  padding:6px;

  display:none;

  flex-direction:column;

  gap:2px;

  z-index:60;

  box-shadow:0 14px 34px rgba(0,0,0,.55);
}

.songMenuDropdown.open{
  display:flex;
}

.songMenuItem{
  border:0;

  background:transparent;

  color:#f7f7f7;

  text-align:left;

  padding:11px 12px;

  border-radius:9px;

  font-size:13px;
  font-weight:750;

  cursor:pointer;
}

.songMenuItem:active{
  background:#26262b;
}

.autoScrollGroup .toolbarBtn,
.asArrowBtn{
  touch-action:none;
}

.asToggleWrap{
  display:inline-flex;

  align-items:center;

  gap:0;
}

.asToggleBtn{
  min-width:40px;

  text-align:center;

  user-select:none;
  -webkit-user-select:none;

  outline:none;
}

.asPlayIcon{
  display:inline-block;

  width:0;
  height:0;

  margin-left:2px;

  border-style:solid;
  border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent currentColor;
}

.asPauseIcon{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:3px;
}

.asPauseIcon i{
  display:block;

  width:3px;
  height:12px;

  background:currentColor;
  border-radius:1px;
}

.asArrowBtn{
  width:0;

  height:40px;

  padding:0;

  border:0;
  background:transparent;

  color:#cfcfd4;

  font-size:15px;
  line-height:1;

  cursor:pointer;

  opacity:0;

  overflow:hidden;

  transition:width .2s ease,opacity .2s ease,margin .2s ease;

  pointer-events:none;
}

.asToggleWrap.speedMode .asArrowBtn{
  width:24px;

  opacity:1;

  pointer-events:auto;
}

.asToggleWrap.speedMode .asArrowUp{
  margin-right:2px;
}

.asToggleWrap.speedMode .asArrowDown{
  margin-left:2px;
}

.asArrowBtn:active{
  color:#fff;
}

.asToggleWrap.speedMode .asToggleBtn{
  background:#fff;
  color:#111;

  border-color:#fff;
}

.lyricsView{
  background:#0e0e10;

  border:1px solid #29292e;

/* =========================================================
   STARTUP SPLASH

   Sequence: the logo mark fades in alone, centered — then
   crossfades into the assembled "disciples" wordmark, where
   the same mark (now smaller) plus a small stem that grows in
   beside it reads as the lowercase "d", with "isciples"
   completing the word and a soft glow settling underneath.
   The tagline fades in last, below the wordmark.
========================================================= */

#startupSplash{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:26px;

  background:#0b0b0c;

  opacity:1;
  transition:opacity 0.9s ease;
}

#startupSplash.splashHidden{
  opacity:0;
  pointer-events:none;
}

#startupSplash .splashStage{
  position:relative;
  width:min(78vw, 320px);
  height:104px;
}

/* Stage A — the mark alone, big, centered */

#startupSplash .splashIconBig{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  animation:
    splashFadeIn 0.6s ease forwards,
    splashFadeOut 0.45s ease forwards 1.05s;
}

#startupSplash .splashIconBig img{
  width:92px;
  height:92px;
  border-radius:50%;
}

/* Stage B — the assembled "disciples" wordmark */

#startupSplash .splashWordmark{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  animation:splashFadeIn 0.5s ease forwards 1.25s;
}

#startupSplash .splashMark{
  position:relative;
  display:inline-flex;
  align-items:flex-end;
  justify-content:center;

  width:42px;
  height:42px;

  margin-right:2px;
}

#startupSplash .splashMark img{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  border-radius:50%;
  display:block;
}

#startupSplash .splashStem{
  position:absolute;
  right:2px;
  bottom:50%;
  z-index:1;

  width:7px;
  height:0;

  background:#f7f7f7;
  border-radius:5px 5px 0 0;

  animation:splashStemGrow 0.45s cubic-bezier(.22,.8,.36,1) forwards 1.3s;
}

#startupSplash .splashRest{
  font-family:inherit;
  font-weight:800;
  letter-spacing:-0.01em;
  font-size:clamp(34px, 9vw, 46px);
  color:#f7f7f7;
  line-height:1;
}

#startupSplash .splashWordmark::after{
  content:'';
  position:absolute;
  left:50%;
  bottom:6px;
  transform:translateX(-50%);

  width:64%;
  height:16px;

  background:radial-gradient(ellipse at center, rgba(247,247,247,0.38), transparent 72%);
  filter:blur(3px);

  opacity:0;
  animation:splashFadeIn 0.6s ease forwards 1.75s;

  pointer-events:none;
}

@keyframes splashFadeIn{
  from{ opacity:0; transform:scale(0.94); }
  to{ opacity:1; transform:scale(1); }
}

@keyframes splashFadeOut{
  to{ opacity:0; transform:scale(1.06); }
}

@keyframes splashStemGrow{
  from{ height:0; }
  to{ height:48px; }
}

#startupSplash .splashText{
  font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-style:italic;
  font-weight:500;

  font-size:clamp(20px, 5.5vw, 30px);
  letter-spacing:0.04em;
  line-height:1.5;

  color:#f2e9d8;
  text-align:center;

  padding:0 32px;

  opacity:0;
  transform:translateY(6px);
  animation:splashTextIn 1.2s ease forwards 1.95s;
}

@keyframes splashTextIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

const screen =
  document.getElementById('screen');

const modal =
  document.getElementById('searchModal');

const query =
  document.getElementById('libraryQuery');


/* =========================================================
   TOASTS + CONFIRM DIALOG

   Lightweight in-app replacements for the browser's native
   alert()/confirm(), which look and feel out of place once the
   app is wrapped as a native shell. showToast() is fire-and-
   forget; showConfirmDialog() returns a Promise<boolean> so
   call sites just `await` it instead of using confirm().
========================================================= */

function showToast(message, type){

  const stack =
    document.getElementById('toastStack');

  if(!stack){
    return;
  }

  const toast =
    document.createElement('div');

  toast.className =
    'toast' +
    (type === 'error' ? ' toastError' : '') +
    (type === 'success' ? ' toastSuccess' : '');

  toast.textContent =
    String(message == null ? '' : message);

  stack.appendChild(toast);

  requestAnimationFrame(() => {
    toast.classList.add('toastShow');
  });

  setTimeout(() => {

    toast.classList.remove('toastShow');

    setTimeout(() => {
      toast.remove();
    }, 250);

  }, 3200);

}


function showConfirmDialog(message, options){

  const opts =
    options || {};

  const confirmLabel =
    opts.confirmLabel || 'Confirm';

  const cancelLabel =
    opts.cancelLabel || 'Cancel';

  const danger =
    !!opts.danger;

  return new Promise((resolve) => {

    const host =
      document.getElementById('confirmOverlay');

    if(!host){
      resolve(window.confirm(message));
      return;
    }

    host.innerHTML = `

      <div class="confirmBack" id="confirmBack">
        <div class="confirmBox">

          <p class="confirmMessage">${esc(String(message == null ? '' : message))}</p>

          <div class="confirmBtnRow">
            <button class="toolbarBtn" id="confirmCancelBtn" type="button">${esc(cancelLabel)}</button>
            <button class="toolbarBtn${danger ? ' danger' : ' primary'}" id="confirmOkBtn" type="button">${esc(confirmLabel)}</button>
          </div>

        </div>
      </div>

    `;

    const back =
      document.getElementById('confirmBack');

    const finish = (result) => {
      back.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 200);
      resolve(result);
    };

    document.getElementById('confirmCancelBtn').onclick = () => finish(false);
    document.getElementById('confirmOkBtn').onclick = () => finish(true);

    back.onclick = (event) => {
      if(event.target === back){
        finish(false);
      }
    };

    requestAnimationFrame(() => {
      back.classList.add('open');
    });

  });

}


/*
  Replacement for window.prompt(), which — per the note on the
  older analysis rename flow — is unreliable inside mobile
  webviews and installed PWAs (it can silently no-op). Returns
  Promise<string|null>: null if cancelled, otherwise the
  trimmed text (which may be an empty string).
*/

function showPromptDialog(message, defaultValue, options){

  const opts =
    options || {};

  const confirmLabel =
    opts.confirmLabel || 'OK';

  const cancelLabel =
    opts.cancelLabel || 'Cancel';

  return new Promise((resolve) => {

    const host =
      document.getElementById('confirmOverlay');

    if(!host){
      resolve(window.prompt(message, defaultValue || ''));
      return;
    }

    host.innerHTML = `

      <div class="confirmBack" id="confirmBack">
        <div class="confirmBox">

          <p class="confirmMessage">${esc(String(message == null ? '' : message))}</p>

          <input
            class="confirmInput"
            id="confirmPromptInput"
            type="text"
            value="${esc(defaultValue || '')}"
          >

          <div class="confirmBtnRow">
            <button class="toolbarBtn" id="confirmCancelBtn" type="button">${esc(cancelLabel)}</button>
            <button class="toolbarBtn primary" id="confirmOkBtn" type="button">${esc(confirmLabel)}</button>
          </div>

        </div>
      </div>

    `;

    const back =
      document.getElementById('confirmBack');

    const input =
      document.getElementById('confirmPromptInput');

    const finish = (result) => {
      back.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 200);
      resolve(result);
    };

    document.getElementById('confirmCancelBtn').onclick = () => finish(null);
    document.getElementById('confirmOkBtn').onclick = () => finish(input.value.trim());

    input.onkeydown = (event) => {
      if(event.key === 'Enter'){
        finish(input.value.trim());
      }else if(event.key === 'Escape'){
        finish(null);
      }
    };

    back.onclick = (event) => {
      if(event.target === back){
        finish(null);
      }
    };

    requestAnimationFrame(() => {
      back.classList.add('open');
      input.focus();
      input.select();
    });

  });

}


/*
  Replays a soft fade/slide-in animation on #screen every time
  its content is swapped out, so navigating between tabs/pages
  (and opening the song viewer, editor, etc.) always feels
  smooth instead of an abrupt content jump.
*/

(function attachScreenTransition(){

  if(!screen)return;

  const replay=()=>{
    screen.classList.remove('screenTransition');
    void screen.offsetWidth;
    screen.classList.add('screenTransition');
  };

  new MutationObserver(replay).observe(
    screen,
    {childList:true}
  );

})();

let source = 'all';

/*
  True right after "Search" opens Ultimate Guitar's own search
  page in a new tab for a plain title lookup. Drives the
  "paste the link here" hint shown in the UG results panel, and
  is cleared as soon as the user pastes a link back / imports /
  switches tabs.
*/
let ugAwaitingPaste = false;

let currentSong = null;


/*
  Whether the song viewer shows chords above the lyrics
  or lyrics only. Session-level display preference — not
  saved with the song.
*/
let showChords = true;

/*
  Library multi-select state: song IDs currently checked in
  the Library's long-press select mode (Rename/Delete/Merge).
*/
let librarySelectedIds = new Set();

/*
  Which top-level tab the Library screen is showing:
  'songs' (the normal saved-songs list) or 'setlists'.
*/
let libraryTab = 'songs';

/*
  When true, the Songs tab only shows songs with favorite:true.
  Session-level, like showChords — not persisted.
*/
let libraryFavoritesOnly = false;


/*
  PDF export options state: working copy of the current song's
  sections (draggable order + per-section include/exclude),
  plus the chosen column count and whether chords are included.
  Rebuilt fresh from the song each time the export screen opens;
  the column/chords choices persist across opens in a session.
*/
let pdfExportSections = [];
let pdfExportColumns = 1;
let pdfExportIncludeChords = true;


/*
  Whenever a song is open (currentSong is set), the Lyrics tab
  in the bottom nav swaps its icon for a small bouncing-dots
  "loading" animation, signalling that a song is open and one
  tap will jump straight back into it — from any screen.
*/

function updateLyricsNavIndicator(){

  const navBtn=
    document.getElementById('navLyricsBtn');

  if(!navBtn)return;

  navBtn.classList.toggle(
    'songOpen',
    !!currentSong
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function setActiveNav(name){

  document
    .querySelectorAll('.nav button')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.screen === name
      );

    });


  const hero =
    document.querySelector('.hero');


  if(hero){

    hero.classList.toggle(
      'heroHidden',
      name !== 'home'
    );

  }


  const top =
    document.querySelector('.top');


  if(top){

    top.classList.toggle(
      'topHidden',
      name !== 'home'
    );

  }


  /*
    Both the library select-bar and the song section float-bar
    live in fixed-position overlays that sit as SIBLINGS of
    #screen (not children of it). #screen replays a transform
    animation on every render, and a `transform` on an ancestor
    turns `position:fixed` descendants into elements positioned
    relative to that ancestor instead of the viewport — which is
    what caused the bars to visibly pop in near the content and
    then snap down into place. Clearing both overlays here, and
    letting each render function repopulate its own overlay,
    keeps them genuinely viewport-fixed with no jump.
  */

  const libraryOverlay =
    document.getElementById('libraryOverlay');

  if(libraryOverlay){

    libraryOverlay.innerHTML = '';

  }


  const songSectionOverlay =
    document.getElementById('songSectionOverlay');

  if(songSectionOverlay){

    songSectionOverlay.innerHTML = '';

  }


  const mergeNavOverlay =
    document.getElementById('mergeNavOverlay');

  if(mergeNavOverlay){

    mergeNavOverlay.innerHTML = '';

  }


  const autoScrollOverlay =
    document.getElementById('autoScrollOverlay');

  if(autoScrollOverlay){

    autoScrollOverlay.innerHTML = '';

  }


  if(typeof updateLyricsNavIndicator==='function'){

    updateLyricsNavIndicator();

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


/*
  Pasted or imported lyrics sometimes already contain literal
  HTML entities (e.g. "that&#039;s" instead of "that's") because
  the source page had them baked into its raw text. Decoding them
  once, up front, means esc() never has to re-escape an entity
  that was never a real character to begin with.
*/

function decodeHtmlEntities(text){

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.innerHTML =
    String(text ?? '');


  return textarea.value;

}


/*
  "Smart"/typographic punctuation — en dashes, em dashes, curly
  quotes, ellipses, non-breaking spaces — round-trips fine
  inside the app (real UTF-8 strings in memory), but breaks on
  export: jsPDF's built-in fonts don't reliably map these
  characters, and a plain .txt file with no encoding marker can
  get opened by another app as the wrong character set. Either
  way the symptom is the same mojibake — "–" turning into
  "â€“". Normalizing to plain ASCII equivalents right before
  writing the file sidesteps the problem entirely, since plain
  ASCII is safe under every encoding. Only used at export time —
  the saved song text and in-app viewer are untouched.
*/

function sanitizeForPlainExport(text){

  return String(text ?? '')

    .replace(/[\u2013\u2014\u2212]/g, '-')   /* – — − */
    .replace(/[\u2018\u2019\u201A\u2032]/g, "'")  /* ‘ ’ ‚ ′ */
    .replace(/[\u201C\u201D\u201E\u2033]/g, '"')  /* “ ” „ ″ */
    .replace(/\u2026/g, '...')               /* … */
    .replace(/[\u00A0\u202F]/g, ' ');        /* nbsp, narrow nbsp */

}


/* =========================================================
   STORAGE
========================================================= */

/*
  Local storage keeps the library small enough to stay fast and
  fit comfortably under a browser's per-origin storage limit.
  500 songs is a generous ceiling for a church's working set —
  well past what most congregations keep on rotation — and the
  Export Library backup (Profile → Data) plus Drive sync are the
  real safety net if a library ever needs to grow past this.
*/
const MAX_SONGS = 500;


function getSongs(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsSongs'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeSongs(songs){

  /*
    No automatic Drive push here on purpose — a save, rename,
    or delete on one phone should never silently overwrite
    someone else's in-progress edits (different key/transpose,
    etc.) on the same song. Brand-new songs are auto-uploaded
    explicitly from saveCurrentSong(); everything else only
    reaches Drive when someone taps that song's Sync button,
    or Profile → Sync Now.
  */

  localStorage.setItem(
    'worshipChordsSongs',
    JSON.stringify(songs.slice(0, MAX_SONGS))
  );

}


/* =========================================================
   FAVORITES
========================================================= */

function toggleFavorite(songId){

  const songs =
    getSongs();

  const song =
    songs.find(
      item => item.id === songId
    );

  if(!song)return;

  song.favorite = !song.favorite;

  writeSongs(songs);

  showToast(
    song.favorite
      ? `"${song.title}" added to Favorites.`
      : `"${song.title}" removed from Favorites.`
  );

}


/* =========================================================
   SETLISTS

   A setlist is just a named, ordered list of song IDs — the
   songs themselves still live only in the main Library. Deleting
   a setlist never touches the songs in it; deleting a song
   just leaves a dangling ID that setlist views quietly skip.
========================================================= */

function getSetlists(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsSetlists'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeSetlists(setlists){

  localStorage.setItem(
    'worshipChordsSetlists',
    JSON.stringify(setlists.slice(0, MAX_SONGS))
  );

}


async function createSetlist(){

  const name =
    await showPromptDialog(
      'Setlist name:',
      ''
    );

  if(name === null)return null;

  const trimmed =
    name.trim();

  if(!trimmed)return null;

  const setlists =
    getSetlists();

  const newSetlist = {
    id:
      (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2),
    name: trimmed,
    songIds: [],
    createdAt: new Date().toISOString()
  };

  setlists.unshift(newSetlist);

  writeSetlists(setlists);

  return newSetlist.id;

}


async function renameSetlist(setlistId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const name =
    await showPromptDialog(
      'Setlist name:',
      setlist.name || ''
    );

  if(name === null)return;

  const trimmed =
    name.trim();

  if(!trimmed)return;

  setlist.name = trimmed;

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}


async function deleteSetlist(setlistId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const confirmed =
    await showConfirmDialog(
      `Delete the setlist "${setlist.name}"? The songs in it stay in your Library.`,
      { confirmLabel:'Delete', danger:true }
    );

  if(!confirmed)return;

  writeSetlists(
    setlists.filter(item => item.id !== setlistId)
  );

  showToast(`"${setlist.name}" deleted.`);

  renderLibrary();

}


function addSongToSetlist(setlistId, songId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  if(setlist.songIds.includes(songId)){

    showToast('Already in that setlist.');
    return;

  }

  setlist.songIds.push(songId);

  writeSetlists(setlists);

  showToast(`Added to "${setlist.name}".`, 'success');

}


function removeSongFromSetlist(setlistId, songId){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  setlist.songIds =
    setlist.songIds.filter(id => id !== songId);

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}


function moveSongInSetlist(setlistId, songId, direction){

  const setlists =
    getSetlists();

  const setlist =
    setlists.find(item => item.id === setlistId);

  if(!setlist)return;

  const index =
    setlist.songIds.indexOf(songId);

  if(index === -1)return;

  const nextIndex =
    index + direction;

  if(nextIndex < 0 || nextIndex >= setlist.songIds.length)return;

  const ids = setlist.songIds;
  const temp = ids[index];
  ids[index] = ids[nextIndex];
  ids[nextIndex] = temp;

  writeSetlists(setlists);

  renderSetlistDetail(setlistId);

}



function saveSong(
  title,
  text,
  url='',
  analysis=null
){

  const songs =
    getSongs();

  const item = {

    id:
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(
            Date.now() +
            Math.random()
          ),

    title:
      title ||
      'Untitled Song',

    text:
      text || '',

    originalText:
      text || '',

    sourceUrl:
      url || '',

    savedAt:
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString(),

    kind:
      'analyzed',

    analysis:
      analysis || null,

    transposeSteps:
      0,

    fontSize:
      getSettings().defaultFontSize

  };


  songs.unshift(item);


  writeSongs(
    songs.slice(0,MAX_SONGS)
  );


  return item;

}


/* =========================================================
   RECENTLY VIEWED
   Separate from the Library on purpose: opening a song in
   the lyrics viewer (search result, import, analyzer preview,
   or a real Library song) only ever touches this list. A song
   only enters the Library when the user taps Save.
========================================================= */

/* =========================================================
   GOOGLE ACCOUNT
   Uses Google Identity Services (client-side OAuth — no
   backend needed). Requires a Google OAuth Client ID, set
   once from the Profile page and stored in Settings.

   Scope is drive.file — the app can only see/create files
   it made itself, never the rest of anyone's Drive. That's
   enough for our one shared library file.
========================================================= */

let googleTokenClient = null;
let googleAccessToken = null;

const GOOGLE_DRIVE_SCOPE =
  'openid email profile ' +
  'https://www.googleapis.com/auth/drive.file';


/*
  True when running inside the wrapped Android app (Capacitor)
  rather than a normal mobile browser tab. Google blocks its web
  sign-in popup inside embedded webviews like this one, so the
  native app needs a different sign-in path — see
  googleSignInNative() below.
*/
function isNativeApp(){

  return !!(
    window.Capacitor &&
    window.Capacitor.isNativePlatform &&
    window.Capacitor.isNativePlatform()
  );

}


/*
  Native sign-in via the Capacitor Google Auth plugin (real
  Android account picker — not the web popup, so it isn't
  blocked). silent=true is used for background token refresh:
  it still resolves quietly if the person already granted
  access before, without popping any UI.

  Requires the @codetrix-studio/capacitor-google-auth plugin to
  be installed in the Android project and an Android-type OAuth
  Client ID configured — see BUILD_APK.md for the exact setup
  steps, since those need your own Google Cloud Console access
  and can't be done from here.
*/
async function googleSignInNative(silent){

  const plugin =
    window.Capacitor &&
    window.Capacitor.Plugins &&
    window.Capacitor.Plugins.GoogleAuth;

  if(!plugin){

    if(!silent){

      showToast(
        'Google Sign-In isn\'t set up in this build yet. ' +
        'See BUILD_APK.md for the native setup steps.',
        'error'
      );

    }

    return false;

  }

  try{

    const result =
      await plugin.signIn();

    googleAccessToken =
      (result.authentication && result.authentication.accessToken) ||
      result.accessToken ||
      null;

    if(!googleAccessToken){

      if(!silent){

        showToast(
          'Google sign-in did not return an access token.',
          'error'
        );

      }

      return false;

    }

    setGoogleUser({

      name: result.name || result.email || 'Google Account',

      email: result.email || '',

      picture: result.imageUrl || ''

    });

    if(!silent){

      renderProfile();

      pullNewSongsFromDrive();

    }

    return true;

  }catch(error){

    console.error(error);

    if(!silent){

      showToast(
        'Google sign-in failed: ' +
        (error && error.message ? error.message : 'unknown error'),
        'error'
      );

    }

    return false;

  }

}


function getGoogleUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsGoogleUser'
      ) || 'null'
    );

  }catch(error){

    console.error(error);

    return null;

  }

}


function setGoogleUser(user){

  if(user){

    localStorage.setItem(
      'worshipChordsGoogleUser',
      JSON.stringify(user)
    );

  }else{

    localStorage.removeItem(
      'worshipChordsGoogleUser'
    );

  }

}


function loadGoogleScript(){

  return new Promise((resolve, reject) => {

    if(window.google && window.google.accounts){

      resolve();
      return;

    }

    const existing =
      document.getElementById(
        'googleIdentityScript'
      );

    if(existing){

      existing.addEventListener(
        'load',
        () => resolve()
      );

      existing.addEventListener(
        'error',
        () => reject(
          new Error('Failed to load Google script.')
        )
      );

      return;

    }

    const script =
      document.createElement('script');

    script.id = 'googleIdentityScript';
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;

    script.onload = () => resolve();

    script.onerror = () => reject(
      new Error('Failed to load Google script.')
    );

    document.head.appendChild(script);

  });

}


async function googleSignIn(){

  if(isNativeApp()){

    await googleSignInNative(false);

    return;

  }

  const clientId =
    getSettings().googleClientId.trim();

  if(!clientId){

    showToast(
      'Add your Google OAuth Client ID first ' +
      '(Profile → Account).',
      'error'
    );

    return;

  }

  try{

    await loadGoogleScript();

  }catch(error){

    showToast(
      'Could not reach Google. Check your connection.',
      'error'
    );

    return;

  }

  googleTokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: clientId,

      scope: GOOGLE_DRIVE_SCOPE,

      callback: async (response) => {

        if(response.error){

          showToast(
            'Google sign-in failed: ' +
            response.error,
            'error'
          );

          return;

        }

        googleAccessToken =
          response.access_token;

        try{

          const profileResponse =
            await fetch(
              'https://www.googleapis.com/oauth2/v3/userinfo',
              {
                headers:{
                  Authorization:
                    'Bearer ' + googleAccessToken
                }
              }
            );

          const profile =
            await profileResponse.json();

          setGoogleUser({

            name: profile.name || profile.email,

            email: profile.email || '',

            picture: profile.picture || ''

          });

        }catch(error){

          console.error(error);

          setGoogleUser({

            name: 'Google Account',

            email: '',

            picture: ''

          });

        }

        renderProfile();

        /*
          After signing in, pull in any songs already in Drive
          that aren't in this Library yet (additive only — this
          never overwrites a song already saved here).
        */

        pullNewSongsFromDrive();

      }

    });

  googleTokenClient.requestAccessToken();

}


function googleSignOut(){

  if(isNativeApp()){

    const plugin =
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.GoogleAuth;

    if(plugin){

      plugin.signOut().catch(() => {});

    }

  }else if(googleAccessToken && window.google){

    google.accounts.oauth2.revoke(
      googleAccessToken,
      () => {}
    );

  }

  googleAccessToken = null;
  googleTokenClient = null;
  driveLibraryFileId = null;

  setGoogleUser(null);
  setSyncStatus('idle');

  renderProfile();

}


/* =========================================================
   GOOGLE DRIVE SYNC
   One shared JSON file (in the signed-in account's Drive)
   holds the whole library plus a short "recently deleted"
   list (tombstones). Nothing syncs automatically except a
   brand-new song being saved — everything else (a changed
   key, an edited line, a rename, a delete) stays local until
   someone deliberately taps that song's Sync button, or
   Profile → Sync Now for the whole library. That way one
   person's in-progress edits never jump onto everyone else's
   copy uninvited.
========================================================= */

const DRIVE_LIBRARY_FILENAME =
  'disciples-library.json';

let driveLibraryFileId = null;
let driveSyncInFlight = false;
let driveSyncQueued = false;


function getTombstones(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsTombstones'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeTombstones(list){

  localStorage.setItem(
    'worshipChordsTombstones',
    JSON.stringify(list)
  );

}


function recordDeletedSongs(ids){

  if(!ids.length){

    return;

  }

  const now =
    new Date().toISOString();

  const list =
    getTombstones().filter(
      item => !ids.includes(item.id)
    );

  ids.forEach(id => {

    list.push({ id, deletedAt: now });

  });

  writeTombstones(list);

}


function setSyncStatus(status, at){

  const detail = { status, at: at || null };

  localStorage.setItem(
    'worshipChordsSyncStatus',
    JSON.stringify(detail)
  );

  const label =
    document.getElementById('driveSyncStatus');

  if(label){

    label.textContent =
      formatSyncStatus(detail);

  }

}


function getSyncStatus(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsSyncStatus'
      ) || 'null'
    ) || { status:'idle', at:null };

  }catch(error){

    return { status:'idle', at:null };

  }

}


function formatSyncStatus(detail){

  if(!getGoogleUser()){

    return 'Not connected';

  }

  if(detail.status === 'syncing'){

    return 'Syncing…';

  }

  if(detail.status === 'error'){

    return 'Sync failed — will retry';

  }

  if(detail.status === 'synced' && detail.at){

    return (
      'Synced ' +
      new Date(detail.at).toLocaleString()
    );

  }

  return 'Not synced yet';

}


/* Merge two song lists + two tombstone lists into one. */

function mergeLibraryState(
  localSongs,
  localTombstones,
  remoteSongs,
  remoteTombstones
){

  const tombstoneMap = new Map();

  [...localTombstones, ...remoteTombstones].forEach(item => {

    if(!item || !item.id)return;

    const existing =
      tombstoneMap.get(item.id);

    if(
      !existing ||
      new Date(item.deletedAt) >
      new Date(existing.deletedAt)
    ){

      tombstoneMap.set(item.id, item);

    }

  });


  const songMap = new Map();

  [...localSongs, ...remoteSongs].forEach(song => {

    if(!song || !song.id)return;

    const existing =
      songMap.get(song.id);

    const songTime =
      new Date(
        song.updatedAt ||
        song.savedAt ||
        0
      );

    const existingTime =
      existing
        ? new Date(
            existing.updatedAt ||
            existing.savedAt ||
            0
          )
        : null;

    if(!existing || songTime > existingTime){

      songMap.set(song.id, song);

    }

  });


  const mergedSongs =
    [...songMap.values()].filter(song => {

      const tomb =
        tombstoneMap.get(song.id);

      if(!tomb){

        return true;

      }

      const songTime =
        new Date(
          song.updatedAt ||
          song.savedAt ||
          0
        );

      /*
        Only keep it if it was edited/re-saved AFTER the
        delete — otherwise the delete wins.
      */

      return new Date(tomb.deletedAt) < songTime;

    });

  mergedSongs.sort(
    (a,b) =>
      new Date(b.savedAt || 0) -
      new Date(a.savedAt || 0)
  );


  /* Keep tombstones from growing forever — 90 days is plenty. */

  const cutoff =
    Date.now() - 90*24*60*60*1000;

  const prunedTombstones =
    [...tombstoneMap.values()].filter(
      item =>
        new Date(item.deletedAt).getTime() >
        cutoff
    );


  return {

    songs: mergedSongs.slice(0,MAX_SONGS),

    tombstones: prunedTombstones

  };

}


async function driveFetch(url, options={}, isRetry=false){

  const response =
    await fetch(url, {

      ...options,

      headers:{

        ...(options.headers || {}),

        Authorization:
          'Bearer ' + googleAccessToken

      }

    });

  if(response.status === 401 && !isRetry){

    const refreshed =
      await silentlyRefreshGoogleToken();

    if(refreshed){

      return driveFetch(url, options, true);

    }

  }

  return response;

}


function silentlyRefreshGoogleToken(){

  return new Promise(resolve => {

    if(!googleTokenClient){

      resolve(false);
      return;

    }

    const previousCallback =
      googleTokenClient.callback;

    googleTokenClient.callback = (response) => {

      googleTokenClient.callback = previousCallback;

      if(response.error){

        resolve(false);
        return;

      }

      googleAccessToken =
        response.access_token;

      resolve(true);

    };

    googleTokenClient.requestAccessToken({
      prompt: ''
    });

  });

}


/*
  Being "signed in" (a saved profile) and having a live Drive
  connection (an access token) are two different things — the
  token resets on every reload and gets silently refreshed in
  the background, which can lag or occasionally fail quietly.
  Any Drive action calls this first so it self-heals instead
  of surfacing "sign in" to someone who already has.
*/

async function ensureGoogleAccessToken(){

  if(googleAccessToken){

    return true;

  }

  if(isNativeApp()){

    return await googleSignInNative(true);

  }

  const clientId =
    getSettings().googleClientId.trim();

  if(!clientId){

    return false;

  }

  try{

    await loadGoogleScript();

  }catch(error){

    return false;

  }

  if(!googleTokenClient){

    googleTokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id: clientId,

        scope: GOOGLE_DRIVE_SCOPE,

        callback: () => {}

      });

  }

  return await silentlyRefreshGoogleToken();

}


async function ensureDriveLibraryFile(){

  if(driveLibraryFileId){

    return driveLibraryFileId;

  }

  const query =
    `name='${DRIVE_LIBRARY_FILENAME}' and trashed=false`;

  const searchResponse =
    await driveFetch(
      'https://www.googleapis.com/drive/v3/files' +
      '?q=' + encodeURIComponent(query) +
      '&fields=files(id,name)'
    );

  const searchData =
    await searchResponse.json();

  if(searchData.files && searchData.files[0]){

    driveLibraryFileId =
      searchData.files[0].id;

    return driveLibraryFileId;

  }


  /* Doesn't exist in this Drive yet — create it empty. */

  const boundary =
    'disciplesBoundary';

  const metadata = {
    name: DRIVE_LIBRARY_FILENAME,
    mimeType: 'application/json'
  };

  const initialContent =
    JSON.stringify({ songs:[], tombstones:[] });

  const body =
    `--${boundary}\r\n` +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(metadata) + '\r\n' +
    `--${boundary}\r\n` +
    'Content-Type: application/json\r\n\r\n' +
    initialContent + '\r\n' +
    `--${boundary}--`;

  const createResponse =
    await driveFetch(
      'https://www.googleapis.com/upload/drive/v3/files' +
      '?uploadType=multipart&fields=id',
      {
        method:'POST',
        headers:{
          'Content-Type':
            `multipart/related; boundary=${boundary}`
        },
        body
      }
    );

  const createData =
    await createResponse.json();

  driveLibraryFileId =
    createData.id;

  return driveLibraryFileId;

}


async function driveDownloadLibrary(fileId){

  const response =
    await driveFetch(
      'https://www.googleapis.com/drive/v3/files/' +
      fileId + '?alt=media'
    );

  if(!response.ok){

    return { songs:[], tombstones:[] };

  }

  const data =
    await response.json().catch(() => null);

  return {

    songs: Array.isArray(data && data.songs) ? data.songs : [],

    tombstones: Array.isArray(data && data.tombstones) ? data.tombstones : []

  };

}


async function driveUploadLibrary(fileId, state){

  await driveFetch(
    'https://www.googleapis.com/upload/drive/v3/files/' +
    fileId + '?uploadType=media',
    {
      method:'PATCH',
      headers:{
        'Content-Type':'application/json'
      },
      body: JSON.stringify(state)
    }
  );

}


/*
  Auto-upload path — used only right after a brand-new song
  is saved. Adds it to the shared Drive file without touching
  any other song already in there.
*/

async function uploadNewSongToDrive(song){

  if(!getGoogleUser()){

    return;

  }

  if(!(await ensureGoogleAccessToken())){

    return;

  }

  try{

    const fileId =
      await ensureDriveLibraryFile();

    const remote =
      await driveDownloadLibrary(fileId);

    const alreadyThere =
      remote.songs.some(
        item => item.id === song.id
      );

    if(!alreadyThere){

      remote.songs.unshift(song);

      await driveUploadLibrary(
        fileId,
        {

          songs: remote.songs.slice(0,MAX_SONGS),

          tombstones: remote.tombstones

        }
      );

    }

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

  }catch(error){

    console.error(error);

    setSyncStatus('error');

  }

}


/*
  Additive-only pull — used on sign-in and app open. Brings in
  any song that exists in Drive but not locally yet (so new
  songs from teammates show up), but never overwrites a song
  that's already in the local Library. That's what keeps a
  quiet app-open or sign-in from clobbering someone's in-
  progress key change on a song they already have.
*/

async function pullNewSongsFromDrive(){

  if(!getGoogleUser()){

    return;

  }

  if(!(await ensureGoogleAccessToken())){

    return;

  }

  try{

    const fileId =
      await ensureDriveLibraryFile();

    const remote =
      await driveDownloadLibrary(fileId);

    const localSongs =
      getSongs();

    const localIds =
      new Set(
        localSongs.map(item => item.id)
      );

    const newOnes =
      remote.songs.filter(
        item => item && item.id && !localIds.has(item.id)
      );

    if(newOnes.length){

      localStorage.setItem(
        'worshipChordsSongs',
        JSON.stringify(
          [...newOnes, ...localSongs].slice(0,MAX_SONGS)
        )
      );

      if(
        document.getElementById('screen') &&
        screen.querySelector('.librarySection')
      ){

        renderLibrary();

      }

    }

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

  }catch(error){

    console.error(error);

    setSyncStatus('error');

  }

}


/*
  Manual, per-song reconcile — the Sync button on an individual
  song. Whichever side (this device or Drive) was edited more
  recently wins for THIS song only; nothing else in the Library
  is touched. Returns 'kept-local', 'took-remote', or
  'uploaded' so the caller can tell the user what happened.
*/

async function syncOneSong(localSong){

  if(!getGoogleUser()){

    showToast(
      'Sign in with Google first (Profile → Account).',
      'error'
    );

    return null;

  }

  if(!(await ensureGoogleAccessToken())){

    showToast(
      'Couldn\'t reconnect to Google automatically — ' +
      'tap Sign In again in Profile → Account, then try Sync.',
      'error'
    );

    return null;

  }

  try{

    const fileId =
      await ensureDriveLibraryFile();

    const remote =
      await driveDownloadLibrary(fileId);

    const remoteIndex =
      remote.songs.findIndex(
        item => item.id === localSong.id
      );

    const remoteSong =
      remoteIndex === -1
        ? null
        : remote.songs[remoteIndex];

    let resultSong;
    let outcome;

    if(!remoteSong){

      resultSong = localSong;
      outcome = 'uploaded';

      remote.songs.unshift(resultSong);

    }else{

      const localTime =
        new Date(
          localSong.updatedAt ||
          localSong.savedAt ||
          0
        );

      const remoteTime =
        new Date(
          remoteSong.updatedAt ||
          remoteSong.savedAt ||
          0
        );

      if(localTime >= remoteTime){

        resultSong = localSong;
        outcome = 'kept-local';

      }else{

        resultSong = remoteSong;
        outcome = 'took-remote';

      }

      remote.songs[remoteIndex] =
        resultSong;

    }

    await driveUploadLibrary(
      fileId,
      {

        songs: remote.songs.slice(0,MAX_SONGS),

        tombstones: remote.tombstones

      }
    );


    const localSongs =
      getSongs();

    const localIndex =
      localSongs.findIndex(
        item => item.id === localSong.id
      );

    if(localIndex === -1){

      localSongs.unshift(resultSong);

    }else{

      localSongs[localIndex] =
        resultSong;

    }

    localStorage.setItem(
      'worshipChordsSongs',
      JSON.stringify(localSongs.slice(0,MAX_SONGS))
    );

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

    return { outcome, song: resultSong };

  }catch(error){

    console.error(error);

    setSyncStatus('error');

    showToast(
      'Sync failed — check your connection and try again.',
      'error'
    );

    return null;

  }

}


/*
  Whole-library manual reconcile — Profile → Sync Now. Pulls,
  merges every song by most-recent-edit, applies deletes via
  tombstones, and pushes the result back. Purely opt-in: only
  runs when the person taps the button.
*/

async function performDriveSync(){

  if(!getGoogleUser() || !googleAccessToken){

    return;

  }

  if(driveSyncInFlight){

    driveSyncQueued = true;
    return;

  }

  driveSyncInFlight = true;
  setSyncStatus('syncing');

  try{

    const fileId =
      await ensureDriveLibraryFile();

    const remote =
      await driveDownloadLibrary(fileId);

    const merged =
      mergeLibraryState(
        getSongs(),
        getTombstones(),
        remote.songs,
        remote.tombstones
      );

    /*
      Write straight to localStorage (not writeSongs/
      writeTombstones) so applying the merge doesn't itself
      schedule another sync loop.
    */

    localStorage.setItem(
      'worshipChordsSongs',
      JSON.stringify(merged.songs)
    );

    writeTombstones(merged.tombstones);

    await driveUploadLibrary(fileId, merged);

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

    if(
      document.getElementById('screen') &&
      screen.querySelector('.librarySection')
    ){

      renderLibrary();

    }

  }catch(error){

    console.error(error);

    setSyncStatus('error');

  }finally{

    driveSyncInFlight = false;

    if(driveSyncQueued){

      driveSyncQueued = false;

      performDriveSync();

    }

  }

}

function profileInitials(name){

  const clean =
    (name || '').trim();

  if(!clean){

    return 'G';

  }

  return clean
    .split(/\s+/)
    .slice(0,2)
    .map(part => part[0])
    .join('')
    .toUpperCase();

}

    reader.onload = () => {

      const raw =

      /*

        not its extension — a renamed or re-saved file should
        still work. A JSON array is a full library backup

        treated as a single song exported as plain text

      let backupSongs = null;
      let wasValidJson = false;

      try{

        const candidate =
          JSON.parse(raw);

        wasValidJson = true;

        if(Array.isArray(candidate)){

          backupSongs = candidate;

            merged.slice(0,MAX_SONGS)

          const parsed =
            parseSongTextFile(raw);

          if(parsed.type === 'merged'){

            const hasLyrics =
              parsed.parts.some(
                part => part.text.trim()
              );

            if(!hasLyrics){

              throw new Error(
                'No lyrics found in this file.'
              );

            }

            const combinedTitle =
              parsed.parts
                .map(part => part.title)
                .join(' + ')
                .slice(0,120);

            const merged =
              saveMergedSongParts(
                combinedTitle,
                parsed.parts
              );

            showToast(
              'Imported ' + parsed.parts.length +
              ' songs merged into "' + merged.title + '".',
              'success'
            );

          }else{

            if(!parsed.text.trim()){

              throw new Error(
                'No lyrics found in this file.'
              );

            }

            saveSong(
              parsed.title,
              parsed.text
            );

            showToast(
              '"' + parsed.title + '" imported into your Library.',
              'success'
            );

          }

        }

        renderProfile();

      }catch(error){

        showToast(
          'That file could not be imported: ' +
          error.message,
          'error'
        );

      }finally{

        importFile.value = '';

      }

    };

    reader.readAsText(file);

  };

  document
    .getElementById('clearRecentBtn')
    .onclick = async () => {

      const confirmed =
        await showConfirmDialog(

/* =========================================================
   SONG SECTION PARSER
========================================================= */

function parseSections(text){

  const lines =
    String(text || '')
      .split(/\r?\n/);


  const sections = [];


  let current = {

    name:'Song',

    lines:[]

  };


  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;


  lines.forEach(line => {

    const clean =
      line.trim();


    const match =
      clean.match(
        sectionPattern
      );


    if(match){

      if(
        current.lines.length ||
        current.name !== 'Song'
      ){

        sections.push(
          current
        );

      }


      current = {

        name:
          clean
            .replace(/^\[\s*/, '')
            .replace(/\s*\]$/, '')
            .replace(/:$/, '')
            .trim(),

        lines:[]

      };

    }else{

      current.lines.push(
        line
      );

    }

  });


  if(
    current.lines.length ||
    !sections.length
  ){

    sections.push(
      current
    );

  }


  return sections;

}


/* =========================================================
   CHORD ENGINE
========================================================= */

/*
  Chord matching is deliberately stricter than ordinary
  word matching so normal lyric words are not treated as chords.

  Supports:

  C
  C#
  Db
  Cm
  Cmin
  Cmaj7
  C7
  Cdim
  Caug
  Csus2
  Cadd9
  C7#9
  Cb5
  C/E
  F#/A#
  Bbmaj7/D
*/

const CHORD_TOKEN_REGEX =
  /^[A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?$/;


function isChordToken(token){

  if(!token){

    return false;

  }


  const clean =
    token
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );


  if(
    !CHORD_TOKEN_REGEX.test(
      clean
    )
  ){

    return false;

  }


  /*
    Avoid treating common lyric words such as:
    A
    I
    Am
    etc. incorrectly.

    Single-letter A-G are valid chords.
    More complex forms are accepted by regex.
  */

  return true;

}


function findChords(line){

  const matches = [];


  const tokenRegex =
    /(?:^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  let match;


  while(
    (match =
      tokenRegex.exec(line))
  ){

    const chord =
      match[1];


    if(
      isChordToken(chord)
    ){

      matches.push(
        chord
      );

    }

  }


  return [
    ...new Set(matches)
  ];

}


function isChordOnlyLine(line){

  const clean =
    String(line || '')
      .trim();


  if(!clean){

    return false;

  }


  const tokens =
    clean
      .split(/[^A-Za-z0-9#\/]+/)
      .filter(Boolean);


  if(!tokens.length){

    return false;

  }


  return tokens.every(
    isChordToken
  );

}


/* =========================================================
   KEY DETECTION

   Guesses the song's key by matching the chords used
   against the diatonic chord set of each of the 24 major/
   minor keys, weighted by how often each chord appears.
   The most likely tonic (first/last chord in the song) gets
   a small bonus, since songs overwhelmingly start or end on
   the tonic chord.
========================================================= */

const MAJOR_SCALE_STEPS =
  [0,2,4,5,7,9,11];

const MAJOR_KEY_QUALITIES =
  ['major','minor','minor','major','major','minor','diminished'];

const MINOR_SCALE_STEPS =
  [0,2,3,5,7,8,10];

const MINOR_KEY_QUALITIES =
  ['minor','diminished','major','minor','minor','major','major'];


function chordQualityFromSuffix(suffix){

  const clean =
    String(suffix || '');

  if(/^dim/i.test(clean)) return 'diminished';
  if(/^aug/i.test(clean)) return 'augmented';
  if(/^maj/i.test(clean)) return 'major';
  if(/^min/i.test(clean)) return 'minor';

  /*
    Lone "m"/"M" is ambiguous by design elsewhere (both are
    accepted as valid chord tokens), but for key detection
    the case matters: lowercase m ("Dm","Dm7") is minor,
    uppercase M ("DM7") is shorthand for a major 7th.
  */
  if(clean[0] === 'm') return 'minor';
  if(clean[0] === 'M') return 'major';

  /* Plain root, dominant 7ths, sus/add chords: major-rooted. */
  return 'major';

}


function parseChordRootQuality(token){

  const clean =
    String(token || '')
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );

  const mainChord =
    clean.split('/')[0];

  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );

  if(!match){

    return null;

  }

  const root =
    normalizeNote(
      match[1]
    );

  const rootIndex =
    chromatic.indexOf(root);

  if(rootIndex === -1){

    return null;

  }

  return {

    root:rootIndex,

    quality:
      chordQualityFromSuffix(
        match[2]
      )

  };

}


function buildKeyChordMap(rootIndex, isMinor){

  const steps =
    isMinor
      ? MINOR_SCALE_STEPS
      : MAJOR_SCALE_STEPS;

  const qualities =
    isMinor
      ? MINOR_KEY_QUALITIES
      : MAJOR_KEY_QUALITIES;

  const map = new Map();

  steps.forEach((step,index) => {

    const noteIndex =
      (rootIndex + step) % 12;

    if(!map.has(noteIndex)){

      map.set(noteIndex, new Set());

    }

    map.get(noteIndex).add(
      qualities[index]
    );

  });

  if(isMinor){

    /*
      Harmonic-minor borrowed dominant (V major instead of
      the natural-minor v). Extremely common in worship/pop
      songs written in a minor key.
    */
    const dominantIndex =
      (rootIndex + 7) % 12;

    if(!map.has(dominantIndex)){

      map.set(dominantIndex, new Set());

    }

    map.get(dominantIndex).add('major');

  }

  return map;

}


function detectKeyFromChords(chordTokens){

  const frequency = {};

  let firstChord = null;
  let lastChord = null;

  (chordTokens || []).forEach(token => {

    frequency[token] =
      (frequency[token] || 0) + 1;

    if(!firstChord){

      firstChord = token;

    }

    lastChord = token;

  });

  const entries =
    Object.keys(frequency)
      .map(token => ({

        weight:frequency[token],

        parsed:
          parseChordRootQuality(token)

      }))
      .filter(entry => entry.parsed);

  if(!entries.length){

    return null;

  }

  const totalWeight =
    entries.reduce(
      (sum,entry) => sum + entry.weight,
      0
    );

  const firstParsed =
    firstChord
      ? parseChordRootQuality(firstChord)
      : null;

  const lastParsed =
    lastChord
      ? parseChordRootQuality(lastChord)
      : null;

  let best = null;

  for(let rootIndex = 0; rootIndex < 12; rootIndex++){

    [false,true].forEach(isMinor => {

      const keyMap =
        buildKeyChordMap(
          rootIndex,
          isMinor
        );

      let matchedWeight = 0;

      entries.forEach(entry => {

        const allowed =
          keyMap.get(
            entry.parsed.root
          );

        if(
          allowed &&
          allowed.has(
            entry.parsed.quality
          )
        ){

          matchedWeight +=
            entry.weight;

        }

      });

      let score =
        matchedWeight / totalWeight;

      const tonicQuality =
        isMinor
          ? 'minor'
          : 'major';

      if(
        firstParsed &&
        firstParsed.root === rootIndex &&
        firstParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(
        lastParsed &&
        lastParsed.root === rootIndex &&
        lastParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(!best || score > best.score){

        best = {rootIndex,isMinor,score};

      }

    });

  }

  const tonicName =
    chromatic[best.rootIndex];

  return {

    tonic:tonicName,

    mode:
      best.isMinor
        ? 'minor'
        : 'major',

    label:
      best.isMinor
        ? tonicName + 'm'
        : tonicName

  };

}


function extractChordTokens(text){

  return String(text || '')
    .split(/\r?\n/)
    .flatMap(findChords);

}


/* =========================================================
   ANALYZER
========================================================= */

function guessTitleFromText(text){

  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;

  const lines =
    String(text || '').split(/\r?\n/);

  for(const rawLine of lines){

    const line = rawLine.trim();

    if(!line)continue;
    if(sectionPattern.test(line))continue;
    if(isChordOnlyLine(line))continue;

    return line.slice(0,80);

  }

  return '';

}

function analyzeFocusedSong(text){

  const sections =
    parseSections(text);


  const analyzedSections =
    sections.map(section => {

      const lines =
        section.lines.map(line => {

          const chords =
            findChords(line);


          return {

            text:line,

            chords

          };

        });


      return {

        name:
          section.name,

        lines,

        chords:[
          ...new Set(
            lines.flatMap(
              line =>
                line.chords
            )
          )

        ]

      };

    });


  return {

    rawText:text,

    sections:
      analyzedSections,

    chords:[
      ...new Set(
        analyzedSections.flatMap(
          section =>
            section.chords
        )
      )

    ],

    key:
      detectKeyFromChords(
        extractChordTokens(text)
      )

  };

}


/* =========================================================
   LYRIC CASING

   Lyrics pasted from sites like Ultimate Guitar sometimes come
   in as SHOUTING ALL CAPS. When a lyric line is entirely
   uppercase, this converts it to normal sentence case for
   display. Lines that are already normal/mixed case are left
   untouched.

   A small list of words always keeps a fixed casing regardless
   of the source formatting or whether the line was all caps.
========================================================= */

const LYRIC_CASE_EXCEPTIONS = [
  { match:/\bdiyos\b/gi, replace:'Diyos' },
  { match:/\byahweh\b/gi, replace:'YAHWEH' },
  { match:/\bpanginoon\b/gi, replace:'Panginoon' },
  { match:/\blord\b/gi, replace:'Lord' },
  { match:/\bgod\b/gi, replace:'God' },
  { match:/\byeshua\b/gi, replace:'Yeshua' },
  { match:/\badonai\b/gi, replace:'Adonai' },
  { match:/\bfather\b/gi, replace:'Father' },
  { match:/\bjesus\b/gi, replace:'Jesus' }
];


function isShoutingLine(text){

  const letters =
    String(text || '')
      .replace(/[^A-Za-z]/g,'');

  if(letters.length < 2){
    return false;
  }

  return (
    letters === letters.toUpperCase() &&
    letters !== letters.toLowerCase()
  );

}


function toSentenceCase(text){

  let result =
    text.toLowerCase();

  /* Capitalize the first letter of the line. */
  result =
    result.replace(
      /^([^A-Za-z]*)([a-z])/,
      (match,lead,letter) => lead + letter.toUpperCase()
    );

  /* Capitalize the first letter after ., ! or ? */
  result =
    result.replace(
      /([.!?]\s+)([a-z])/g,
      (match,punct,letter) => punct + letter.toUpperCase()
    );

  return result;

}


function applyLyricCaseExceptions(text){

  let result = text;

  LYRIC_CASE_EXCEPTIONS.forEach(rule => {

    result =
      result.replace(
        rule.match,
        rule.replace
      );

  });

  return result;

}


function normalizeLyricCasing(text){

  if(!text) return text;

  let result = text;

  if(isShoutingLine(text)){
    result = toSentenceCase(result);
  }

  return applyLyricCaseExceptions(result);

}

function formatAnalysisLine(line){

  if(
    isChordOnlyLine(
      line.text
    )
  ){

    return `<div class="songLine chordLine">${esc(line.text)}</div>`;

  }


  const displayText =
    line.chords.length
      ? line.text
      : normalizeLyricCasing(line.text);


  let html =
    esc(displayText);


  line.chords
    .forEach(chord => {

      const safe =
        esc(chord);


      html =
        html.replace(
          new RegExp(
            `(^|[^A-Za-z0-9#\\/])(${escapeRegExp(chord)})(?=[^A-Za-z0-9#\\/]|$)`,
            'g'
          ),
          `$1<span class="detectedChord">$2</span>`
        );

    });


  return `<div class="songLine lyricLine">${html || '&nbsp;'}</div>`;

}


function escapeRegExp(value){

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

}

/* =========================================================
   TRANSPOSE ENGINE
========================================================= */

const chromatic = [

  'C',
  'C#',
  'D',
  'D#',
  'E',
  'F',
  'F#',
  'G',
  'G#',
  'A',
  'A#',
  'B'

];


const flatToSharp = {

  Db:'C#',
  Eb:'D#',
  Gb:'F#',
  Ab:'G#',
  Bb:'A#'

};


function normalizeNote(note){

  return (
    flatToSharp[note] ||
    note
  );

}


function transposeNote(
  note,
  amount
){

  const normalized =
    normalizeNote(note);


  const index =
    chromatic.indexOf(
      normalized
    );


  if(index === -1){

    return note;

  }


  const newIndex =
    (
      (index + amount) % 12 +
      12
    ) % 12;


  return chromatic[newIndex];

}


function transposeChord(
  chord,
  amount
){

  const slashParts =
    chord.split('/');


  let mainChord =
    slashParts[0];


  let bassNote =
    slashParts[1];


  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if(!match){

    return chord;

  }


  const root =
    match[1];


  const suffix =
    match[2];


  const newRoot =
    transposeNote(
      root,
      amount
    );


  let result =
    newRoot +
    suffix;


  if(bassNote){

    bassNote =
      transposeNote(
        bassNote,
        amount
      );


    result +=
      '/' +
      bassNote;

  }


  return result;

}


function transposeText(
  text,
  amount
){

  if(!amount){

    return text;

  }


  /*
    Matches chord-like tokens including:
    Fdim
    F#dim
    E7#9
    Cmaj7
    G/B
    Bb
  */

  const regex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/gm;


  return text.replace(
    regex,
    (
      full,
      prefix,
      chord
    ) => {

      if(
        !isChordToken(chord)
      ){

        return full;

      }


      return (
        prefix +
        transposeChord(
          chord,
          amount
        )
      );

    }
  );

}

  ){

    Track this as a recently viewed song regardless of whether

  */
