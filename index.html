<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0e">
<title>The Disciples</title>
</head>
<body>
<script>
(async function(){
  try {
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('worship-chords-')).map(k=>caches.delete(k)));
    }
  } catch(e) {}
  location.replace('./app.html?v=20260820-architecture-1');
})();
</script>
<noscript><a href="./app.html?v=20260820-architecture-1">Open The Disciples</a></noscript>
</body>
</html>
