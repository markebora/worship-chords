<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b0b0c"
>

<title>Worship Chords</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  background:#0b0b0c;
  color:#f7f7f7;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:920px;
  min-height:100vh;

  background:#111113;

  position:relative;

  padding-bottom:110px;
}


/* =========================================================
   HEADER
========================================================= */

.top{
  padding:24px 22px 0;
}

.welcome{
  font-size:15px;
  color:#a7a7ad;
  font-weight:600;
}

.hero{
  text-align:center;
  padding:42px 20px 48px;

  max-height:260px;

  opacity:1;

  overflow:hidden;

  transition:
    max-height .32s ease,
    padding .32s ease,
    opacity .22s ease;
}

.hero.heroHidden{
  max-height:0;

  padding-top:0;
  padding-bottom:0;

  opacity:0;
}

.hero h1{
  margin:0;

  font-size:42px;
  line-height:1.05;

  font-weight:800;
}

.hero p{
  margin:10px 0 0;

  color:#a7a7ad;
  font-size:15px;
}


/* =========================================================
   MAIN
========================================================= */

.content{
  padding:0 22px;
}

.content.screenTransition{
  animation:screenFadeIn .32s cubic-bezier(.22,.8,.36,1);
}

@keyframes screenFadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.placeholder{
  min-height:280px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#66666d;

  font-size:14px;
  text-align:center;
}


/* =========================================================
   COMMON BUTTONS
========================================================= */

.toolbarBtn,
.smallBtn,
.editorBtn,
.backBtn,
.goBtn,
.searchBtn,
.closeBtn{
  cursor:pointer;
}

.toolbarBtn{
  border:1px solid #303036;

  background:#1a1a1d;

  color:#eee;

  border-radius:10px;

  padding:9px 11px;

  font-size:12px;
  font-weight:700;
}

.toolbarBtn:hover{
  background:#222226;
}

.toolbarBtn.primary{
  background:#fff;
  color:#111;
}


/* =========================================================
   OPEN-SONG NAV INDICATOR (bouncing dots)
========================================================= */

.nav .icon{
  position:relative;
}

.navDots{
  display:none;

  position:absolute;
  inset:0;

  align-items:center;
  justify-content:center;

  gap:4px;
}

.navDots i{
  width:5px;
  height:5px;

  border-radius:50%;

  background:currentColor;

  animation:navDotBounce 1.1s ease-in-out infinite;
}

.navDots i:nth-child(2){
  animation-delay:.18s;
}

.navDots i:nth-child(3){
  animation-delay:.36s;
}

@keyframes navDotBounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

.nav button.songOpen .icon svg{
  display:none;
}

.nav button.songOpen .navDots{
  display:flex;
}


/* =========================================================
   FLOATING NAVIGATION
========================================================= */

.nav{
  position:fixed;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 24px);
  max-width:620px;

  height:60px;

  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  z-index:100;

  background:rgba(0,0,0,.48);

  border:1px solid rgba(255,255,255,.12);

  border-radius:20px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.nav button{
  flex:1;

  min-width:0;

  height:48px;

  border:0;
  border-radius:15px;

  background:transparent;

  color:rgba(255,255,255,.38);

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.nav button.active{
  color:#fff;

  background:rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 0 14px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.nav .icon{
  width:24px;
  height:24px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:currentColor;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.30))
    drop-shadow(0 0 7px rgba(255,255,255,.12));
}

.nav .icon svg{
  width:22px;
  height:22px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.6;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button.active .icon{
  color:#fff;

  filter:
    drop-shadow(0 0 4px rgba(255,255,255,1))
    drop-shadow(0 0 9px rgba(255,255,255,.75))
    drop-shadow(0 0 18px rgba(255,255,255,.35));

  transform:translateY(-1px);
}

.nav button.active .icon svg{
  stroke-width:1.85;
}

.nav button:active{
  transform:scale(.94);
}


/* =========================================================
   HOME
========================================================= */

.homePage{
  padding-bottom:30px;
}

.homeActions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.homeCard{
  padding:18px;

  border:1px solid #29292e;

  border-radius:15px;

  background:#18181b;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .2s ease;
}

.homeCard:active{
  transform:scale(.98);
}

.homeCardIcon{
  width:26px;
  height:26px;

  margin-bottom:12px;

  color:#fff;
}

.homeCardIcon svg{
  width:100%;
  height:100%;

  fill:none;
  stroke:currentColor;

  stroke-width:1.6;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.homeCardTitle{
  font-size:15px;
  font-weight:800;
}

.homeCardText{
  margin-top:5px;

  color:#777780;

  font-size:12px;

  line-height:1.5;
}


/* =========================================================
   LYRICS WORKSPACE
========================================================= */

.lyricsWorkspace{
  padding:4px 0 30px;
}

.lyricsWorkspaceHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:18px;
}

.lyricsWorkspaceTitle{
  font-size:28px;
  font-weight:800;
}

.lyricsWorkspaceSub{
  margin-top:4px;

  color:#85858c;

  font-size:12px;
}

.lyricsActions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

  margin-bottom:18px;
}

.lyricsAction{
  border:1px solid #303036;

  background:#18181b;

  color:#fff;

  border-radius:14px;

  padding:15px;

  text-align:left;

  cursor:pointer;
}

.lyricsAction:hover{
  background:#202024;
}

.lyricsActionIcon{
  width:22px;
  height:22px;

  margin-bottom:2px;

  color:#fff;
}

.lyricsActionIcon svg{
  width:100%;
  height:100%;

  fill:none;
  stroke:currentColor;

  stroke-width:1.7;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.lyricsActionTitle{
  margin-top:7px;

  font-size:13px;
  font-weight:800;
}

.lyricsActionSub{
  margin-top:3px;

  color:#777780;

  font-size:11px;
}

.recentTitle{
  margin:20px 0 9px;

  color:#777780;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.09em;

  font-weight:800;
}


/* =========================================================
   LIBRARY
========================================================= */

.libraryHead{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.libraryTitle{
  font-size:28px;
  font-weight:800;
}

.searchBtn{
  width:44px;
  height:44px;

  border:1px solid #303036;

  border-radius:14px;

  background:#1a1a1d;

  color:#fff;

  display:grid;
  place-items:center;
}

.searchBtn svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.librarySection{
  margin:22px 0;
}

.sectionLabel{
  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.09em;

  color:#77777f;

  font-weight:800;

  margin-bottom:9px;
}

.songCard{
  display:flex;

  align-items:center;

  gap:12px;

  padding:14px 15px;

  margin:8px 0;

  background:#18181b;

  border:1px solid #29292e;

  border-radius:14px;

  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:
    background .2s ease,
    transform .15s ease;
}

.songCard:active{
  transform:scale(.985);

  background:#1d1d21;
}

.songIcon{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:10px;

  background:#232328;

  display:grid;
  place-items:center;

  color:#fff;
}

.songIcon svg{
  width:17px;
  height:17px;

  fill:none;
  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.songInfo{
  flex:1;

  min-width:0;
}

.songName{
  font-weight:750;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.songMeta{
  font-size:12px;

  color:#777780;

  margin-top:3px;
}

.empty{
  padding:18px;

  border:1px dashed #303036;

  border-radius:14px;

  color:#707078;

  font-size:13px;

  text-align:center;
}


/* =========================================================
   SEARCH MODAL
========================================================= */

.modalBack{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,0);

  z-index:500;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear .25s;
}

.modalBack.open{
  opacity:1;

  visibility:visible;

  pointer-events:auto;

  background:rgba(0,0,0,.68);

  transition:
    opacity .25s ease,
    background .25s ease,
    visibility 0s linear 0s;
}

.modal{
  width:min(920px,100%);

  max-height:88vh;

  overflow:auto;

  background:#151518;

  border:1px solid #2d2d32;

  border-radius:22px 22px 0 0;

  padding:20px;

  transform:translateY(28px);

  transition:transform .3s cubic-bezier(.22,.8,.36,1);
}

.modalBack.open .modal{
  transform:translateY(0);
}

.modalTop{
  display:flex;

  align-items:center;

  gap:12px;
}

.modalTop h2{
  margin:0;

  font-size:20px;

  flex:1;
}

.closeBtn{
  border:0;

  background:#242429;

  color:#ddd;

  border-radius:10px;

  padding:9px 12px;
}

.searchBox{
  display:flex;

  gap:8px;

  margin:16px 0 12px;
}

.searchInput{
  flex:1;

  min-width:0;

  background:#0e0e10;

  border:1px solid #34343a;

  color:#fff;

  border-radius:12px;

  padding:13px 14px;

  outline:none;
}

.goBtn{
  border:0;

  border-radius:12px;

  padding:0 16px;

  background:#fff;

  color:#111;

  font-weight:800;
}

.sourceTabs{
  display:flex;

  gap:8px;

  margin-bottom:14px;
}

.sourceTabs button{
  flex:1;

  border:1px solid #303036;

  background:#1b1b1f;

  color:#9999a2;

  border-radius:10px;

  padding:10px;

  font-size:12px;

  font-weight:750;

  cursor:pointer;
}

.sourceTabs button.active{
  background:#29292e;

  color:#fff;

  border-color:#44444b;
}

.result{
  padding:13px 0;

  border-top:1px solid #29292e;
}

.result:first-child{
  border-top:0;
}

.resultTitle{
  font-weight:750;
}

.resultMeta,
.hint{
  font-size:12px;

  color:#777780;

  line-height:1.5;

  margin-top:5px;
}

.resultActions{
  display:flex;

  gap:7px;

  margin-top:9px;

  flex-wrap:wrap;
}

.driveStatus{
  padding:12px;

  background:#1a1a1d;

  border-radius:12px;

  color:#aaa;

  font-size:13px;

  line-height:1.5;

  margin-top:10px;
}


/* =========================================================
   SONG VIEWER
========================================================= */

.songPage{
  padding:4px 0 30px;
}

.songTop{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.backBtn{
  border:0;

  background:#25252a;

  color:#fff;

  border-radius:10px;

  padding:9px 12px;
}

.songHeading{
  flex:1;

  min-width:0;
}

.songHeading h1{
  margin:0;

  font-size:26px;

  line-height:1.15;
}

.songHeading p{
  margin:5px 0 0;

  color:#85858c;

  font-size:13px;
}

.songToolbar{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-bottom:14px;
}

.toolbarRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  flex-wrap:wrap;
}

.toolbarRow.secondaryRow{
  justify-content:flex-start;
}

.viewModeGroup{
  display:flex;

  width:100%;

  gap:4px;

  background:#1b1b1f;

  border:1px solid #303036;

  border-radius:13px;

  padding:4px;
}

.viewModeBtn{
  flex:1;

  border:0;

  background:transparent;

  color:#9999a2;

  border-radius:9px;

  padding:9px 10px;

  font-size:13px;
  font-weight:800;

  cursor:pointer;

  transition:background .18s ease,color .18s ease;
}

.viewModeBtn.active{
  background:#fff;
  color:#111;
}

.transposeGroup,
.autoScrollGroup{
  display:flex;

  align-items:center;

  gap:8px;
}

.autoScrollGroup .toolbarBtn,
.asArrowBtn{
  touch-action:none;
}

.asToggleWrap{
  display:inline-flex;

  align-items:center;

  gap:0;
}

.asToggleBtn{
  min-width:40px;

  text-align:center;

  user-select:none;
  -webkit-user-select:none;

  outline:none;
}

.asPlayIcon{
  display:inline-block;

  width:0;
  height:0;

  margin-left:2px;

  border-style:solid;
  border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent currentColor;
}

.asPauseIcon{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:3px;
}

.asPauseIcon i{
  display:block;

  width:3px;
  height:12px;

  background:currentColor;
  border-radius:1px;
}

.asArrowBtn{
  width:0;

  height:40px;

  padding:0;

  border:0;
  background:transparent;

  color:#cfcfd4;

  font-size:15px;
  line-height:1;

  cursor:pointer;

  opacity:0;

  overflow:hidden;

  transition:width .2s ease,opacity .2s ease,margin .2s ease;

  pointer-events:none;
}

.asToggleWrap.speedMode .asArrowBtn{
  width:24px;

  opacity:1;

  pointer-events:auto;
}

.asToggleWrap.speedMode .asArrowUp{
  margin-right:2px;
}

.asToggleWrap.speedMode .asArrowDown{
  margin-left:2px;
}

.asArrowBtn:active{
  color:#fff;
}

.asToggleWrap.speedMode .asToggleBtn{
  background:#fff;
  color:#111;

  border-color:#fff;
}

.lyricsView{
  background:#0e0e10;

  border:1px solid #29292e;

  border-radius:14px;

  padding:12px 6px 12px 8px;

  white-space:pre-wrap;

  font:
    15px/1.75
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  overflow:auto;

  min-height:300px;

  text-align:left;
}


/* =========================================================
   STRUCTURED SONG DISPLAY
========================================================= */

.songFixedHeader{position:sticky;top:0;z-index:40;background:rgba(17,17,19,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0 -1px 14px;padding:10px 0;border-bottom:1px solid #29292e;}
.songHeaderTop{display:flex;align-items:center;gap:10px;min-width:0;padding:0 1px;}
.songBackBtn{flex:0 0 auto;width:34px;height:34px;border:1px solid #303036;background:#18181b;color:#f7f7f7;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,border-color .18s ease;}
.songBackBtn:active{background:#303036;}
.songBackBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.songHeaderTitle{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.songSectionFloatBar{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:620px;z-index:99;background:transparent;border:0;box-shadow:none;padding:0;}

/* =========================================================
   ANALYSIS TITLE + RENAME
========================================================= */

.analysisTitleRow{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:2px;}
.keyBadge{display:inline-block;margin:10px 0 4px;background:#1d3a2b;color:#7fe0a3;font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px;border:1px solid #2c5a41;}
.songHeaderKey{flex:0 0 auto;margin:0;font-size:11px;padding:4px 10px;white-space:nowrap;}
.analysisTitle{margin:0;flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.analysisTitle.untitled{color:#85858c;font-weight:700;font-style:italic;}
.analysisRenameBtn{flex:0 0 auto;width:30px;height:30px;border:1px solid #303036;background:#18181b;color:#cfcfd4;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,color .18s ease,border-color .18s ease;}
.analysisRenameBtn:active{background:#303036;color:#fff;}
.analysisRenameBtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.analysisTitleInput{margin:0;flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.2;background:#0e0e10;border:1px solid #4a4a52;border-radius:8px;color:#fff;padding:4px 8px;outline:none;font-family:inherit;}

/* =========================================================
   LIBRARY MULTI-SELECT
========================================================= */

.songCard{position:relative;}
.songCard.selectable{padding-left:44px;}
.songCheck{display:none;position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:1.5px solid #46464d;background:#111113;align-items:center;justify-content:center;}
.songCard.selectable .songCheck{display:flex;}
.songCard.selected{background:#1c1c22;border-color:#4a4a55;}
.songCard.selected .songCheck{background:#fff;border-color:#fff;}
.songCheck svg{width:13px;height:13px;fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.songCard.selected .songCheck svg{opacity:1;}

.librarySelectBar{position:fixed;bottom:82px;left:50%;width:calc(100% - 24px);max-width:620px;z-index:99;display:flex;align-items:center;gap:8px;padding:10px;background:rgba(28,28,32,.92);border:1px solid rgba(255,255,255,.12);border-radius:17px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);transform:translateX(-50%);animation:librarySelectBarIn .22s cubic-bezier(.2,.7,.3,1) both;}
@keyframes librarySelectBarIn{
  from{opacity:0;transform:translateX(-50%) translateY(16px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}
.librarySelectCount{flex:1;min-width:0;font-size:12px;font-weight:800;color:#cfcfd4;padding-left:4px;}
.librarySelectBar button{flex:0 0 auto;}
.songSectionNav{display:flex;gap:7px;overflow-x:auto;padding:0 1px 3px;scrollbar-width:none;touch-action:pan-x;}
.songSectionNav::-webkit-scrollbar{display:none;}

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

const screen =
  document.getElementById('screen');

const modal =

const query =

/*
  Replays a soft fade/slide-in animation on #screen every time
  its content is swapped out, so navigating between tabs/pages
  (and opening the song viewer, editor, etc.) always feels
  smooth instead of an abrupt content jump.
*/

(function attachScreenTransition(){

  if(!screen)return;

  const replay=()=>{
    screen.classList.remove('screenTransition');
    void screen.offsetWidth;
    screen.classList.add('screenTransition');
  };

  new MutationObserver(replay).observe(
    screen,
    {childList:true}
  );

})();

let source = 'all';

let currentSong = null;

/*
  Whether the song viewer shows chords above the lyrics
  or lyrics only. Session-level display preference — not
  saved with the song.
*/
let showChords = true;

/*
  Library multi-select state: song IDs currently checked in
  the Library's long-press select mode (Rename/Delete/Merge).
*/
let librarySelectedIds = new Set();


/*
  Whenever a song is open (currentSong is set), the Lyrics tab
  in the bottom nav swaps its icon for a small bouncing-dots
  "loading" animation, signalling that a song is open and one
  tap will jump straight back into it — from any screen.
*/

function updateLyricsNavIndicator(){

  const navBtn=
    document.getElementById('navLyricsBtn');

  if(!navBtn)return;

  navBtn.classList.toggle(
    'songOpen',
    !!currentSong
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function setActiveNav(name){

  document
    .querySelectorAll('.nav button')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.screen === name
      );

    });


  const hero =
    document.querySelector('.hero');


  if(hero){

    hero.classList.toggle(
      'heroHidden',
      name !== 'home'
    );

  }


  /*
    Both the library select-bar and the song section float-bar
    live in fixed-position overlays that sit as SIBLINGS of
    #screen (not children of it). #screen replays a transform
    animation on every render, and a `transform` on an ancestor
    turns `position:fixed` descendants into elements positioned
    relative to that ancestor instead of the viewport — which is
    what caused the bars to visibly pop in near the content and
    then snap down into place. Clearing both overlays here, and
    letting each render function repopulate its own overlay,
    keeps them genuinely viewport-fixed with no jump.
  */

  const libraryOverlay =
    document.getElementById('libraryOverlay');

  if(libraryOverlay){

    libraryOverlay.innerHTML = '';

  }


  const songSectionOverlay =
    document.getElementById('songSectionOverlay');

  if(songSectionOverlay){

    songSectionOverlay.innerHTML = '';

  }


  if(typeof updateLyricsNavIndicator==='function'){

    updateLyricsNavIndicator();

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


/*
  Pasted or imported lyrics sometimes already contain literal
  HTML entities (e.g. "that&#039;s" instead of "that's") because
  the source page had them baked into its raw text. Decoding them
  once, up front, means esc() never has to re-escape an entity
  that was never a real character to begin with.
*/

function decodeHtmlEntities(text){

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.innerHTML =
    String(text ?? '');


  return textarea.value;

}


/* =========================================================
   STORAGE
========================================================= */

function getSongs(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'worshipChordsSongs'
      ) || '[]'
    );

  }catch(error){

    console.error(error);

    return [];

  }

}


function writeSongs(songs){

  localStorage.setItem(
    'worshipChordsSongs',
    JSON.stringify(songs)
  );

}


function saveSong(
  title,
  text,
  url='',
  analysis=null
){

  const songs =
    getSongs();

  const item = {

    id:
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(
            Date.now() +
            Math.random()
          ),

    title:
      title ||
      'Untitled Song',

    text:
      text || '',

    originalText:
      text || '',

    sourceUrl:
      url || '',

    savedAt:
      new Date().toISOString(),

    kind:
      'analyzed',

    analysis:
      analysis || null,

    transposeSteps:
      0,

    fontSize:
      15

  };


  songs.unshift(item);


  writeSongs(
    songs.slice(0,200)
  );


  return item;

}

/* =========================================================
   SONG SECTION PARSER
========================================================= */

function parseSections(text){

  const lines =
    String(text || '')
      .split(/\r?\n/);


  const sections = [];


  let current = {

    name:'Song',

    lines:[]

  };


  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;


  lines.forEach(line => {

    const clean =
      line.trim();


    const match =
      clean.match(
        sectionPattern
      );


    if(match){

      if(
        current.lines.length ||
        current.name !== 'Song'
      ){

        sections.push(
          current
        );

      }


      current = {

        name:
          clean
            .replace(/^\[\s*/, '')
            .replace(/\s*\]$/, '')
            .replace(/:$/, '')
            .trim(),

        lines:[]

      };

    }else{

      current.lines.push(
        line
      );

    }

  });


  if(
    current.lines.length ||
    !sections.length
  ){

    sections.push(
      current
    );

  }


  return sections;

}


/* =========================================================
   CHORD ENGINE
========================================================= */

/*
  Chord matching is deliberately stricter than ordinary
  word matching so normal lyric words are not treated as chords.

  Supports:

  C
  C#
  Db
  Cm
  Cmin
  Cmaj7
  C7
  Cdim
  Caug
  Csus2
  Cadd9
  C7#9
  Cb5
  C/E
  F#/A#
  Bbmaj7/D
*/

const CHORD_TOKEN_REGEX =
  /^[A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?$/;


function isChordToken(token){

  if(!token){

    return false;

  }


  const clean =
    token
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );


  if(
    !CHORD_TOKEN_REGEX.test(
      clean
    )
  ){

    return false;

  }


  /*
    Avoid treating common lyric words such as:
    A
    I
    Am
    etc. incorrectly.

    Single-letter A-G are valid chords.
    More complex forms are accepted by regex.
  */

  return true;

}


function findChords(line){

  const matches = [];


  const tokenRegex =
    /(?:^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  let match;


  while(
    (match =
      tokenRegex.exec(line))
  ){

    const chord =
      match[1];


    if(
      isChordToken(chord)
    ){

      matches.push(
        chord
      );

    }

  }


  return [
    ...new Set(matches)
  ];

}


function isChordOnlyLine(line){

  const clean =
    String(line || '')
      .trim();


  if(!clean){

    return false;

  }


  const tokens =
    clean
      .split(/[^A-Za-z0-9#\/]+/)
      .filter(Boolean);


  if(!tokens.length){

    return false;

  }


  return tokens.every(
    isChordToken
  );

}


/* =========================================================
   KEY DETECTION

   Guesses the song's key by matching the chords used
   against the diatonic chord set of each of the 24 major/
   minor keys, weighted by how often each chord appears.
   The most likely tonic (first/last chord in the song) gets
   a small bonus, since songs overwhelmingly start or end on
   the tonic chord.
========================================================= */

const MAJOR_SCALE_STEPS =
  [0,2,4,5,7,9,11];

const MAJOR_KEY_QUALITIES =
  ['major','minor','minor','major','major','minor','diminished'];

const MINOR_SCALE_STEPS =
  [0,2,3,5,7,8,10];

const MINOR_KEY_QUALITIES =
  ['minor','diminished','major','minor','minor','major','major'];


function chordQualityFromSuffix(suffix){

  const clean =
    String(suffix || '');

  if(/^dim/i.test(clean)) return 'diminished';
  if(/^aug/i.test(clean)) return 'augmented';
  if(/^maj/i.test(clean)) return 'major';
  if(/^min/i.test(clean)) return 'minor';

  /*
    Lone "m"/"M" is ambiguous by design elsewhere (both are
    accepted as valid chord tokens), but for key detection
    the case matters: lowercase m ("Dm","Dm7") is minor,
    uppercase M ("DM7") is shorthand for a major 7th.
  */
  if(clean[0] === 'm') return 'minor';
  if(clean[0] === 'M') return 'major';

  /* Plain root, dominant 7ths, sus/add chords: major-rooted. */
  return 'major';

}


function parseChordRootQuality(token){

  const clean =
    String(token || '')
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );

  const mainChord =
    clean.split('/')[0];

  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );

  if(!match){

    return null;

  }

  const root =
    normalizeNote(
      match[1]
    );

  const rootIndex =
    chromatic.indexOf(root);

  if(rootIndex === -1){

    return null;

  }

  return {

    root:rootIndex,

    quality:
      chordQualityFromSuffix(
        match[2]
      )

  };

}


function buildKeyChordMap(rootIndex, isMinor){

  const steps =
    isMinor
      ? MINOR_SCALE_STEPS
      : MAJOR_SCALE_STEPS;

  const qualities =
    isMinor
      ? MINOR_KEY_QUALITIES
      : MAJOR_KEY_QUALITIES;

  const map = new Map();

  steps.forEach((step,index) => {

    const noteIndex =
      (rootIndex + step) % 12;

    if(!map.has(noteIndex)){

      map.set(noteIndex, new Set());

    }

    map.get(noteIndex).add(
      qualities[index]
    );

  });

  if(isMinor){

    /*
      Harmonic-minor borrowed dominant (V major instead of
      the natural-minor v). Extremely common in worship/pop
      songs written in a minor key.
    */
    const dominantIndex =
      (rootIndex + 7) % 12;

    if(!map.has(dominantIndex)){

      map.set(dominantIndex, new Set());

    }

    map.get(dominantIndex).add('major');

  }

  return map;

}


function detectKeyFromChords(chordTokens){

  const frequency = {};

  let firstChord = null;
  let lastChord = null;

  (chordTokens || []).forEach(token => {

    frequency[token] =
      (frequency[token] || 0) + 1;

    if(!firstChord){

      firstChord = token;

    }

    lastChord = token;

  });

  const entries =
    Object.keys(frequency)
      .map(token => ({

        weight:frequency[token],

        parsed:
          parseChordRootQuality(token)

      }))
      .filter(entry => entry.parsed);

  if(!entries.length){

    return null;

  }

  const totalWeight =
    entries.reduce(
      (sum,entry) => sum + entry.weight,
      0
    );

  const firstParsed =
    firstChord
      ? parseChordRootQuality(firstChord)
      : null;

  const lastParsed =
    lastChord
      ? parseChordRootQuality(lastChord)
      : null;

  let best = null;

  for(let rootIndex = 0; rootIndex < 12; rootIndex++){

    [false,true].forEach(isMinor => {

      const keyMap =
        buildKeyChordMap(
          rootIndex,
          isMinor
        );

      let matchedWeight = 0;

      entries.forEach(entry => {

        const allowed =
          keyMap.get(
            entry.parsed.root
          );

        if(
          allowed &&
          allowed.has(
            entry.parsed.quality
          )
        ){

          matchedWeight +=
            entry.weight;

        }

      });

      let score =
        matchedWeight / totalWeight;

      const tonicQuality =
        isMinor
          ? 'minor'
          : 'major';

      if(
        firstParsed &&
        firstParsed.root === rootIndex &&
        firstParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(
        lastParsed &&
        lastParsed.root === rootIndex &&
        lastParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(!best || score > best.score){

        best = {rootIndex,isMinor,score};

      }

    });

  }

  const tonicName =
    chromatic[best.rootIndex];

  return {

    tonic:tonicName,

    mode:
      best.isMinor
        ? 'minor'
        : 'major',

    label:
      best.isMinor
        ? tonicName + 'm'
        : tonicName

  };

}


function extractChordTokens(text){

  return String(text || '')
    .split(/\r?\n/)
    .flatMap(findChords);

}


/* =========================================================
   ANALYZER
========================================================= */

function guessTitleFromText(text){

  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;

  const lines =
    String(text || '').split(/\r?\n/);

  for(const rawLine of lines){

    const line = rawLine.trim();

    if(!line)continue;
    if(sectionPattern.test(line))continue;
    if(isChordOnlyLine(line))continue;

    return line.slice(0,80);

  }

  return '';

}

function analyzeFocusedSong(text){

  const sections =
    parseSections(text);


  const analyzedSections =
    sections.map(section => {

      const lines =
        section.lines.map(line => {

          const chords =
            findChords(line);


          return {

            text:line,

            chords

          };

        });


      return {

        name:
          section.name,

        lines,

        chords:[
          ...new Set(
            lines.flatMap(
              line =>
                line.chords
            )
          )

        ]

      };

    });


  return {

    rawText:text,

    sections:
      analyzedSections,

    chords:[
      ...new Set(
        analyzedSections.flatMap(
          section =>
            section.chords
        )
      )

    ],

    key:
      detectKeyFromChords(
        extractChordTokens(text)
      )

  };

}

function formatAnalysisLine(line){

  if(
    isChordOnlyLine(
      line.text
    )
  ){

    return `<div class="songLine chordLine">${esc(line.text)}</div>`;

  }


  let html =
    esc(line.text);


  line.chords
    .forEach(chord => {

      const safe =
        esc(chord);


      html =
        html.replace(
          new RegExp(
            `(^|[^A-Za-z0-9#\\/])(${escapeRegExp(chord)})(?=[^A-Za-z0-9#\\/]|$)`,
            'g'
          ),
          `$1<span class="detectedChord">$2</span>`
        );

    });


  return `<div class="songLine lyricLine">${html || '&nbsp;'}</div>`;

}


function escapeRegExp(value){

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

}

/* =========================================================
   TRANSPOSE ENGINE
========================================================= */

const chromatic = [

  'C',
  'C#',
  'D',
  'D#',
  'E',
  'F',
  'F#',
  'G',
  'G#',
  'A',
  'A#',
  'B'

];


const flatToSharp = {

  Db:'C#',
  Eb:'D#',
  Gb:'F#',
  Ab:'G#',
  Bb:'A#'

};


function normalizeNote(note){

  return (
    flatToSharp[note] ||
    note
  );

}


function transposeNote(
  note,
  amount
){

  const normalized =
    normalizeNote(note);


  const index =
    chromatic.indexOf(
      normalized
    );


  if(index === -1){

    return note;

  }


  const newIndex =
    (
      (index + amount) % 12 +
      12
    ) % 12;


  return chromatic[newIndex];

}


function transposeChord(
  chord,
  amount
){

  const slashParts =
    chord.split('/');


  let mainChord =
    slashParts[0];


  let bassNote =
    slashParts[1];


  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if(!match){

    return chord;

  }


  const root =
    match[1];


  const suffix =
    match[2];


  const newRoot =
    transposeNote(
      root,
      amount
    );


  let result =
    newRoot +
    suffix;


  if(bassNote){

    bassNote =
      transposeNote(
        bassNote,
        amount
      );


    result +=
      '/' +
      bassNote;

  }


  return result;

}


function transposeText(
  text,
  amount
){

  if(!amount){

    return text;

  }


  /*
    Matches chord-like tokens including:
    Fdim
    F#dim
    E7#9
    Cmaj7
    G/B
    Bb
  */

  const regex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/gm;


  return text.replace(
    regex,
    (
      full,
      prefix,
      chord
    ) => {

      if(
        !isChordToken(chord)
      ){

        return full;

      }


      return (
        prefix +
        transposeChord(
          chord,
          amount
        )
      );

    }
  );

}


/* =========================================================
   SONG VIEWER
========================================================= */

function openSong(song){

  currentSong =
    song;


  currentSong.originalText =
    decodeHtmlEntities(
      currentSong.originalText ||
      currentSong.text ||
      ''
    );


  currentSong.text =
    currentSong.originalText;


  modal.classList.remove('open');


  setActiveNav('lyrics');


  if(
    !currentSong.originalText
  ){

    currentSong.originalText =
      currentSong.text || '';

  }


  if(
    typeof currentSong.transposeSteps !==
    'number'
  ){

    currentSong.transposeSteps =
      0;

  }


  if(
    typeof currentSong.fontSize !==
    'number'
  ){

    currentSong.fontSize =
      15;

  }


  renderSongViewer();

}


function getViewerSections(song, displayedText){
  const parsed = parseSections(displayedText);
  const normalized = parsed.map((section,index) => ({...section,_id:String(index)+'|'+String(section.name||'Section').trim().toLowerCase()}));
  const savedOrder = Array.isArray(song.sectionOrder) ? song.sectionOrder : [];
  if(!savedOrder.length){ song.sectionOrder=normalized.map(section=>section._id); return normalized; }
  const byId=new Map(normalized.map(section=>[section._id,section]));
  const ordered=[];
  savedOrder.forEach(id=>{const section=byId.get(id);if(section){ordered.push(section);byId.delete(id);}});
  normalized.forEach(section=>{if(byId.has(section._id)) ordered.push(section);});
  song.sectionOrder=ordered.map(section=>section._id);
  return ordered;
}

function persistSectionOrder(){
  if(!currentSong)return;
  const songs=getSongs();
  const index=songs.findIndex(item=>item.id===currentSong.id);
  if(index!==-1){songs[index]=currentSong;writeSongs(songs.slice(0,200));}
}

function reorderViewerSections(fromIndex,toIndex){
  if(!currentSong||fromIndex===toIndex)return;
  const amount=currentSong.transposeSteps||0;
  const displayedText=transposeText(currentSong.originalText||currentSong.text||'',amount);
  const sections=getViewerSections(currentSong,displayedText);
  if(fromIndex<0||toIndex<0||fromIndex>=sections.length||toIndex>=sections.length)return;
  const moved=sections.splice(fromIndex,1)[0];
  sections.splice(toIndex,0,moved);
  currentSong.sectionOrder=sections.map(section=>section._id);
  persistSectionOrder();
  renderSongViewer();
}

function attachSectionNavBehavior(){
  const nav=document.getElementById('songSectionNav');
  if(!nav)return;
  let pressTimer=null;
  let draggingButton=null;
  let dragStartIndex=-1;
  const clearPress=()=>{clearTimeout(pressTimer);pressTimer=null;nav.querySelectorAll('button').forEach(button=>button.classList.remove('longPressing'));};
  const setActiveIndex=index=>{
    nav.querySelectorAll('button').forEach(button=>{
      button.classList.toggle('active',Number(button.dataset.sectionIndex)===index);
    });
  };
  const fixedHeader=document.querySelector('.songFixedHeader');
  const headerHeight=fixedHeader?fixedHeader.offsetHeight:0;
  const sectionEls=[...document.querySelectorAll('.songSection')];
  if(sectionEls.length){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          setActiveIndex(Number(entry.target.dataset.sectionIndex));
        }
      });
    },{
      root:null,
      rootMargin:`-${headerHeight+1}px 0px -70% 0px`,
      threshold:0
    });
    sectionEls.forEach(section=>observer.observe(section));
  }
  nav.querySelectorAll('button').forEach(button=>{
    button.addEventListener('pointerdown',event=>{
      clearPress();button.classList.add('longPressing');
      pressTimer=setTimeout(()=>{draggingButton=button;dragStartIndex=[...nav.children].indexOf(button);button.classList.remove('longPressing');button.classList.add('dragging');},500);
    });
    button.addEventListener('pointermove',event=>{
      if(!draggingButton)return;
      event.preventDefault();
      const buttons=[...nav.querySelectorAll('button')];
      const target=buttons.find(targetButton=>{if(targetButton===draggingButton)return false;const rect=targetButton.getBoundingClientRect();return event.clientX>=rect.left&&event.clientX<=rect.right;});
      if(!target)return;
      const currentIndex=[...nav.children].indexOf(draggingButton);
      const targetIndex=[...nav.children].indexOf(target);
      if(targetIndex>currentIndex)nav.insertBefore(draggingButton,target.nextSibling);else nav.insertBefore(draggingButton,target);
    });
    button.addEventListener('pointerup',()=>{
      const wasDragging=!!draggingButton;clearPress();
      if(wasDragging){const finalIndex=[...nav.children].indexOf(button);button.classList.remove('dragging');draggingButton=null;if(finalIndex!==dragStartIndex)reorderViewerSections(dragStartIndex,finalIndex);dragStartIndex=-1;return;}
      const index=Number(button.dataset.sectionIndex);setActiveIndex(index);const target=document.getElementById('section-'+index);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    button.addEventListener('pointercancel',()=>{clearPress();if(draggingButton)draggingButton.classList.remove('dragging');draggingButton=null;dragStartIndex=-1;});
  });
}

/* =========================================================
   AUTO SCROLL
========================================================= */

let autoScrollActive=false;
let autoScrollRAF=null;
let autoScrollLastTime=null;
let autoScrollSpeedLevel=2; /* 1-5 */
const AUTO_SCROLL_MIN_LEVEL=1;
const AUTO_SCROLL_MAX_LEVEL=5;

function autoScrollPxPerSecond(){
  return 18+autoScrollSpeedLevel*16; /* level1=34 ... level5=98 */
}

function autoScrollStep(now){
  if(!autoScrollActive)return;
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn){stopAutoScroll();return;}
  if(autoScrollLastTime===null)autoScrollLastTime=now;
  const deltaSeconds=(now-autoScrollLastTime)/1000;
  autoScrollLastTime=now;
  window.scrollBy(0,autoScrollPxPerSecond()*deltaSeconds);
  const scroller=document.scrollingElement||document.documentElement;
  if(scroller.scrollTop+window.innerHeight>=scroller.scrollHeight-2){
    stopAutoScroll();
    return;
  }
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function autoScrollIconHTML(){
  return autoScrollActive
    ? '<span class="asPauseIcon" aria-hidden="true"><i></i><i></i></span>'
    : '<span class="asPlayIcon" aria-hidden="true"></span>';
}

function refreshAutoScrollToggleLabel(){
  const wrap=document.getElementById('asToggleWrap');
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn)return;
  if(wrap&&wrap.classList.contains('speedMode')){
    toggleBtn.textContent=String(autoScrollSpeedLevel);
  }else{
    toggleBtn.innerHTML=autoScrollIconHTML();
  }
}

function startAutoScroll(){
  autoScrollActive=true;
  autoScrollLastTime=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.add('primary');
  refreshAutoScrollToggleLabel();
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function stopAutoScroll(){
  autoScrollActive=false;
  autoScrollLastTime=null;
  if(autoScrollRAF)cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.remove('primary');
  refreshAutoScrollToggleLabel();
}

function toggleAutoScroll(){
  if(autoScrollActive)stopAutoScroll();else startAutoScroll();
}

function setAutoScrollSpeedLevel(level){
  autoScrollSpeedLevel=Math.max(AUTO_SCROLL_MIN_LEVEL,Math.min(AUTO_SCROLL_MAX_LEVEL,level));
  refreshAutoScrollToggleLabel();
}

function attachAutoScrollControls(){
  const toggleBtn=document.getElementById('asToggle');
  const wrap=document.getElementById('asToggleWrap');
  const upBtn=document.getElementById('asArrowUp');
  const downBtn=document.getElementById('asArrowDown');
  if(!toggleBtn||!wrap)return;

  let pressTimer=null;
  let longPressFired=false;

  const enterSpeedMode=()=>{
    longPressFired=true;
    wrap.classList.add('speedMode');
    refreshAutoScrollToggleLabel();
  };

  const exitSpeedMode=()=>{
    wrap.classList.remove('speedMode');
    refreshAutoScrollToggleLabel();
  };

  if(upBtn)upBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel+1);
  });

  if(downBtn)downBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel-1);
  });

  toggleBtn.addEventListener('pointerdown',event=>{
    event.preventDefault();
    longPressFired=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(enterSpeedMode,450);
  });

  toggleBtn.addEventListener('pointerup',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('pointercancel',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('click',()=>{
    /*
      A click always fires right after pointerup, even for a
      long press. If this click is the tail end of the same
      press that just opened speed mode, swallow it so the
      popup doesn't instantly close again.
    */
    if(longPressFired){
      longPressFired=false;
      return;
    }
    if(wrap.classList.contains('speedMode')){
      /* Tapping the number saves the speed and closes the popup. */
      exitSpeedMode();
    }else{
      toggleAutoScroll();
    }
  });
}


function formatViewerLine(
  line
){

  let html =
    esc(line);


  const chordRegex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  html =
    html.replace(
      chordRegex,
      (
        prefix,
        chord
      ) => {

        return (
          prefix +
          '<span class="chordToken">' +
          chord +
          '</span>'
        );

      }
    );


  return html || '&nbsp;';

}

function saveCurrentSong(){

  if(!currentSong){

    return;

  }


  const songs =
    getSongs();


  const index =
    songs.findIndex(
      item =>
        item.id ===
        currentSong.id
    );


  if(index === -1){

    /*
      This is a preview/new song.
      Give it a real ID and save it.
    */

    currentSong.id =
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now());


    currentSong.savedAt =
      new Date().toISOString();


    currentSong.originalText =
      currentSong.originalText ||
      currentSong.text ||
      '';


    currentSong.kind =
      'analyzed';


    songs.unshift(
      currentSong
    );

  }else{

    songs[index] =
      currentSong;

  }


  writeSongs(
    songs.slice(0,200)
  );


  alert(
    'Song saved.'
  );


  renderSongViewer();

}

function duplicateEditorSection(button){
  const section=button.closest('[data-editor-section]');
  if(!section)return;
  const clone=section.cloneNode(true);
  section.parentElement.insertBefore(clone,section.nextSibling);
}


function moveEditorSection(
  button,
  direction
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(!section){

    return;

  }


  const container =
    section.parentElement;


  const sections =
    [...container.children];


  const index =
    sections.indexOf(
      section
    );


  const target =
    index + direction;


  if(
    target < 0 ||
    target >= sections.length
  ){

    return;

  }


  if(
    direction < 0
  ){

    container.insertBefore(
      section,
      sections[target]
    );

  }else{

    container.insertBefore(
      sections[target],
      section
    );

  }

}


function deleteEditorSection(
  button
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(section){

    section.remove();

  }

}


function saveEditorChanges(){

  const sections =
    document

  const output = [];


  sections.forEach(section => {

    const name =
      section

        )
        .value
        .trim();


    const text =
      section
        .querySelector(
          '.editorTextarea'
        )
        .value;


    if(
      name ||
      text.trim()
    ){

      output.push(
        name || 'Section'
      );


      output.push(
        text
      );


      output.push('');

    }

  });


  const text =
    output.join('\n')
      .replace(
        /\n{3,}/g,
        '\n\n'
      )
      .trim();


  currentSong.originalText =
    text;

    parseSections(text).map((section,index) =>

            );

        }
      );


      card.addEventListener(
        'pointerup',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointerleave',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointercancel',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );

    });

}


/*
  Renaming a single saved song, used both from the library's
  select-mode "Rename" action.
*/

function renameSongById(songId){

  const songs =
    getSongs();

  const song =
    songs.find(
      item => item.id === songId
    );

  if(!song)return;


  const nextTitle =
    prompt(
      'Song title:',
      song.title || ''
    );

  if(nextTitle === null)return;


  const trimmed =
    nextTitle.trim();

  if(!trimmed)return;


  song.title =
    trimmed;

  writeSongs(songs);


  librarySelectedIds.clear();

  renderLibrary();

}


/*
  Merge 2–10 selected songs into a single new saved song,
  combining their lyrics/chords in library order. Originals
  are left untouched so nothing is lost if the merge isn't
  what the user wanted.
*/

function mergeSongsByIds(ids){

  const songs =
    getSongs();

  const ordered =
    songs.filter(
      song => ids.includes(song.id)
    );

  if(ordered.length < 2)return;


  const suggestedTitle =
    ordered
      .map(song => song.title)
      .join(' + ')
      .slice(0,120);

  const nextTitle =
    prompt(
      'Merged song title:',
      suggestedTitle
    );

  if(nextTitle === null)return;


  const title =
    nextTitle.trim() ||
    suggestedTitle;

  const combinedText =
    ordered
      .map(song => song.originalText || song.text || '')
      .join('\n\n');

  const merged =
    saveSong(
      title,
      combinedText
    );


  librarySelectedIds.clear();

  alert(
    `Merged ${ordered.length} songs into "${merged.title}".`
  );

  renderLibrary();

}


function toggleLibrarySelection(songId){

  if(librarySelectedIds.has(songId)){

    librarySelectedIds.delete(songId);

  }else{

    if(librarySelectedIds.size >= 10)return;

    librarySelectedIds.add(songId);

  }

  renderLibrary();

}


function exitLibrarySelectMode(){

  librarySelectedIds.clear();

  renderLibrary();

}


/* =========================================================
   SEARCH — single bar, behavior depends on the active tab
========================================================= */

function openSearch(
  selectedSource='all'
){

  source =
    selectedSource;


  modal.classList.add('open');


  document
    .querySelectorAll(
      '.sourceTabs button'
    )
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.source ===
        source
      );

    });


  query.focus();


  renderResults();

}


function renderResults(){

  const searchText =
    query.value
      .trim()
      .toLowerCase();


  const list =
    getSongs().filter(song => {

      const content =
        (
          song.title +
          ' ' +
          song.text
        )
        .toLowerCase();


      return (
        !searchText ||
        content.includes(
          searchText
        )
      );

    });


  let html = '';


  /* =======================================================
     LOCAL / DRIVE
  ====================================================== */

  if(
    source === 'all' ||
    source === 'drive'
  ){

    html += `

      <div class="result">

        <div class="resultTitle">
          Saved Songs
        </div>


        <div class="resultMeta">

          ${
            list.length
              ? 'Songs matching your search'
              : 'No matching saved songs'
          }

        </div>


        ${
          list
            .map(song => `

              <div class="resultActions">

                <button
                  class="smallBtn toolbarBtn primary"
                  data-open="${esc(song.id)}"
                >
                  Open ${esc(song.title)}
                </button>

              </div>

            `)
            .join('')
        }


        ${
          source === 'drive'
          ? `
            <div class="driveStatus">
              🔐 Google Drive isn't connected yet. Once connected,
              Search will look up matching songs in your Drive.
            </div>
          `
          : ''
        }

      </div>

    `;

  }


  /* =======================================================
     ULTIMATE GUITAR
  ====================================================== */

  if(
    source === 'ug'
  ){

    html += `

      <div class="result">

        <div class="resultTitle">
          Ultimate Guitar
        </div>


        <div class="resultMeta">

          Type a song title and tap Search to look it up on
          Ultimate Guitar, or paste a direct chord-page URL
          to import it — lyrics and chords are detected
          automatically.

        </div>


        <div id="ugResult"></div>

      </div>

    `;

  }


  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      html ||
      '<div class="empty">No results.</div>';


  document
    .querySelectorAll(
      '[data-open]'
    )
    .forEach(button => {

      button.onclick = () => {

        const song =
          getSongs().find(
            item =>
              item.id ===
              button.dataset.open
          );


        if(song){

          openSong(song);

        }

      };

    });

}


/* =========================================================
   TOP SEARCH BAR — one input, behavior depends on the
   active source tab (All / Google Drive / Ultimate Guitar)
========================================================= */

function looksLikeUrl(value){

  return /^https?:\/\//i.test(
    value.trim()
  );

}


function handleTopSearch(){

  const value =
    query.value.trim();


  if(source === 'ug'){

    if(!value){

      renderResults();

      return;

    }


    if(looksLikeUrl(value)){

      /*
        Make sure #ugResult exists in the DOM before we try
        to write status/progress into it.
      */

      renderResults();


      importFromUG(value);


      return;

    }


    /*
      No scraping/search API for Ultimate Guitar's catalog —
      only a direct-URL importer (/api/import) exists. So a
      plain title search opens UG's own search page; the user
      copies the chord-page link back here to import it, which
      auto-detects the lyrics and chords.
    */

    window.open(

      'https://www.ultimate-guitar.com/search.php?search_type=title&value=' +
      encodeURIComponent(value),

      '_blank'

    );


    renderResults();


    return;

  }


  /*
    'all' and 'drive' both just filter/search — Drive search
    itself is a placeholder until Drive OAuth is connected.
  */

  renderResults();

}


/* =========================================================
   ULTIMATE GUITAR IMPORT
   Given a direct chord-page URL, fetches the page through
   the backend importer, then automatically detects the
   song's lyrics and chords via the same analyzer used for
   pasted-in songs, and saves it straight to the Library.
========================================================= */

async function importFromUG(url){

  const box =
    document.getElementById(
      'ugResult'
    );


  if(!box){

    return;

  }


  try{

    const parsedUrl =
      new URL(url);


    if(
      !parsedUrl.hostname.endsWith(
        'ultimate-guitar.com'
      )
    ){

      throw new Error(
        'Please use an Ultimate Guitar URL.'
      );

    }

  }catch(error){

    box.innerHTML =
      '<div class="hint">' +
      esc(
        error.message ||
        "That doesn't look like a valid URL."
      ) +
      '</div>';

    return;

  }


  box.innerHTML =
    '<div class="hint">⏳ Loading song...</div>';


  try{

    const response =
      await fetch(
        '/api/import',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              url
            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if(!response.ok){

      throw new Error(

        data.error ||
        `Importer returned HTTP ${response.status}`

      );

    }


    const raw =
      (
        url.split('/').pop() ||
        'Ultimate Guitar Song'
      )
      .replace(
        /[-_]/g,
        ' '
      );


    const title =
      raw
        .replace(
          /\s+chords?\s+\d+.*$/i,
          ''
        )
        .replace(
          /\s+\d+.*$/,
          ''
        )
        .trim()
        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );


    const importedText =
      decodeHtmlEntities(
        data.text || ''
      );


    /*
      Immediately analyze the imported song — this is what
      detects the section structure, lyrics, and chords.
    */

    const analysis =
      analyzeFocusedSong(
        importedText
      );


    const song =
      saveSong(
        title,
        importedText,
        data.sourceUrl || url,
        analysis
      );


    box.innerHTML = `

      <div class="hint">

        ✅ "${esc(song.title)}" imported —
        lyrics and chords detected automatically.

      </div>


      <div class="resultActions">

        <button
          class="smallBtn toolbarBtn primary"
          id="openImportedSong"
        >
          Open Song
        </button>

      </div>

    `;


    document
      .getElementById(
        'openImportedSong'
      )
      .onclick =
        () => openSong(song);


  }catch(error){

    box.innerHTML =
      '<div class="hint">⚠️ ' +
      esc(

        error.message ||
        'Something went wrong importing this song.'

      ) +
      '</div>';

  }

}


/* =========================================================
   GLOBAL BINDINGS / INIT
========================================================= */

document
  .getElementById('closeSearch')
  .onclick =
    () => modal.classList.remove('open');


/* Clicking the dimmed backdrop (not the sheet itself) closes it. */

modal.addEventListener(
  'click',
  event => {

    if(event.target === modal){

      modal.classList.remove('open');

    }

  }
);


document
  .getElementById('runSearch')
  .onclick =
    handleTopSearch;


query.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Enter'){

      event.preventDefault();

      handleTopSearch();

    }

  }
);


document
  .querySelectorAll(
    '.sourceTabs button'
  )
  .forEach(button => {

    button.onclick = () => {

      source =
        button.dataset.source;

      document
        .querySelectorAll(
          '.sourceTabs button'
        )
        .forEach(tab => {

          tab.classList.toggle(
            'active',
            tab === button
          );

        });

      renderResults();

    };

  });


document
  .querySelectorAll(
    '.nav button[data-screen]'
  )
  .forEach(button => {

    button.onclick = () => {

      const target =
        button.dataset.screen;

      if(target === 'home'){

        renderHome();

      }else if(target === 'lyrics'){

        currentSong
          ? renderSongViewer()
          : renderLyrics();

      }else if(target === 'library'){

        renderLibrary();

      }else if(target === 'profile'){

        renderProfile();

      }

    };

  });


renderHome();

</script>
