<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worship Chords</title>

<style>
*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#090b0e;
  color:#f5f6f7;
  font-family:Arial,sans-serif
}

.app{
  max-width:920px;
  margin:auto;
  min-height:100vh;
  background:#11151a
}

header{
  padding:14px 18px;
  border-bottom:1px solid #293039;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.brand{
  font-size:20px;
  font-weight:800
}

.sub,.muted{
  color:#929ca6;
  font-size:13px
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:#272e36;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.btn.primary{
  background:#fff;
  color:#111
}

.btn.active{
  background:#fff;
  color:#111
}

nav{
  display:flex;
  background:#151a20;
  border-bottom:1px solid #293039
}

nav button{
  flex:1;
  border:0;
  background:none;
  color:#8f99a4;
  padding:14px;
  font-weight:700
}

nav button.active{
  color:#fff;
  border-bottom:2px solid #fff
}

main{
  padding:18px
}

.hidden{
  display:none
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.card,.item{
  background:#171c22;
  border:1px solid #293039;
  border-radius:14px;
  padding:15px;
  margin:9px 0
}

.item{
  display:flex;
  align-items:center;
  gap:10px
}

.itemmain{
  flex:1;
  min-width:0
}

.itemmain b{
  display:block
}

.itemmain span{
  display:block;
  color:#8e98a3;
  font-size:12px;
  margin-top:3px
}


/* =========================================================
   FIXED SONG CONTROL AREA
   ========================================================= */

.songControlsSticky{
  position:sticky;
  top:0;
  z-index:10;
  background:#11151a;
  padding:8px 0 0;
  margin-bottom:4px
}

.mainSongControls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding-bottom:7px
}


/* =========================================================
   HIDEABLE CONTROL ROW
   ========================================================= */

.utilityRow{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  padding-bottom:7px
}

.utilityControls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  flex:1
}

.utilityToggle{
  min-width:42px;
  text-align:center;
  font-size:18px;
  padding:8px 12px
}

.utilityHidden .utilityControls{
  display:none
}


/* =========================================================
   SECTION BUTTON BAR
   ALWAYS VISIBLE / STICKY
   ========================================================= */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  background:#11151a;
  padding:8px 0 10px;
  z-index:9;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{
  display:none
}

.tabs button{
  white-space:nowrap;
  flex-shrink:0
}


/* SELECTED SECTION BUTTON */

.tabs button.sectionActive{
  background:#cfe8d5 !important;
  color:#111 !important;
  border-bottom:0 !important
}


/* SELECTED SECTION CARD */

.card.sectionActive{
  background:#cfe8d5;
  border-color:#9ac9a5;
  color:#111
}

.card.sectionActive .part-title{
  color:#315c3b
}

.card.sectionActive .chordInput{
  color:#2f6b3d
}

.card.sectionActive .muted{
  color:#4f6f57
}


/* Keep selected section visible below sticky buttons */

#content .card{
  scroll-margin-top:150px
}


/* =========================================================
   EDIT MODE
   ========================================================= */

.editBanner{
  display:none;
  background:#fff;
  color:#111;
  padding:10px 13px;
  border-radius:10px;
  font-weight:800;
  margin:10px 0
}

.editMode .editBanner{
  display:block
}

.editSectionBtn{
  cursor:grab;
  touch-action:none
}

.editSectionBtn.dragging{
  opacity:.45;
  outline:2px dashed #72b7ff
}

.editSectionBtn.dropTarget{
  outline:2px solid #72b7ff
}


/* =========================================================
   SONG CONTENT
   ========================================================= */

.part-title{
  text-transform:uppercase;
  letter-spacing:1px;
  color:#aeb6bf;
  font-size:12px;
  margin-bottom:7px
}

.line{
  display:block;
  margin:0 0 4px;
  padding:0;
  border-radius:8px
}

.handle{
  display:none
}

.chordInput{
  display:block;
  width:100%;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  color:#72b7ff;
  font:bold 16px monospace;
  padding:1px 5px;
  line-height:1.05;
  margin:0
}

.editMode .chordInput{
  border-color:#3a424c;
  background:#0e1115
}

.chordRow{
  min-height:18px;
  margin:0
}

.lyricText{
  font-size:18px;
  padding:0 5px;
  line-height:1.1;
  margin:0
}


/* =========================================================
   COMPACT CHORD ONLY LINE
   ========================================================= */

.chordOnlyLine{
  display:block !important;
  margin:4px 0 !important;
  padding:3px 7px !important;
  border-radius:8px
}

.chordOnlyInner{
  font:bold 18px monospace !important;
  color:#72b7ff !important;
  white-space:nowrap !important;
  letter-spacing:0 !important
}

.chordOnlyInner .chordInput{
  display:block;
  width:100%;
  letter-spacing:.08em
}

.editMode .chordOnlyLine{
  background:#0e1115;
  border:1px solid #3a424c
}


/* =========================================================
   SINGER MODE
   ========================================================= */

.singerBanner{
  display:none;
  background:#fff;
  color:#111;
  padding:8px 12px;
  border-radius:9px;
  font-weight:800;
  margin:10px 0
}

.singerMode .singerBanner{
  display:inline-block
}

.singerMode .chordRow{
  display:none
}


/* =========================================================
   MODAL
   ========================================================= */

.modalback{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  align-items:flex-end;
  z-index:20
}

.modal{
  width:min(920px,100%);
  max-height:90vh;
  overflow:auto;
  background:#171c22;
  border-radius:20px 20px 0 0;
  padding:20px
}

.modal h2{
  margin-top:0
}

.input,
.modal input,
.modal textarea{
  width:100%;
  background:#0e1115;
  color:#fff;
  border:1px solid #343c45;
  border-radius:9px;
  padding:12px;
  font:inherit
}

.modal textarea{
  min-height:180px;
  resize:vertical
}

.searchbox{
  display:flex;
  gap:8px;
  margin:15px 0
}

.searchbox input{
  flex:1
}


/* =========================================================
   TRANSPOSE KEY GRID
   ========================================================= */

.keygrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.keybtn{
  padding:13px 5px;
  border:1px solid #343c45;
  border-radius:9px;
  background:#20262d;
  color:#fff;
  font-weight:800;
  cursor:pointer
}

.keybtn:hover{
  background:#303943
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  background:#27303a;
  color:#aeb8c2;
  font-size:11px
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#111;
  padding:10px 15px;
  border-radius:10px;
  font-weight:700;
  display:none;
  z-index:30
}


@media(max-width:500px){

  .keygrid{
    grid-template-columns:repeat(3,1fr)
  }

  .lyricText{
    font-size:16px
  }

  .tabs{
    padding:8px 0
  }

  #content .card{
    scroll-margin-top:135px
  }

  .mainSongControls .btn,
  .utilityControls .btn{
    padding:9px 10px
  }
}
.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}</style>
</head>


<body>

<div class="app">

<header>

  <div>
    <div class="brand">Worship Chords</div>
    <div class="sub">Lyrics • Chords • Setlists</div>
  </div>

  <button class="btn" onclick="openSearch()">
    🔎 Search Song
  </button>

</header>


<nav>

  <button
    id="songsNav"
    class="active"
    onclick="showTab('songs')"
  >
    Songs
  </button>

  <button
    id="setlistsNav"
    onclick="showTab('setlists')"
  >
    Setlists
  </button>

</nav>


<!-- =======================================================
     SONG LIBRARY
     ======================================================= -->

<main id="songs">

  <div class="row">

    <div>

      <h1 style="margin:4px 0">
        Song Library
      </h1>

      <div class="muted">
        Search, import and analyze your worship songs
      </div>

    </div>

    <button
      class="btn primary"
      onclick="openSearch()"
    >
      ＋ Add / Search Song
    </button>

  </div>


  <div class="card">

    <b>Current song</b>

    <div
      class="item"
      style="padding:10px 0;border:0"
    >

      <div class="itemmain">

        <b id="libraryTitle">
          Way Maker
        </b>

        <span id="libraryArtist">
          Sinach • Key C
        </span>

      </div>

      <button
        class="btn"
        onclick="openSong()"
      >
        Open
      </button>

    </div>

  </div>

</main>


<!-- =======================================================
     SETLISTS
     ======================================================= -->

<main
  id="setlists"
  class="hidden"
>

  <div class="row">

    <div>

      <h1 style="margin:4px 0">
        Setlists
      </h1>

      <div class="muted">
        Your worship service songs
      </div>

    </div>

    <button
      class="btn primary"
      onclick="addSetSong()"
    >
      ＋ Add Song
    </button>

  </div>


  <div
    class="card"
    id="setlistBox"
  ></div>

</main>


<!-- =======================================================
     SONG VIEW
     ======================================================= -->

<main
  id="song"
  class="hidden"
>


  <!-- =====================================================
       STICKY CONTROL AREA
       ===================================================== -->

  <div class="songControlsSticky">

    <!-- MAIN BUTTONS -->

    <div class="mainSongControls">

      <button
        class="btn"
        onclick="showTab('songs')"
      >
        ← Songs
      </button>


      <button
        class="btn"
        id="editBtn"
        onclick="toggleEdit()"
      >
        ✎ Edit
      </button>


      <button
        class="btn"
        id="hideBtn"
        onclick="toggleSingerMode()"
      >
        👁 Hide Chords
      </button>

    </div>


    <!-- HIDEABLE BUTTONS -->

    <div
      class="utilityRow"
      id="utilityRow"
    >

      <div class="utilityControls">

        <button
          class="btn"
          onclick="font(-1)"
        >
          A−
        </button>


        <button
          class="btn"
          onclick="font(1)"
        >
          A+
        </button>


        <button
          class="btn"
          onclick="autoScroll()"
        >
          ▶ Auto Scroll
        </button>


        <button
          class="btn"
          onclick="transpose()"
        >
          Transpose
        </button>


        <!-- SAVE ONLY APPEARS IN EDIT MODE -->

        <button
          class="btn primary"
          id="saveBtn"
          onclick="saveLocal()"
        >
          💾 Save
        </button>

      </div>


      <!-- HIDE / SHOW -->

      <button
        class="btn utilityToggle"
        id="utilityToggle"
        onclick="toggleUtilityControls()"
      >
        ^
      </button>

    </div>


    <!-- SECTION BUTTONS - NEVER HIDDEN -->

    <div
      class="tabs"
      id="tabs"
    ></div>

  </div>


  <div class="singerBanner">
    SINGER MODE • Lyrics only
  </div>


  <div class="editBanner">
    ✎ EDIT MODE — Drag the section buttons above to reorder them. Only chords are editable below.
  </div>


  <div id="content"></div>


</main>


<!-- =======================================================
     MODAL
     ======================================================= -->

<div
  class="modalback"
  id="modal"
>

  <div
    class="modal"
    id="modalBody"
  ></div>

</div>


<div
  class="toast"
  id="toast"
></div>


</div>


<script>


/* =========================================================
   SONG DATA
   ========================================================= */

const base={

  "Intro":[
    ["C",""],
    ["G",""],
    ["Am",""],
    ["F",""]
  ],

  "Verse 1":[
    ["C","You are here, moving in our midst"],
    ["G","I worship You, I worship You"],
    ["Am","You are here, working in this place"],
    ["F","I worship You, I worship You"]
  ],

  "Chorus":[
    ["C","Way Maker, Miracle Worker"],
    ["G","Promise Keeper, Light in the darkness"],
    ["Am","My God, that is who You are"],
    ["F","That is who You are"]
  ],

  "Verse 2":[
    ["C","You are here, touching every heart"],
    ["G","I worship You, I worship You"],
    ["Am","You are here, healing every heart"],
    ["F","I worship You, I worship You"]
  ],

  "Bridge":[
    ["Am","Even when I don't see it, You're working"],
    ["F","Even when I don't feel it, You're working"],
    ["C","You never stop, You never stop working"],
    ["G","You never stop, You never stop working"]
  ],

  "Tag":[
    ["C","That is who You are"],
    ["G","That is who You are"]
  ],

  "Adlib":[
    ["Am","You are here"],
    ["F","You are here"]
  ],

  "Interlude":[
    ["C",""],
    ["G",""]
  ],

  "Outro":[
    ["C","That is who You are"],
    ["G","That is who You are"],
    ["Am","That is who You are"],
    ["F","That is who You are"]
  ]

};


let arrangement=Object.keys(base);

let size=18;

let editMode=false;

let singerMode=false;

let scrollTimer=null;

let utilityHidden=false;

let currentSongTitle='Way Maker';

let currentArtist='Sinach';

let currentKey='C';

let sectionDrag=null;

let activeSection='Intro';


let setlist=[
  'Way Maker',
  'Goodness of God',
  'What a Beautiful Name'
];


/* =========================================================
   NAVIGATION
   ========================================================= */

function showTab(t){

  ['songs','setlists','song'].forEach(x=>{

    document
      .getElementById(x)
      .classList
      .toggle(
        'hidden',
        x!==t
      );

  });


  document
    .getElementById('songsNav')
    .classList
    .toggle(
      'active',
      t==='songs'
    );


  document
    .getElementById('setlistsNav')
    .classList
    .toggle(
      'active',
      t==='setlists'
    );


  if(t==='setlists'){
    renderSetlist();
  }

}


function openSong(){

  showTab('song');

  renderSong();

}


/* =========================================================
   RENDER SONG
   ========================================================= */

function renderSong(){

  compactChordOnlyLines();


  document
    .getElementById('songTitle')
    ?.remove();


  document
    .getElementById('songArtist')
    ?.remove();


  document
    .getElementById('key')
    ?.remove();


  document
    .getElementById('libraryTitle')
    .textContent=currentSongTitle;


  document
    .getElementById('libraryArtist')
    .textContent=
      currentArtist+
      ' • Key '+
      currentKey;


  document
    .getElementById('editBtn')
    .textContent=
      editMode
      ?
      '✓ Done Editing'
      :
      '✎ Edit';


  /* SAVE ONLY IN EDIT MODE */

  document
    .getElementById('saveBtn')
    .style
    .display=
      editMode
      ?
      'inline-block'
      :
      'none';


  /* SECTION BUTTONS */

  document
    .getElementById('tabs')
    .innerHTML=

      arrangement
        .map((p,i)=>{

          const selected=
            p===activeSection;


          return `

            <button
              class="btn
                ${selected?'sectionActive':''}
                ${editMode?'editSectionBtn':''}"
              ${
                editMode
                ?
                `
                draggable="true"
                ondragstart="sectionDragStart(event,${i})"
                ondragover="sectionDragOver(event)"
                ondrop="sectionDrop(event,${i})"
                ondragend="sectionDragEnd(event)"
                `
                :
                ''
              }
              onclick="jump(${i})"
            >
              ${esc(p)}
            </button>

          `;

        })
        .join('');


  /* CONTENT */

  document
    .getElementById('content')
    .innerHTML=

      arrangement
        .map((p,i)=>{

          const selected=
            p===activeSection;


          return `

            <section
              class="card
                ${selected?'sectionActive':''}"
              id="part${i}"
            >

              <div class="part-title">
                ${esc(p)}
              </div>


              <div>

                ${
                  base[p]
                    .map(
                      (x,j)=>
                        lineHTML(i,j,x)
                    )
                    .join('')
                }

              </div>


              ${
                editMode
                ?
                `

                  <div class="controls">

                    <button
                      class="btn"
                      onclick="addLine(${i})"
                    >
                      ＋ Add lyric line
                    </button>


                    <button
                      class="btn"
                      onclick="addChordLine(${i})"
                    >
                      ＋ Add chord line
                    </button>

                  </div>

                `
                :
                ''
              }

            </section>

          `;

        })
        .join('');


  applyFontSize();

  applyModes();


  if(
    !arrangement.includes(activeSection)
  ){

    activeSection=
      arrangement[0] ||
      '';

  }


  updateSectionHighlight();

}


/* =========================================================
   SECTION HIGHLIGHT
   ========================================================= */

function updateSectionHighlight(){

  document
    .querySelectorAll('#tabs button')
    .forEach(button=>{

      button.classList.toggle(
        'sectionActive',
        button.textContent.trim()===
        activeSection
      );

    });


  document
    .querySelectorAll('#content .card')
    .forEach(card=>{

      const title=
        card.querySelector(
          '.part-title'
        );


      const isSelected=
        title &&
        title.textContent.trim()===
        activeSection;


      card.classList.toggle(
        'sectionActive',
        isSelected
      );

    });

}


/* =========================================================
   JUMP TO SECTION
   ========================================================= */

function jump(i){

  if(!arrangement[i]){
    return;
  }


  activeSection=
    arrangement[i];


  updateSectionHighlight();


  const target=
    document.getElementById(
      'part'+i
    );


  if(!target){
    return;
  }


  const sticky=
    document.querySelector(
      '.songControlsSticky'
    );


  const extraSpace=10;


  const targetTop=
    target.getBoundingClientRect().top+
    window.scrollY-
    sticky.offsetHeight-
    extraSpace;


  window.scrollTo({

    top:Math.max(
      0,
      targetTop
    ),

    behavior:'smooth'

  });

}


/* =========================================================
   LINE HTML
   ========================================================= */

function lineHTML(pi,li,x){

  /* CHORD ONLY */

  if(!x[1] && x[0]){

    return `

      <div class="chordOnlyLine">

        <div class="chordOnlyInner">

          ${
            editMode
            ?

            `

              <input
                class="chordInput"
                value="${esc(x[0])}"
                onchange="
                  updateLine(
                    ${pi},
                    ${li},
                    0,
                    this.value
                  )
                "
                aria-label="Chord line"
              >

            `

            :

            `<span>${esc(x[0])}</span>`

          }

        </div>

      </div>

    `;

  }


  /* NORMAL LYRIC + CHORD */

  return `

    <div class="line">

      <div class="handle"></div>

      <div>

        <div class="chordRow">

          <input
            class="chordInput"
            value="${esc(x[0])}"
            ${editMode?'':'readonly'}
            onchange="
              updateLine(
                ${pi},
                ${li},
                0,
                this.value
              )
            "
            aria-label="Chord"
          >

        </div>


        <div class="lyricText">
          ${esc(x[1])}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   ESCAPE
   ========================================================= */

function esc(s){

  return String(s??'')

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    );

}


/* =========================================================
   UPDATE LINE
   ========================================================= */

function updateLine(
  pi,
  li,
  field,
  val
){

  const p=
    arrangement[pi];


  if(
    base[p] &&
    base[p][li]
  ){

    base[p][li][field]=
      val.trim();


    /* Do NOT automatically save here.
       User can use Save in Edit Mode. */

  }

}


/* =========================================================
   SECTION DRAGGING
   ========================================================= */

function sectionDragStart(e,i){

  sectionDrag=i;

  e.dataTransfer.effectAllowed=
    'move';


  e.currentTarget.classList.add(
    'dragging'
  );

}


function sectionDragOver(e){

  if(editMode){

    e.preventDefault();

  }

}


function sectionDrop(e,target){

  e.preventDefault();


  if(
    sectionDrag===null ||
    sectionDrag===target
  ){

    return;

  }


  const moved=
    arrangement.splice(
      sectionDrag,
      1
    )[0];


  arrangement.splice(
    target,
    0,
    moved
  );


  sectionDrag=null;


  renderSong();


  toast(
    'Section order updated'
  );

}


function sectionDragEnd(e){

  sectionDrag=null;


  e.currentTarget.classList.remove(
    'dragging'
  );

}


/* =========================================================
   EDIT MODE
   ========================================================= */

function toggleEdit(){

  editMode=
    !editMode;


  if(
    editMode &&
    singerMode
  ){

    singerMode=false;


    document
      .getElementById('hideBtn')
      .textContent=
        '👁 Hide Chords';

  }


  renderSong();


  toast(
    editMode
    ?
    'Edit mode on'
    :
    'Edit mode closed'
  );

}


/* =========================================================
   ADD LINES
   ========================================================= */

      14,
      Math.min(
        30,
        size+n

    );


  applyFontSize();

}

  document
    .querySelectorAll(
      '#content .lyricText'
    )
    .forEach(el=>{

      el.style.fontSize=
        size+'px';

    });


  document
    .querySelectorAll(
      '#content .chordInput'
    )
    .forEach(el=>{

      el.style.fontSize=

          size-2

    .querySelectorAll(
      '#content .chordOnlyInner'
    )
    .forEach(el=>{

      el.style.fontSize=

          14,
          size
        )+'px';

/* =========================================================
   SEARCH SONGS
   ========================================================= */

async function searchSongs(){

  const q=
    document
      .getElementById(
        'searchTerm'
      )
      .value
      .trim();


  const box=
    document
      .getElementById(
        'searchResults'
      );


  if(!q){

    box.innerHTML=
      '<div class="muted">Enter a song title.</div>';

    return;

  }


  box.innerHTML=
    '<div class="muted">Searching…</div>';


  try{

    const r=
      await fetch(
        'https://itunes.apple.com/search?term='+
        encodeURIComponent(q)+
        '&entity=song&limit=8'
      );


    const d=
      await r.json();


    box.innerHTML=
      d.results.length

      ?

      d.results
        .map(x=>`

          <div class="item">

            <div class="itemmain">

              <b>
                ${esc(x.trackName)}
              </b>


              <span>

                ${esc(x.artistName)}

                <span class="badge">
                  ${esc(
                    x.collectionName ||
                    'Song'
                  )}
                </span>

              </span>

            </div>


            <button
              class="btn"
              onclick='selectSearch(
                ${JSON.stringify(x.trackName)},
                ${JSON.stringify(x.artistName)}
              )'
            >
              Use
            </button>

          </div>

        `)
        .join('')

      :

      '<div class="muted">No songs found.</div>';

  }
  catch(e){

    box.innerHTML=
      '<div class="muted">Search service unavailable. You can still paste a link or chord sheet.</div>';

  }

}

/* =========================================================
   FETCH LINK
   ========================================================= */

async function fetchSongLink(){

  const url=
    document
      .getElementById(
        'songUrl'
      )
      .value
      .trim();


  const out=
    document
      .getElementById(
        'analysisResult'
      );


  if(!url){

    out.innerHTML=
      '<div class="card">Paste a URL first.</div>';

    return;

  }


  out.innerHTML=
    '<div class="card">Fetching link…</div>';


  try{

    let text='';


    try{

      const r=
        await fetch(url);


      if(r.ok){

        text=
          await r.text();

      }

    }
    catch(e){}


    if(!text){

      const r=
        await fetch(
          'https://api.allorigins.win/raw?url='+
          encodeURIComponent(url)
        );


      if(r.ok){

        text=
          await r.text();

      }

    }


    if(!text){
      throw 0;
    }


    document
      .getElementById(
        'songText'
      )
      .value=

        new DOMParser()
          .parseFromString(
            text,
            'text/html'
          )
          .body
          .innerText
          .slice(
            0,
            50000
          );


    out.innerHTML=
      '<div class="card">Link loaded. Review the text, then tap <b>Analyze Pasted Text</b>.</div>';

  }
  catch(e){

    out.innerHTML=`

      <div class="card">

        <b>
          Could not fetch this link.
        </b>


        <div class="muted">

          The site may block browser access.
          Copy the chord/lyrics text and paste it below.

        </div>

      </div>

    `;

  }

}


/* =========================================================
   NORMALIZE SECTION
   ========================================================= */

function normalizeSection(s){

  s=
    s
      .toLowerCase()
      .replace(/[\_\-]+/g,' ')
      .replace(/\s+/g,' ')
      .trim();


  s=
    s
      .replace(
        /^./,
        c=>c.toUpperCase()
      )

      .replace(
        /^Verse$/,
        'Verse 1'
      )

      .replace(
        /^Pre Chorus$/,
        'Pre-Chorus'
      )

      .replace(
        /^Prechorus$/,
        'Pre-Chorus'
      )

      .replace(
        /^Ad Lib$/,
        'Adlib'
      );


  return s;

}


/* =========================================================
   ANALYZE SONG
   ========================================================= */

function analyzeSong(){

  const title=
    document
      .getElementById(
        'importTitle'
      )
      .value
      .trim()
      ||
      'Imported Song';


  const artist=
    document
      .getElementById(
        'importArtist'
      )
      .value
      .trim()
      ||
      'Unknown Artist';


  const text=
    document
      .getElementById(
        'songText'
      )
      .value
      .trim();


  if(!text){

    document
      .getElementById(
        'analysisResult'
      )
      .innerHTML=
        '<div class="card">Paste lyrics/chords first.</div>';

    return;

  }


  const allowed=
    /^(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|bridge|tag|ad[- ]?lib|adlib|interlude|outro)$/i;


  const lines=
    text.split(
      /\r?\n/
    );


  const sections=[];

  let current='Verse 1';

  let bucket=[];


  function flush(){

    if(bucket.length){

      base[current]=bucket;

      sections.push(current);

      bucket=[];

    }

  }


  for(const raw of lines){

    let line=
      raw
        .replace(
          /\t/g,
          ' '
        )
        .trim();


    if(!line){
      continue;
    }


    const marker=
      line
        .replace(
          /^\[|\]$/g,
          ''
        )
        .replace(
          /:$/,
          ''
        )
        .trim();


    if(
      allowed.test(marker)
    ){

      flush();

      current=
        normalizeSection(
          marker
        );

      continue;

    }


    const chordMatch=
      line.match(
        /^[A-G](?:#|b)?(?:m|maj|min|sus|add|dim|aug|7|9|11|13|6|2|4)?(?:\/[A-G](?:#|b)?)?/i
      );


    const chord=
      chordMatch
      ?
      chordMatch[0]
      :
      '';


    let lyric=line;


    if(
      chord &&
      line
        .toLowerCase()
        .startsWith(
          chord.toLowerCase()
        )
    ){

      lyric=
        line
          .slice(
            chord.length
          )
          .trim();

    }


    bucket.push([
      chord,
      lyric
    ]);

  }


  flush();


  if(!sections.length){

    base['Verse 1']=
      lines
        .filter(Boolean)
        .map(
          x=>[
            '',
            x.trim()
          ]
        );


    sections.push(
      'Verse 1'
    );

  }


  arrangement=
    sections;


  activeSection=
    arrangement[0] ||
    '';


  currentSongTitle=
    title;


  currentArtist=
    artist;


  currentKey=
    detectKey();


  compactChordOnlyLines();


  document
    .getElementById(
      'analysisResult'
    )
    .innerHTML=`

      <div class="card">

        <b>
          Detected structure
        </b>


        <div
          class="muted"
          style="
            margin:7px 0 12px
          "
        >

          ${sections.length}
          sections •

          ${sections
            .map(esc)
            .join(' • ')}

        </div>


        ${
          sections
            .map(
              (s,i)=>`

                <div class="item">

                  <div class="itemmain">

                    <b>
                      ${i+1}. ${esc(s)}
                    </b>


                    <span>
                      ${base[s].length} lines
                    </span>

                  </div>

                </div>

              `
            )
            .join('')
        }


        <button
          class="btn primary"
          style="
            width:100%;
            margin-top:8px
          "
          onclick="finishImport()"
        >
          ✓ Open Analyzed Song
        </button>

      </div>

    `;

}


/* =========================================================
   KEY DETECTION
   ========================================================= */

function detectKey(){

  for(const p of arrangement){

    for(const [c] of base[p]){

      if(!c){
        continue;
      }


      const m=
        c.match(
          /^([A-G](?:#|b)?)/i
        );


      if(m){

        return normalizeNote(
          m[1]
        );

      }

    }

  }


  return 'C';

}


/* =========================================================
   COMPACT CHORD ONLY LINES
   ========================================================= */

function compactChordOnlyLines(){

  for(
    const p of Object.keys(base)
  ){

    const out=[];

    let pending=[];


    const flush=()=>{

      if(
        pending.length
      ){

        out.push([
          pending.join(' '),
          ''
        ]);


        pending=[];

      }

    };


    for(
      const item of base[p]
    ){

      if(
        item[0] &&
        !item[1]
      ){

        pending.push(
          item[0].trim()
        );

      }
      else{

        flush();

        out.push(
          item
        );

      }

    }


    flush();


    base[p]=out;

  }

}


/* =========================================================
   FINISH IMPORT
   ========================================================= */

function finishImport(){

  closeModal();

  showTab('song');

  renderSong();

  saveLocal();

  toast(

  );

}


/* =========================================================
   TRANSPOSE SYSTEM
   =========================================================

   EXACT CHROMATIC ORDER REQUESTED:

   C  → C#
   C# → D
   D  → D#
   D# → E
   E  → F
   F  → F#
   F# → G
   G  → G#
   G# → A
   A  → Bb
   Bb → B
   B  → C

   This fixes the previous problem where the object
   key order could cause incorrect enharmonic results.
   ========================================================= */


/* Canonical note order */

const chromaticNotes=[
  'C',
  'C#',
  'D',
  'D#',
  'E',
  'F',
  'F#',
  'G',
  'G#',
  'A',
  'Bb',
  'B'
];


/* Note values */

const semitones={
  'C':0,
  'B#':0,

  'C#':1,
  'Db':1,

  'D':2,

  'D#':3,
  'Eb':3,

  'E':4,
  'Fb':4,

  'F':5,
  'E#':5,

  'F#':6,
  'Gb':6,

  'G':7,

  'G#':8,
  'Ab':8,

  'A':9,

  'A#':10,
  'Bb':10,

  'B':11,
  'Cb':11
};


/* =========================================================
   NORMALIZE NOTE
   ========================================================= */

function normalizeNote(note){

  if(!note){
    return 'C';
  }


  note=
    note
      .trim()
      .replace(
        '♯',
        '#'
      )
      .replace(
        '♭',
        'b'
      );


  const value=
    semitones[note];


  if(value===undefined){
    return note;
  }


  return chromaticNotes[value];

}


/* =========================================================
   TRANSPOSE MODAL
   ========================================================= */

function transpose(){

  document
    .getElementById(
      'modal'
    )
    .style
    .display='flex';


  document
    .getElementById(
      'modalBody'
    )
    .innerHTML=`

      <div class="row">

        <h2>
          Transpose
        </h2>


        <button
          class="btn"
          onclick="closeModal()"
        >
          Close
        </button>

      </div>


      <div
        class="muted"
        style="
          margin-bottom:12px
        "
      >
        Current key:
        <b>${esc(currentKey)}</b>
      </div>


      <div class="keygrid">

        ${
          chromaticNotes
            .map(k=>`

              <button
                class="keybtn"
                onclick="
                  applyTranspose(
                    '${k}'
                  )
                "
              >
                ${k}
              </button>

            `)
            .join('')
        }

      </div>

    `;

}


/* =========================================================
   TRANSPOSE CHORD
   ========================================================= */

function transposeChord(
  chord,
  interval
){

  if(!chord){
    return chord;
  }


  /*
    Correct regex:

    Captures:
    1 = root note
    2 = rest of chord

    Examples:

    Am   -> A + m
    C#m7 -> C# + m7
    G/B  -> G + /B
    Bb   -> Bb + ''
  */

  const m=
    chord.match(
      /^([A-G](?:#|b)?)(.*)$/i
    );


  if(!m){
    return chord;
  }


  const root=
    normalizeNote(
      m[1]
    );


  if(
    semitones[root]===
    undefined
  ){

    return chord;

  }


  const newValue=
    (
      semitones[root]+
      interval+
      12
    )%12;


  const newRoot=
    chromaticNotes[
      newValue
    ];


  let suffix=
    m[2];


  /*
    Also transpose slash-bass notes.

    Example:

    C/G + 2
    becomes
    D/A
  */

  suffix=
    suffix.replace(
      /\/([A-G](?:#|b)?)/g,
      (full,bass)=>{

        const bassRoot=
          normalizeNote(
            bass
          );


        if(
          semitones[bassRoot]===
          undefined
        ){

          return full;

        }


        const newBassValue=
          (
            semitones[bassRoot]+
            interval+
            12
          )%12;


        return '/' +
          chromaticNotes[
            newBassValue
          ];

      }
    );


  return newRoot+suffix;

}


/* =========================================================
   APPLY TRANSPOSE
   ========================================================= */

function applyTranspose(
  target
){

  target=
    normalizeNote(
      target
    );


  const current=
    normalizeNote(
      currentKey
    );


  if(
    semitones[target]===
    undefined ||
    semitones[current]===
    undefined
  ){

    toast(
      'Invalid key'
    );

    return;

  }


  /*
    IMPORTANT:

    Calculate interval numerically.

    C = 0
    D = 2

    Therefore:

    2 - 0 = 2 semitones

    C -> D

    NOT Db.
  */

  const interval=
    (
      semitones[target]-
      semitones[current]+
      12
    )%12;


  /*
    Transpose every chord.
  */

  Object.keys(base)
    .forEach(p=>{

      base[p]=
        base[p].map(
          ([c,l])=>{

            return [
              transposeChord(
                c,
                interval
              ),
              l
            ];

          }
        );

    });


  currentKey=
    target;


  closeModal();

  renderSong();


  toast(
    'Transposed to '+
    target
  );

}

/* =========================================================
   SAVE
   ========================================================= */

function saveLocal(
  show=true
){

  try{

    localStorage.setItem(
      'worshipChordsApp',
      JSON.stringify({

        base,

        arrangement,

        size,

        setlist,

        currentSongTitle,

        currentArtist,

        currentKey,

        activeSection

      })
    );


    if(show){

      toast(
        'Saved locally'
      );

    }

  }
  catch(e){

    if(show){

      toast(
        'Could not save'
      );

    }

  }

}


/* =========================================================
   LOAD
   ========================================================= */

function loadLocal(){

  try{

    const d=
      JSON.parse(
        localStorage.getItem(
          'worshipChordsApp'
        ) ||
        'null'
      );


    if(!d){
      return;
    }


    if(d.base){

      Object.assign(
        base,
        d.base
      );

    }


    if(
      Array.isArray(
        d.arrangement
      ) &&
      d.arrangement.length
    ){

      arrangement=
        d.arrangement;

    }


    if(
      Array.isArray(
        d.setlist
      )
    ){

      setlist=
        d.setlist;

    }


    if(d.size){

      size=
        d.size;

    }


    if(
      d.currentSongTitle
    ){

      currentSongTitle=
        d.currentSongTitle;

    }


    if(
      d.currentArtist
    ){

      currentArtist=
        d.currentArtist;

    }


    if(d.currentKey){

      currentKey=
        normalizeNote(
          d.currentKey
        );

    }


    if(
      d.activeSection &&
      arrangement.includes(
        d.activeSection
      )
    ){

      activeSection=
        d.activeSection;

    }
    else{

      activeSection=
        arrangement[0] ||
        '';

    }


    compactChordOnlyLines();

  }
  catch(e){}

}


/* =========================================================
   TOAST
   ========================================================= */

function toast(m){

  const t=
    document.getElementById(
      'toast'
    );


  t.textContent=m;


  t.style.display=
    'block';


  setTimeout(
    ()=>{
      t.style.display=
        'none';
    },
    1700
  );

}


/* =========================================================
   START
   ========================================================= */

loadLocal();

renderSong();
