/*
  Manual, per-song reconcile — the Sync button on an individual
  song. Whichever side (this device or Drive) was edited more
  recently wins for THIS song only; nothing else in the Library
  is touched. Returns 'kept-local', 'took-remote', or
  'uploaded' so the caller can tell the user what happened.
*/

async function syncOneSong(localSong, opts){

  const silent = !!(opts && opts.silent);

  if(!getGoogleUser()){

    if(!silent){
      showToast(
        'Sign in first (Profile → Account).',
        'error'
      );
    }

    return null;

  }

  if(!(await ensureSyncSession())){

    if(!silent){
      showToast(
        'Couldn\'t reconnect automatically — ' +
        'tap Sign In again in Profile → Account, then try Sync.',
        'error'
      );
    }

    return null;

  }

  try{

    const remote =
      await downloadLibrary();

    const remoteIndex =
      remote.songs.findIndex(
        item => item.id === localSong.id
      );

    const remoteSong =
      remoteIndex === -1
        ? null
        : remote.songs[remoteIndex];

    let resultSong;
    let outcome;

    if(!remoteSong){

      resultSong = localSong;
      outcome = 'uploaded';

      remote.songs.unshift(resultSong);

    }else{

      const localTime =
        new Date(
          localSong.updatedAt ||
          localSong.savedAt ||
          0
        );

      const remoteTime =
        new Date(
          remoteSong.updatedAt ||
          remoteSong.savedAt ||
          0
        );

      if(localTime >= remoteTime){

        resultSong = localSong;
        outcome = 'kept-local';

      }else{

        resultSong = remoteSong;
        outcome = 'took-remote';

      }

      remote.songs[remoteIndex] =
        resultSong;

    }

    await uploadLibrary(
      {

        songs: remote.songs.slice(0,MAX_SONGS),

        tombstones: remote.tombstones

      }
    );


    const localSongs =
      getSongs();

    const localIndex =
      localSongs.findIndex(
        item => item.id === localSong.id
      );

    if(localIndex === -1){

      localSongs.unshift(resultSong);

    }else{

      localSongs[localIndex] =
        resultSong;

    }

    localStorage.setItem(
      'worshipChordsSongs',
      JSON.stringify(localSongs.slice(0,MAX_SONGS))
    );

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

    return { outcome, song: resultSong };

  }catch(error){

    console.error(error);

    setSyncStatus('error');

    if(!silent){
      showToast(
        'Sync failed — check your connection and try again.',
        'error'
      );
    }

    return null;

  }

}


/*
  Whole-library manual reconcile — Profile → Sync Now. Pulls,
  merges every song by most-recent-edit, applies deletes via
  tombstones, and pushes the result back. Purely opt-in: only
  runs when the person taps the button.
*/

async function performDriveSync(){

  if(!getGoogleUser()){

    return;

  }

  if(!(await ensureSyncSession())){

    setSyncStatus('error');

    alert(
      'Couldn\'t reconnect automatically — ' +
      'tap Sign In again in Profile → Account, then try Sync Now.'
    );

    return;

  }

  if(driveSyncInFlight){

    driveSyncQueued = true;
    return;

  }

  driveSyncInFlight = true;
  setSyncStatus('syncing');

  try{

    const remote =
      await downloadLibrary();

    const merged =
      mergeLibraryState(
        getSongs(),
        getTombstones(),
        remote.songs,
        remote.tombstones
      );

    /*
      Write straight to localStorage (not writeSongs/
      writeTombstones) so applying the merge doesn't itself
      schedule another sync loop.
    */

    localStorage.setItem(
      'worshipChordsSongs',
      JSON.stringify(merged.songs)
    );

    writeTombstones(merged.tombstones);

    await uploadLibrary(merged);

    setSyncStatus(
      'synced',
      new Date().toISOString()
    );

    if(
      document.getElementById('screen') &&
      screen.querySelector('.librarySection')
    ){

      renderLibrary();

    }

  }catch(error){

    console.error(error);

    setSyncStatus('error');

  }finally{

    driveSyncInFlight = false;

    if(driveSyncQueued){

      driveSyncQueued = false;

      performDriveSync();

    }

  }

}

function profileInitials(name){

  const clean =
    (name || '').trim();

  if(!clean){

    return 'G';

  }

  return clean
    .split(/\s+/)
    .slice(0,2)
    .map(part => part[0])
    .join('')
    .toUpperCase();

}

    .getElementById('scrollSpeedUp')

          5,

        String(next);

    };


  /* ---------- Data management ---------- */

  document
    .getElementById('exportLibraryBtn')
    .onclick = () => {

      const blob =
        new Blob(
          [JSON.stringify(getSongs(), null, 2)],
          { type:'application/json' }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement('a');

      link.href = url;
      link.download =
        'disciples-library-backup.json';

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

    };

  const importFile =
    document.getElementById('importLibraryFile');

  document
    .getElementById('importLibraryBtn')
    .onclick = () => importFile.click();

  importFile.onchange = () => {

    const file =
      importFile.files[0];

    if(!file){

      return;

    }

    const reader =
      new FileReader();

    reader.onload = () => {

      const raw =
        String(reader.result || '');


      /*
        Figure out what kind of file this is by its content,
        not its extension — a renamed or re-saved file should
        still work. A JSON array is a full library backup
        (Export, above). Valid JSON that ISN'T an array is a
        JSON file, just not one of ours. Anything else is
        treated as a single song exported as plain text
        (Export as Text, from a song's ⋮ menu).
      */

      let backupSongs = null;
      let wasValidJson = false;

      try{

        const candidate =
          JSON.parse(raw);

        wasValidJson = true;

        if(Array.isArray(candidate)){

          backupSongs = candidate;

        }

      }catch(error){

        wasValidJson = false;

      }


      try{

        if(backupSongs){

          const existing =
            getSongs();

          const existingIds =
            new Set(
              existing.map(item => item.id)
            );

          const merged =
            existing.concat(
              backupSongs.filter(
                item =>
                  item &&
                  item.id &&
                  !existingIds.has(item.id)
              )
            );

          writeSongs(
            merged.slice(0,MAX_SONGS)
          );

          showToast(
            'Backup imported into your Library.',
            'success'
          );

        }else if(wasValidJson){

          throw new Error(
            'This JSON file is not a valid library backup.'
          );

        }else{

          const parsed =
            parseSongTextFile(raw);

          if(parsed.type === 'merged'){

            const hasLyrics =
              parsed.parts.some(
                part => part.text.trim()
              );

            if(!hasLyrics){

              throw new Error(
                'No lyrics found in this file.'
              );

            }

            const combinedTitle =
              parsed.parts
                .map(part => part.title)
                .join(' + ')
                .slice(0,120);

            const merged =
              saveMergedSongParts(
                combinedTitle,
                parsed.parts
              );

            showToast(
              'Imported ' + parsed.parts.length +
              ' songs merged into "' + merged.title + '".',
              'success'
            );

          }else{

            if(!parsed.text.trim()){

              throw new Error(
                'No lyrics found in this file.'
              );

            }

            saveSong(
              parsed.title,
              parsed.text
            );

            showToast(
              '"' + parsed.title + '" imported into your Library.',
              'success'
            );

          }

        }

        renderProfile();

      }catch(error){

        showToast(
          'That file could not be imported: ' +
          error.message,
          'error'
        );

      }finally{

        importFile.value = '';

      }

    };

    reader.readAsText(file);

  };

  document
    .getElementById('clearRecentBtn')
    .onclick = async () => {

      const confirmed =
        await showConfirmDialog(
          'Clear your Recently Viewed list? Your Library is not affected.',
          { confirmLabel:'Clear', danger:true }
        );

      if(!confirmed){

        return;

      }

      writeRecentViews([]);

      renderProfile();

    };

  document
    .getElementById('clearLibraryBtn')
    .onclick = async () => {

      const confirmed =
        await showConfirmDialog(
          'Delete every saved song from your Library? This cannot be undone.',
          { confirmLabel:'Delete All', danger:true }
        );

      if(!confirmed){

        return;

      }

      recordDeletedSongs(
        getSongs().map(song => song.id)
      );

      writeSongs([]);

      renderProfile();

    };

}

/*
  Handles a file chosen from the Lyrics page's "Import Song"
  button. Reuses the same parseSongTextFile() the Profile
  screen's "Import Backup" uses, so this recognizes the exact
  same things: a plain single song, a song exported with the
  Title: "X" marker, or — if the file has more than one Title:
  marker — a merged song, which gets reconstructed as a proper
  paginated merge (mergeParts) rather than one flat blob. Saves
  straight to the Library and opens it immediately, since this
  entry point is about getting a song in front of you to read,
  not just filing it away.
*/

function handleLyricsImportFile(inputEl){

  const file =
    inputEl.files[0];

  if(!file){

    return;

  }

  const reader =
    new FileReader();

  reader.onload = () => {

    const raw =
      String(reader.result || '');

    try{

      const parsed =
        parseSongTextFile(raw);

      if(parsed.type === 'merged'){

        const hasLyrics =
          parsed.parts.some(
            part => part.text.trim()
          );

        if(!hasLyrics){

          throw new Error(
            'No lyrics found in this file.'
          );

        }

        const combinedTitle =
          parsed.parts
            .map(part => part.title)
            .join(' + ')
            .slice(0,120);

        const merged =
          saveMergedSongParts(
            combinedTitle,
            parsed.parts
          );

        showToast(
          'Imported ' + parsed.parts.length +
          ' songs merged into "' + merged.title + '".',
          'success'
        );

        openSong(merged);

      }else{

        if(!parsed.text.trim()){

          throw new Error(
            'No lyrics found in this file.'
          );

        }

        const song =
          saveSong(
            parsed.title,
            parsed.text
          );

        showToast(
          '"' + song.title + '" imported into your Library.',
          'success'
        );

        openSong(song);

      }

    }catch(error){

      showToast(
        'That file could not be imported: ' +
        error.message,
        'error'
      );

    }finally{

      inputEl.value = '';

    }

  };

  reader.readAsText(file);

}


/* =========================================================
   SONG SECTION PARSER
========================================================= */

function parseSections(text){

  const lines =
    String(text || '')
      .split(/\r?\n/);


  const sections = [];


  let current = {

    name:'Song',

    lines:[]

  };


  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;


  lines.forEach(line => {

    const clean =
      line.trim();


    const match =
      clean.match(
        sectionPattern
      );


    if(match){

      if(
        current.lines.length ||
        current.name !== 'Song'
      ){

        sections.push(
          current
        );

      }


      current = {

        name:
          clean
            .replace(/^\[\s*/, '')
            .replace(/\s*\]$/, '')
            .replace(/:$/, '')
            .trim(),

        lines:[]

      };

    }else{

      current.lines.push(
        line
      );

    }

  });


  if(
    current.lines.length ||
    !sections.length
  ){

    sections.push(
      current
    );

  }


  return sections;

}


/* =========================================================
   CHORD ENGINE
========================================================= */

/*
  Chord matching is deliberately stricter than ordinary
  word matching so normal lyric words are not treated as chords.

  Supports:

  C
  C#
  Db
  Cm
  Cmin
  Cmaj7
  C7
  Cdim
  Caug
  Csus2
  Cadd9
  C7#9
  Cb5
  C/E
  F#/A#
  Bbmaj7/D
*/

const CHORD_TOKEN_REGEX =
  /^[A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?$/;


function isChordToken(token){

  if(!token){

    return false;

  }


  const clean =
    token
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );


  if(
    !CHORD_TOKEN_REGEX.test(
      clean
    )
  ){

    return false;

  }


  /*
    Avoid treating common lyric words such as:
    A
    I
    Am
    etc. incorrectly.

    Single-letter A-G are valid chords.
    More complex forms are accepted by regex.
  */

  return true;

}


function findChords(line){

  const matches = [];


  const tokenRegex =
    /(?:^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  let match;


  while(
    (match =
      tokenRegex.exec(line))
  ){

    const chord =
      match[1];


    if(
      isChordToken(chord)
    ){

      matches.push(
        chord
      );

    }

  }


  return [
    ...new Set(matches)
  ];

}


function isChordOnlyLine(line){

  const clean =
    String(line || '')
      .trim();


  if(!clean){

    return false;

  }


  const tokens =
    clean
      .split(/[^A-Za-z0-9#\/]+/)
      .filter(Boolean);


  if(!tokens.length){

    return false;

  }


  /*
    Ultimate Guitar's rhythm-slash bar notation writes a chord
    line like "G / / | Bm / / | Em / / | C / / |" — each "/"
    means "hold the previous chord for a beat" and "|" marks a
    bar line. "|" is already stripped out entirely by the split
    above (it isn't in the keep-set), but a bare "/" survives as
    its own token — and isChordToken() rejects it, since it
    doesn't start with a note letter. Without this, a line like
    that fails the "every token is a chord" check below and
    gets misread as a lyric line instead of a chord line.
  */

  return tokens.every(
    token =>
      /^\/+$/.test(token) ||
      isChordToken(token)
  );

}


/* =========================================================
   KEY DETECTION

   Guesses the song's key by matching the chords used
   against the diatonic chord set of each of the 24 major/
   minor keys, weighted by how often each chord appears.
   The most likely tonic (first/last chord in the song) gets
   a small bonus, since songs overwhelmingly start or end on
   the tonic chord.
========================================================= */

const MAJOR_SCALE_STEPS =
  [0,2,4,5,7,9,11];

const MAJOR_KEY_QUALITIES =
  ['major','minor','minor','major','major','minor','diminished'];

const MINOR_SCALE_STEPS =
  [0,2,3,5,7,8,10];

const MINOR_KEY_QUALITIES =
  ['minor','diminished','major','minor','minor','major','major'];


function chordQualityFromSuffix(suffix){

  const clean =
    String(suffix || '');

  if(/^dim/i.test(clean)) return 'diminished';
  if(/^aug/i.test(clean)) return 'augmented';
  if(/^maj/i.test(clean)) return 'major';
  if(/^min/i.test(clean)) return 'minor';

  /*
    Lone "m"/"M" is ambiguous by design elsewhere (both are
    accepted as valid chord tokens), but for key detection
    the case matters: lowercase m ("Dm","Dm7") is minor,
    uppercase M ("DM7") is shorthand for a major 7th.
  */
  if(clean[0] === 'm') return 'minor';
  if(clean[0] === 'M') return 'major';

  /* Plain root, dominant 7ths, sus/add chords: major-rooted. */
  return 'major';

}


function parseChordRootQuality(token){

  const clean =
    String(token || '')
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );

  const mainChord =
    clean.split('/')[0];

  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );

  if(!match){

    return null;

  }

  const root =
    normalizeNote(
      match[1]
    );

  const rootIndex =
    chromatic.indexOf(root);

  if(rootIndex === -1){

    return null;

  }

  return {

    root:rootIndex,

    quality:
      chordQualityFromSuffix(
        match[2]
      )

  };

}


function buildKeyChordMap(rootIndex, isMinor){

  const steps =
    isMinor
      ? MINOR_SCALE_STEPS
      : MAJOR_SCALE_STEPS;

  const qualities =
    isMinor
      ? MINOR_KEY_QUALITIES
      : MAJOR_KEY_QUALITIES;

  const map = new Map();

  steps.forEach((step,index) => {

    const noteIndex =
      (rootIndex + step) % 12;

    if(!map.has(noteIndex)){

      map.set(noteIndex, new Set());

    }

    map.get(noteIndex).add(
      qualities[index]
    );

  });

  if(isMinor){

    /*
      Harmonic-minor borrowed dominant (V major instead of
      the natural-minor v). Extremely common in worship/pop
      songs written in a minor key.
    */
    const dominantIndex =
      (rootIndex + 7) % 12;

    if(!map.has(dominantIndex)){

      map.set(dominantIndex, new Set());

    }

    map.get(dominantIndex).add('major');

  }

  return map;

}


function detectKeyFromChords(chordTokens){

  const frequency = {};

  let firstChord = null;
  let lastChord = null;

  (chordTokens || []).forEach(token => {

    frequency[token] =
      (frequency[token] || 0) + 1;

    if(!firstChord){

      firstChord = token;

    }

    lastChord = token;

  });

  const entries =
    Object.keys(frequency)
      .map(token => ({

        weight:frequency[token],

        parsed:
          parseChordRootQuality(token)

      }))
      .filter(entry => entry.parsed);

  if(!entries.length){

    return null;

  }

  const totalWeight =
    entries.reduce(
      (sum,entry) => sum + entry.weight,
      0
    );

  const firstParsed =
    firstChord
      ? parseChordRootQuality(firstChord)
      : null;

  const lastParsed =
    lastChord
      ? parseChordRootQuality(lastChord)
      : null;

  let best = null;

  for(let rootIndex = 0; rootIndex < 12; rootIndex++){

    [false,true].forEach(isMinor => {

      const keyMap =
        buildKeyChordMap(
          rootIndex,
          isMinor
        );

      let matchedWeight = 0;

      entries.forEach(entry => {

        const allowed =
          keyMap.get(
            entry.parsed.root
          );

        if(
          allowed &&
          allowed.has(
            entry.parsed.quality
          )
        ){

          matchedWeight +=
            entry.weight;

        }

      });

      let score =
        matchedWeight / totalWeight;

      const tonicQuality =
        isMinor
          ? 'minor'
          : 'major';

      if(
        firstParsed &&
        firstParsed.root === rootIndex &&
        firstParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(
        lastParsed &&
        lastParsed.root === rootIndex &&
        lastParsed.quality === tonicQuality
      ){

        score += 0.15;

      }

      if(!best || score > best.score){

        best = {rootIndex,isMinor,score};

      }

    });

  }

  const tonicName =
    chromatic[best.rootIndex];

  return {

    tonic:tonicName,

    mode:
      best.isMinor
        ? 'minor'
        : 'major',

    label:
      best.isMinor
        ? tonicName + 'm'
        : tonicName

  };

}


/*
  Suggests a capo position that lets a guitarist play open,
  beginner-friendly chord shapes instead of the song's actual
  (harder) key — e.g. key of D# suggested as "Capo 1, play in D".
  Returns null when the key is already one of those easy shapes,
  or when no easy shape is within a practical 7-fret reach.
*/
function getCapoSuggestion(keyInfo){

  if(!keyInfo)return null;

  const isMinor =
    keyInfo.mode === 'minor';

  const easyShapes =
    isMinor
      ? ['Am','Em','Dm']
      : ['C','D','G','A','E'];

  const shapeRoots =
    easyShapes.map(shape =>
      isMinor ? shape.slice(0,-1) : shape
    );

  const tonicIndex =
    chromatic.indexOf(keyInfo.tonic);

  if(tonicIndex === -1)return null;

  if(shapeRoots.includes(keyInfo.tonic))return null;

  let best = null;

  shapeRoots.forEach((shapeRoot, i) => {

    const shapeIndex =
      chromatic.indexOf(shapeRoot);

    if(shapeIndex === -1)return;

    const fret =
      ((tonicIndex - shapeIndex) % 12 + 12) % 12;

    if(fret > 0 && fret <= 7){

      if(!best || fret < best.fret){

        best = { fret, shape: easyShapes[i] };

      }

    }

  });

  return best;

}


function extractChordTokens(text){

  return String(text || '')
    .split(/\r?\n/)
    .flatMap(findChords);

}


/* =========================================================
   ANALYZER
========================================================= */

function guessTitleFromText(text){

  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;

  const lines =
    String(text || '').split(/\r?\n/);

  for(const rawLine of lines){

    const line = rawLine.trim();

    if(!line)continue;
    if(sectionPattern.test(line))continue;
    if(isChordOnlyLine(line))continue;

    return line.slice(0,80);

  }

  return '';

}

function analyzeFocusedSong(text){

  const sections =
    parseSections(text);


  const analyzedSections =
    sections.map(section => {

      const lines =
        section.lines.map(line => {

          const chords =
            findChords(line);


          return {

            text:line,

            chords

          };

        });


      return {

        name:
          section.name,

        lines,

        chords:[
          ...new Set(
            lines.flatMap(
              line =>
                line.chords
            )
          )

        ]

      };

    });


  return {

    rawText:text,

    sections:
      analyzedSections,

    chords:[
      ...new Set(
        analyzedSections.flatMap(
          section =>
            section.chords
        )
      )

    ],

    key:
      detectKeyFromChords(
        extractChordTokens(text)
      )

  };

}


/* =========================================================
   LYRIC CASING

   Lyrics pasted from sites like Ultimate Guitar sometimes come
   in as SHOUTING ALL CAPS. When a lyric line is entirely
   uppercase, this converts it to normal sentence case for
   display. Lines that are already normal/mixed case are left
   untouched.

   A small list of words always keeps a fixed casing regardless
   of the source formatting or whether the line was all caps.
========================================================= */

const LYRIC_CASE_EXCEPTIONS = [
  { match:/\bdiyos\b/gi, replace:'Diyos' },
  { match:/\byahweh\b/gi, replace:'YAHWEH' },
  { match:/\bpanginoon\b/gi, replace:'Panginoon' },
  { match:/\blord\b/gi, replace:'Lord' },
  { match:/\bgod\b/gi, replace:'God' },
  { match:/\byeshua\b/gi, replace:'Yeshua' },
  { match:/\badonai\b/gi, replace:'Adonai' },
  { match:/\bfather\b/gi, replace:'Father' },
  { match:/\bjesus\b/gi, replace:'Jesus' }
];


function isShoutingLine(text){

  const letters =
    String(text || '')
      .replace(/[^A-Za-z]/g,'');

  if(letters.length < 2){
    return false;
  }

  return (
    letters === letters.toUpperCase() &&
    letters !== letters.toLowerCase()
  );

}


function toSentenceCase(text){

  let result =
    text.toLowerCase();

  /* Capitalize the first letter of the line. */
  result =
    result.replace(
      /^([^A-Za-z]*)([a-z])/,
      (match,lead,letter) => lead + letter.toUpperCase()
    );

  /* Capitalize the first letter after ., ! or ? */
  result =
    result.replace(
      /([.!?]\s+)([a-z])/g,
      (match,punct,letter) => punct + letter.toUpperCase()
    );

  return result;

}


function applyLyricCaseExceptions(text){

  let result = text;

  LYRIC_CASE_EXCEPTIONS.forEach(rule => {

    result =
      result.replace(
        rule.match,
        rule.replace
      );

  });

  return result;

}


function normalizeLyricCasing(text){

  if(!text) return text;

  let result = text;

  if(isShoutingLine(text)){
    result = toSentenceCase(result);
  }

  return applyLyricCaseExceptions(result);

}


/* =========================================================
   RENDER ANALYSIS
========================================================= */

function formatAnalysisLine(line){

  if(
    isChordOnlyLine(
      line.text
    )
  ){

    return `<div class="songLine chordLine">${esc(line.text)}</div>`;

  }


  const displayText =
    line.chords.length
      ? line.text
      : normalizeLyricCasing(line.text);


  let html =
    esc(displayText);


  line.chords
    .forEach(chord => {

      const safe =
        esc(chord);


      html =
        html.replace(
          new RegExp(
            `(^|[^A-Za-z0-9#\\/])(${escapeRegExp(chord)})(?=[^A-Za-z0-9#\\/]|$)`,
            'g'
          ),
          `$1<span class="detectedChord">$2</span>`
        );

    });


  return `<div class="songLine lyricLine">${html || '&nbsp;'}</div>`;

}


function escapeRegExp(value){

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

}

/* =========================================================
   TRANSPOSE ENGINE
========================================================= */

const chromatic = [

  'C',
  'C#',
  'D',
  'D#',
  'E',
  'F',
  'F#',
  'G',
  'G#',
  'A',
  'A#',
  'B'

];


const flatToSharp = {

  Db:'C#',
  Eb:'D#',
  Gb:'F#',
  Ab:'G#',
  Bb:'A#'

};


function normalizeNote(note){

  return (
    flatToSharp[note] ||
    note
  );

}


function transposeNote(
  note,
  amount
){

  const normalized =
    normalizeNote(note);


  const index =
    chromatic.indexOf(
      normalized
    );


  if(index === -1){

    return note;

  }


  const newIndex =
    (
      (index + amount) % 12 +
      12
    ) % 12;


  return chromatic[newIndex];

}


function transposeChord(
  chord,
  amount
){

  const slashParts =
    chord.split('/');


  let mainChord =
    slashParts[0];


  let bassNote =
    slashParts[1];


  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if(!match){

    return chord;

  }


  const root =
    match[1];


  const suffix =
    match[2];


  const newRoot =
    transposeNote(
      root,
      amount
    );


  let result =
    newRoot +
    suffix;


  if(bassNote){

    bassNote =
      transposeNote(
        bassNote,
        amount
      );


    result +=
      '/' +
      bassNote;

  }


  return result;

}


function transposeText(
  text,
  amount
){

  if(!amount){

    return text;

  }


  /*
    Matches chord-like tokens including:
    Fdim
    F#dim
    E7#9
    Cmaj7
    G/B
    Bb
  */

  const regex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/gm;


  return text.replace(
    regex,
    (
      full,
      prefix,
      chord
    ) => {

      if(
        !isChordToken(chord)
      ){

        return full;

      }


      return (
        prefix +
        transposeChord(
          chord,
          amount
        )
      );

    }
  );

}

function openSong(song){

  currentSong =

    );


  currentSong.text =
    currentSong.originalText;


  modal.classList.remove('open');

  ){

      currentSong.text || '';

  }


  if(
    typeof currentSong.transposeSteps !==
    'number'
  ){

    currentSong.transposeSteps =
      0;

  }


  if(
    typeof currentSong.fontSize !==
    'number'
  ){

    currentSong.fontSize =
      getSettings().defaultFontSize;

  }


  /*
    Track this as a recently viewed song regardless of whether
    it's saved to the Library — that's what "Recent" means now.
  */

  recordRecentView(currentSong);


  renderSongViewer();

}


function getViewerSections(song, displayedText){
  const parsed = parseSections(displayedText);
  const normalized = parsed.map((section,index) => ({...section,_id:String(index)+'|'+String(section.name||'Section').trim().toLowerCase()}));
  const savedOrder = Array.isArray(song.sectionOrder) ? song.sectionOrder : [];
  if(!savedOrder.length){ song.sectionOrder=normalized.map(section=>section._id); return normalized; }
  const byId=new Map(normalized.map(section=>[section._id,section]));
  const ordered=[];
  savedOrder.forEach(id=>{const section=byId.get(id);if(section){ordered.push(section);byId.delete(id);}});
  normalized.forEach(section=>{if(byId.has(section._id)) ordered.push(section);});
  song.sectionOrder=ordered.map(section=>section._id);
  return ordered;
}

function persistSectionOrder(){
  if(!currentSong)return;
  const songs=getSongs();
  const index=songs.findIndex(item=>item.id===currentSong.id);
  if(index!==-1){songs[index]=currentSong;writeSongs(songs.slice(0,MAX_SONGS));}
}

function reorderViewerSections(fromIndex,toIndex){
  if(!currentSong||fromIndex===toIndex)return;
  const isMerged=Array.isArray(currentSong.mergeParts)&&currentSong.mergeParts.length>1;
  const target=isMerged?currentSong.mergeParts[clampMergedPartIndex(currentSong)]:currentSong;
  const amount=(isMerged?target.transposeSteps:currentSong.transposeSteps)||0;
  const displayedText=transposeText(target.originalText||target.text||'',amount);
  const sections=getViewerSections(target,displayedText);
  if(fromIndex<0||toIndex<0||fromIndex>=sections.length||toIndex>=sections.length)return;
  const moved=sections.splice(fromIndex,1)[0];
  sections.splice(toIndex,0,moved);
  target.sectionOrder=sections.map(section=>section._id);
  persistSectionOrder();
  renderSongViewer();
}


/* =========================================================
   SONG FLOW

   A separate arrangement layer on top of the parsed sections —
   an ordered list that can repeat a section (Chorus twice,
   Verse 1 again) and interleave free-text notes for the Music
   Director, without duplicating any actual lyrics/chords data.
   Each flow item just references a section by its _id, so
   editing that section's content anywhere updates every place
   it's used in the flow automatically.

   Until the person actually edits the flow for a song, nothing
   is persisted — Chords/Lyrics keeps behaving exactly as before
   (this is fully backward-compatible with every existing song).
   The moment they touch the Flow tab, a real `flow` array is
   saved and from then on Chords/Lyrics renders THAT arrangement
   — repeats, notes, and all — instead of the plain unique list.
========================================================= */

function getFlowTarget(song){

  if(
    Array.isArray(song.mergeParts) &&
    song.mergeParts.length > 1
  ){
    return song.mergeParts[clampMergedPartIndex(song)];
  }

  return song;

}


function getSongFlow(target, sections){

  if(
    Array.isArray(target.flow) &&
    target.flow.length
  ){
    return target.flow;
  }

  return sections.map(section => ({
    id: 'flow-' + section._id + '-' + Math.random().toString(36).slice(2,7),
    type: 'section',
    sectionId: section._id
  }));

}


function persistSongFlow(target, flow){

  if(!currentSong)return;

  target.flow = flow;

  currentSong.updatedAt =
    new Date().toISOString();

  const songs = getSongs();

  const index =
    songs.findIndex(item => item.id === currentSong.id);

  if(index !== -1){
    songs[index] = currentSong;
    writeSongs(songs.slice(0, MAX_SONGS));
  }

}


function getExpandedDisplayBlocks(sections, flow){

  const byId =
    new Map(sections.map(section => [section._id, section]));

  const blocks = [];

  /* Extra transpose offset in effect at this point in the flow.
     A section item can carry keyChangeSteps, which resets this
     value from that position onward — including through later
     repeats of the same (or a different) section — until either
     the flow ends or another keyChangeSteps point overrides it.
     This lets one song hold two or more different keys. */

  let currentExtra = 0;

  flow.forEach(item => {

    if(item.type === 'note'){

      blocks.push({
        isNote: true,
        id: item.id,
        text: item.text || ''
      });

      return;

    }

    if(typeof item.keyChangeSteps === 'number'){
      currentExtra = item.keyChangeSteps;
    }

    const section =
      byId.get(item.sectionId);

    if(section){

      const lines =
        currentExtra
          ? section.lines.map(line => transposeText(line, currentExtra))
          : section.lines;

      const hasKeyChange =
        typeof item.keyChangeSteps === 'number';

      const keyLabel =
        hasKeyChange
          ? (detectKeyFromChords(extractChordTokens(lines.join('\n'))) || {}).label
          : undefined;

      blocks.push({
        isNote: false,
        id: item.id,
        name: section.name,
        lines,
        lineNotes: Array.isArray(item.lineNotes) ? item.lineNotes : [],
        sideNote: item.sideNote || '',
        hasKeyChange,
        keyChangeSteps: currentExtra,
        keyChangeLabel: keyLabel
      });

    }

  });

  return blocks;

}

function moveFlowItem(flow, index, direction){

  const target = index + direction;

  if(target < 0 || target >= flow.length)return flow;

  const copy = flow.slice();

  const [item] = copy.splice(index, 1);

  copy.splice(target, 0, item);

  return copy;

}


function findFlowItem(flow, flowItemId){

  return flow.find(item => item.id === flowItemId);

}


function addLineNoteToFlow(flow, flowItemId, lineIndex, placement){

  return flow.map(item => {

    if(item.id !== flowItemId)return item;

    const lineNotes =
      Array.isArray(item.lineNotes) ? item.lineNotes.slice() : [];

    lineNotes.push({
      id: 'note-' + Math.random().toString(36).slice(2,7),
      lineIndex,
      placement,
      text: ''
    });

    return { ...item, lineNotes };

  });

}


function removeLineNoteFromFlow(flow, flowItemId, noteId){

  return flow.map(item => {

    if(item.id !== flowItemId)return item;

    return {
      ...item,
      lineNotes: (item.lineNotes || []).filter(note => note.id !== noteId)
    };

  });

}


function updateLineNoteTextInFlow(flow, flowItemId, noteId, text){

  return flow.map(item => {

    if(item.id !== flowItemId)return item;

    return {
      ...item,
      lineNotes: (item.lineNotes || []).map(note =>
        note.id === noteId ? { ...note, text } : note
      )
    };

  });

}

/*
  Shared by the Flow tab (interactive=true) and the real
  Chords/Lyrics display (interactive=false) — same markup for
  the lines themselves so an arrangement drawn in Flow mode
  looks identical to how it actually reads during a set,
  annotations included.
*/

function renderSectionLinesHTML(block, interactive){

  const lineNotes =
    block.lineNotes || [];

  return block.lines
    .map((line, lineIndex) => {

      if(line.trim() === '')return '';

      const aboveNotes =
        lineNotes.filter(note => note.lineIndex === lineIndex && note.placement === 'above');

      const besideNotes =
        lineNotes.filter(note => note.lineIndex === lineIndex && note.placement === 'beside');

      const aboveHTML =
        aboveNotes.map(note => interactive ? `
          <div class="flowLineNoteAbove" data-line-note-id="${esc(note.id)}">
            <textarea
              class="flowLineNoteInput"
              data-line-note-edit="${esc(note.id)}"
              placeholder="Note..."
              rows="1"
            >${esc(note.text)}</textarea>
            <button type="button" class="flowLineNoteDelete" data-line-note-delete="${esc(note.id)}" aria-label="Remove note">✕</button>
          </div>
        ` : (
          mdViewMode && note.text.trim()
            ? `<div class="mdNotePill mdNotePillAbove">${esc(note.text)}</div>`
            : ''
        )).join('');

      const lineHTML =
        isChordOnlyLine(line)
          ? `<div class="songLine chordLine">${esc(line)}</div>`
          : `<div class="songLine lyricLine">${formatViewerLine(line)}</div>`;

      const besideHTML =
        besideNotes.map(note => interactive ? `
          <span class="flowLineNoteBeside" data-line-note-id="${esc(note.id)}">
            <input
              class="flowLineNoteBesideInput"
              data-line-note-edit="${esc(note.id)}"
              value="${esc(note.text)}"
              placeholder="note"
            >
            <button type="button" class="flowLineNoteDelete" data-line-note-delete="${esc(note.id)}" aria-label="Remove note">✕</button>
          </span>
        ` : (
          mdViewMode && note.text.trim()
            ? `<span class="mdNotePill mdNotePillBeside">${esc(note.text)}</span>`
            : ''
        )).join('');

      const tapAttr =
        interactive ? ` data-flow-line-tap="${lineIndex}"` : '';

      return `${aboveHTML}<div class="flowLineWrap"${tapAttr}>${lineHTML}${besideHTML}</div>`;

    })
    .join('');

}


function flowSectionAccent(name){

  const key = (name || '').toLowerCase();

  if(key.includes('pre-chorus') || key.includes('prechorus'))return '#89ddff';
  if(key.includes('chorus'))return '#e6c98a';
  if(key.includes('verse'))return '#7aa2f7';
  if(key.includes('bridge'))return '#c792ea';
  if(key.includes('intro'))return '#9ece6a';
  if(key.includes('outro'))return '#f7768e';
  if(key.includes('tag') || key.includes('interlude') || key.includes('instrumental'))return '#7dcfff';

  return '#6b6b72';

}

      item.sideNote
        ? `<span class="flowSideNote" data-flow-sidenote-slot="${i}">${esc(item.sideNote)}<button type="button" class="flowSideNoteDelete" data-flow-sidenote-clear="${i}" aria-label="Remove note">✕</button></span>`
        : `<span class="flowSideNoteSlot" data-flow-sidenote-slot="${i}"></span>`;

    const keyChangeHTML =
      typeof item.keyChangeSteps === 'number'
        ? (() => {
            const detected =
              detectKeyFromChords(
                extractChordTokens(
                  section.lines.map(line => transposeText(line, item.keyChangeSteps)).join('\n')
                )
              );
            const label =
              detected
                ? detected.label
                : (item.keyChangeSteps > 0 ? '+' : '') + item.keyChangeSteps;
            return `<span class="flowKeyChangeBadge" data-flow-keychange-open="${i}">Key: ${esc(label)}</span>`;
          })()
        : '';

    html.push(`
      <div class="flowSectionCard" data-flow-index="${i}" data-flow-group="${i}:${end}" data-flow-jump="${i}" style="border-left:3px solid ${accent}75;">

        <div class="flowSectionHeader">
          <div class="flowSectionNameGroup">
            <div class="songSectionName">
              <span class="flowSectionDot" style="background:${accent};"></span>${esc(section.name)}${count > 1 ? `<span class="flowRepeatBadge">×${count}</span>` : ''}
            </div>
            ${sideNoteHTML}
            ${keyChangeHTML}
          </div>
          ${sectionControlsHTML}
        </div>

        <div class="flowKeyChangePanel" data-flow-keychange-panel="${i}" hidden></div>

      </div>
    `);

    i = end + 1;

  }

  return html.join('');

}


function jumpToFlowSection(index){

  songFlowMode = false;

  renderSongViewer();

  requestAnimationFrame(() => {

    const el =
      document.getElementById('section-' + index);

    if(!el)return;

    el.scrollIntoView({ behavior:'smooth', block:'start' });

    el.classList.add('flowJumpFlash');

    setTimeout(() => el.classList.remove('flowJumpFlash'), 1100);

  });

}


function attachFlowControls(target, flow, sections){

  /* Section cards keep their delete/duplicate controls hidden
     until the card is long-pressed — tapping elsewhere, or
     finishing an action, collapses it again on the next render.
     A double-tap jumps to that section in the Chords/Lyrics view. */

  const LONG_PRESS_MS = 420;
  const CONTROL_SELECTOR = '.flowDeleteBtn, .flowDupBtn, .flowDragHandle, .flowAddNoteInlineBtn, .flowSideNoteDelete, .flowSideNoteInput, .flowSideNoteConfirm, .flowSideNote, .flowKeyChangeBtn, .flowKeyChangeBadge, .flowKeyChangePanel';

  document.querySelectorAll('.flowSectionCard').forEach(card => {

    let pressTimer = null;
    let longPressed = false;

    const clear = () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    };

    card.addEventListener('pointerdown', (event) => {

      if(event.target.closest(CONTROL_SELECTOR))return;

      longPressed = false;

      clear();

      pressTimer = setTimeout(() => {

        document.querySelectorAll('.flowSectionCard.controlsRevealed').forEach(other => {
          if(other !== card)other.classList.remove('controlsRevealed');
        });

        card.classList.add('controlsRevealed');
        longPressed = true;

        if(navigator.vibrate)navigator.vibrate(8);

      }, LONG_PRESS_MS);

    });

    ['pointerup','pointerleave','pointercancel'].forEach(evt => {
      card.addEventListener(evt, clear);
    });

    card.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    card.addEventListener('click', (event) => {

      if(event.target.closest(CONTROL_SELECTOR))return;

      if(longPressed){
        longPressed = false;
        return;
      }

      if(card.classList.contains('controlsRevealed')){
        card.classList.remove('controlsRevealed');
      }

    });

    card.addEventListener('dblclick', (event) => {

      if(event.target.closest(CONTROL_SELECTOR))return;

      const jumpIndex = card.dataset.flowJump;

      if(jumpIndex !== undefined){
        jumpToFlowSection(Number(jumpIndex));
      }

    });

  });

  document.querySelectorAll('.flowDragHandle').forEach(handle => {

    handle.addEventListener('pointerdown', (event) => {

      event.preventDefault();
      event.stopPropagation();

      const card =
        handle.closest('.flowSectionCard, .flowBetweenNote');

      const list =
        document.getElementById('flowList');

      if(!card || !list)return;

      card.classList.add('dragging');

      const onMove = (moveEvent) => {

        const y = moveEvent.clientY;

        const siblings =
          [...list.children].filter(el => el !== card);

        let dropBefore = null;

        for(const sib of siblings){

          const rect = sib.getBoundingClientRect();

          if(y < rect.top + rect.height / 2){
            dropBefore = sib;
            break;
          }

        }

        if(dropBefore){
          list.insertBefore(card, dropBefore);
        }else{
          list.appendChild(card);
        }

      };

      const onUp = () => {

        document.removeEventListener('pointermove', onMove);

        card.classList.remove('dragging');

        const newFlow = [];

        [...list.children].forEach(el => {

          const range = (el.dataset.flowGroup || '').split(':');

          if(range.length !== 2)return;

          const start = Number(range[0]);
          const end = Number(range[1]);

          for(let idx = start; idx <= end; idx++){
            if(flow[idx])newFlow.push(flow[idx]);
          }

        });

        persistSongFlow(target, newFlow);

        renderSongViewer();

      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp, { once:true });

    });

  });

  document.querySelectorAll('[data-flow-duplicate]').forEach(btn => {

    btn.onclick = (event) => {

      event.stopPropagation();

      const index =
        Number(btn.dataset.flowDuplicate);

      const updated =
        flow.slice();

      const copy = {
        ...updated[index],
        id: 'flow-' + Math.random().toString(36).slice(2,9)
      };

      updated.splice(index + 1, 0, copy);

      persistSongFlow(target, updated);

      renderSongViewer();

    };

  });

  const openSideNoteEditor = (index) => {

    const card =
      document.querySelector(`.flowSectionCard[data-flow-jump="${index}"]`);

    const slot =
      card && card.querySelector(`[data-flow-sidenote-slot="${index}"]`);

    if(!slot)return;

    const current =
      (flow[index] && flow[index].sideNote) || '';

    slot.outerHTML = `
      <span class="flowSideNoteEditWrap" data-flow-sidenote-slot="${index}">
        <input type="text" class="flowSideNoteInput" data-flow-sidenote-input="${index}" placeholder="key change, cue...">
        <button type="button" class="flowSideNoteConfirm" data-flow-sidenote-confirm="${index}" aria-label="Save note">✓</button>
      </span>
    `;

    const inputEl =
      card.querySelector(`[data-flow-sidenote-input="${index}"]`);

    if(!inputEl)return;

    inputEl.value = current;

    inputEl.focus();
    inputEl.select();

    let committed = false;

    const commit = () => {

      if(committed)return;
      committed = true;

      const updated =
        flow.slice();

      updated[index] = {
        ...updated[index],
        sideNote: inputEl.value.trim()
      };

      persistSongFlow(target, updated);

      renderSongViewer();

    };

    inputEl.addEventListener('blur', commit);

    const confirmBtn =
      card.querySelector(`[data-flow-sidenote-confirm="${index}"]`);

    if(confirmBtn){
      confirmBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        commit();
      });
    }

    inputEl.addEventListener('keydown', (keyEvent) => {

      if(keyEvent.key === 'Enter'){
        keyEvent.preventDefault();
        inputEl.blur();
      }

      if(keyEvent.key === 'Escape'){
        committed = true;
        renderSongViewer();
      }

    });

  };

  document.querySelectorAll('[data-flow-sidenote-edit]').forEach(btn => {

    btn.onclick = (event) => {
      event.stopPropagation();
      openSideNoteEditor(Number(btn.dataset.flowSidenoteEdit));
    };

  });

  document.querySelectorAll('.flowSideNote').forEach(chip => {

    chip.addEventListener('click', (event) => {

      if(event.target.closest('.flowSideNoteDelete'))return;

      event.stopPropagation();

      openSideNoteEditor(Number(chip.dataset.flowSidenoteSlot));

    });

  });

  document.querySelectorAll('[data-flow-sidenote-clear]').forEach(btn => {

    btn.onclick = (event) => {

      event.stopPropagation();

      const index =
        Number(btn.dataset.flowSidenoteClear);

      const updated =
        flow.slice();

      updated[index] = {
        ...updated[index],
        sideNote: ''
      };

      persistSongFlow(target, updated);

      renderSongViewer();

    };

  });

  /* Change Key — revealed via the same long-press that shows
     the other section controls. Sets an extra transpose offset
     that takes effect starting at this exact point in the flow
     and carries forward (through repeats of any section) until
     either the song ends or another Change Key point overrides
     it. Lets one song hold two (or more) different keys. */

  const openKeyChangeEditor = (index) => {

    const panel =
      document.querySelector(`[data-flow-keychange-panel="${index}"]`);

    if(!panel)return;

    const hasExisting =
      typeof flow[index].keyChangeSteps === 'number';

    let value =
      hasExisting ? flow[index].keyChangeSteps : 0;

    const draw = () => {

      panel.hidden = false;

      const targetSection =
        sections.find(section => section._id === flow[index].sectionId);

      const detected =
        targetSection
          ? detectKeyFromChords(
              extractChordTokens(
                targetSection.lines.map(line => transposeText(line, value)).join('\n')
              )
            )
          : null;

      const keyPreview =
        detected ? ` (${esc(detected.label)})` : '';

      panel.innerHTML = `
        <div class="flowKeyChangeControls">
          <span class="flowKeyChangeLabel">Key change from here — carries to the end unless changed again</span>
          <div class="transposeGroup">
            <button type="button" class="toolbarBtn" data-kc-down>−</button>
            <button type="button" class="toolbarBtn" data-kc-value>${value > 0 ? '+' : ''}${value}${keyPreview}</button>
            <button type="button" class="toolbarBtn" data-kc-up>+</button>
          </div>
          ${hasExisting ? '<button type="button" class="flowKeyChangeClear" data-kc-clear>Remove</button>' : ''}
          <button type="button" class="toolbarBtn" data-kc-done>Done</button>
        </div>
      `;

      panel.querySelector('[data-kc-down]').onclick = (event) => {
        event.stopPropagation();
        value -= 1;
        draw();
      };

      panel.querySelector('[data-kc-up]').onclick = (event) => {
        event.stopPropagation();
        value += 1;
        draw();
      };

      const clearBtn = panel.querySelector('[data-kc-clear]');

      if(clearBtn){
        clearBtn.onclick = (event) => {
          event.stopPropagation();
          const updated = flow.slice();
          const rest = { ...updated[index] };
          delete rest.keyChangeSteps;
          updated[index] = rest;
          persistSongFlow(target, updated);
          renderSongViewer();
        };
      }

      panel.querySelector('[data-kc-done]').onclick = (event) => {
        event.stopPropagation();
        const updated = flow.slice();
        updated[index] = { ...updated[index], keyChangeSteps: value };
        persistSongFlow(target, updated);
        renderSongViewer();
      };

    };

    draw();

  };

  document.querySelectorAll('[data-flow-keychange-open]').forEach(btn => {

    btn.onclick = (event) => {
      event.stopPropagation();
      openKeyChangeEditor(Number(btn.dataset.flowKeychangeOpen));
    };

  });

  document.querySelectorAll('[data-flow-delete]').forEach(btn => {

    btn.onclick = () => {

      const index =
        Number(btn.dataset.flowDelete);

      const updated =
        flow.slice();

      updated.splice(index, 1);

      persistSongFlow(target, updated);

      renderSongViewer();

    };

  });

  document.querySelectorAll('[data-flow-note-index]').forEach(textarea => {

    textarea.addEventListener('blur', () => {

      const index =
        Number(textarea.dataset.flowNoteIndex);

      const updated =
        flow.slice();

      updated[index] = {
        ...updated[index],
        text: textarea.value
      };

      persistSongFlow(target, updated);

    });

  });

  document.querySelectorAll('[data-flow-note-check]').forEach(btn => {

    btn.onclick = (event) => {

      event.stopPropagation();

      const index =
        Number(btn.dataset.flowNoteCheck);

      const wrap =
        btn.closest('.flowBetweenNote');

      const textarea =
        wrap && wrap.querySelector('[data-flow-note-index]');

      const text =
        textarea ? textarea.value : ((flow[index] && flow[index].text) || '');

      const updated =
        flow.slice();

      updated[index] = {
        ...updated[index],
        text,
        confirmed: true
      };

      persistSongFlow(target, updated);

      renderSongViewer();

    };

  });

  document.querySelectorAll('[data-flow-note-reopen]').forEach(el => {

    el.onclick = (event) => {

      event.stopPropagation();

      const index =
        Number(el.dataset.flowNoteReopen);

      const updated =
        flow.slice();

      updated[index] = {
        ...updated[index],
        confirmed: false
      };

      persistSongFlow(target, updated);

      renderSongViewer();

      requestAnimationFrame(() => {
        const textarea =
          document.querySelector(`[data-flow-note-index="${index}"]`);
        if(textarea)textarea.focus();
      });

    };

  });

  document.querySelectorAll('[data-flow-line-tap]').forEach(wrap => {

    wrap.onclick = (event) => {

      if(
        event.target.closest('.flowLineNoteBeside') ||
        event.target.closest('.flowLineNoteDelete')
      ){
        return;
      }

      const lineIndex =
        Number(wrap.dataset.flowLineTap);

      const container =
        wrap.closest('[data-flow-item-id]');

      if(!container)return;

      const flowItemId =
        container.dataset.flowItemId;

      showLineNoteChooser((placement) => {

        const updated =
          addLineNoteToFlow(flow, flowItemId, lineIndex, placement);

        persistSongFlow(target, updated);

        renderSongViewer();

      });

    };

  });

  document.querySelectorAll('[data-line-note-delete]').forEach(btn => {

    btn.onclick = (event) => {

      event.stopPropagation();

      const noteId =
        btn.dataset.lineNoteDelete;

      const container =
        btn.closest('[data-flow-item-id]');

      if(!container)return;

      const flowItemId =
        container.dataset.flowItemId;

      const updated =
        removeLineNoteFromFlow(flow, flowItemId, noteId);

      persistSongFlow(target, updated);

      renderSongViewer();

    };

  });

  document.querySelectorAll('[data-line-note-edit]').forEach(input => {

    input.addEventListener('click', event => event.stopPropagation());

    input.addEventListener('blur', () => {

      const noteId =
        input.dataset.lineNoteEdit;

      const container =
        input.closest('[data-flow-item-id]');

      if(!container)return;

      const flowItemId =
        container.dataset.flowItemId;

      const updated =
        updateLineNoteTextInFlow(flow, flowItemId, noteId, input.value);

      persistSongFlow(target, updated);

    });

  });

  const addSectionBtn =
    document.getElementById('flowAddSectionBtn');

  if(addSectionBtn){

    addSectionBtn.onclick = () => {

      showAddFlowSectionPicker(sections, (sectionId) => {

        const updated =
          flow.concat([{
            id: 'flow-' + sectionId + '-' + Math.random().toString(36).slice(2,7),
            type: 'section',
            sectionId,
            lineNotes: []
          }]);

        persistSongFlow(target, updated);

        renderSongViewer();

      });

    };

  }

  const addNoteBtn =
    document.getElementById('flowAddNoteBtn');

  if(addNoteBtn){

    addNoteBtn.onclick = () => {

      const updated =
        flow.concat([{
          id: 'flow-note-' + Math.random().toString(36).slice(2,7),
          type: 'note',
          text: ''
        }]);

      persistSongFlow(target, updated);

      renderSongViewer();

      requestAnimationFrame(() => {

        const inputs =
          document.querySelectorAll('[data-flow-note-index]');

        const last =
          inputs[inputs.length - 1];

        if(last){
          last.focus();
        }

      });

    };

  }

}

function attachSectionNavBehavior(){
  const nav=document.getElementById('songSectionNav');
  if(!nav)return;
  let pressTimer=null;
  let draggingButton=null;
  let dragStartIndex=-1;
  const clearPress=()=>{clearTimeout(pressTimer);pressTimer=null;nav.querySelectorAll('button').forEach(button=>button.classList.remove('longPressing'));};
  const setActiveIndex=index=>{
    nav.querySelectorAll('button').forEach(button=>{
      button.classList.toggle('active',Number(button.dataset.sectionIndex)===index);
    });
  };
  const fixedHeader=document.querySelector('.songFixedHeader');
  const headerHeight=fixedHeader?fixedHeader.offsetHeight:0;
  const sectionEls=[...document.querySelectorAll('.songSection')];
  if(sectionEls.length){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          setActiveIndex(Number(entry.target.dataset.sectionIndex));
        }
      });
    },{
      root:null,
      rootMargin:`-${headerHeight+1}px 0px -70% 0px`,
      threshold:0
    });
    sectionEls.forEach(section=>observer.observe(section));
  }
  nav.querySelectorAll('button').forEach(button=>{
    button.addEventListener('pointerdown',event=>{
      clearPress();button.classList.add('longPressing');
      pressTimer=setTimeout(()=>{draggingButton=button;dragStartIndex=[...nav.children].indexOf(button);button.classList.remove('longPressing');button.classList.add('dragging');},500);
    });
    button.addEventListener('pointermove',event=>{
      if(!draggingButton)return;
      event.preventDefault();
      const buttons=[...nav.querySelectorAll('button')];
      const target=buttons.find(targetButton=>{if(targetButton===draggingButton)return false;const rect=targetButton.getBoundingClientRect();return event.clientX>=rect.left&&event.clientX<=rect.right;});
      if(!target)return;
      const currentIndex=[...nav.children].indexOf(draggingButton);
      const targetIndex=[...nav.children].indexOf(target);
      if(targetIndex>currentIndex)nav.insertBefore(draggingButton,target.nextSibling);else nav.insertBefore(draggingButton,target);
    });
    button.addEventListener('pointerup',()=>{
      const wasDragging=!!draggingButton;clearPress();
      if(wasDragging){const finalIndex=[...nav.children].indexOf(button);button.classList.remove('dragging');draggingButton=null;if(finalIndex!==dragStartIndex)reorderViewerSections(dragStartIndex,finalIndex);dragStartIndex=-1;return;}
      const index=Number(button.dataset.sectionIndex);setActiveIndex(index);const target=document.getElementById('section-'+index);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    button.addEventListener('pointercancel',()=>{clearPress();if(draggingButton)draggingButton.classList.remove('dragging');draggingButton=null;dragStartIndex=-1;});
  });
}

/* =========================================================
   MERGED SONG VIEWER
   Renders a merged song (created via mergeSongsByIds) as a
   set of pages — one full lyrics page per original song —
   that the user can flip through by swiping left/right,
   tapping the transparent zones on either edge of the screen,
   or tapping a numbered pill in the header. Only songs with
   song.mergeParts (length>1) use this path; a plain song keeps
   using the normal renderSongViewer() rendering untouched.
========================================================= */

function clampMergedPartIndex(song){
  const total=song.mergeParts.length;
  let index=song.activePartIndex||0;
  if(index<0)index=0;
  if(index>total-1)index=total-1;
  song.activePartIndex=index;
  return index;
}

function goToMergedPartIndex(index){
  const song=currentSong;
  if(!song||!Array.isArray(song.mergeParts))return;
  const total=song.mergeParts.length;
  const clamped=Math.max(0,Math.min(total-1,index));
  if(clamped===(song.activePartIndex||0))return;
  stopAutoScroll();
  song.activePartIndex=clamped;
  renderSongViewer();
  window.scrollTo(0,0);
}

function goToMergedPart(delta){
  const song=currentSong;
  if(!song||!Array.isArray(song.mergeParts))return;
  goToMergedPartIndex((song.activePartIndex||0)+delta);
}

function attachMergedSwipeHandlers(){
  const el=document.getElementById('lyricsText');
  if(!el)return;
  let startX=0,startY=0,tracking=false,horizontal=false;

  el.addEventListener('touchstart',event=>{
    if(event.touches.length!==1)return;
    const touch=event.touches[0];
    startX=touch.clientX;
    startY=touch.clientY;
    tracking=true;
    horizontal=false;
  },{passive:true});
  el.addEventListener('touchmove',event=>{
    if(!tracking)return;
    const dx=event.touches[0].clientX-startX;
    const dy=event.touches[0].clientY-startY;
    if(!horizontal&&Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.3){
      horizontal=true;
    }
    if(horizontal){
      event.preventDefault();
      el.style.transform=`translateX(${dx}px)`;
    }
  },{passive:false});
  const finishSwipe=event=>{
    if(!tracking)return;
    tracking=false;
    if(horizontal){
      const touch=event.changedTouches?event.changedTouches[0]:null;
      const dx=touch?touch.clientX-startX:0;
      el.style.transform='';
      /*
        Only a real drag (past the 60px threshold) navigates.
        A plain tap/click inside the lyrics content — with
        little or no horizontal movement — does nothing here,
        so simply tapping to read never advances the song.
      */
      if(dx<-60)goToMergedPart(1);
      else if(dx>60)goToMergedPart(-1);
    }
    horizontal=false;
  };
  el.addEventListener('touchend',finishSwipe);
  el.addEventListener('touchcancel',finishSwipe);
}

/* =========================================================
   AUTO SCROLL
========================================================= */

let autoScrollActive=false;
let autoScrollRAF=null;
let autoScrollLastTime=null;
let autoScrollSpeedLevel=getSettings().autoScrollSpeed; /* 1-5 */
const AUTO_SCROLL_MIN_LEVEL=1;
const AUTO_SCROLL_MAX_LEVEL=5;

/*
  Level 1 used to be 34px/s (18+1*16) — same formula as the
  other levels — but that was too fast for people trying to
  follow along while playing. 25% was tried and felt too slow;
  70% of the original level-1 speed is the current sweet spot.
  Levels 2-5 keep their original speeds so the rest of the range
  feels the same as before.
*/
const AUTO_SCROLL_SPEEDS = {
  1: (18+1*16) * 0.7,  /* 34 -> 23.8px/s */
  2: 18+2*16,           /* 50px/s */
  3: 18+3*16,           /* 66px/s */
  4: 18+4*16,           /* 82px/s */
  5: 18+5*16            /* 98px/s */
};

function autoScrollPxPerSecond(){
  return AUTO_SCROLL_SPEEDS[autoScrollSpeedLevel] || AUTO_SCROLL_SPEEDS[1];
}

function autoScrollStep(now){
  if(!autoScrollActive)return;
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn){stopAutoScroll();return;}
  if(autoScrollLastTime===null)autoScrollLastTime=now;
  const deltaSeconds=(now-autoScrollLastTime)/1000;
  autoScrollLastTime=now;
  window.scrollBy(0,autoScrollPxPerSecond()*deltaSeconds);
  const scroller=document.scrollingElement||document.documentElement;
  if(scroller.scrollTop+window.innerHeight>=scroller.scrollHeight-2){
    stopAutoScroll();
    return;
  }
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function autoScrollIconHTML(){
  return autoScrollActive
    ? '<span class="asPauseIcon" aria-hidden="true"><i></i><i></i></span>'
    : '<span class="asPlayIcon" aria-hidden="true"></span>';
}

function refreshAutoScrollToggleLabel(){
  const wrap=document.getElementById('asToggleWrap');
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn)return;
  if(wrap&&wrap.classList.contains('speedMode')){
    toggleBtn.textContent=String(autoScrollSpeedLevel);
  }else{
    toggleBtn.innerHTML=autoScrollIconHTML();
  }
}

function startAutoScroll(){
  autoScrollActive=true;
  autoScrollLastTime=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.add('primary');
  refreshAutoScrollToggleLabel();
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function stopAutoScroll(){
  autoScrollActive=false;
  autoScrollLastTime=null;
  if(autoScrollRAF)cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.remove('primary');
  refreshAutoScrollToggleLabel();
}

function toggleAutoScroll(){
  if(autoScrollActive)stopAutoScroll();else startAutoScroll();
}

function setAutoScrollSpeedLevel(level){
  autoScrollSpeedLevel=Math.max(AUTO_SCROLL_MIN_LEVEL,Math.min(AUTO_SCROLL_MAX_LEVEL,level));
  refreshAutoScrollToggleLabel();
  const badge=document.getElementById('asSpeedBadge');
  if(badge)badge.textContent=autoScrollSpeedLevel+'x';
}

/*
  Renders the auto-scroll control into its own fixed overlay
  (a sibling of #screen, same reasoning as the section float
  bar — see the comment in setActiveNav) so it stays pinned
  on screen the whole time you're reading, instead of
  scrolling away with the rest of the toolbar.
*/

function renderAutoScrollFab(){
  const overlay=document.getElementById('autoScrollOverlay');
  if(!overlay)return;
  overlay.innerHTML=`
    <div class="autoScrollFab idleFade">
      <div class="asToggleWrap" id="asToggleWrap">
        <button type="button" class="asArrowBtn asArrowUp" id="asArrowUp" aria-label="Increase scroll speed">⌃</button>
        <button class="toolbarBtn asToggleBtn${autoScrollActive?' primary':''}" id="asToggle" aria-label="${autoScrollActive?'Pause auto-scroll':'Start auto-scroll'}">${autoScrollIconHTML()}</button>
        <button type="button" class="asArrowBtn asArrowDown" id="asArrowDown" aria-label="Decrease scroll speed">⌄</button>
      </div>
      <div class="asSpeedBadge" id="asSpeedBadge">${autoScrollSpeedLevel}x</div>
    </div>
  `;
  attachAutoScrollControls();
  attachIdleFade(document.querySelector('.autoScrollFab'));
}

function attachAutoScrollControls(){
  const toggleBtn=document.getElementById('asToggle');
  const wrap=document.getElementById('asToggleWrap');
  const upBtn=document.getElementById('asArrowUp');
  const downBtn=document.getElementById('asArrowDown');
  if(!toggleBtn||!wrap)return;

  let pressTimer=null;
  let longPressFired=false;

  const enterSpeedMode=()=>{
    longPressFired=true;
    wrap.classList.add('speedMode');
    refreshAutoScrollToggleLabel();
  };

  const exitSpeedMode=()=>{
    wrap.classList.remove('speedMode');
    refreshAutoScrollToggleLabel();
  };

  if(upBtn)upBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel+1);
  });

  if(downBtn)downBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel-1);
  });

  toggleBtn.addEventListener('pointerdown',event=>{
    event.preventDefault();
    longPressFired=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(enterSpeedMode,450);
  });

  toggleBtn.addEventListener('pointerup',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('pointercancel',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('click',()=>{
    /*
      A click always fires right after pointerup, even for a
      long press. If this click is the tail end of the same
      press that just opened speed mode, swallow it so the
      popup doesn't instantly close again.
    */
    if(longPressFired){
      longPressFired=false;
      return;
    }
    if(wrap.classList.contains('speedMode')){
      /* Tapping the number saves the speed and closes the popup. */
      exitSpeedMode();
    }else{
      toggleAutoScroll();
    }
  });
}


function formatViewerLine(
  line
){

  const displayLine =
    findChords(line).length
      ? line
      : normalizeLyricCasing(line);


  let html =
    esc(displayLine);


  const chordRegex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  html =
    html.replace(
      chordRegex,
      (
        prefix,
        chord
      ) => {

        return (
          prefix +
          '<span class="chordToken">' +
          chord +
          '</span>'
        );

      }
    );


  return html || '&nbsp;';

}


/* =========================================================
   SAVE CURRENT SONG
========================================================= */

function saveCurrentSong(){

  if(!currentSong){

    return;

  }


  const songs =
    getSongs();


  const index =
    songs.findIndex(
      item =>
        item.id ===
        currentSong.id
    );


  currentSong.updatedAt =
    new Date().toISOString();


  const isNewSong =
    index === -1;


  if(isNewSong){

    /*
      This is a preview/new song.
      Give it a real ID and save it.
    */

    currentSong.id =
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now());


    currentSong.savedAt =
      new Date().toISOString();


    currentSong.originalText =
      currentSong.originalText ||
      currentSong.text ||
      '';


    currentSong.kind =
      'analyzed';


    songs.unshift(
      currentSong
    );

  }else{

    songs[index] =
      currentSong;

  }


  writeSongs(
    songs.slice(0,MAX_SONGS)
  );


  /*
    Only a brand-new song auto-reaches Drive — that's what
    makes it visible in everyone's Library. Re-saving an
    existing song (a new key, an edited line, etc.) stays
    local until that song's own Sync button is tapped, so one
    person's in-progress changes don't jump onto everyone
    else's copy uninvited.
  */

  if(isNewSong){

    uploadNewSongToDrive(currentSong);

  }


  showToast(
    'Song saved.',
    'success'
  );


  renderSongViewer();

}

/* =========================================================
   IMPORT (TEXT) — the inverse of the export below. Recognizes
   the `Title: "X"` marker line exportCurrentSongAsText writes:
   one marker means a single song, more than one means the file
   is a merged song (one marker per part), so the importer can
   rebuild it as a proper paginated merge instead of one flat
   blob. Files exported before this marker existed (bare title
   on line 1, no "Title:" prefix) still import fine as a single
   song via the legacy fallback below.
========================================================= */

function parseSongTextFile(raw){

  const text =
    String(raw || '')
      .replace(/\r\n/g,'\n')
      .replace(/^\uFEFF/,'');

  const lines =
    text.split('\n');


  const titleLinePattern =
    /^title\s*:\s*"(.*)"\s*$/i;

  const titleLineIndexes = [];

  lines.forEach((line, index) => {

    if(titleLinePattern.test(line.trim())){

      titleLineIndexes.push(index);

    }

  });


  if(!titleLineIndexes.length){

    /* Legacy format: no marker, first line is just the title. */

    const legacy =
      parseLegacySingleSongTextFile(text);

    return {
      type: 'single',
      title: legacy.title,
      text: legacy.text
    };

  }


  const readPartBody = (startIndex, endIndex) => {

    let index = startIndex;

    while(
      index < endIndex &&
      lines[index].trim() === ''
    ){

      index++;

    }

    if(
      index < endIndex &&
      /^key\s*:/i.test(lines[index].trim())
    ){

      index++;

    }

    return lines
      .slice(index, endIndex)
      .join('\n')
      .replace(/^\n+/,'')
      .replace(/\n+$/,'');

  };


  const parts =
    titleLineIndexes.map((lineIndex, partIndex) => {

      const match =
        lines[lineIndex]
          .trim()
          .match(titleLinePattern);

      const title =
        (match && match[1].trim()) ||
        'Untitled Song';

      const segmentEnd =
        titleLineIndexes[partIndex + 1] !== undefined
          ? titleLineIndexes[partIndex + 1]
          : lines.length;

      return {
        title,
        text: readPartBody(lineIndex + 1, segmentEnd)
      };

    });


  if(parts.length === 1){

    return {
      type: 'single',
      title: parts[0].title,
      text: parts[0].text
    };

  }


  return {
    type: 'merged',
    parts
  };

}


function parseLegacySingleSongTextFile(text){

  const lines =
    text.split('\n');


  let index = 0;

  while(
    index < lines.length &&
    lines[index].trim() === ''
  ){

    index++;

  }


  const title =
    (lines[index] || 'Untitled Song')
      .trim() ||
    'Untitled Song';

  index++;


  while(
    index < lines.length &&
    lines[index].trim() === ''
  ){

    index++;

  }

  if(
    index < lines.length &&
    /^key\s*:/i.test(lines[index].trim())
  ){

    index++;

  }


  const body =
    lines
      .slice(index)
      .join('\n')
      .replace(/^\n+/,'');


  return {
    title,
    text: body
  };

}


/* =========================================================
   EXPORT (TEXT) — saves the currently viewed song to a local
   .txt file (chords + lyrics, respecting the current
   transpose), named after the song title. Each song's title is
   written as a `Title: "X"` marker line — for a merged song,
   every part gets its own marker, one after another, so a
   later import can tell a merge apart from a single song just
   by counting how many Title: lines the file has (see
   parseSongTextFile).
========================================================= */

function exportCurrentSongAsText(){

  if(!currentSong)return;

  const song = currentSong;

  const isMerged =
    Array.isArray(song.mergeParts) &&
    song.mergeParts.length > 1;

  const parts =
    isMerged
      ? song.mergeParts
      : [{

          title:
            song.title ||
            'Untitled Song',

          text:
            song.originalText ||
            song.text ||
            ''

        }];

  const amount =
    song.transposeSteps || 0;


  const outputLines = [];


  parts.forEach((part, partIndex) => {

    const partAmount =
      isMerged
        ? (part.transposeSteps || 0)
        : amount;

    const displayedText =
      transposeText(
        part.text || '',
        partAmount
      );

    const sections =
      parseSections(
        displayedText
      );

    const keyInfo =
      detectKeyFromChords(
        extractChordTokens(
          displayedText
        )
      );


    if(partIndex > 0){

      outputLines.push('');

    }


    outputLines.push(
      'Title: "' +
      (part.title || 'Untitled Song') +
      '"'
    );


    if(keyInfo){

      outputLines.push(
        'Key: ' + keyInfo.label
      );

    }


    outputLines.push('');


    sections.forEach(section => {

      outputLines.push(
        '[' + section.name + ']'
      );

      section.lines.forEach(
        line => outputLines.push(line)
      );

      outputLines.push('');

    });

  });


  const text =
    sanitizeForPlainExport(
      outputLines
        .join('\n')
        .replace(/\n{3,}/g,'\n\n')
        .trim() +
      '\n'
    );


  const filename =
    (song.title || 'untitled-song')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-+|-+$)/g,'') ||
    'song';


  const blob =
    new Blob(
      ['\uFEFF' + text],
      { type:'text/plain;charset=utf-8' }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;
  link.download = filename + '.txt';

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);

}


/* =========================================================

  if(!currentSong)return;

    Array.isArray(currentSong.mergeParts) &&
    currentSong.mergeParts.length > 1;

  const source =
    isMerged
      ? currentSong.mergeParts[clampMergedPartIndex(currentSong)]
      : currentSong;

  const amount =
    (isMerged ? source.transposeSteps : currentSong.transposeSteps) || 0;

  const displayedText =
    transposeText(

      source.originalText ||
      source.text ||
      '',

      amount

    );

  const parsed =
    parseSections(
      displayedText
    );

  pdfExportSections =
    parsed.map((section,index) => ({

      ...section,

      _id:
        String(index) + '|' +
        String(section.name || 'Section').trim().toLowerCase(),
