/* =========================================================
   FLOATING NAVIGATION
========================================================= */

.nav{
  position:fixed;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 24px);
  max-width:620px;

  height:70px;

  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  z-index:100;

  background:rgba(0,0,0,.48);

  border:1px solid rgba(255,255,255,.12);

  border-radius:22px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.nav button{
  flex:1;

  min-width:0;

  height:58px;

  border:0;
  border-radius:17px;

  background:transparent;

  color:rgba(255,255,255,.38);

  font:600 11px inherit;

  cursor:pointer;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:4px;

  transition:
    background .25s ease,
    color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.nav button[data-screen="lyrics"]{
  flex:1.35;

  background:rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04);
}

.nav button.active{
  color:#fff;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 0 14px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.nav button[data-screen="lyrics"].active{
  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 0 8px rgba(255,255,255,.25),
    0 0 20px rgba(255,255,255,.12),
    inset 0 1px 0 rgba(255,255,255,.10);
}

.nav .icon{
  width:25px;
  height:25px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:currentColor;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.30))
    drop-shadow(0 0 7px rgba(255,255,255,.12));
}

.nav .icon svg{
  width:20px;
  height:20px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button.active .icon{
  color:#fff;

  filter:
    drop-shadow(0 0 4px rgba(255,255,255,1))
    drop-shadow(0 0 9px rgba(255,255,255,.75))
    drop-shadow(0 0 18px rgba(255,255,255,.35));

  transform:translateY(-1px);
}

.nav button.active .icon svg{
  stroke-width:2;
}

.nav button[data-screen="lyrics"] .icon svg{
  width:24px;
  height:24px;
}

.nav button[data-screen="lyrics"] span:last-child{

  font-weight:800;
}

  overflow:auto;

/* =========================================================

========================================================= */

.songFixedHeader{position:sticky;top:0;left:auto;transform:none;width:100%;z-index:300;background:rgba(17,17,19,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0;padding:8px 16px 10px;border-bottom:1px solid #29292e;box-shadow:0 8px 24px rgba(0,0,0,.35);}

/* =========================================================
   SONG SECTION PARSER
========================================================= */

function parseSections(text){

  const lines =
    String(text || '')
      .split(/\r?\n/);


  const sections = [];


  let current = {

    name:'Song',

    lines:[]

  };


  const sectionPattern =
    /^\s*\[?\s*(intro|verse(?:\s*\d+)?|pre[- ]?chorus|chorus|refrain|bridge|interlude|instrumental|outro|ending|tag|hook|solo)(?:\s*\d+)?\s*:?\s*\]?\s*$/i;


  lines.forEach(line => {

    const clean =
      line.trim();


    const match =
      clean.match(
        sectionPattern
      );


    if(match){

      if(
        current.lines.length ||
        current.name !== 'Song'
      ){

        sections.push(
          current
        );

      }


      current = {

        name:
          clean
            .replace(/^\[\s*/, '')
            .replace(/\s*\]$/, '')
            .replace(/:$/, '')
            .trim(),

        lines:[]

      };

    }else{

      current.lines.push(
        line
      );

    }

  });


  if(
    current.lines.length ||
    !sections.length
  ){

    sections.push(
      current
    );

  }


  return sections;

}


/* =========================================================
   CHORD ENGINE
========================================================= */

/*
  Chord matching is deliberately stricter than ordinary
  word matching so normal lyric words are not treated as chords.

  Supports:

  C
  C#
  Db
  Cm
  Cmin
  Cmaj7
  C7
  Cdim
  Caug
  Csus2
  Cadd9
  C7#9
  Cb5
  C/E
  F#/A#
  Bbmaj7/D
*/

const CHORD_TOKEN_REGEX =
  /^[A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add)?(?:[0-9]+)?(?:[#b][0-9]+)?(?:\/[A-G](?:#|b)?)?$/;


function isChordToken(token){

  if(!token){

    return false;

  }


  const clean =
    token
      .replace(
        /^[\[\(\{<]+|[\]\)\}>.,;:!?]+$/g,
        ''
      );


  if(
    !CHORD_TOKEN_REGEX.test(
      clean
    )
  ){

    return false;

  }


  /*
    Avoid treating common lyric words such as:
    A
    I
    Am
    etc. incorrectly.

    Single-letter A-G are valid chords.
    More complex forms are accepted by regex.
  */

  return true;

}


function findChords(line){

  const matches = [];


  const tokenRegex =
    /(?:^|\s)([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add)?(?:[0-9]+)?(?:[#b][0-9]+)?(?:\/[A-G](?:#|b)?)?)(?=\s|$)/g;


  let match;


  while(
    (match =
      tokenRegex.exec(line))
  ){

    const chord =
      match[1];


    if(
      isChordToken(chord)
    ){

      matches.push(
        chord
      );

    }

  }


  return [
    ...new Set(matches)
  ];

}


function isChordOnlyLine(line){

  const clean =
    String(line || '')
      .trim();


  if(!clean){

    return false;

  }


  const tokens =
    clean.split(/\s+/);


  if(!tokens.length){

    return false;

  }


  return tokens.every(
    isChordToken
  );

}


/* =========================================================
   ANALYZER
========================================================= */

function analyzeFocusedSong(text){

  const sections =
    parseSections(text);


  const analyzedSections =
    sections.map(section => {

      const lines =
        section.lines.map(line => {

          const chords =
            findChords(line);


          return {

            text:line,

            chords

          };

        });


      return {

        name:
          section.name,

        lines,

        chords:[
          ...new Set(
            lines.flatMap(
              line =>
                line.chords
            )
          )

        ]

      };

    });


  return {

    rawText:text,

    sections:
      analyzedSections,

    chords:[
      ...new Set(
        analyzedSections.flatMap(
          section =>
            section.chords
        )
      )

    ]

  };

}

        );

  `;

}


function escapeRegExp(value){

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

}

/* =========================================================
   TRANSPOSE ENGINE
========================================================= */

const chromatic = [

  'C',
  'C#',
  'D',
  'D#',
  'E',
  'F',
  'F#',
  'G',
  'G#',
  'A',
  'A#',
  'B'

];


const flatToSharp = {

  Db:'C#',
  Eb:'D#',
  Gb:'F#',
  Ab:'G#',
  Bb:'A#'

};


function normalizeNote(note){

  return (
    flatToSharp[note] ||
    note
  );

}


function transposeNote(
  note,
  amount
){

  const normalized =
    normalizeNote(note);


  const index =
    chromatic.indexOf(
      normalized
    );


  if(index === -1){

    return note;

  }


  const newIndex =
    (
      (index + amount) % 12 +
      12
    ) % 12;


  return chromatic[newIndex];

}


function transposeChord(
  chord,
  amount
){

  const slashParts =
    chord.split('/');


  let mainChord =
    slashParts[0];


  let bassNote =
    slashParts[1];


  const match =
    mainChord.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if(!match){

    return chord;

  }


  const root =
    match[1];


  const suffix =
    match[2];


  const newRoot =
    transposeNote(
      root,
      amount
    );


  let result =
    newRoot +
    suffix;


  if(bassNote){

    bassNote =
      transposeNote(
        bassNote,
        amount
      );


    result +=
      '/' +
      bassNote;

  }


  return result;

}


function transposeText(
  text,
  amount
){

  if(!amount){

    return text;

  }


  /*
    Matches chord-like tokens including:
    Fdim
    F#dim
    E7#9
    Cmaj7
    G/B
    Bb
  */

  const regex =
    /(^|\s)([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add)?(?:[0-9]+)?(?:[#b][0-9]+)?(?:\/[A-G](?:#|b)?)?)(?=\s|$)/gm;


  return text.replace(
    regex,
    (
      full,
      prefix,
      chord
    ) => {

      if(
        !isChordToken(chord)
      ){

        return full;

      }


      return (
        prefix +
        transposeChord(
          chord,
          amount
        )
      );

    }
  );

}


/* =========================================================
   SONG VIEWER
========================================================= */

function openSong(song){

  currentSong =
    song;


  modal.style.display =
    'none';


  setActiveNav('lyrics');


  if(
    !currentSong.originalText
  ){

    currentSong.originalText =
      currentSong.text || '';

  }


  if(
    typeof currentSong.transposeSteps !==
    'number'
  ){

    currentSong.transposeSteps =
      0;

  }


  if(
    typeof currentSong.fontSize !==
    'number'
  ){

    currentSong.fontSize =
      15;

  }


  renderSongViewer();

}


function getViewerSections(song, displayedText){
  const parsed = parseSections(displayedText);
  const normalized = parsed.map((section,index) => ({...section,_id:String(index)+'|'+String(section.name||'Section').trim().toLowerCase()}));
  const savedOrder = Array.isArray(song.sectionOrder) ? song.sectionOrder : [];
  if(!savedOrder.length){ song.sectionOrder=normalized.map(section=>section._id); return normalized; }
  const byId=new Map(normalized.map(section=>[section._id,section]));
  const ordered=[];
  savedOrder.forEach(id=>{const section=byId.get(id);if(section){ordered.push(section);byId.delete(id);}});
  normalized.forEach(section=>{if(byId.has(section._id)) ordered.push(section);});
  song.sectionOrder=ordered.map(section=>section._id);
  return ordered;
}

function persistSectionOrder(){
  if(!currentSong)return;
  const songs=getSongs();
  const index=songs.findIndex(item=>item.id===currentSong.id);
  if(index!==-1){songs[index]=currentSong;writeSongs(songs.slice(0,200));}
}

function reorderViewerSections(fromIndex,toIndex){
  if(!currentSong||fromIndex===toIndex)return;
  const amount=currentSong.transposeSteps||0;
  const displayedText=transposeText(currentSong.originalText||currentSong.text||'',amount);
  const sections=getViewerSections(currentSong,displayedText);
  if(fromIndex<0||toIndex<0||fromIndex>=sections.length||toIndex>=sections.length)return;
  const moved=sections.splice(fromIndex,1)[0];
  sections.splice(toIndex,0,moved);
  currentSong.sectionOrder=sections.map(section=>section._id);
  persistSectionOrder();
  renderSongViewer();
}

function updateSectionNavActive(){
  const nav=document.getElementById('songSectionNav');
  if(!nav)return;
  const sections=[...document.querySelectorAll('.songSection')];
  if(!sections.length)return;
  const navButtons=[...nav.querySelectorAll('button')];
  let activeIndex=0;
  const headerHeight=nav.closest('.songFixedHeader')?.getBoundingClientRect().height || 100;
  let bestDistance=Infinity;
  sections.forEach((section,index)=>{
    const top=section.getBoundingClientRect().top;
    const distance=Math.abs(top-headerHeight-8);
    if(top-headerHeight<=24 && distance<bestDistance){activeIndex=index;bestDistance=distance;}
  });
  navButtons.forEach((button,index)=>button.classList.toggle('active',index===activeIndex));
}

  const nav=document.getElementById('songSectionNav');

  let pressTimer=null;

  const clearPress=()=>{clearTimeout(pressTimer);pressTimer=null;nav.querySelectorAll('button').forEach(button=>button.classList.remove('longPressing'));};
  nav.querySelectorAll('button').forEach(button=>{
    button.addEventListener('pointerdown',event=>{
      event.preventDefault();clearPress();button.classList.add('longPressing');
      pressTimer=setTimeout(()=>{draggingButton=button;dragStartIndex=[...nav.children].indexOf(button);button.classList.remove('longPressing');button.classList.add('dragging');},500);
    });
    button.addEventListener('pointermove',event=>{
      if(!draggingButton)return;
      const buttons=[...nav.querySelectorAll('button')];
      const target=buttons.find(targetButton=>{if(targetButton===draggingButton)return false;const rect=targetButton.getBoundingClientRect();return event.clientX>=rect.left&&event.clientX<=rect.right;});
      if(!target)return;
      const currentIndex=[...nav.children].indexOf(draggingButton);
      const targetIndex=[...nav.children].indexOf(target);
      if(targetIndex>currentIndex)nav.insertBefore(draggingButton,target.nextSibling);else nav.insertBefore(draggingButton,target);
    });
    button.addEventListener('pointerup',()=>{
      const wasDragging=!!draggingButton;clearPress();
      if(wasDragging){const finalIndex=[...nav.children].indexOf(button);button.classList.remove('dragging');draggingButton=null;if(finalIndex!==dragStartIndex)reorderViewerSections(dragStartIndex,finalIndex);dragStartIndex=-1;return;}
      nav.querySelectorAll('button').forEach(item=>item.classList.remove('active'));
      button.classList.add('active');
      const index=Number(button.dataset.sectionIndex);const target=document.getElementById('section-'+index);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    button.addEventListener('pointercancel',()=>{clearPress();if(draggingButton)draggingButton.classList.remove('dragging');draggingButton=null;dragStartIndex=-1;});
  });
  window.addEventListener('scroll',updateSectionNavActive,{passive:true});
}

function formatViewerLine(
  line
){

  let html =
    esc(line);


  const chordRegex =
    /(^|\s)([A-G](?:#|b)?(?:maj|min|m|dim|aug|sus|add)?(?:[0-9]+)?(?:[#b][0-9]+)?(?:\/[A-G](?:#|b)?)?)(?=\s|$)/g;


  html =
    html.replace(
      chordRegex,
      (
        prefix,
        chord
      ) => {

        return (
          prefix +
          '<span class="chordToken">' +
          chord +
          '</span>'
        );

      }
    );


  return html || '&nbsp;';

}

function saveCurrentSong(){

  if(!currentSong){

    return;

  }


  const songs =
    getSongs();


  const index =
    songs.findIndex(
      item =>
        item.id ===
        currentSong.id
    );


  if(index === -1){

    /*
      This is a preview/new song.
      Give it a real ID and save it.
    */

    currentSong.id =
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now());


    currentSong.savedAt =
      new Date().toISOString();


    currentSong.originalText =
      currentSong.originalText ||
      currentSong.text ||
      '';


    currentSong.kind =
      'analyzed';


    songs.unshift(
      currentSong
    );

  }else{

    songs[index] =
      currentSong;

  }


  writeSongs(
    songs.slice(0,200)
  );


  alert(
    'Song saved.'
  );


  renderSongViewer();

}

function addEditorSection(){

    select
      ? select.value
      : 'Verse';

    document.getElementById(
      'editorSections'
    );


  if(!container){

    return;

  }


  const wrapper =
    document.createElement('div');


  wrapper.innerHTML =
    editorSectionHTML(

        lines:[]

      container.children.length

function duplicateEditorSection(button){
  const section=button.closest('[data-editor-section]');
  if(!section)return;
  const clone=section.cloneNode(true);
  section.parentElement.insertBefore(clone,section.nextSibling);
}


function moveEditorSection(
  button,
  direction
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(!section){

    return;

  }


  const container =
    section.parentElement;


  const sections =
    [...container.children];


  const index =
    sections.indexOf(
      section
    );


  const target =
    index + direction;


  if(
    target < 0 ||
    target >= sections.length
  ){

    return;

  }


  if(
    direction < 0
  ){

    container.insertBefore(
      section,
      sections[target]
    );

  }else{

    container.insertBefore(
      sections[target],
      section
    );

  }

}


function deleteEditorSection(
  button
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(section){

    section.remove();

  }

}


function saveEditorChanges(){

  const sections =
    document
      .querySelectorAll(
        '[data-editor-section]'
      );


  const output = [];


  sections.forEach(section => {

    const name =
      section
        .querySelector(
          '.sectionType'
        )
        .value
        .trim();


    const text =
      section
        .querySelector(
          '.editorTextarea'
        )
        .value;


    if(
      name ||
      text.trim()
    ){

      output.push(
        name || 'Section'
      );


      output.push(
        text
      );


      output.push('');

    }

  });


  const text =
    output.join('\n')
      .replace(
        /\n{3,}/g,
        '\n\n'
      )
      .trim();


  currentSong.originalText =
    text;


  currentSong.text =
    text;


  currentSong.analysis =
    analyzeFocusedSong(
      text
    );

  currentSong.sectionOrder =
    parseSections(text).map((section,index) =>
      String(index) + '|' + String(section.name || 'Section').trim().toLowerCase()
    );


  saveCurrentSong();

}

/* =========================================================
   ULTIMATE GUITAR IMPORT
========================================================= */

async function loadUG(){

  const input =
    document.getElementById(
      'ugUrl'
    );


  const box =
    document.getElementById(
      'ugResult'
    );


  const url =
    (
      input?.value ||
      ''
    ).trim();


  if(!url){

    box.innerHTML =
      '<div class="hint">Paste an Ultimate Guitar URL first.</div>';

    return;

  }


  try{

    const parsedUrl =
      new URL(url);


    if(
      !parsedUrl.hostname.endsWith(
        'ultimate-guitar.com'
      )
    ){

      throw new Error(
        'Please use an Ultimate Guitar URL.'
      );

    }

  }catch(error){

    box.innerHTML =
      '<div class="hint">' +
      esc(error.message) +
      '</div>';

    return;

  }


  box.innerHTML =
    '<div class="hint">⏳ Loading song...</div>';


  try{

    const response =
      await fetch(
        '/api/import',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              url
            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if(!response.ok){

      throw new Error(

        data.error ||
        `Importer returned HTTP ${response.status}`

      );

    }


    const raw =
      (
        url.split('/').pop() ||
        'Ultimate Guitar Song'
      )
      .replace(
        /[-_]/g,
        ' '
      );


    const title =
      raw
        .replace(
          /\s+chords?\s+\d+.*$/i,
          ''
        )
        .replace(
          /\s+\d+.*$/,
          ''
        )
        .trim()
        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );


    const importedText =
      data.text || '';


    /*
      Immediately analyze the imported song.
    */

    const analysis =
      analyzeFocusedSong(
        importedText
      );


    const song =
      saveSong(
        title,
        importedText,
        data.sourceUrl || url,
        analysis
      );


    localStorage.setItem(
      'worshipChordsSourceUrl',
      data.sourceUrl || url
    );


    localStorage.setItem(
      'worshipChordsImportedText',
      importedText
    );


    box.innerHTML = `

      <div class="hint">

        ✅ Song imported and saved.

      </div>


      <div class="resultActions">

        <button
          class="smallBtn toolbarBtn primary"
          id="analyzeLoaded"
        >
          Analyze Song
        </button>


        <button
          class="smallBtn toolbarBtn"
          id="openLoaded"
        >
          Open Lyrics
        </button>

      </div>

    `;


    document
      .getElementById(
        'openLoaded'
      )
      .onclick =
        () => openSong(song);


    document
      .getElementById(
        'analyzeLoaded'
      )
      .onclick =
        () =>
          renderAnalyzer(
            importedText
          );

  }catch(error){

    console.error(error);


    box.innerHTML =
      '<div class="hint">⚠️ ' +
      esc(
        error.message ||
        'Importer failed.'
      ) +
      '</div>';

  }

}


/* =========================================================
   SEARCH EVENTS
========================================================= */

query.addEventListener(
  'input',
  renderResults
);


document
  .getElementById(
    'runSearch'
  )
  .onclick =
    renderResults;


document
  .getElementById(
    'closeSearch'
  )
  .onclick = () => {

    modal.style.display =
      'none';

  };


modal.addEventListener(
  'click',
  event => {

    if(
      event.target ===
      modal
    ){

      modal.style.display =
        'none';

    }

  }
);


document
  .querySelectorAll(
    '.sourceTabs button'
  )
  .forEach(button => {

    button.onclick = () => {

      openSearch(
        button.dataset.source
      );

    };

  });


/* =========================================================
   MAIN NAVIGATION
========================================================= */

document
  .querySelectorAll(
    '.nav button'
  )
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const screenName =
          button.dataset.screen;


        if(
          screenName ===
          'home'
        ){

          renderHome();

        }


        else if(
          screenName ===
          'lyrics'
        ){

          renderLyrics();

        }


        else if(
          screenName ===
          'library'
        ){

          renderLibrary();

        }


        else if(
          screenName ===
          'menu'
        ){

          setActiveNav('menu');


          screen.innerHTML = `

            <div class="placeholder">

              Menu
              <br>
              — ready to connect —

            </div>

          `;

        }

      }
    );

  });


/* =========================================================
   INITIAL SCREEN
========================================================= */

renderHome();

</script>

</body>
</html>
