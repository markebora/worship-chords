<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Worship Chords</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f7f7f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:920px;min-height:100vh;background:#111113;position:relative;padding-bottom:82px}
.top{padding:24px 22px 0}
.welcome{font-size:15px;color:#a7a7ad;font-weight:600;letter-spacing:.01em}
.hero{text-align:center;padding:58px 20px 80px}
.hero h1{margin:0;font-size:42px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.hero p{margin:10px 0 0;color:#a7a7ad;font-size:15px;font-weight:500}
.content{padding:0 22px}
.placeholder{min-height:360px;display:flex;align-items:center;justify-content:center;color:#66666d;font-size:14px;text-align:center}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(920px,100%);height:72px;background:rgba(22,22,24,.97);border-top:1px solid #2a2a2e;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:#85858c;font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.nav button.active{color:#fff}
.icon{font-size:20px;line-height:1}
@media(min-width:700px){.nav{border-radius:16px 16px 0 0}.hero{padding-top:70px}.hero h1{font-size:48px}}
.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="welcome">Welcome!</div></div>
  <section class="hero">
    <h1>Disciples</h1>
    <p>Soli Deo Gloria</p>
  </section>
  <main class="content" id="screen">
    <div class="placeholder">Your songs and tools will appear here.</div>
  </main>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-screen="home"><span class="icon">⌂</span><span>Home</span></button>
    <button data-screen="library"><span class="icon">▱</span><span>Library</span></button>
    <button data-screen="lyrics"><span class="icon">♫</span><span>Lyrics</span></button>
    <button data-screen="menu"><span class="icon">☰</span><span>Menu</span></button>
  </nav>
</div>
<script>
const screen=document.getElementById('screen');
document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
 button.classList.add('active');
 const name=button.dataset.screen;
 screen.innerHTML='<div class="placeholder">'+name.charAt(0).toUpperCase()+name.slice(1)+' screen — ready to connect.</div>';
}));
</script>
</body>
</html>
