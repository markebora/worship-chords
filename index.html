}


function getViewerSections(song, displayedText){
  const parsed = parseSections(displayedText);
  const normalized = parsed.map((section,index) => ({...section,_id:String(index)+'|'+String(section.name||'Section').trim().toLowerCase()}));
  const savedOrder = Array.isArray(song.sectionOrder) ? song.sectionOrder : [];
  if(!savedOrder.length){ song.sectionOrder=normalized.map(section=>section._id); return normalized; }
  const byId=new Map(normalized.map(section=>[section._id,section]));
  const ordered=[];
  savedOrder.forEach(id=>{const section=byId.get(id);if(section){ordered.push(section);byId.delete(id);}});
  normalized.forEach(section=>{if(byId.has(section._id)) ordered.push(section);});
  song.sectionOrder=ordered.map(section=>section._id);
  return ordered;
}

function persistSectionOrder(){
  if(!currentSong)return;
  const songs=getSongs();
  const index=songs.findIndex(item=>item.id===currentSong.id);
  if(index!==-1){songs[index]=currentSong;writeSongs(songs.slice(0,MAX_SONGS));}
}

function reorderViewerSections(fromIndex,toIndex){
  if(!currentSong||fromIndex===toIndex)return;
  const isMerged=Array.isArray(currentSong.mergeParts)&&currentSong.mergeParts.length>1;
  const target=isMerged?currentSong.mergeParts[clampMergedPartIndex(currentSong)]:currentSong;
  const amount=currentSong.transposeSteps||0;
  const displayedText=transposeText(target.originalText||target.text||'',amount);
  const sections=getViewerSections(target,displayedText);
  if(fromIndex<0||toIndex<0||fromIndex>=sections.length||toIndex>=sections.length)return;
  const moved=sections.splice(fromIndex,1)[0];
  sections.splice(toIndex,0,moved);
  target.sectionOrder=sections.map(section=>section._id);
  persistSectionOrder();
  renderSongViewer();
}

function attachSectionNavBehavior(){
  const nav=document.getElementById('songSectionNav');
  if(!nav)return;
  let pressTimer=null;
  let draggingButton=null;
  let dragStartIndex=-1;
  const clearPress=()=>{clearTimeout(pressTimer);pressTimer=null;nav.querySelectorAll('button').forEach(button=>button.classList.remove('longPressing'));};
  const setActiveIndex=index=>{
    nav.querySelectorAll('button').forEach(button=>{
      button.classList.toggle('active',Number(button.dataset.sectionIndex)===index);
    });
  };
  const fixedHeader=document.querySelector('.songFixedHeader');
  const headerHeight=fixedHeader?fixedHeader.offsetHeight:0;
  const sectionEls=[...document.querySelectorAll('.songSection')];
  if(sectionEls.length){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          setActiveIndex(Number(entry.target.dataset.sectionIndex));
        }
      });
    },{
      root:null,
      rootMargin:`-${headerHeight+1}px 0px -70% 0px`,
      threshold:0
    });
    sectionEls.forEach(section=>observer.observe(section));
  }
  nav.querySelectorAll('button').forEach(button=>{
    button.addEventListener('pointerdown',event=>{
      clearPress();button.classList.add('longPressing');
      pressTimer=setTimeout(()=>{draggingButton=button;dragStartIndex=[...nav.children].indexOf(button);button.classList.remove('longPressing');button.classList.add('dragging');},500);
    });
    button.addEventListener('pointermove',event=>{
      if(!draggingButton)return;
      event.preventDefault();
      const buttons=[...nav.querySelectorAll('button')];
      const target=buttons.find(targetButton=>{if(targetButton===draggingButton)return false;const rect=targetButton.getBoundingClientRect();return event.clientX>=rect.left&&event.clientX<=rect.right;});
      if(!target)return;
      const currentIndex=[...nav.children].indexOf(draggingButton);
      const targetIndex=[...nav.children].indexOf(target);
      if(targetIndex>currentIndex)nav.insertBefore(draggingButton,target.nextSibling);else nav.insertBefore(draggingButton,target);
    });
    button.addEventListener('pointerup',()=>{
      const wasDragging=!!draggingButton;clearPress();
      if(wasDragging){const finalIndex=[...nav.children].indexOf(button);button.classList.remove('dragging');draggingButton=null;if(finalIndex!==dragStartIndex)reorderViewerSections(dragStartIndex,finalIndex);dragStartIndex=-1;return;}
      const index=Number(button.dataset.sectionIndex);setActiveIndex(index);const target=document.getElementById('section-'+index);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    button.addEventListener('pointercancel',()=>{clearPress();if(draggingButton)draggingButton.classList.remove('dragging');draggingButton=null;dragStartIndex=-1;});
  });
}

function clampMergedPartIndex(song){
  const total=song.mergeParts.length;
  let index=song.activePartIndex||0;
  if(index<0)index=0;
  if(index>total-1)index=total-1;
  song.activePartIndex=index;
  return index;
}

function goToMergedPartIndex(index){
  const song=currentSong;
  if(!song||!Array.isArray(song.mergeParts))return;
  const total=song.mergeParts.length;
  const clamped=Math.max(0,Math.min(total-1,index));
  if(clamped===(song.activePartIndex||0))return;
  stopAutoScroll();
  song.activePartIndex=clamped;
  renderSongViewer();
  window.scrollTo(0,0);
}

function goToMergedPart(delta){
  const song=currentSong;
  if(!song||!Array.isArray(song.mergeParts))return;
  goToMergedPartIndex((song.activePartIndex||0)+delta);
}

function attachMergedSwipeHandlers(){
  const el=document.getElementById('lyricsText');
  if(!el)return;
  let startX=0,startY=0,tracking=false,horizontal=false;

  /*
    The tap zones (left/right transparent edge buttons) are
    the "border" — swiping should never start there, only
    inside the actual lyrics content. Checking their real
    getBoundingClientRect() (rather than duplicating the CSS
    width as a magic number) means this stays correct even if
    the tap-zone size changes later.
  */
  const withinTapZone=(x,y)=>{
    return ['mergeTapPrev','mergeTapNext'].some(id=>{
      const zone=document.getElementById(id);
      if(!zone)return false;
      const rect=zone.getBoundingClientRect();
      return x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom;
    });
  };

  el.addEventListener('touchstart',event=>{
    if(event.touches.length!==1)return;
    const touch=event.touches[0];
    if(withinTapZone(touch.clientX,touch.clientY)){
      /*
        Touch started on the edge tap-zone itself — let that
        button handle it as a tap, don't also track it as a
        swipe candidate.
      */
      tracking=false;
      return;
    }
    startX=touch.clientX;
    startY=touch.clientY;
    tracking=true;
    horizontal=false;
  },{passive:true});
  el.addEventListener('touchmove',event=>{
    if(!tracking)return;
    const dx=event.touches[0].clientX-startX;
    const dy=event.touches[0].clientY-startY;
    if(!horizontal&&Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.3){
      horizontal=true;
    }
    if(horizontal){
      event.preventDefault();
      el.style.transform=`translateX(${dx}px)`;
    }
  },{passive:false});
  const finishSwipe=event=>{
    if(!tracking)return;
    tracking=false;
    if(horizontal){
      const touch=event.changedTouches?event.changedTouches[0]:null;
      const dx=touch?touch.clientX-startX:0;
      el.style.transform='';
      /*
        Only a real drag (past the 60px threshold) navigates.
        A plain tap/click inside the lyrics content — with
        little or no horizontal movement — does nothing here,
        so simply tapping to read never advances the song.
      */
      if(dx<-60)goToMergedPart(1);
      else if(dx>60)goToMergedPart(-1);
    }
    horizontal=false;
  };
  el.addEventListener('touchend',finishSwipe);
  el.addEventListener('touchcancel',finishSwipe);
}

/* =========================================================
   AUTO SCROLL
========================================================= */

let autoScrollActive=false;
let autoScrollRAF=null;
let autoScrollLastTime=null;
let autoScrollSpeedLevel=getSettings().autoScrollSpeed; /* 1-5 */
const AUTO_SCROLL_MIN_LEVEL=1;
const AUTO_SCROLL_MAX_LEVEL=5;

function autoScrollPxPerSecond(){
  return 18+autoScrollSpeedLevel*16; /* level1=34 ... level5=98 */
}

function autoScrollStep(now){
  if(!autoScrollActive)return;
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn){stopAutoScroll();return;}
  if(autoScrollLastTime===null)autoScrollLastTime=now;
  const deltaSeconds=(now-autoScrollLastTime)/1000;
  autoScrollLastTime=now;
  window.scrollBy(0,autoScrollPxPerSecond()*deltaSeconds);
  const scroller=document.scrollingElement||document.documentElement;
  if(scroller.scrollTop+window.innerHeight>=scroller.scrollHeight-2){
    stopAutoScroll();
    return;
  }
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function autoScrollIconHTML(){
  return autoScrollActive
    ? '<span class="asPauseIcon" aria-hidden="true"><i></i><i></i></span>'
    : '<span class="asPlayIcon" aria-hidden="true"></span>';
}

function refreshAutoScrollToggleLabel(){
  const wrap=document.getElementById('asToggleWrap');
  const toggleBtn=document.getElementById('asToggle');
  if(!toggleBtn)return;
  if(wrap&&wrap.classList.contains('speedMode')){
    toggleBtn.textContent=String(autoScrollSpeedLevel);
  }else{
    toggleBtn.innerHTML=autoScrollIconHTML();
  }
}

function startAutoScroll(){
  autoScrollActive=true;
  autoScrollLastTime=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.add('primary');
  refreshAutoScrollToggleLabel();
  autoScrollRAF=requestAnimationFrame(autoScrollStep);
}

function stopAutoScroll(){
  autoScrollActive=false;
  autoScrollLastTime=null;
  if(autoScrollRAF)cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF=null;
  const toggleBtn=document.getElementById('asToggle');
  if(toggleBtn)toggleBtn.classList.remove('primary');
  refreshAutoScrollToggleLabel();
}

function toggleAutoScroll(){
  if(autoScrollActive)stopAutoScroll();else startAutoScroll();
}

function setAutoScrollSpeedLevel(level){
  autoScrollSpeedLevel=Math.max(AUTO_SCROLL_MIN_LEVEL,Math.min(AUTO_SCROLL_MAX_LEVEL,level));
  refreshAutoScrollToggleLabel();
}

/*
  Renders the auto-scroll control into its own fixed overlay
  (a sibling of #screen, same reasoning as the section float
  bar — see the comment in setActiveNav) so it stays pinned
  on screen the whole time you're reading, instead of
  scrolling away with the rest of the toolbar.
*/

function renderAutoScrollFab(){
  const overlay=document.getElementById('autoScrollOverlay');
  if(!overlay)return;
  overlay.innerHTML=`
    <div class="autoScrollFab">
      <div class="asToggleWrap" id="asToggleWrap">
        <button type="button" class="asArrowBtn asArrowUp" id="asArrowUp" aria-label="Increase scroll speed">⌃</button>
        <button class="toolbarBtn asToggleBtn${autoScrollActive?' primary':''}" id="asToggle" aria-label="${autoScrollActive?'Pause auto-scroll':'Start auto-scroll'}">${autoScrollIconHTML()}</button>
        <button type="button" class="asArrowBtn asArrowDown" id="asArrowDown" aria-label="Decrease scroll speed">⌄</button>
      </div>
    </div>
  `;
  attachAutoScrollControls();
}

function attachAutoScrollControls(){
  const toggleBtn=document.getElementById('asToggle');
  const wrap=document.getElementById('asToggleWrap');
  const upBtn=document.getElementById('asArrowUp');
  const downBtn=document.getElementById('asArrowDown');
  if(!toggleBtn||!wrap)return;

  let pressTimer=null;
  let longPressFired=false;

  const enterSpeedMode=()=>{
    longPressFired=true;
    wrap.classList.add('speedMode');
    refreshAutoScrollToggleLabel();
  };

  const exitSpeedMode=()=>{
    wrap.classList.remove('speedMode');
    refreshAutoScrollToggleLabel();
  };

  if(upBtn)upBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel+1);
  });

  if(downBtn)downBtn.addEventListener('click',event=>{
    event.stopPropagation();
    setAutoScrollSpeedLevel(autoScrollSpeedLevel-1);
  });

  toggleBtn.addEventListener('pointerdown',event=>{
    event.preventDefault();
    longPressFired=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(enterSpeedMode,450);
  });

  toggleBtn.addEventListener('pointerup',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('pointercancel',()=>{
    clearTimeout(pressTimer);
  });

  toggleBtn.addEventListener('click',()=>{
    /*
      A click always fires right after pointerup, even for a
      long press. If this click is the tail end of the same
      press that just opened speed mode, swallow it so the
      popup doesn't instantly close again.
    */
    if(longPressFired){
      longPressFired=false;
      return;
    }
    if(wrap.classList.contains('speedMode')){
      /* Tapping the number saves the speed and closes the popup. */
      exitSpeedMode();
    }else{
      toggleAutoScroll();
    }
  });
}


function formatViewerLine(
  line
){

  const displayLine =
    findChords(line).length
      ? line
      : normalizeLyricCasing(line);


  let html =
    esc(displayLine);


  const chordRegex =
    /(^|[^A-Za-z0-9#\/])([A-G](?:#|b)?(?:(?:[Mm][Aa][Jj]|[Mm][Ii][Nn]|[Dd][Ii][Mm]|[Aa][Uu][Gg]|[Ss][Uu][Ss]|[Aa][Dd][Dd]|[Mm])[0-9]*|[0-9]+)*(?:[#b][0-9]+)*(?:\/[A-G](?:#|b)?)?)(?=[^A-Za-z0-9#\/]|$)/g;


  html =
    html.replace(
      chordRegex,
      (
        prefix,
        chord
      ) => {

        return (
          prefix +
          '<span class="chordToken">' +
          chord +
          '</span>'
        );

      }
    );


  return html || '&nbsp;';

}


/* =========================================================
   SAVE CURRENT SONG
========================================================= */

function saveCurrentSong(){

  if(!currentSong){

    return;

  }


  const songs =
    getSongs();


  const index =
    songs.findIndex(
      item =>
        item.id ===
        currentSong.id
    );


  currentSong.updatedAt =
    new Date().toISOString();


  const isNewSong =
    index === -1;


  if(isNewSong){

    /*
      This is a preview/new song.
      Give it a real ID and save it.
    */

    currentSong.id =
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now());


    currentSong.savedAt =
      new Date().toISOString();


    currentSong.originalText =
      currentSong.originalText ||
      currentSong.text ||
      '';


    currentSong.kind =
      'analyzed';


    songs.unshift(
      currentSong
    );

  }else{

    songs[index] =
      currentSong;

  }


  writeSongs(
    songs.slice(0,MAX_SONGS)
  );


  /*
    Only a brand-new song auto-reaches Drive — that's what
    makes it visible in everyone's Library. Re-saving an
    existing song (a new key, an edited line, etc.) stays
    local until that song's own Sync button is tapped, so one
    person's in-progress changes don't jump onto everyone
    else's copy uninvited.
  */

  if(isNewSong){

    uploadNewSongToDrive(currentSong);

  }


  showToast(
    'Song saved.',
    'success'
  );


  renderSongViewer();

}

/* =========================================================
   IMPORT (TEXT) — the inverse of the export below. Recognizes
   the `Title: "X"` marker line exportCurrentSongAsText writes:
   one marker means a single song, more than one means the file
   is a merged song (one marker per part), so the importer can
   rebuild it as a proper paginated merge instead of one flat
   blob. Files exported before this marker existed (bare title
   on line 1, no "Title:" prefix) still import fine as a single
   song via the legacy fallback below.
========================================================= */

function parseSongTextFile(raw){

  const text =
    String(raw || '')
      .replace(/\r\n/g,'\n')
      .replace(/^\uFEFF/,'');

  const lines =
    text.split('\n');


  const titleLinePattern =
    /^title\s*:\s*"(.*)"\s*$/i;

  const titleLineIndexes = [];

  lines.forEach((line, index) => {

    if(titleLinePattern.test(line.trim())){

      titleLineIndexes.push(index);

    }

  });


  if(!titleLineIndexes.length){

    /* Legacy format: no marker, first line is just the title. */

    const legacy =
      parseLegacySingleSongTextFile(text);

    return {
      type: 'single',
      title: legacy.title,
      text: legacy.text
    };

  }


  const readPartBody = (startIndex, endIndex) => {

    let index = startIndex;

    while(
      index < endIndex &&
      lines[index].trim() === ''
    ){

      index++;

    }

    if(
      index < endIndex &&
      /^key\s*:/i.test(lines[index].trim())
    ){

      index++;

    }

    return lines
      .slice(index, endIndex)
      .join('\n')
      .replace(/^\n+/,'')
      .replace(/\n+$/,'');

  };


  const parts =
    titleLineIndexes.map((lineIndex, partIndex) => {

      const match =
        lines[lineIndex]
          .trim()
          .match(titleLinePattern);

      const title =
        (match && match[1].trim()) ||
        'Untitled Song';

      const segmentEnd =
        titleLineIndexes[partIndex + 1] !== undefined
          ? titleLineIndexes[partIndex + 1]
          : lines.length;

      return {
        title,
        text: readPartBody(lineIndex + 1, segmentEnd)
      };

    });


  if(parts.length === 1){

    return {
      type: 'single',
      title: parts[0].title,
      text: parts[0].text
    };

  }


  return {
    type: 'merged',
    parts
  };

}


function parseLegacySingleSongTextFile(text){

  const lines =
    text.split('\n');


  let index = 0;

  while(
    index < lines.length &&
    lines[index].trim() === ''
  ){

    index++;

  }


  const title =
    (lines[index] || 'Untitled Song')
      .trim() ||
    'Untitled Song';

  index++;


  while(
    index < lines.length &&
    lines[index].trim() === ''
  ){

    index++;

  }

  if(
    index < lines.length &&
    /^key\s*:/i.test(lines[index].trim())
  ){

    index++;

  }


  const body =
    lines
      .slice(index)
      .join('\n')
      .replace(/^\n+/,'');


  return {
    title,
    text: body
  };

}


/* =========================================================
   EXPORT (TEXT) — saves the currently viewed song to a local
   .txt file (chords + lyrics, respecting the current
   transpose), named after the song title. Each song's title is
   written as a `Title: "X"` marker line — for a merged song,
   every part gets its own marker, one after another, so a
   later import can tell a merge apart from a single song just
   by counting how many Title: lines the file has (see
   parseSongTextFile).
========================================================= */

function exportCurrentSongAsText(){

  if(!currentSong)return;

  const song = currentSong;

  const isMerged =
    Array.isArray(song.mergeParts) &&
    song.mergeParts.length > 1;

  const parts =
    isMerged
      ? song.mergeParts
      : [{

          title:
            song.title ||
            'Untitled Song',

          text:
            song.originalText ||
            song.text ||
            ''

        }];

  const amount =
    song.transposeSteps || 0;


  const outputLines = [];


  parts.forEach((part, partIndex) => {

    const displayedText =
      transposeText(
        part.text || '',
        amount
      );

    const sections =
      parseSections(
        displayedText
      );

    const keyInfo =
      detectKeyFromChords(
        extractChordTokens(
          displayedText
        )
      );


    if(partIndex > 0){

      outputLines.push('');

    }


    outputLines.push(
      'Title: "' +
      (part.title || 'Untitled Song') +
      '"'
    );


    if(keyInfo){

      outputLines.push(
        'Key: ' + keyInfo.label
      );

    }


    outputLines.push('');


    sections.forEach(section => {

      outputLines.push(
        '[' + section.name + ']'
      );

      section.lines.forEach(
        line => outputLines.push(line)
      );

      outputLines.push('');

    });

  });


  const text =
    sanitizeForPlainExport(
      outputLines
        .join('\n')
        .replace(/\n{3,}/g,'\n\n')
        .trim() +
      '\n'
    );


  const filename =
    (song.title || 'untitled-song')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-+|-+$)/g,'') ||
    'song';


  const blob =
    new Blob(
      ['\uFEFF' + text],
      { type:'text/plain;charset=utf-8' }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;
  link.download = filename + '.txt';

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);

}

/*
  Drag-to-reorder for the section list on the PDF export
  screen. Dragging starts from the ⠿ handle (no long-press
  needed, since reordering is the primary action here), and
  pointermove/pointerup are tracked on the document so the drag
  keeps working even if the finger moves off the row.
*/

function attachPdfSectionDragging(){

  const list =
    document.getElementById('pdfSectionList');

  if(!list)return;

  let draggingRow = null;
  let dragStartIndex = -1;

  const onMove = event => {

    if(!draggingRow)return;

    event.preventDefault();

    const rows =
      [...list.querySelectorAll('.pdfSectionRow')];

    const target =
      rows.find(row => {

        if(row === draggingRow)return false;

        const rect =
          row.getBoundingClientRect();

        return (
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );

      });

    if(!target)return;

    const currentIndex =
      [...list.children].indexOf(draggingRow);

    const targetIndex =
      [...list.children].indexOf(target);

    if(targetIndex > currentIndex){
      list.insertBefore(draggingRow, target.nextSibling);
    }else{
      list.insertBefore(draggingRow, target);
    }

  };

  const onUp = () => {

    if(!draggingRow)return;

    draggingRow.classList.remove('dragging');

    const finalIndex =
      [...list.children].indexOf(draggingRow);

    if(finalIndex !== dragStartIndex){

      const moved =
        pdfExportSections.splice(dragStartIndex, 1)[0];

      pdfExportSections.splice(finalIndex, 0, moved);

      updatePdfExportPreview();

    }

    draggingRow = null;
    dragStartIndex = -1;

    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);

  };

  list.querySelectorAll('.pdfSectionRow').forEach(row => {

    const handle =
      row.querySelector('.pdfDragHandle');

    if(!handle)return;

    handle.addEventListener('pointerdown', event => {

      event.preventDefault();

      draggingRow = row;

      dragStartIndex =
        [...list.children].indexOf(row);

      row.classList.add('dragging');

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);

    });

  });

}


/*
  Generates the actual PDF from the current export options:
  section order/inclusion, column count, and whether chords are
  included. Lays text out in N columns per page, wrapping to a
  new column (or a new page, once columns run out) as content
  overflows.
*/

function generatePdfFromOptions(){

  if(!currentSong)return;

  if(
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){

    showToast(
      'The PDF library failed to load. Check your connection and try again.',
      'error'
    );

    return;

  }

  const sectionsToExport =
    pdfExportSections.filter(section => !section.excluded);

  if(!sectionsToExport.length){

    showToast(
      'Select at least one section to export.',
      'error'
    );

    return;

  }

  const amount =
    currentSong.transposeSteps || 0;

  const displayedText =
    transposeText(

      currentSong.originalText ||
      currentSong.text ||
      '',

      amount

    );

  const keyInfo =
    detectKeyFromChords(
      extractChordTokens(
        displayedText
      )
    );

  const { jsPDF } =
    window.jspdf;

  const doc =
    new jsPDF({
      unit:'pt',
      format:'letter'
    });

  const columns = pdfExportColumns;
  const pageMargin = 40;
  const columnGap = 18;

  const pageWidth =
    doc.internal.pageSize.getWidth();

  const pageHeight =
    doc.internal.pageSize.getHeight();

  const contentWidth =
    pageWidth - pageMargin * 2;

  const columnWidth =
    (contentWidth - columnGap * (columns - 1)) / columns;

  const fontSize =
    columns === 1 ? 11 : columns === 2 ? 9.5 : 8.5;

  const lineHeight =
    columns === 1 ? 15 : 13;

  const bottomLimit =
    pageHeight - 40;

  let columnIndex = 0;
  let pageTopY = 56;
  let x = pageMargin;
  let y = pageTopY;

  function resetColumnPosition(){
    x = pageMargin + columnIndex * (columnWidth + columnGap);
    y = pageTopY;
  }

  function newPage(){
    doc.addPage();
    columnIndex = 0;
    pageTopY = 56;
    resetColumnPosition();
  }

  function nextColumn(){
    columnIndex++;
    if(columnIndex >= columns){
      newPage();
    }else{
      resetColumnPosition();
    }
  }

  function ensureSpace(next){
    if(y + next > bottomLimit){
      nextColumn();
    }
  }

  /* Title (full width, first page only) */

  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  doc.setTextColor(20,20,20);

  doc.text(
    sanitizeForPlainExport(
      currentSong.title ||
      'Untitled Song'
    ),
    pageMargin,
    y
  );

  y += 26;

  if(keyInfo){

    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(100,100,105);

    doc.text(
      sanitizeForPlainExport(
        'Key: ' + keyInfo.label
      ),
      pageMargin,
      y
    );

    y += 22;

  }else{

    y += 6;

  }

  pageTopY = y;
  resetColumnPosition();

  /* Sections, laid out into columns */

  sectionsToExport.forEach(section => {

    doc.setFont('helvetica','bold');
    doc.setFontSize(fontSize + 1);

    const nameWrapped =
      doc.splitTextToSize(
        sanitizeForPlainExport(
          (section.name || 'Section').toUpperCase()
        ),
        columnWidth
      );

    nameWrapped.forEach(line => {

      ensureSpace(lineHeight);

      doc.setTextColor(60,60,65);

      doc.text(
        line,
        x,
        y
      );

      y += lineHeight;

    });

    y += 2;

    doc.setFont('courier','normal');
    doc.setFontSize(fontSize);

    const lines =
      section.lines
        .filter(line => line.trim() !== '')
        .filter(line => pdfExportIncludeChords || !isChordOnlyLine(line));

    lines.forEach(rawLine => {

      const line =
        sanitizeForPlainExport(
          rawLine.length
            ? rawLine
            : ' '
        );

      const isChord =
        isChordOnlyLine(line);

      const wrapped =
        doc.splitTextToSize(
          line,
          columnWidth
        );

      wrapped.forEach(part => {

        ensureSpace(lineHeight);

        if(isChord){

          doc.setTextColor(37,99,209);
          doc.setFont('courier','bold');

        }else{

          doc.setTextColor(25,25,28);
          doc.setFont('courier','normal');

        }

        doc.text(
          part,
          x,
          y
        );

        y += lineHeight;

      });

    });

    y += columns === 1 ? 10 : 8;

  });

  const filename =
    (currentSong.title || 'untitled-song')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-+|-+$)/g,'') ||
    'song';

  doc.save(
    filename + '.pdf'
  );

}

function duplicateEditorSection(button){
  const section=button.closest('[data-editor-section]');
  if(!section)return;
  const clone=section.cloneNode(true);
  section.parentElement.insertBefore(clone,section.nextSibling);
}


function moveEditorSection(
  button,
  direction
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(!section){

    return;

  }


  const container =
    section.parentElement;


  const sections =
    [...container.children];


  const index =
    sections.indexOf(
      section
    );


  const target =
    index + direction;


  if(
    target < 0 ||
    target >= sections.length
  ){

    return;

  }


  if(
    direction < 0
  ){

    container.insertBefore(
      section,
      sections[target]
    );

  }else{

    container.insertBefore(
      sections[target],
      section
    );

  }

}


function deleteEditorSection(
  button
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(section){

    section.remove();

  }

}

        .value;


    if(
      name ||
      text.trim()
    ){

      output.push(
        name || 'Section'
      );


      output.push(
        text
      );


      output.push('');

    }

  });


  const text =
    output.join('\n')
      .replace(
        /\n{3,}/g,
        '\n\n'
      )
      .trim();


  currentSong.originalText =
    text;


  currentSong.text =
    text;


  currentSong.analysis =
    analyzeFocusedSong(
      text
    );

  currentSong.sectionOrder =
    parseSections(text).map((section,index) =>
      String(index) + '|' + String(section.name || 'Section').trim().toLowerCase()
    );


  if(currentSong.mergeParts){

    delete currentSong.mergeParts;

    delete currentSong.activePartIndex;

  }


  saveCurrentSong();

}

            item =>

              },
              550
            );

        }
      );


      card.addEventListener(
        'pointerup',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointerleave',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointercancel',

            pressTimer
          );

        }
      );

              `"${song.title}" — your version is now the shared one.`,

async function renameSongById(songId){

  const songs =
    getSongs();

  const song =
    songs.find(
      item => item.id === songId
    );

  if(!song)return;


  const nextTitle =
    await showPromptDialog(
      'Song title:',
      song.title || ''
    );

  if(nextTitle === null)return;


  const trimmed =
    nextTitle.trim();

  if(!trimmed)return;


  song.title =
    trimmed;

  song.updatedAt =
    new Date().toISOString();

  writeSongs(songs);


  librarySelectedIds.clear();

  renderLibrary();

}


/*
  Merge 2–10 selected songs into a single new saved song,
  combining their lyrics/chords in the order they were
  selected — whichever song was long-pressed/tapped first
  becomes song 1, the second tapped becomes song 2, etc.
  Originals are left untouched so nothing is lost if the merge
  isn't what the user wanted.
*/

async function mergeSongsByIds(ids){

  const songsById =
    new Map(
      getSongs().map(song => [song.id, song])
    );

  const ordered =
    ids
      .map(id => songsById.get(id))
      .filter(Boolean);

  if(ordered.length < 2)return;


  const suggestedTitle =
    ordered
      .map(song => song.title)
      .join(' + ')
      .slice(0,120);

  const nextTitle =
    await showPromptDialog(
      'Merged song title:',
      suggestedTitle
    );

  if(nextTitle === null)return;


  const title =
    nextTitle.trim() ||
    suggestedTitle;

  const parts =
    ordered.map(song => ({
      title: song.title || 'Untitled Song',
      text: song.originalText || song.text || ''
    }));

  const merged =
    saveMergedSongParts(
      title,
      parts
    );


  librarySelectedIds.clear();

  showToast(
    `Merged ${ordered.length} songs into "${merged.title}".`,
    'success'
  );

  renderLibrary();

}


/*
  Saves a set of song parts as a single merged song — used by
  both the manual Library "Merge" action above and by importing
  a text file that contains more than one "Title:" marker (see
  parseSongTextFile). Tags the saved song with mergeParts so the
  viewer opens it as a swipeable set of pages, one per part.
*/

function saveMergedSongParts(title, parts){

  const combinedText =
    parts
      .map(part => part.text)
      .join('\n\n');

  const merged =
    saveSong(
      title,
      combinedText
    );

  merged.mergeParts = parts;
  merged.activePartIndex = 0;

  const allSongs = getSongs();

  const mergedIndex =
    allSongs.findIndex(item => item.id === merged.id);

  if(mergedIndex !== -1){

    allSongs[mergedIndex] = merged;

    writeSongs(allSongs.slice(0,MAX_SONGS));

  }

  return merged;

}


function toggleLibrarySelection(songId){

  if(librarySelectedIds.has(songId)){

    librarySelectedIds.delete(songId);

  }else{

    if(librarySelectedIds.size >= 10)return;

    librarySelectedIds.add(songId);

  }

  renderLibrary();

}


function exitLibrarySelectMode(){

  librarySelectedIds.clear();

  renderLibrary();

}

      return (
        !searchText ||
        content.includes(
          searchText

      );

    });


  let html = '';


  /* =======================================================
     LOCAL / DRIVE
  ====================================================== */

  if(
    source === 'all' ||
    source === 'drive'
  ){

    html += `

      <div class="result">

        <div class="resultTitle">
          Saved Songs
        </div>


        <div class="resultMeta">

          ${
            list.length
              ? 'Songs matching your search'

            .map(song => `

                <button
                  class="smallBtn toolbarBtn primary"
                  data-open="${esc(song.id)}"
                >
                  Open ${esc(song.title)}
                </button>

              </div>

            `)
            .join('')
        }


        ${
          source === 'drive'
          ? (
            getGoogleUser()
            ? `
              <div class="driveStatus">
                ✅ Connected as ${esc(getGoogleUser().email || getGoogleUser().name)}.
                Drive song search is coming soon — for now, use
                Import or Analyze to bring a song in.
              </div>
            `
            : `
              <div class="driveStatus">
                🔐 Google Drive isn't connected yet. Sign in from
                Profile → Account, then Search will look up
                matching songs in your Drive.
              </div>
            `
          )
          : ''
        }

      </div>

    `;

  }


  /* =======================================================
     ULTIMATE GUITAR
  ====================================================== */

  if(
    source === 'ug'
  ){

    html += `

      <div class="result">

        <div class="resultTitle">
          Ultimate Guitar
        </div>


        <div class="resultMeta">

          Type a song title and tap Search to look it up on
          Ultimate Guitar, or paste a direct chord-page URL
          to import it — lyrics and chords are detected
          automatically.

        </div>

        ${
          ugAwaitingPaste
            ? `
              <div class="ugPasteHint">
                <div class="ugPasteHintText">
                  Ultimate Guitar opened in a new tab. Find your
                  song, copy its chord-page link, then paste it
                  back here to import it.
                </div>
                <button type="button" class="toolbarBtn primary ugPasteBtn" id="ugPasteBtn">
                  Paste link
                </button>
              </div>
            `
            : ''
        }


        <div id="ugResult"></div>

      </div>

    `;

  }


  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      html ||
      '<div class="empty">No results.</div>';


  document
    .querySelectorAll(
      '[data-open]'
    )
    .forEach(button => {

      button.onclick = () => {

        const song =
          getSongs().find(
            item =>
              item.id ===
              button.dataset.open
          );


        if(song){

          openSong(song);

        }

      };

    });


  const ugPasteBtn =
    document.getElementById(
      'ugPasteBtn'
    );

  if(ugPasteBtn){

    ugPasteBtn.onclick = async () => {

      if(
        !navigator.clipboard ||
        !navigator.clipboard.readText
      ){

        /*
          Clipboard read isn't available/permitted (older
          browser, insecure context, or the user hasn't
          granted permission) — just focus the field so a
          manual paste (Ctrl+V, or long-press → Paste on
          mobile) is one tap away.
        */

        query.focus();

        return;

      }


      try{

        const clipboardText =
          (await navigator.clipboard.readText())
            .trim();

        if(clipboardText){

          query.value =
            clipboardText;

          if(looksLikeUrl(clipboardText)){

            handleTopSearch();

            return;

          }

        }

        query.focus();

      }catch(error){

        query.focus();

      }

    };

  }

}


/* =========================================================
   TOP SEARCH BAR — one input, behavior depends on the
   active source tab (All / Google Drive / Ultimate Guitar)
========================================================= */

function looksLikeUrl(value){

  return /^https?:\/\//i.test(
    value.trim()
  );

}


function handleTopSearch(){

  const value =
    query.value.trim();


  if(source === 'ug'){

    if(!value){

      renderResults();

      return;

    }


    if(looksLikeUrl(value)){

      /*
        Make sure #ugResult exists in the DOM before we try
        to write status/progress into it.
      */

      ugAwaitingPaste =
        false;

      renderResults();


      importFromUG(value);


      return;

    }


    /*
      No scraping/search API for Ultimate Guitar's catalog —
      only a direct-URL importer (/api/import) exists. So a
      plain title search opens UG's own search page; the user
      copies the chord-page link back here to import it, which
      auto-detects the lyrics and chords.
    */

    window.open(

      'https://www.ultimate-guitar.com/search.php?search_type=title&value=' +
      encodeURIComponent(value),

      '_blank'

    );


    ugAwaitingPaste =
      true;

    query.value =
      '';

    renderResults();

    query.focus();


    return;

  }


  /*
    'all' and 'drive' both just filter/search — Drive search
    itself is a placeholder until Drive OAuth is connected.
  */

  renderResults();

}


/* =========================================================
   ULTIMATE GUITAR IMPORT
   Given a direct chord-page URL, fetches the page through
   the backend importer, then automatically detects the
   song's lyrics and chords via the same analyzer used for
   pasted-in songs, and saves it straight to the Library.
========================================================= */

async function importFromUG(url){

  const box =
    document.getElementById(
      'ugResult'
    );


  if(!box){

    return;

  }


  try{

    const parsedUrl =
      new URL(url);


    if(
      !parsedUrl.hostname.endsWith(
        'ultimate-guitar.com'
      )
    ){

      throw new Error(
        'Please use an Ultimate Guitar URL.'
      );

    }

  }catch(error){

    box.innerHTML =
      '<div class="hint">' +
      esc(
        error.message ||
        "That doesn't look like a valid URL."
      ) +
      '</div>';

    return;

  }


  box.innerHTML =
    '<div class="hint">⏳ Loading song...</div>';


  try{

    const response =
      await fetch(
        '/api/import',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              url
            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if(!response.ok){

      throw new Error(

        data.error ||
        `Importer returned HTTP ${response.status}`

      );

    }


    const raw =
      (
        url.split('/').pop() ||
        'Ultimate Guitar Song'
      )
      .replace(
        /[-_]/g,
        ' '
      );


    const title =
      raw
        .replace(
          /\s+chords?\s+\d+.*$/i,
          ''
        )
        .replace(
          /\s+\d+.*$/,
          ''
        )
        .trim()
        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );


    const importedText =
      decodeHtmlEntities(
        data.text || ''
      );


    /*
      Immediately analyze the imported song — this is what
      detects the section structure, lyrics, and chords.
    */

    const analysis =
      analyzeFocusedSong(
        importedText
      );


    /*
      Don't save to the Library yet — importing is just a
      preview. It only becomes a Library entry if the user
      opens it and taps Save (same pattern as the "Open Lyrics"
      preview from the Analyzer). Opening it does add it to
      Recent Songs, though.
    */

    const song = {

      id:
        'preview-' +
        (
          window.crypto &&
          crypto.randomUUID
            ? crypto.randomUUID()
            : String(
                Date.now() +
                Math.random()
              )
        ),

      title:
        title ||
        'Untitled Song',

      text:
        importedText,

      originalText:
        importedText,

      sourceUrl:
        data.sourceUrl || url,

      analysis,

      transposeSteps:
        0,

      fontSize:
        getSettings().defaultFontSize

    };


    box.innerHTML = `

      <div class="hint">

        ✅ "${esc(song.title)}" imported —
        lyrics and chords detected automatically.
        Open it and tap Save to add it to your Library.

      </div>


      <div class="resultActions">

        <button
          class="smallBtn toolbarBtn primary"
          id="openImportedSong"
        >
          Open Song
        </button>

      </div>

    `;


    document
      .getElementById(
        'openImportedSong'
      )
      .onclick =
        () => openSong(song);


  }catch(error){

    box.innerHTML =
      '<div class="hint">⚠️ ' +
      esc(

        error.message ||
        'Something went wrong importing this song.'

      ) +
      '</div>';

  }

}


/* =========================================================
   GLOBAL BINDINGS / INIT
========================================================= */

document
  .getElementById('closeSearch')
  .onclick =
    () => modal.classList.remove('open');


/* Clicking the dimmed backdrop (not the sheet itself) closes it. */

modal.addEventListener(
  'click',
  event => {

    if(event.target === modal){

      modal.classList.remove('open');

    }

  }
);


document
  .getElementById('runSearch')
  .onclick =
    handleTopSearch;


query.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Enter'){

      event.preventDefault();

      handleTopSearch();

    }

  }
);


document
  .querySelectorAll(
    '.sourceTabs button'
  )
  .forEach(button => {

    button.onclick = () => {

      source =
        button.dataset.source;

      ugAwaitingPaste =
        false;

      document
        .querySelectorAll(
          '.sourceTabs button'
        )
        .forEach(tab => {

          tab.classList.toggle(
            'active',
            tab === button
          );

        });

      renderResults();

    };

  });


document
  .querySelectorAll(
    '.nav button[data-screen]'
  )
  .forEach(button => {

    button.onclick = () => {

      const target =
        button.dataset.screen;

      if(target === 'home'){

        renderHome();

      }else if(target === 'lyrics'){

        currentSong
          ? renderSongViewer()
          : renderLyrics();

      }else if(target === 'library'){

        renderLibrary();

      }else if(target === 'profile'){

        renderProfile();

      }

    };

  });


renderHome();


/*
  Fade out the startup splash once the home screen has actually
  rendered. The minimum-display timer keeps it from flashing by
  too quickly on fast loads; the fallback removal guarantees it
  never gets stuck on screen even if something above throws.
*/

(function hideStartupSplash(){

  const splash = document.getElementById('startupSplash');
  if(!splash) return;

  const dismiss = () => {
    splash.classList.add('splashHidden');
    setTimeout(() => splash.remove(), 1000);
  };

  setTimeout(dismiss, 3500);

})();


/*
  If we already have a Google account on file, try to pick the
  session back up quietly (no popup) and pull in any brand-new
  songs the other people have saved — never overwrites a song
  already in this Library. If the silent grab fails — say, the
  browser blocked it — nothing breaks; signing in again from
  Profile covers it.
*/

async function initGoogleSyncOnLoad(){

  const user =
    getGoogleUser();

  const clientId =
    getSettings().googleClientId.trim();

  if(!user || !clientId){

    return;

  }

  try{

    await loadGoogleScript();

  }catch(error){

    console.error(error);
    return;

  }

  googleTokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: clientId,

      scope: GOOGLE_DRIVE_SCOPE,

      callback: (response) => {

        if(response.error){

          console.error(
            'Silent Google sign-in failed:',
            response.error
          );

          return;

        }

        googleAccessToken =
          response.access_token;

        pullNewSongsFromDrive();

      }

    });

  googleTokenClient.requestAccessToken({
    prompt: ''
  });

}


initGoogleSyncOnLoad();


/*
  Register the service worker so Chrome/Android offers
  "Install app" / "Add to Home Screen" and the app can open
  even with a spotty connection. It only caches the app shell
  (this HTML file) — Drive sync, imports, and search still go
  over the network like normal, so nothing here changes app
  behavior when you're online.
*/

if('serviceWorker' in navigator){

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('/sw.js')
      .catch(error => {

        console.error(
          'Service worker registration failed:',
          error
        );

      });

  });

}

</script>
