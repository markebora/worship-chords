<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Worship Chords</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f7f7f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
button,input{font:inherit}.app{width:100%;max-width:920px;min-height:100vh;background:#111113;position:relative;padding-bottom:82px}.top{padding:24px 22px 0}.welcome{font-size:15px;color:#a7a7ad;font-weight:600;letter-spacing:.01em}.hero{text-align:center;padding:58px 20px 80px}.hero h1{margin:0;font-size:42px;line-height:1.05;font-weight:800;letter-spacing:-.03em}.hero p{margin:10px 0 0;color:#a7a7ad;font-size:15px;font-weight:500}.content{padding:0 22px}.placeholder{min-height:360px;display:flex;align-items:center;justify-content:center;color:#66666d;font-size:14px;text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(920px,100%);height:72px;background:rgba(22,22,24,.97);border-top:1px solid #2a2a2e;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;color:#85858c;font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav button.active{color:#fff}.icon{font-size:20px;line-height:1}@media(min-width:700px){.nav{border-radius:16px 16px 0 0}.hero{padding-top:70px}.hero h1{font-size:48px}}
.libraryHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.libraryTitle{font-size:28px;font-weight:800}.searchBtn{width:44px;height:44px;border:1px solid #303036;border-radius:14px;background:#1a1a1d;color:#fff;display:grid;place-items:center;font-size:21px;cursor:pointer}.librarySection{margin:22px 0}.sectionLabel{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#77777f;font-weight:800;margin-bottom:9px}.songCard{display:flex;align-items:center;gap:12px;padding:14px 15px;margin:8px 0;background:#18181b;border:1px solid #29292e;border-radius:14px}.songIcon{width:38px;height:38px;border-radius:10px;background:#232328;display:grid;place-items:center;font-size:18px}.songInfo{flex:1;min-width:0}.songName{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.songMeta{font-size:12px;color:#777780;margin-top:3px}.songAction{border:0;background:#25252a;color:#ddd;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.empty{padding:18px;border:1px dashed #303036;border-radius:14px;color:#707078;font-size:13px;text-align:center}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal{width:min(920px,100%);max-height:88vh;overflow:auto;background:#151518;border:1px solid #2d2d32;border-radius:22px 22px 0 0;padding:20px}.modalTop{display:flex;align-items:center;gap:12px}.modalTop h2{margin:0;font-size:20px;flex:1}.closeBtn{border:0;background:#242429;color:#ddd;border-radius:10px;padding:9px 12px;cursor:pointer}.searchBox{display:flex;gap:8px;margin:16px 0 12px}.searchInput{flex:1;min-width:0;background:#0e0e10;border:1px solid #34343a;color:#fff;border-radius:12px;padding:13px 14px;outline:none}.goBtn{border:0;background:#fff;color:#111;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}.sourceTabs{display:flex;gap:8px;margin-bottom:14px}.sourceTabs button{flex:1;border:1px solid #303036;background:#1b1b1f;color:#9999a2;border-radius:10px;padding:10px;font-size:12px;font-weight:750;cursor:pointer}.sourceTabs button.active{background:#29292e;color:#fff;border-color:#44444b}.result{padding:13px 0;border-top:1px solid #29292e}.result:first-child{border-top:0}.resultTitle{font-weight:750}.resultMeta{font-size:12px;color:#777780;margin-top:3px}.resultActions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.smallBtn{border:0;background:#29292e;color:#eee;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.smallBtn.primary{background:#fff;color:#111}.hint{color:#777780;font-size:12px;line-height:1.5;margin-top:8px}.driveStatus{padding:12px;background:#1a1a1d;border-radius:12px;color:#aaa;font-size:13px;line-height:1.5}.viewer{padding:18px;background:#0e0e10;border:1px solid #29292e;border-radius:14px;white-space:pre-wrap;font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.backLibrary{border:0;background:#25252a;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;margin-bottom:14px}
.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="welcome">Welcome!</div></div>
  <section class="hero"><h1>Disciples</h1><p>Soli Deo Gloria</p></section>
  <main class="content" id="screen"><div class="placeholder">Your songs and tools will appear here.</div></main>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-screen="home"><span class="icon">⌂</span><span>Home</span></button>
    <button data-screen="library"><span class="icon">▱</span><span>Library</span></button>
    <button data-screen="lyrics"><span class="icon">♫</span><span>Lyrics</span></button>
    <button data-screen="menu"><span class="icon">☰</span><span>Menu</span></button>
  </nav>
</div>
<div class="modalBack" id="searchModal"><div class="modal" role="dialog" aria-modal="true">
  <div class="modalTop"><h2>Search Library</h2><button class="closeBtn" id="closeSearch">Close</button></div>
  <div class="searchBox"><input class="searchInput" id="libraryQuery" placeholder="Search song title..." autocomplete="off"><button class="goBtn" id="runSearch">Search</button></div>
  <div class="sourceTabs"><button class="active" data-source="all">All</button><button data-source="drive">Google Drive</button><button data-source="ug">Ultimate Guitar</button></div>
  <div id="searchResults"><div class="hint">Search your saved songs here. Google Drive connection will be enabled once your Drive OAuth/client configuration is added.</div></div>
</div></div>
<script>
const screen=document.getElementById('screen');
const searchModal=document.getElementById('searchModal');
const queryInput=document.getElementById('libraryQuery');
let searchSource='all';
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function getSavedSongs(){
  try{return JSON.parse(localStorage.getItem('worshipChordsSongs')||'[]')}catch{return[]}
}
function saveImportedSong(title,text,sourceUrl){
  const songs=getSavedSongs();
  const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:title||'Untitled Song',text:text||'',sourceUrl:sourceUrl||'',savedAt:new Date().toISOString(),kind:'analyzed'};
  songs.unshift(item);localStorage.setItem('worshipChordsSongs',JSON.stringify(songs.slice(0,200)));return item;
}
function openSongTab(song){
  const tab=window.open('about:blank','_blank');
  if(!tab){alert('Please allow pop-ups for Worship Chords to open songs in a new tab.');return}
  const title=escapeHtml(song.title||'Song');
  const text=escapeHtml(song.text||'No song content saved.');
  tab.document.write(`<!doctype html><html><head><title>${title} — Worship Chords</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b0b0c;color:#eee;font-family:system-ui;padding:24px}.wrap{max-width:820px;margin:auto}.meta{color:#888;font-size:13px;margin:6px 0 20px}.song{background:#111113;border:1px solid #29292e;border-radius:14px;padding:18px;white-space:pre-wrap;font:15px/1.7 ui-monospace,monospace;overflow:auto}a{color:#aaa}</style></head><body><div class="wrap"><h1>${title}</h1><div class="meta">${song.kind==='analyzed'?'Analyzed / Saved Song':'Loaded Song'}${song.sourceUrl?` · <a href="${escapeHtml(song.sourceUrl)}" target="_blank" rel="noopener">Source</a>`:''}</div><div class="song">${text}</div></div></body></html>`);tab.document.close();
}
function renderLibrary(){
  const songs=getSavedSongs();
  screen.innerHTML=`<div class="libraryHead"><div class="libraryTitle">Library</div><button class="searchBtn" id="openSearch" aria-label="Search library">⌕</button></div>
  <div class="librarySection"><div class="sectionLabel">Saved & Analyzed Songs</div>${songs.length?songs.map(s=>`<div class="songCard"><div class="songIcon">♫</div><div class="songInfo"><div class="songName">${escapeHtml(s.title)}</div><div class="songMeta">${s.kind==='analyzed'?'Analyzed':'Saved'}${s.savedAt?' · '+new Date(s.savedAt).toLocaleDateString():''}</div></div><button class="songAction" data-open="${escapeHtml(s.id)}">Open</button></div>`).join(''):`<div class="empty">No saved songs yet.<br>Analyzed songs will appear here when we connect the analyzer save function.</div>`}</div>
  <div class="librarySection"><div class="sectionLabel">Sources</div><div class="songCard"><div class="songIcon">G</div><div class="songInfo"><div class="songName">Google Drive</div><div class="songMeta">Search your saved song files</div></div><button class="songAction" id="driveSearch">Search</button></div><div class="songCard"><div class="songIcon">UG</div><div class="songInfo"><div class="songName">Ultimate Guitar</div><div class="songMeta">Load chord pages into the analyzer</div></div><button class="songAction" id="ugSearch">Search</button></div></div>`;
  document.getElementById('openSearch').onclick=()=>openSearch('all');
  document.getElementById('driveSearch').onclick=()=>openSearch('drive');
  document.getElementById('ugSearch').onclick=()=>openSearch('ug');
  screen.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const s=songs.find(x=>x.id===b.dataset.open);if(s)openSongTab(s)});
}
function openSearch(source='all'){searchSource=source;searchModal.style.display='flex';document.querySelectorAll('.sourceTabs button').forEach(b=>b.classList.toggle('active',b.dataset.source===source));queryInput.focus();renderSearchResults();}
function closeSearch(){searchModal.style.display='none'}
function renderSearchResults(){
  const q=queryInput.value.trim().toLowerCase();
  const songs=getSavedSongs().filter(s=>!q||String(s.title+' '+s.text).toLowerCase().includes(q));
  let html='';
  if(searchSource==='all'||searchSource==='drive'){
    html+=`<div class="result"><div class="resultTitle">Google Drive</div><div class="resultMeta">${songs.length?'Saved songs matching your search':'No matching saved songs in this device'}</div>${songs.map(s=>`<div class="resultActions"><button class="smallBtn primary" data-search-open="${escapeHtml(s.id)}">Open ${escapeHtml(s.title)}</button></div>`).join('')}<div class="driveStatus" style="margin-top:10px">🔐 Google Drive OAuth is the next connection step. The UI is ready, but your private Drive cannot be searched until a Google OAuth client ID is configured.</div></div>`;
  }
  if(searchSource==='all'||searchSource==='ug'){
    const encoded=encodeURIComponent(q||'');
    const ugSearchUrl='https://www.ultimate-guitar.com/search.php?search_type=title&value='+encoded;
    html+=`<div class="result"><div class="resultTitle">Ultimate Guitar</div><div class="resultMeta">${q?'Search Ultimate Guitar for “'+escapeHtml(q)+'”':'Enter a song title above'}</div><div class="resultActions"><button class="smallBtn primary" id="ugWebSearch">Search Ultimate Guitar</button></div><div class="hint">You can also paste a direct Ultimate Guitar chord-page link to load and analyze it.</div><div class="searchBox" style="margin-top:10px"><input class="searchInput" id="ugUrlInput" placeholder="https://tabs.ultimate-guitar.com/..." value=""><button class="goBtn" id="loadUgUrl">Load</button></div><div id="ugLoadResult"></div></div>`;
  }
  document.getElementById('searchResults').innerHTML=html||'<div class="empty">No results.</div>';
  document.querySelectorAll('[data-search-open]').forEach(b=>b.onclick=()=>{const s=getSavedSongs().find(x=>x.id===b.dataset.searchOpen);if(s)openSongTab(s)});
  const webBtn=document.getElementById('ugWebSearch');if(webBtn)webBtn.onclick=()=>{const url='https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent(queryInput.value.trim());window.open(url,'_blank','noopener')};
  const loadBtn=document.getElementById('loadUgUrl');if(loadBtn)loadBtn.onclick=loadUltimateGuitar;
}
async function loadUltimateGuitar(){
  const input=document.getElementById('ugUrlInput'),box=document.getElementById('ugLoadResult');const url=(input?.value||'').trim();if(!url)return;
  try{const host=new URL(url).hostname;if(!host.endsWith('ultimate-guitar.com'))throw new Error('Please use an Ultimate Guitar URL.');}catch(e){box.innerHTML='<div class="hint">'+escapeHtml(e.message)+'</div>';return}
  box.innerHTML='<div class="hint">⏳ Loading song...</div>';
  try{const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Importer failed');const title=(url.split('/').pop()||'Ultimate Guitar Song').replace(/[-_]/g,' ');const song=saveImportedSong(title,data.text||'',data.sourceUrl||url);localStorage.setItem('worshipChordsSourceUrl',data.sourceUrl||url);localStorage.setItem('worshipChordsImportedText',data.text||'');box.innerHTML='<div class="hint">✅ Song loaded and saved to Library.</div><div class="resultActions"><button class="smallBtn primary" id="openLoaded">Open in new tab</button></div>';document.getElementById('openLoaded').onclick=()=>openSongTab(song);}catch(e){box.innerHTML='<div class="hint">⚠️ '+escapeHtml(e.message)+'</div>'}
}
queryInput.addEventListener('input',()=>renderSearchResults());document.getElementById('runSearch').onclick=renderSearchResults;document.getElementById('closeSearch').onclick=closeSearch;searchModal.addEventListener('click',e=>{if(e.target===searchModal)closeSearch()});document.querySelectorAll('.sourceTabs button').forEach(b=>b.addEventListener('click',()=>{searchSource=b.dataset.source;document.querySelectorAll('.sourceTabs button').forEach(x=>x.classList.toggle('active',x===b));renderSearchResults()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});

document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');const name=button.dataset.screen;if(name==='library')renderLibrary();else screen.innerHTML='<div class="placeholder">'+name.charAt(0).toUpperCase()+name.slice(1)+' screen — ready to connect.</div>';}));
window.addEventListener('worshipchords:song-saved',e=>{if(e.detail)saveImportedSong(e.detail.title,e.detail.text,e.detail.sourceUrl);});
</script>
</body>
</html>
