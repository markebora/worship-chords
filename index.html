/*
  Drag-to-reorder for the section list on the PDF export
  screen. Dragging starts from the ⠿ handle (no long-press
  needed, since reordering is the primary action here), and
  pointermove/pointerup are tracked on the document so the drag
  keeps working even if the finger moves off the row.
*/

function attachPdfSectionDragging(){

  const list =
    document.getElementById('pdfSectionList');

  if(!list)return;

  let draggingRow = null;
  let dragStartIndex = -1;

  const onMove = event => {

    if(!draggingRow)return;

    event.preventDefault();

    const rows =
      [...list.querySelectorAll('.pdfSectionRow')];

    const target =
      rows.find(row => {

        if(row === draggingRow)return false;

        const rect =
          row.getBoundingClientRect();

        return (
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );

      });

    if(!target)return;

    const currentIndex =
      [...list.children].indexOf(draggingRow);

    const targetIndex =
      [...list.children].indexOf(target);

    if(targetIndex > currentIndex){
      list.insertBefore(draggingRow, target.nextSibling);
    }else{
      list.insertBefore(draggingRow, target);
    }

  };

  const onUp = () => {

    if(!draggingRow)return;

    draggingRow.classList.remove('dragging');

    const finalIndex =
      [...list.children].indexOf(draggingRow);

    if(finalIndex !== dragStartIndex){

      const moved =
        pdfExportSections.splice(dragStartIndex, 1)[0];

      pdfExportSections.splice(finalIndex, 0, moved);

      updatePdfExportPreview();

    }

    draggingRow = null;
    dragStartIndex = -1;

    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);

  };

  list.querySelectorAll('.pdfSectionRow').forEach(row => {

    const handle =
      row.querySelector('.pdfDragHandle');

    if(!handle)return;

    handle.addEventListener('pointerdown', event => {

      event.preventDefault();

      draggingRow = row;

      dragStartIndex =
        [...list.children].indexOf(row);

      row.classList.add('dragging');

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);

    });

  });

}


/*
  Generates the actual PDF from the current export options:
  section order/inclusion, column count, and whether chords are
  included. Lays text out in N columns per page, wrapping to a
  new column (or a new page, once columns run out) as content
  overflows.
*/

function generatePdfFromOptions(){

  if(!currentSong)return;

  if(
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){

    showToast(
      'The PDF library failed to load. Check your connection and try again.',
      'error'
    );

    return;

  }

  const sectionsToExport =
    pdfExportSections.filter(section => !section.excluded);

  if(!sectionsToExport.length){

    showToast(
      'Select at least one section to export.',
      'error'
    );

    return;

  }

  const isMerged =
    Array.isArray(currentSong.mergeParts) &&
    currentSong.mergeParts.length > 1;

  const pdfSource =
    isMerged
      ? currentSong.mergeParts[clampMergedPartIndex(currentSong)]
      : currentSong;

  const amount =
    (isMerged ? pdfSource.transposeSteps : currentSong.transposeSteps) || 0;

  const displayedText =
    transposeText(

      pdfSource.originalText ||
      pdfSource.text ||
      '',

      amount

    );

  const keyInfo =
    detectKeyFromChords(
      extractChordTokens(
        displayedText
      )
    );

  const { jsPDF } =
    window.jspdf;

  const doc =
    new jsPDF({
      unit:'pt',
      format:pdfExportPageSize === 'a4' ? 'a4' : pdfExportPageSize === 'legal' ? 'legal' : 'letter'
    });

  const columns = pdfExportColumns;
  const pageMargin = 40;
  const columnGap = 18;

  const pageWidth =
    doc.internal.pageSize.getWidth();

  const pageHeight =
    doc.internal.pageSize.getHeight();

  const contentWidth =
    pageWidth - pageMargin * 2;

  const columnWidth =
    (contentWidth - columnGap * (columns - 1)) / columns;

  const fontSize =
    columns === 1 ? 11 : columns === 2 ? 9.5 : 8.5;

  const lineHeight =
    columns === 1 ? 15 : 13;

  const bottomLimit =
    pageHeight - 40;

  let columnIndex = 0;
  let pageTopY = 56;
  let x = pageMargin;
  let y = pageTopY;

  function resetColumnPosition(){
    x = pageMargin + columnIndex * (columnWidth + columnGap);
    y = pageTopY;
  }

  function newPage(){
    doc.addPage();
    columnIndex = 0;
    pageTopY = 56;
    resetColumnPosition();
  }

  function nextColumn(){
    columnIndex++;
    if(columnIndex >= columns){
      newPage();
    }else{
      resetColumnPosition();
    }
  }

  function ensureSpace(next){
    if(y + next > bottomLimit){
      nextColumn();
    }
  }

  /* Title (full width, first page only) */

  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  doc.setTextColor(20,20,20);

  doc.text(
    sanitizeForPlainExport(
      pdfSource.title ||
      currentSong.title ||
      'Untitled Song'
    ),
    pageMargin,
    y
  );

  y += 26;

  if(keyInfo){

    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(100,100,105);

    doc.text(
      sanitizeForPlainExport(
        'Key: ' + keyInfo.label
      ),
      pageMargin,
      y
    );

    y += 22;

  }else{

    y += 6;

  }

  pageTopY = y;
  resetColumnPosition();

  /* Sections, laid out into columns */

  sectionsToExport.forEach(section => {

    doc.setFont('helvetica','bold');
    doc.setFontSize(fontSize + 1);

    const nameWrapped =
      doc.splitTextToSize(
        sanitizeForPlainExport(
          (section.name || 'Section').toUpperCase()
        ),
        columnWidth
      );

    nameWrapped.forEach(line => {

      ensureSpace(lineHeight);

      doc.setTextColor(60,60,65);

      doc.text(
        line,
        x,
        y
      );

      y += lineHeight;

    });

    y += 2;

    doc.setFont('courier','normal');
    doc.setFontSize(fontSize);

    const lines =
      section.lines
        .filter(line => line.trim() !== '')
        .filter(line => pdfExportIncludeChords || !isChordOnlyLine(line));

    lines.forEach(rawLine => {

      const line =
        sanitizeForPlainExport(
          rawLine.length
            ? rawLine
            : ' '
        );

      const isChord =
        isChordOnlyLine(line);

      const wrapped =
        doc.splitTextToSize(
          line,
          columnWidth
        );

      wrapped.forEach(part => {

        ensureSpace(lineHeight);

        if(isChord){

          doc.setTextColor(37,99,209);
          doc.setFont('courier','bold');

        }else{

          doc.setTextColor(25,25,28);
          doc.setFont('courier','normal');

        }

        doc.text(
          part,
          x,
          y
        );

        y += lineHeight;

      });

    });

    y += columns === 1 ? 10 : 8;

  });

  const filename =
    (currentSong.title || 'untitled-song')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-+|-+$)/g,'') ||
    'song';

  doc.save(
    filename + '.pdf'
  );

}

function addEditorSection(){

  const select =
    document.getElementById(
      'sectionTypeSelect'
    );


  const name =
    select
      ? select.value
      : 'Verse';


  const container =
    document.getElementById(
      'editorSections'
    );


  if(!container){

    return;

  }


  const wrapper =
    document.createElement('div');


  wrapper.innerHTML =
    editorSectionHTML(
      {
        name,
        lines:[]
      },
      container.children.length
    );


  container.appendChild(
    wrapper.firstElementChild
  );

}


function duplicateEditorSection(button){
  const section=button.closest('[data-editor-section]');
  if(!section)return;
  const clone=section.cloneNode(true);
  section.parentElement.insertBefore(clone,section.nextSibling);
}


function moveEditorSection(
  button,
  direction
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(!section){

    return;

  }


  const container =
    section.parentElement;


  const sections =
    [...container.children];


  const index =
    sections.indexOf(
      section
    );


  const target =
    index + direction;


  if(
    target < 0 ||
    target >= sections.length
  ){

    return;

  }


  if(
    direction < 0
  ){

    container.insertBefore(
      section,
      sections[target]
    );

  }else{

    container.insertBefore(
      sections[target],
      section
    );

  }

}


function deleteEditorSection(
  button
){

  const section =
    button.closest(
      '[data-editor-section]'
    );


  if(section){

    section.remove();

  }

}


function saveEditorChanges(){

  const sections =
    document
      .querySelectorAll(
        '[data-editor-section]'
      );


  const output = [];


  sections.forEach(section => {

    const name =
      section
        .querySelector(
          '.sectionType'
        )
        .value
        .trim();


    const text =
      section
        .querySelector(
          '.editorTextarea'
        )
        .value;


    if(
      name ||
      text.trim()
    ){

      output.push(
        name || 'Section'
      );


      output.push(
        text
      );


      output.push('');

    }

  });


  const text =
    output.join('\n')
      .replace(
        /\n{3,}/g,
        '\n\n'
      )
      .trim();


  currentSong.originalText =
    text;


  currentSong.text =
    text;


  currentSong.analysis =
    analyzeFocusedSong(
      text
    );

  currentSong.sectionOrder =
    parseSections(text).map((section,index) =>
      String(index) + '|' + String(section.name || 'Section').trim().toLowerCase()
    );


  if(currentSong.mergeParts){

    delete currentSong.mergeParts;

    delete currentSong.activePartIndex;

  }


  saveCurrentSong();

}

      */

      card.addEventListener(
        'contextmenu',
        event => {

          event.preventDefault();

                  (scale + darkened background) on THIS card
                  before the list re-renders. Without this,
                  the old (visually "pressed") node gets
                  swapped out mid-touch for a fresh node in
                  its normal resting state, and that instant
                  jump from pressed → normal is the flicker.
                */

                card.style.transition =
                  'none';

                card.style.transform =
                  'scale(1)';

                card.style.background =
                  '#18181b';

                toggleLibrarySelection(
                  songId
                );

              },
              550
            );

      );


      card.addEventListener(
        'pointerup',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointerleave',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      card.addEventListener(
        'pointercancel',
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );

    });

              data-open-lineup-song="${esc(song.id)}"
              style="${song.missing ? 'color:#a7a7ae;' : ''}"
            >
              ${esc(song.title)}${song.missing ? ' (not synced to this device yet)' : ''}
            </div>

            <button class="setlistOrderBtn" type="button" data-remove-from-lineup="${esc(song.id)}" title="Remove from lineup" style="color:#ff8b8b;">✕</button>

          </div>

        `).join('')
        : `
          <div class="empty">
            ${emptyStateIconHTML('music')}
            Nothing sent yet.<br>
            Open a song, tap ⋮, then "Send to Team".
          </div>
        `
      }

    </div>

  `;


  document.getElementById('lineupBackBtn').onclick = () => {
    renderHome();

  document.getElementById('lineupClearBtn').onclick = async () => {

    const confirmed =
      await showConfirmDialog(
        `Clear the "${lineup.title || 'Sunday Worship'}" lineup for the whole team?`,
        { confirmLabel:'Clear', danger:true }
      );

    if(!confirmed)return;

    await clearLineup();

    renderHome();

  };

  screen.querySelectorAll('[data-open-lineup-song]').forEach(el => {
    el.onclick = async () => {

      const songId =
        el.dataset.openLineupSong;

      const song =
        songsById.get(songId);

      if(song){

        openSong(song);
        return;

      }

      /* Not on this device yet — actually try to fetch it instead
         of just repeating the same error every time it's tapped. */

      if(el.dataset.syncing === '1')return;
      el.dataset.syncing = '1';

      showToast('Syncing…', null, { id:'lineupSync', small:true });

      const result =
        await pullNewSongsFromDrive();

      el.dataset.syncing = '';

      if(!result.ok){

        showToast(
          result.reason === 'signed-out'
            ? 'Sign in first to sync this song.'
            : 'Could not sync — check your connection.',
          'error',
          { id:'lineupSync' }
        );

        return;

      }

      const freshSong =
        getSongs().find(item => item.id === songId);

      if(freshSong){

        songsById.set(songId, freshSong);

        showToast('Synced.', 'success', { id:'lineupSync', small:true });

        openSong(freshSong);

      }else{

        showToast(
          "This song hasn't been shared to the library yet.",
          'error',
          { id:'lineupSync' }
        );

      }

    };
  });

  screen.querySelectorAll('[data-remove-from-lineup]').forEach(btn => {
    btn.onclick = () => {
      removeSongFromLineup(btn.dataset.removeFromLineup);
    };
  });

async function renameSongById(songId){

  const songs =
    getSongs();

  const song =
    songs.find(
      item => item.id === songId
    );

  if(!song)return;


  const nextTitle =
    await showPromptDialog(
      'Song title:',
      song.title || ''
    );

    nextTitle.trim();

/*
  Merge 2–10 selected songs into a single new saved song,
  combining their lyrics/chords in the order they were
  selected — whichever song was long-pressed/tapped first
  becomes song 1, the second tapped becomes song 2, etc.
  Originals are left untouched so nothing is lost if the merge
  isn't what the user wanted.
*/

async function mergeSongsByIds(ids){

  const songsById =
    new Map(
      getSongs().map(song => [song.id, song])
    );

  const ordered =
    ids
      .map(id => songsById.get(id))
      .filter(Boolean);

  if(ordered.length < 2)return;


  const suggestedTitle =
    ordered
      .map(song => song.title)
      .join(' + ')
      .slice(0,120);

  const nextTitle =
    await showPromptDialog(
      'Merged song title:',
      suggestedTitle
    );

  if(nextTitle === null)return;


  const title =
    nextTitle.trim() ||
    suggestedTitle;

  const parts =
    ordered.map(song => ({
      title: song.title || 'Untitled Song',
      text: song.originalText || song.text || ''
    }));

  const merged =
    saveMergedSongParts(
      title,
      parts
    );


  librarySelectedIds.clear();

  showToast(
    `Merged ${ordered.length} songs into "${merged.title}".`,
    'success'
  );

  renderLibrary();

}


/*
  Saves a set of song parts as a single merged song — used by
  both the manual Library "Merge" action above and by importing
  a text file that contains more than one "Title:" marker (see
  parseSongTextFile). Tags the saved song with mergeParts so the
  viewer opens it as a swipeable set of pages, one per part.
*/

function saveMergedSongParts(title, parts){

  const combinedText =
    parts
      .map(part => part.text)
      .join('\n\n');

  const merged =
    saveSong(
      title,
      combinedText
    );

  merged.mergeParts = parts;
  merged.activePartIndex = 0;

  const allSongs = getSongs();

  const mergedIndex =
    allSongs.findIndex(item => item.id === merged.id);

  if(mergedIndex !== -1){

    allSongs[mergedIndex] = merged;

    writeSongs(allSongs.slice(0,MAX_SONGS));

  }

  return merged;

}

  if(

  ){

    html += `

      <div class="result">

                  data-open="${esc(song.id)}"

                  Open ${esc(song.title)}
                </button>

              </div>

            .join('')
        }


        ${
          source === 'drive'
          ? (
            getGoogleUser()
            ? `
              <div class="driveStatus">
                ✅ Signed in as ${esc(getGoogleUser().email || getGoogleUser().name)}.
                Library search is coming soon — for now, use
                Import or Analyze to bring a song in.
              </div>
            `
            : `
              <div class="driveStatus">
                🔐 Not signed in yet. Sign in from
                Profile → Account, then Search will look up
                matching songs in the shared library.
              </div>
            `
          )
          : ''
        }

      </div>

    `;

  }


  /* =======================================================
     ULTIMATE GUITAR
  ====================================================== */

  if(
    source === 'ug'
  ){

    html += `

      <div class="result">

        <div class="resultTitle">
          Ultimate Guitar
        </div>


        <div class="resultMeta">

          Type a song title and tap Search to look it up on
          Ultimate Guitar, or paste a direct chord-page URL
          to import it — lyrics and chords are detected
          automatically.

        </div>

        ${
          ugAwaitingPaste
            ? `
              <div class="ugPasteHint">
                <div class="ugPasteHintText">
                  Ultimate Guitar opened in a new tab. Find your
                  song, copy its chord-page link, then paste it
                  back here to import it.
                </div>
                <button type="button" class="toolbarBtn primary ugPasteBtn" id="ugPasteBtn">
                  Paste link
                </button>
              </div>
            `
            : ''
        }


        <div id="ugResult"></div>

      </div>

    `;

  }


  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      html ||
      '<div class="empty">' + emptyStateIconHTML('search') + 'No results.</div>';


  document
    .querySelectorAll(
      '[data-open]'
    )
    .forEach(button => {

      button.onclick = () => {

        const song =
          getSongs().find(
            item =>
              item.id ===
              button.dataset.open
          );


        if(song){

          openSong(song);

        }

      };

    });


  const ugPasteBtn =
    document.getElementById(
      'ugPasteBtn'
    );

  if(ugPasteBtn){

    ugPasteBtn.onclick = async () => {

      if(
        !navigator.clipboard ||
        !navigator.clipboard.readText
      ){

        /*
          Clipboard read isn't available/permitted (older
          browser, insecure context, or the user hasn't
          granted permission) — just focus the field so a
          manual paste (Ctrl+V, or long-press → Paste on
          mobile) is one tap away.
        */

        query.focus();

        return;

      }


      try{

        const clipboardText =
          (await navigator.clipboard.readText())
            .trim();

        if(clipboardText){

          query.value =
            clipboardText;

          if(looksLikeUrl(clipboardText)){

            handleTopSearch();

            return;

          }

        }

        query.focus();

      }catch(error){

        query.focus();

      }

    };

  }

}


/* =========================================================
   TOP SEARCH BAR — one input, behavior depends on the
   active source tab (All / Google Drive / Ultimate Guitar)
========================================================= */

function looksLikeUrl(value){

  return /^https?:\/\//i.test(
    value.trim()
  );

}


function handleTopSearch(){

  const value =
    query.value.trim();


  if(source === 'ug'){

    if(!value){

      renderResults();

      return;

    }


    if(looksLikeUrl(value)){

      /*
        Make sure #ugResult exists in the DOM before we try
        to write status/progress into it.
      */

      ugAwaitingPaste =
        false;

      renderResults();


      importFromUG(value);


      return;

    }


    /*
      No scraping/search API for Ultimate Guitar's catalog —
      only a direct-URL importer (/api/import) exists. So a
      plain title search opens UG's own search page; the user
      copies the chord-page link back here to import it, which
      auto-detects the lyrics and chords.
    */

    window.open(

      'https://www.ultimate-guitar.com/search.php?search_type=title&value=' +
      encodeURIComponent(value),

      '_blank'

    );


    ugAwaitingPaste =
      true;

    query.value =
      '';

    renderResults();

    query.focus();


    return;

  }


  /*
    'all' and 'drive' both just filter/search — Drive search
    itself is a placeholder until Drive OAuth is connected.
  */

  renderResults();

}


/* =========================================================
   ULTIMATE GUITAR IMPORT
   Given a direct chord-page URL, fetches the page through
   the backend importer, then automatically detects the
   song's lyrics and chords via the same analyzer used for
   pasted-in songs, and saves it straight to the Library.
========================================================= */

async function importFromUG(url){

  const box =
    document.getElementById(
      'ugResult'
    );


  if(!box){

    return;

  }


  try{

    const parsedUrl =
      new URL(url);


    if(
      !parsedUrl.hostname.endsWith(
        'ultimate-guitar.com'
      )
    ){

      throw new Error(
        'Please use an Ultimate Guitar URL.'
      );

    }

  }catch(error){

    box.innerHTML =
      '<div class="hint">' +
      esc(
        error.message ||
        "That doesn't look like a valid URL."
      ) +
      '</div>';

    return;

  }


  box.innerHTML =
    '<div class="hint">⏳ Loading song...</div>';


  try{

    const response =
      await fetch(
        API_BASE_URL + '/api/import',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              url
            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if(!response.ok){

      throw new Error(

        data.error ||
        `Importer returned HTTP ${response.status}`

      );

    }


    const raw =
      (
        url.split('/').pop() ||
        'Ultimate Guitar Song'
      )
      .replace(
        /[-_]/g,
        ' '
      );


    const title =
      raw
        .replace(
          /\s+chords?\s+\d+.*$/i,
          ''
        )
        .replace(
          /\s+\d+.*$/,
          ''
        )
        .trim()
        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );


    const importedText =
      decodeHtmlEntities(
        data.text || ''
      );


    /*
      Immediately analyze the imported song — this is what
      detects the section structure, lyrics, and chords.
    */

    const analysis =
      analyzeFocusedSong(
        importedText
      );


    /*
      Don't save to the Library yet — importing is just a
      preview. It only becomes a Library entry if the user
      opens it and taps Save (same pattern as the "Open Lyrics"
      preview from the Analyzer). Opening it does add it to
      Recent Songs, though.
    */

    const song = {

      id:
        'preview-' +
        (
          window.crypto &&
          crypto.randomUUID
            ? crypto.randomUUID()
            : String(
                Date.now() +
                Math.random()
              )
        ),

      title:
        title ||
        'Untitled Song',

      text:
        importedText,

      originalText:
        importedText,

      sourceUrl:
        data.sourceUrl || url,

      analysis,

      transposeSteps:
        0,

      fontSize:
        getSettings().defaultFontSize

    };


    box.innerHTML = `

      <div class="hint">

        ✅ "${esc(song.title)}" imported —
        lyrics and chords detected automatically.
        Open it and tap Save to add it to your Library.

      </div>


      <div class="resultActions">

        <button
          class="smallBtn toolbarBtn primary"
          id="openImportedSong"
        >
          Open Song
        </button>

      </div>

    `;


    document
      .getElementById(
        'openImportedSong'
      )
      .onclick =
        () => openSong(song);


  }catch(error){

    box.innerHTML =
      '<div class="hint">⚠️ ' +
      esc(

        error.message ||
        'Something went wrong importing this song.'

      ) +
      '</div>';

  }

}

/*
  Fade out the startup splash once the home screen has actually
  rendered. The minimum-display timer keeps it from flashing by
  too quickly on fast loads; the fallback removal guarantees it
  never gets stuck on screen even if something above throws.
*/

(function hideStartupSplash(){

  const splash = document.getElementById('startupSplash');
  if(!splash) return;

  const dismiss = () => {
    splash.classList.add('splashHidden');
    setTimeout(() => splash.remove(), 1000);
  };

  setTimeout(dismiss, 2200);

})();


/*
  If there's a signed-in Firebase user (the SDK persists this
  in IndexedDB/localStorage and restores it automatically), pick
  it back up quietly and pull in any brand-new songs the other
  people have saved — never overwrites a song already in this
  Library. If there's no session, nothing breaks; signing in
  again from Profile covers it.
*/

async function initSyncOnLoad(){

  await firebaseReadyPromise;

  if(!firebaseAuth){

    return;

  }

  const user =
    await waitForFirebaseAuthReady();

  if(!user){

    return;

  }

  if(!getGoogleUser()){

    await onAuthReady(user);

    return;

  }

  refreshUserProfile(user);

  pullNewSongsFromDrive();

  pullLineupFromDrive();

}


initSyncOnLoad();


/*
  Register the service worker so Chrome/Android offers
  "Install app" / "Add to Home Screen" and the app can open
  even with a spotty connection. It only caches the app shell
  (this HTML file) — Drive sync, imports, and search still go
  over the network like normal, so nothing here changes app
  behavior when you're online.
*/

/* =========================================================
   NEW-SONG PUSH NOTIFICATIONS
   Subscribes this device to Web Push so it gets a real phone
   notification when the Drive-sync backend (see /api/drive-*)
   detects a new song in the shared folder — even if the app
   isn't open.
========================================================= */

function notificationsCurrentlyOn(){

  return (
    !!getSettings().songNotifications &&
    typeof Notification !== 'undefined' &&
    Notification.permission === 'granted'
  );

}


function notificationStatusText(){

  if(typeof Notification === 'undefined'){

    return 'Not supported on this browser.';

  }

  if(Notification.permission === 'denied'){

    return 'Blocked — enable notifications for this app in your phone settings.';

  }

  if(notificationsCurrentlyOn()){

    return "On — you'll be notified when a new song is added.";

  }

  return 'Off — turn on to get notified when a new song is added.';

}


function urlBase64ToUint8Array(base64String){

  const padding =
    '='.repeat(
      (4 - base64String.length % 4) % 4
    );

  const base64 =
    (base64String + padding)
      .replace(/-/g,'+')
      .replace(/_/g,'/');

  const rawData =
    atob(base64);

  const outputArray =
    new Uint8Array(rawData.length);

  for(let i = 0; i < rawData.length; i++){

    outputArray[i] =
      rawData.charCodeAt(i);

  }

  return outputArray;

}


/*
  Tells the backend a brand-new song was just added to the
  shared library, so it can push a "New song added" notification
  to everyone else's device. Fire-and-forget — a failed request
  here shouldn't block or fail the sync itself.
*/
async function notifyNewSong(title){

  if(!NOTIFY_SECRET || NOTIFY_SECRET.includes('YOUR-'))return;

  try{

    await fetch(API_BASE_URL + '/api/notify-new-song', {

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        'X-Notify-Secret': NOTIFY_SECRET
      },

      body: JSON.stringify({ title })

    });

  }catch(error){

    console.error(error);

  }

}


/*
  Same endpoint as notifyNewSong, just with a heading override
  so the push says "Sunday Worship lineup updated" instead of
  "New song added" — see the optional `heading` field handled
  in api/notify-new-song.js.
*/
async function notifyLineupUpdate(songTitle){

  if(!NOTIFY_SECRET || NOTIFY_SECRET.includes('YOUR-'))return;

  try{

    await fetch(API_BASE_URL + '/api/notify-new-song', {

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        'X-Notify-Secret': NOTIFY_SECRET
      },

      body: JSON.stringify({

        title: songTitle,
        heading: 'Sunday Worship lineup updated'

      })

    });

  }catch(error){

    console.error(error);

  }

}


async function enableSongNotifications(){

  if(
    !('serviceWorker' in navigator) ||
    !('PushManager' in window)
  ){

    alert(
      "Push notifications aren't supported on this browser/device."
    );

    return;

  }

  try{

    const permission =
      await Notification.requestPermission();

    if(permission !== 'granted'){

      writeSettings({ songNotifications:false });

      renderProfile();

      return;

    }

    const keyResponse =
      await fetch(API_BASE_URL + '/api/vapid-public-key');

    const { publicKey } =
      await keyResponse.json();

    if(!publicKey){

      alert(
        "Notifications aren't set up on the server yet."
      );

      return;

    }

    const registration =
      await navigator.serviceWorker.ready;

    let subscription =
      await registration.pushManager.getSubscription();

    if(!subscription){

      subscription =
        await registration.pushManager.subscribe({

          userVisibleOnly:true,

          applicationServerKey:
            urlBase64ToUint8Array(publicKey)

        });

    }

    await fetch(API_BASE_URL + '/api/push-subscribe', {

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:
        JSON.stringify({ subscription })

    });

    writeSettings({ songNotifications:true });

  }catch(error){

    console.error(
      'Enable notifications failed:',
      error
    );

    alert(
      'Could not turn on notifications. Please try again.'
    );

  }

  renderProfile();

}


async function disableSongNotifications(){

  try{

    if('serviceWorker' in navigator){

      const registration =
        await navigator.serviceWorker.ready;

      const subscription =
        await registration.pushManager.getSubscription();

      if(subscription){

        await fetch(API_BASE_URL + '/api/push-subscribe', {

          method:'DELETE',

          headers:{
            'Content-Type':'application/json'
          },

          body:
            JSON.stringify({
              endpoint:subscription.endpoint
            })

        });

        await subscription.unsubscribe();

      }

    }

  }catch(error){

    console.error(
      'Disable notifications failed:',
      error
    );

  }

  writeSettings({ songNotifications:false });

  renderProfile();

}


if('serviceWorker' in navigator){

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('/sw.js')
      .catch(error => {

        console.error(
          'Service worker registration failed:',
          error
        );

      });

  });

}


/* =========================================================
   HARDWARE BACK BUTTON (native app shell)

   In a browser tab, the phone's back gesture/button falls back
   to normal browser history — leaving the page, or doing
   nothing if there's nowhere to go. In a bundled native app
   (Capacitor), there IS no browser history to fall back on, so
   without this the hardware back button just closes the app
   from any screen.

   This mirrors whatever the on-screen back button already does
   for the current screen (see currentScreenName, set at the top
   of each render* function above): closes an open song menu or
   dialog first if one is open, otherwise goes to that screen's
   logical parent, and only lets the app actually exit once
   already on Home — same as tapping back manually would.
*/

function handleHardwareBack(){

  const songMenuDropdown =
    document.getElementById('songMenuDropdown');

  if(songMenuDropdown && songMenuDropdown.classList.contains('open')){

    closeSongMenu();

    return true;

  }

  const confirmBack =
    document.getElementById('confirmBack');

  if(confirmBack && confirmBack.classList.contains('open')){

    confirmBack.classList.remove('open');

    const host =
      document.getElementById('confirmOverlay');

    setTimeout(() => {
      if(host)host.innerHTML = '';
    }, 200);

    return true;

  }

  switch(currentScreenName){

    case 'songViewer':

      stopAutoScroll();
      songFlowMode = false;
      currentSong = null;
      renderLyrics();

      return true;

    case 'setlistDetail':

      libraryTab = 'setlists';
      renderLibrary();

      return true;

    case 'lineupDetail':

      renderHome();

      return true;

    case 'library':
    case 'lyrics':
    case 'profile':

      renderHome();

      return true;

    case 'home':
    default:

      /*
        Already on Home — nothing left to go "back" to inside
        the app. Return false so the caller below lets the
        native app actually exit, same as a person would expect
        pressing back on a home screen to do.
      */

      return false;

  }

}


if(
  window.Capacitor &&
  window.Capacitor.Plugins &&
  window.Capacitor.Plugins.App
){

  window.Capacitor.Plugins.App.addListener(
    'backButton',
    () => {

      const handled =
        handleHardwareBack();

      if(!handled){

        window.Capacitor.Plugins.App.exitApp();

      }

    }
  );

}
