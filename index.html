<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Worship Chords</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f7f7f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}button,input{font:inherit}.app{width:100%;max-width:920px;min-height:100vh;background:#111113;position:relative;padding-bottom:82px}.top{padding:24px 22px 0}.welcome{font-size:15px;color:#a7a7ad;font-weight:600}.hero{text-align:center;padding:58px 20px 80px}.hero h1{margin:0;font-size:42px;line-height:1.05;font-weight:800}.hero p{margin:10px 0 0;color:#a7a7ad;font-size:15px}.content{padding:0 22px}.placeholder{min-height:360px;display:flex;align-items:center;justify-content:center;color:#66666d;font-size:14px;text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(920px,100%);height:72px;background:rgba(22,22,24,.97);border-top:1px solid #2a2a2e;display:flex;z-index:20}.nav button{flex:1;border:0;background:none;color:#85858c;font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav button.active{color:#fff}.icon{font-size:20px;line-height:1}.libraryHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.libraryTitle{font-size:28px;font-weight:800}.searchBtn{width:44px;height:44px;border:1px solid #303036;border-radius:14px;background:#1a1a1d;color:#fff;display:grid;place-items:center;font-size:21px;cursor:pointer}.librarySection{margin:22px 0}.sectionLabel{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#77777f;font-weight:800;margin-bottom:9px}.songCard{display:flex;align-items:center;gap:12px;padding:14px 15px;margin:8px 0;background:#18181b;border:1px solid #29292e;border-radius:14px}.songIcon{width:38px;height:38px;border-radius:10px;background:#232328;display:grid;place-items:center;font-size:18px}.songInfo{flex:1;min-width:0}.songName{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.songMeta{font-size:12px;color:#777780;margin-top:3px}.songAction,.smallBtn{border:0;background:#29292e;color:#eee;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.smallBtn.primary,.goBtn{background:#fff;color:#111}.empty{padding:18px;border:1px dashed #303036;border-radius:14px;color:#707078;font-size:13px;text-align:center}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal{width:min(920px,100%);max-height:88vh;overflow:auto;background:#151518;border:1px solid #2d2d32;border-radius:22px 22px 0 0;padding:20px}.modalTop{display:flex;align-items:center;gap:12px}.modalTop h2{margin:0;font-size:20px;flex:1}.closeBtn{border:0;background:#242429;color:#ddd;border-radius:10px;padding:9px 12px;cursor:pointer}.searchBox{display:flex;gap:8px;margin:16px 0 12px}.searchInput{flex:1;min-width:0;background:#0e0e10;border:1px solid #34343a;color:#fff;border-radius:12px;padding:13px 14px;outline:none}.goBtn{border:0;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}.sourceTabs{display:flex;gap:8px;margin-bottom:14px}.sourceTabs button{flex:1;border:1px solid #303036;background:#1b1b1f;color:#9999a2;border-radius:10px;padding:10px;font-size:12px;font-weight:750;cursor:pointer}.sourceTabs button.active{background:#29292e;color:#fff;border-color:#44444b}.result{padding:13px 0;border-top:1px solid #29292e}.result:first-child{border-top:0}.resultTitle{font-weight:750}.resultMeta,.hint{font-size:12px;color:#777780;line-height:1.5;margin-top:5px}.resultActions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.driveStatus{padding:12px;background:#1a1a1d;border-radius:12px;color:#aaa;font-size:13px;line-height:1.5;margin-top:10px}.songPage{padding:4px 0 30px}.songTop{display:flex;align-items:center;gap:10px;margin-bottom:18px}.backBtn{border:0;background:#25252a;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.songHeading{flex:1;min-width:0}.songHeading h1{margin:0;font-size:26px;line-height:1.15}.songHeading p{margin:5px 0 0;color:#85858c;font-size:13px}.songToolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbarBtn{border:1px solid #303036;background:#1a1a1d;color:#eee;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer}.lyricsView{background:#0e0e10;border:1px solid #29292e;border-radius:14px;padding:18px;white-space:pre-wrap;font:15px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;min-height:300px}.songSource{margin-top:10px;font-size:12px;color:#777780}.songSource a{color:#bbb}.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}</style>
</head>
<body>
<div class="app"><div class="top"><div class="welcome">Welcome!</div></div><section class="hero"><h1>Disciples</h1><p>Soli Deo Gloria</p></section><main class="content" id="screen"><div class="placeholder">Your songs and tools will appear here.</div></main><nav class="nav" aria-label="Main navigation"><button class="active" data-screen="home"><span class="icon">⌂</span><span>Home</span></button><button data-screen="library"><span class="icon">▱</span><span>Library</span></button><button data-screen="lyrics"><span class="icon">♫</span><span>Lyrics</span></button><button data-screen="menu"><span class="icon">☰</span><span>Menu</span></button></nav></div>
<div class="modalBack" id="searchModal"><div class="modal" role="dialog" aria-modal="true"><div class="modalTop"><h2>Search Library</h2><button class="closeBtn" id="closeSearch">Close</button></div><div class="searchBox"><input class="searchInput" id="libraryQuery" placeholder="Search song title..." autocomplete="off"><button class="goBtn" id="runSearch">Search</button></div><div class="sourceTabs"><button class="active" data-source="all">All</button><button data-source="drive">Google Drive</button><button data-source="ug">Ultimate Guitar</button></div><div id="searchResults"></div></div></div>
<script>
const screen=document.getElementById('screen'),modal=document.getElementById('searchModal'),query=document.getElementById('libraryQuery');let source='all';let currentSong=null;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function getSongs(){try{return JSON.parse(localStorage.getItem('worshipChordsSongs')||'[]')}catch{return[]}}
function saveSong(title,text,url){const a=getSongs(),item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:title||'Untitled Song',text:text||'',sourceUrl:url||'',savedAt:new Date().toISOString(),kind:'analyzed'};a.unshift(item);localStorage.setItem('worshipChordsSongs',JSON.stringify(a.slice(0,200)));return item}
function openSong(song){currentSong=song;modal.style.display='none';screen.innerHTML=`<div class="songPage"><div class="songTop"><button class="backBtn" id="backToLibrary">← Library</button><div class="songHeading"><h1>${esc(song.title||'Untitled Song')}</h1><p>Lyrics & Chords</p></div></div><div class="songToolbar"><button class="toolbarBtn" id="transposeBtn">Transpose</button><button class="toolbarBtn" id="fontMinus">A−</button><button class="toolbarBtn" id="fontPlus">A+</button><button class="toolbarBtn" id="editBtn">Edit Song</button><button class="toolbarBtn" id="saveBtn">Save</button></div><div class="lyricsView" id="lyricsText">${esc(song.text||'No lyrics/chords saved yet.')}</div>${song.sourceUrl?`<div class="songSource">Source: <a href="${esc(song.sourceUrl)}" target="_blank" rel="noopener">${esc(song.sourceUrl)}</a></div>`:''}</div>`;document.getElementById('backToLibrary').onclick=renderLibrary;let size=15;document.getElementById('fontMinus').onclick=()=>{size=Math.max(11,size-1);document.getElementById('lyricsText').style.fontSize=size+'px'};document.getElementById('fontPlus').onclick=()=>{size=Math.min(30,size+1);document.getElementById('lyricsText').style.fontSize=size+'px'};document.getElementById('editBtn').onclick=editCurrentSong;document.getElementById('saveBtn').onclick=()=>{if(currentSong){const list=getSongs().map(x=>x.id===currentSong.id?currentSong:x);localStorage.setItem('worshipChordsSongs',JSON.stringify(list));alert('Song saved.')}};document.getElementById('transposeBtn').onclick=()=>alert('Transpose is ready to connect to the existing chord engine next.')}
function editCurrentSong(){if(!currentSong)return;const next=prompt('Edit lyrics and chords:',currentSong.text||'');if(next===null)return;currentSong.text=next;const list=getSongs().map(x=>x.id===currentSong.id?currentSong:x);localStorage.setItem('worshipChordsSongs',JSON.stringify(list));openSong(currentSong)}
function renderLibrary(){const list=getSongs();screen.innerHTML=`<div class="libraryHead"><div class="libraryTitle">Library</div><button class="searchBtn" id="openSearch" aria-label="Search library">⌕</button></div><div class="librarySection"><div class="sectionLabel">Saved & Analyzed Songs</div>${list.length?list.map(s=>`<div class="songCard"><div class="songIcon">♫</div><div class="songInfo"><div class="songName">${esc(s.title)}</div><div class="songMeta">Analyzed${s.savedAt?' · '+new Date(s.savedAt).toLocaleDateString():''}</div></div><button class="songAction" data-id="${esc(s.id)}">Open</button></div>`).join(''):'<div class="empty">No saved songs yet.<br>Analyzed songs will appear here.</div>'}</div><div class="librarySection"><div class="sectionLabel">Sources</div><div class="songCard"><div class="songIcon">G</div><div class="songInfo"><div class="songName">Google Drive</div><div class="songMeta">Search your saved song files</div></div><button class="songAction" id="driveSearch">Search</button></div><div class="songCard"><div class="songIcon">UG</div><div class="songInfo"><div class="songName">Ultimate Guitar</div><div class="songMeta">Search and load chord pages</div></div><button class="songAction" id="ugSearch">Search</button></div></div>`;document.getElementById('openSearch').onclick=()=>openSearch('all');document.getElementById('driveSearch').onclick=()=>openSearch('drive');document.getElementById('ugSearch').onclick=()=>openSearch('ug');screen.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const s=list.find(x=>x.id===b.dataset.id);if(s)openSong(s)})}
function openSearch(s){source=s||'all';modal.style.display='flex';document.querySelectorAll('.sourceTabs button').forEach(b=>b.classList.toggle('active',b.dataset.source===source));query.focus();renderResults()}
function renderResults(){const q=query.value.trim().toLowerCase(),list=getSongs().filter(s=>!q||String(s.title+' '+s.text).toLowerCase().includes(q));let html='';if(source==='all'||source==='drive')html+=`<div class="result"><div class="resultTitle">Google Drive</div><div class="resultMeta">${list.length?'Saved songs matching your search':'No matching saved songs'}</div>${list.map(s=>`<div class="resultActions"><button class="smallBtn primary" data-open="${esc(s.id)}">Open ${esc(s.title)}</button></div>`).join('')}<div class="driveStatus">🔐 Google Drive UI is ready. Private Drive search will be connected with Google OAuth next.</div></div>`;if(source==='all'||source==='ug')html+=`<div class="result"><div class="resultTitle">Ultimate Guitar</div><div class="resultMeta">${q?'Search for “'+esc(q)+'”':'Search by song title'}</div><div class="resultActions"><button class="smallBtn primary" id="ugSearchWeb">Search Ultimate Guitar</button></div><div class="hint">Or paste a direct Ultimate Guitar chord-page URL to load it into Worship Chords.</div><div class="searchBox"><input class="searchInput" id="ugUrl" placeholder="https://tabs.ultimate-guitar.com/..."><button class="goBtn" id="ugLoad">Load</button></div><div id="ugResult"></div></div>`;document.getElementById('searchResults').innerHTML=html||'<div class="empty">No results.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const s=getSongs().find(x=>x.id===b.dataset.open);if(s)openSong(s)});const web=document.getElementById('ugSearchWeb');if(web)web.onclick=()=>window.open('https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent(query.value.trim()),'_blank','noopener');const load=document.getElementById('ugLoad');if(load)load.onclick=loadUG}
async function loadUG(){const input=document.getElementById('ugUrl'),box=document.getElementById('ugResult'),url=(input?.value||'').trim();if(!url)return;try{const u=new URL(url);if(!u.hostname.endsWith('ultimate-guitar.com'))throw new Error('Please use an Ultimate Guitar URL.')}catch(e){box.innerHTML='<div class="hint">'+esc(e.message)+'</div>';return}box.innerHTML='<div class="hint">⏳ Loading song...</div>';try{const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`Importer returned HTTP ${r.status}`);const raw=(url.split('/').pop()||'Ultimate Guitar Song').replace(/[-_]/g,' '),title=raw.replace(/\b\w/g,c=>c.toUpperCase()),song=saveSong(title,data.text||'',data.sourceUrl||url);localStorage.setItem('worshipChordsSourceUrl',data.sourceUrl||url);localStorage.setItem('worshipChordsImportedText',data.text||'');box.innerHTML='<div class="hint">✅ Song loaded and saved to Library.</div><div class="resultActions"><button class="smallBtn primary" id="openLoaded">Open Lyrics Page</button></div>';document.getElementById('openLoaded').onclick=()=>openSong(song)}catch(e){box.innerHTML='<div class="hint">⚠️ '+esc(e.message||'Importer failed.')+'</div>'}}
query.addEventListener('input',renderResults);document.getElementById('runSearch').onclick=renderResults;document.getElementById('closeSearch').onclick=()=>modal.style.display='none';modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});document.querySelectorAll('.sourceTabs button').forEach(b=>b.onclick=()=>openSearch(b.dataset.source));document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const n=b.dataset.screen;if(n==='library')renderLibrary();else if(n==='lyrics'){const list=getSongs();if(list[0])openSong(list[0]);else screen.innerHTML='<div class="placeholder">No song is loaded yet.</div>'}else screen.innerHTML='<div class="placeholder">'+n.charAt(0).toUpperCase()+n.slice(1)+' screen — ready to connect.</div>'}));
</script>
</body>
</html>
