<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Worship Lineup · Disciples</title>
<style>
  :root{
    --bg:#000;
    --card:#141416;
    --line:rgba(255,255,255,.08);
    --text:#f4f4f5;
    --muted:#8e8e93;
    --accent:#e8b923;
    --chord:#6ea8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100vh;padding:max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),28px)}
  .wrap{max-width:560px;margin:0 auto}
  .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 18px}
  h1{font-size:28px;line-height:1.15;margin:0 0 6px}
  .date{color:var(--accent);font-size:15px;font-weight:600;margin-bottom:4px}
  .updated{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:rgba(232,185,35,.14);
    color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .title{flex:1;min-width:0;font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
  .key{flex:0 0 auto;color:var(--muted);font-size:14px;font-weight:600;
    padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  details.song{border-top:1px solid var(--line)}
  details.song:first-child{border-top:0}
  details.song > summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
  details.song > summary::-webkit-details-marker{display:none}
  details.song > summary::after{content:"›";color:var(--muted);font-size:22px;transition:transform .15s}
  details.song[open] > summary::after{transform:rotate(90deg)}
  .songBody{padding:2px 16px 16px;overflow-x:auto}
  .secName{margin:14px 0 4px;color:#9a9aa0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .secName:first-child{margin-top:4px}
  .ln{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:14px;line-height:1.5;white-space:pre;color:#e9e9ec}
  .ln.chord{color:var(--chord);font-weight:700}
  .toolbar{display:flex;justify-content:flex-end;margin:0 0 10px}
  .linkBtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px}
  .note{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:#b4b4b9;font-size:13.5px;line-height:1.5}
  .note a{color:var(--accent);font-weight:600;text-decoration:none}
  .msg{padding:36px 20px;text-align:center;color:var(--muted);line-height:1.5;font-size:15px}
  .btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;
    background:var(--accent);color:#1a1400;font-size:16px;font-weight:700;text-align:center;
    text-decoration:none}
  .hint{margin-top:12px;color:var(--muted);font-size:12.5px;line-height:1.5;text-align:center}
  .foot{margin-top:26px;color:#5b5b60;font-size:12px;text-align:center}
  [hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">Disciples · Worship Lineup</div>

  <div id="loading" class="msg">Loading lineup…</div>
  <div id="error" class="msg" hidden></div>

  <div id="content" hidden>
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
    <div class="updated" id="updated"></div>

    <div class="toolbar" id="toolbar" hidden>
      <button type="button" class="linkBtn" id="toggleAll">Expand all</button>
    </div>

    <div class="card" id="list"></div>

    <div class="note" id="note" hidden></div>

    <a class="btn" id="openApp" href="#" hidden>Open in the Disciples app</a>
    <div class="hint" id="appHint" hidden>
      Have the Disciples app? This opens the lineup there. Don't have it yet? Ask your worship leader for the app.
    </div>
  </div>

  <div class="foot">Shared from Disciples</div>
</div>

<script>
(function(){

  function el(id){ return document.getElementById(id); }

  function timeAgo(ms){

    if(!ms)return '';

    var min = Math.max(0, Math.floor((Date.now() - ms) / 60000));

    if(min < 1)return 'Updated just now';
    if(min < 60)return 'Updated ' + min + ' min ago';

    var hr = Math.floor(min / 60);

    if(hr < 24)return 'Updated ' + hr + ' hr ago';

    var day = Math.floor(hr / 24);

    return 'Updated ' + day + (day === 1 ? ' day ago' : ' days ago');

  }

  function showError(message){

    el('loading').hidden = true;
    el('content').hidden = true;

    var box = el('error');

    box.textContent = message;
    box.hidden = false;

  }

  function div(className, text){

    var node = document.createElement('div');

    node.className = className;

    if(text !== undefined)node.textContent = text;

    return node;

  }

  /* Plain list: title + key only (what everyone with the link sees). */
  function renderPlain(list, songs){

    songs.forEach(function(song, index){

      var row = div('row');

      row.appendChild(div('num', String(index + 1)));
      row.appendChild(div('title', song.title));

      if(song.key)row.appendChild(div('key', song.key));

      list.appendChild(row);

    });

  }

  /* Team members: each song opens to its chords and lyrics. */
  var detailsList = [];

  function renderMember(list, songs){

    songs.forEach(function(song, index){

      var details = document.createElement('details');
      details.className = 'song';

      var summary = document.createElement('summary');

      summary.appendChild(div('num', String(index + 1)));
      summary.appendChild(div('title', song.title));

      if(song.key)summary.appendChild(div('key', song.key));

      details.appendChild(summary);

      var body = div('songBody');

      var sections = song.sections || [];

      if(!sections.length){

        body.appendChild(div('secName', 'No chords or lyrics saved for this song yet.'));

      }

      sections.forEach(function(section){

        if(section.name)body.appendChild(div('secName', section.name));

        var chordSet = {};

        (section.chords || []).forEach(function(i){ chordSet[i] = true; });

        (section.lines || []).forEach(function(line, i){

          body.appendChild(div('ln' + (chordSet[i] ? ' chord' : ''), line));

        });

      });

      details.appendChild(body);

      list.appendChild(details);

      detailsList.push(details);

    });

    var toggle = el('toggleAll');
    var opened = false;

    el('toolbar').hidden = false;

    toggle.onclick = function(){

      opened = !opened;

      detailsList.forEach(function(item){ item.open = opened; });

      toggle.textContent = opened ? 'Collapse all' : 'Expand all';

    };

  }

  function render(data){

    el('loading').hidden = true;
    el('error').hidden = true;
    el('content').hidden = false;

    el('title').textContent = data.title || 'Worship Lineup';
    el('date').textContent = data.dateLabel || '';
    el('updated').textContent = timeAgo(data.updatedAt);
    document.title = (data.title || 'Worship Lineup') + ' · Disciples';

    var list = el('list');

    list.textContent = '';

    if(!data.songs || !data.songs.length){

      list.appendChild(div('msg', 'No songs in this lineup yet.'));

      return;

    }

    if(data.member){

      renderMember(list, data.songs);

    }else{

      renderPlain(list, data.songs);

      var note = el('note');

      note.textContent = '';

      if(data.viewer === 'signed-in'){

        note.textContent =
          'Chords and lyrics are only shown to members of this team. ' +
          'The account you are signed in with is not on this team.';

      }else{

        note.appendChild(document.createTextNode(
          'Team member? Chords and lyrics show here when you are signed in to Disciples in this browser. '
        ));

        var signIn = document.createElement('a');

        signIn.href = '/';
        signIn.textContent = 'Sign in to Disciples';

        note.appendChild(signIn);

        note.appendChild(document.createTextNode(', then open this link again.'));

      }

      note.hidden = false;

    }

  }

  function setupOpenInApp(token){

    if(!/Android/i.test(navigator.userAgent))return;

    var link = el('openApp');

    link.href =
      'intent://' + location.host + '/lineup/' + token +
      '#Intent;scheme=https;package=app.disciples.worship;' +
      'S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';

    link.hidden = false;
    el('appHint').hidden = false;

  }

  /* Reuse the sign-in this browser already has for the Disciples site
     (same origin, same Firebase project). Resolves to an ID token, or
     null when nobody is signed in or anything goes wrong. */
  function getIdToken(){

    return new Promise(function(resolve){

      var finished = false;

      function done(value){

        if(finished)return;

        finished = true;
        resolve(value);

      }

      setTimeout(function(){ done(null); }, 4000);

      try{

        if(!window.firebase)return done(null);

        fetch('/api/firebase-config')
          .then(function(res){ return res.ok ? res.json() : null; })
          .then(function(config){

            if(!config || !config.apiKey || !config.projectId)return done(null);

            if(!window.firebase.apps.length)window.firebase.initializeApp(config);

            var auth = window.firebase.auth();

            var off = auth.onAuthStateChanged(function(user){

              off();

              if(!user)return done(null);

              user.getIdToken().then(done, function(){ done(null); });

            });

          })
          .catch(function(){ done(null); });

      }catch(error){

        done(null);

      }

    });

  }

  var parts = location.pathname.split('/').filter(Boolean);
  var token = parts[0] === 'lineup' ? (parts[1] || '') : '';

  if(!token){

    showError('This link is not valid.');
    return;

  }

  getIdToken()
    .then(function(idToken){

      return fetch('/api/lineup-share?token=' + encodeURIComponent(token), {
        cache: 'no-store',
        headers: idToken ? { Authorization: 'Bearer ' + idToken } : {}
      });

    })
    .then(function(res){
      return res.json().then(function(body){ return { ok:res.ok, body:body }; });
    })
    .then(function(result){

      if(!result.ok || !result.body || !result.body.ok){

        showError((result.body && result.body.error) || 'This lineup is not available.');
        return;

      }

      render(result.body);
      setupOpenInApp(token);

    })
    .catch(function(){
      showError('Could not load the lineup. Check your connection and try again.');
    });

})();
</script>
</body>
</html>
