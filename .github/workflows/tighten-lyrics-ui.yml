name: Tighten lyrics UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten lyric layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.part-title{text-transform:uppercase;letter-spacing:1px;color:#aeb6bf;font-size:12px;margin-bottom:14px}', '.part-title{text-transform:uppercase;letter-spacing:1px;color:#aeb6bf;font-size:12px;margin-bottom:7px}')
          s=s.replace('.line{display:grid;grid-template-columns:20px 1fr;gap:7px;margin:9px 0;padding:7px;border-radius:10px}', '.line{display:grid;grid-template-columns:0 1fr;gap:0;margin:2px 0;padding:2px 0;border-radius:8px}')
          s=s.replace('.handle{color:#6e7882;padding-top:8px;user-select:none}', '.handle{display:none}')
          s=s.replace('.chordRow{min-height:28px}', '.chordRow{min-height:21px}')
          s=s.replace('.lyricText{font-size:18px;padding:4px 7px;line-height:1.4}', '.lyricText{font-size:18px;padding:1px 5px;line-height:1.2}')
          s=s.replace('@media(max-width:500px){.keygrid{grid-template-columns:repeat(3,1fr)}.lyricText{font-size:16px}}', '@media(max-width:500px){.keygrid{grid-template-columns:repeat(3,1fr)}.lyricText{font-size:16px}}')
          s=s.replace('<div class="handle">•</div>', '<div class="handle"></div>')
          p.write_text(s)
          PY
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Tighten lyrics spacing and remove lyric bullets"
          git push