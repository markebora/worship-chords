name: Apply lyrics navigation test fix
on:
  push:
    branches: [test-lyrics-nav-freeze]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_header = '''.songFixedHeader{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(920px,100%);z-index:300;background:rgba(17,17,19,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0;padding:8px 16px 10px;border-bottom:1px solid #29292e;box-shadow:0 8px 24px rgba(0,0,0,.35);}'''
          new_header = '''.songFixedHeader{position:sticky;top:0;left:auto;transform:none;width:100%;z-index:300;background:rgba(17,17,19,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0;padding:8px 16px 10px;border-bottom:1px solid #29292e;box-shadow:0 8px 24px rgba(0,0,0,.35);}'''
          if old_header not in s:
              raise SystemExit('Expected current songFixedHeader CSS not found')
          s = s.replace(old_header, new_header, 1)

          old_songpage = '''.songPage{\n  padding:120px 0 30px;\n}'''
          new_songpage = '''.songPage{\n  padding:0 0 30px;\n}'''
          if old_songpage not in s:
              raise SystemExit('Expected current songPage CSS not found')
          s = s.replace(old_songpage, new_songpage, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify patch
        run: |
          grep -F '.songFixedHeader{position:sticky;top:0;left:auto;transform:none;width:100%' index.html
          grep -F '.songPage{' index.html
      - name: Remove temporary patch workflow and commit result
        run: |
          rm -f .github/workflows/apply-nav-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-nav-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix frozen lyrics section navigation"
          git push