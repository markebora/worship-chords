name: Apply Worship Chords UI update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compact chord-only grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="function finishImport(){closeModal();showTab('song');renderSong();saveLocal();toast('Song analyzed and imported')}"
          insert="""function compactChordOnlyLines(){
            for(const p of Object.keys(base)){
              const out=[]; let pending=[];
              const flush=()=>{if(pending.length){out.push([pending.join(' '),'']);pending=[]}};
              for(const item of base[p]){
                if(item[0] && !item[1]) pending.push(item[0].trim());
                else { flush(); out.push(item); }
              }
              flush();
              base[p]=out;
            }
          }
          """
          if 'function compactChordOnlyLines()' not in s:
            if marker not in s: raise SystemExit('finishImport target not found')
            s=s.replace(marker,insert+marker)
          target="arrangement=sections;currentSongTitle=title;currentArtist=artist;currentKey=detectKey();"
          replacement="compactChordOnlyLines(); arrangement=sections;currentSongTitle=title;currentArtist=artist;currentKey=detectKey();"
          if target not in s: raise SystemExit('analyze target not found')
          s=s.replace(target,replacement,1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Group consecutive chord-only lines into compact rows"
          git push
