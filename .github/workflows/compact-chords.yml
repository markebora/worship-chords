name: Fix compact chord-only display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Inject the existing chord-only compaction behavior.
          fn = '''function compactChordOnlyLines(){
            for(const part of Object.keys(base)){
              const source=Array.isArray(base[part])?base[part]:[];
              const out=[]; let chords=[];
              const flush=()=>{if(chords.length){out.push([chords.join(' '),'']);chords=[]}};
              for(const row of source){
                const chord=String(row?.[0]??'').trim();
                const lyric=String(row?.[1]??'').trim();
                if(chord && !lyric) chords.push(chord);
                else {flush();out.push(row)}
              }
              flush();
              base[part]=out;
            }
          }
          '''
          if 'function compactChordOnlyLines()' not in s:
            s=s.replace('function renderSong(){', fn+'function renderSong(){', 1)
          s=s.replace('function renderSong(){document.getElementById(\'songTitle\')', 'function renderSong(){compactChordOnlyLines();document.getElementById(\'songTitle\')', 1)
          s=s.replace('if(d.currentKey)currentKey=d.currentKey}catch(e){}', 'if(d.currentKey)currentKey=d.currentKey;compactChordOnlyLines()}catch(e){}', 1)
          css='''.chordOnlyLine{display:block!important;margin:4px 0!important;padding:3px 7px!important}.chordOnlyInner{font:bold 18px monospace!important;color:#72b7ff!important;white-space:nowrap!important;letter-spacing:0!important}.chordOnlyInner .chordInput{display:block;width:100%;letter-spacing:.08em}'''
          if css not in s:
            s=s.replace('</style>', css+'</style>', 1)

          # =========================================================
          # Song viewer: fixed title/parts header + scrolling toolbar
          # =========================================================
          layout_css = r'''

/* =========================================================
   SONG VIEWER — FIXED TITLE + HORIZONTAL LYRICS PARTS
========================================================= */

.songFixedHeader{
  position:sticky;
  top:0;
  z-index:50;
  padding:4px 0 10px;
  background:#111113;
  border-bottom:1px solid #29292e;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
}

.songFixedHeader .songTop{
  margin-bottom:10px;
}

.songPartsNav{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  padding:1px 1px 3px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.songPartsNav::-webkit-scrollbar{
  display:none;
}

.songPartBtn{
  flex:0 0 auto;
  border:1px solid #303036;
  background:#18181b;
  color:#a9a9b1;
  border-radius:999px;
  padding:8px 13px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .15s ease;
}

.songPartBtn:hover{
  background:#232328;
  color:#fff;
}

.songPartBtn:active{
  transform:scale(.96);
}

.songPartBtn.active{
  background:#fff;
  color:#111;
  border-color:#fff;
}

.songSection{
  scroll-margin-top:150px;
}

@media (max-width:600px){
  .songFixedHeader{
    padding-bottom:9px;
  }

  .songPartBtn{
    padding:8px 12px;
    font-size:10px;
  }

  .songSection{
    scroll-margin-top:142px;
  }
}
'''
          if 'SONG VIEWER — FIXED TITLE + HORIZONTAL LYRICS PARTS' not in s:
            s=s.replace('</style>', layout_css+'</style>', 1)

          start = s.find('function renderSongViewer(){')
          end = s.find('function formatViewerLine(', start)
          if start < 0 or end < 0:
            raise SystemExit('renderSongViewer function not found')

          block = s[start:end]
          toolbar_marker = '      <div class="songToolbar">'
          top_start = block.find('      <div class="songTop">')
          toolbar_start = block.find(toolbar_marker)
          if top_start < 0 or toolbar_start < 0:
            raise SystemExit('song viewer header/toolbar markers not found')

          top = block[top_start:toolbar_start]
          parts = '''      <div class="songPartsNav" id="songPartsNav">

        ${
          sections
            .map(
              (section,index) => `
                <button
                  class="songPartBtn"
                  type="button"
                  data-part-index="${index}"
                >
                  ${esc(section.name)}
                </button>
              `
            )
            .join('')
        }

      </div>

'''
          replacement = '      <div class="songFixedHeader">\n\n' + top + parts + '      </div>\n\n\n'
          block = block[:top_start] + replacement + block[toolbar_start:]

          old_section = '<div class="songSection">'
          new_section = '<div class="songSection" id="song-section-${index}">'
          if old_section not in block:
            raise SystemExit('songSection marker not found')
          block = block.replace(old_section, new_section, 1)

          listener_marker = "  document\n    .getElementById(\n      'backToLyrics'\n    )"
          listeners = '''  document
    .querySelectorAll('.songPartBtn')
    .forEach(button => {

      button.onclick = () => {

        const index =
          Number(button.dataset.partIndex);

        const target =
          document.getElementById(
            `song-section-${index}`
          );

        if(!target){
          return;
        }

        document
          .querySelectorAll('.songPartBtn')
          .forEach(item => item.classList.remove('active'));

        button.classList.add('active');

        target.scrollIntoView({
          behavior:'smooth',
          block:'start'
        });

      };

    });


'''
          if listener_marker not in block:
            raise SystemExit('viewer event-listener marker not found')
          block = block.replace(listener_marker, listeners + listener_marker, 1)

          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit patched app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add fixed song header and lyrics parts navigation"
          git push
