name: Build Android APK

# Runs on every push that touches the native wrapper, and by hand
# (Actions tab -> Build Android APK -> Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/app @capacitor/push-notifications @capacitor/filesystem @capacitor/share
          npm install -D @capacitor/cli @capacitor/android

      - name: Create Android project
        run: |
          node build-www.cjs
          npx cap add android

      - name: Firebase config (secret GOOGLE_SERVICES_JSON)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON secret (paste the whole text of google-services.json)"; exit 1; fi
          printf '%s' "$GS" > android/app/google-services.json

      - name: Add FolderSave plugin, permissions, notification meta-data
        run: |
          PKG=android/app/src/main/java/app/disciples/worship
          mkdir -p $PKG
          cp android-extras/FolderSavePlugin.java android-extras/MainActivity.java $PKG/
          sed -i '/^dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' android/app/build.gradle
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          '''
          meta='''
                  <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="disciples-updates" />
                  <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />
          '''
          s=s.replace('<application',perms+'<application',1)
          s=re.sub(r'(<application[^>]*>)',lambda m:m.group(1)+meta,s,count=1)
          open(p,'w').write(s)
          PY

      - name: Keep the same signing key every build (optional secret DEBUG_KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: each build is signed differently, so you must uninstall the old app before installing a new APK."; fi

      - name: Sync and build
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Disciples-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
