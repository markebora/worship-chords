name: Fix Lyrics UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-lyrics-ui:
    if: ${{ !contains(github.event.head_commit.message, '[lyrics-ui-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python tools/fix_lyrics_ui.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix lyrics spacing and movable song sections [lyrics-ui-fixed]"
          git push
