name: Apply lyrics navigation test

on:
  push:
    branches:
      - test-lyrics-nav-freeze

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Patch lyrics navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css = r'''

/* =========================================================
   TEST: FROZEN LYRICS SECTION NAVIGATION
========================================================= */

.lyrics-section-nav-fixed{
  position:sticky !important;
  top:0 !important;
  z-index:220 !important;

  display:flex !important;
  align-items:center !important;
  gap:6px !important;

  overflow-x:auto !important;
  overflow-y:hidden !important;

  padding:8px 10px !important;
  margin:0 -22px 14px !important;

  background:rgba(17,17,19,.96) !important;
  border-top:1px solid rgba(255,255,255,.07) !important;
  border-bottom:1px solid rgba(255,255,255,.12) !important;
  backdrop-filter:blur(18px) !important;
  -webkit-backdrop-filter:blur(18px) !important;
}

.lyrics-section-nav-fixed > *{
  flex:0 0 auto !important;
}

.lyrics-section-nav-fixed button{
  flex:0 0 auto !important;
  white-space:nowrap !important;

  border:1px solid #303036 !important;
  border-radius:10px !important;
  background:#1a1a1d !important;
  color:#f7f7f7 !important;

  padding:9px 13px !important;
  min-height:38px !important;

  font-size:12px !important;
  font-weight:800 !important;
}

.lyrics-section-nav-fixed button.is-section-active,
.lyrics-section-nav-fixed button[aria-current="true"]{
  background:#fff !important;
  color:#111 !important;
  border-color:#fff !important;
}

@media (max-width:600px){
  .lyrics-section-nav-fixed{
    margin-left:-12px !important;
    margin-right:-12px !important;
    padding-left:10px !important;
    padding-right:10px !important;
  }
}

'''

          js = r'''

/* =========================================================
   TEST: FROZEN LYRICS SECTION NAVIGATION JS
========================================================= */
(function(){
  const sectionNames = /^(intro|verse|pre[- ]?chorus|chorus|bridge|tag|refrain|hook|outro|instrumental|interlude|vamp|ending|coda|solo|song)$/i;

  function cleanText(value){
    return (value || '').replace(/\s+/g,' ').trim();
  }

  function getSectionButtons(){
    return [...document.querySelectorAll('button')].filter(btn => {
      const text = cleanText(btn.textContent).replace(/^\[|\]$/g,'');
      return sectionNames.test(text);
    });
  }

  function install(){
    const buttons = getSectionButtons();
    if(buttons.length < 2) return;

    // Find the closest common container that actually contains the section buttons.
    let container = buttons[0].parentElement;
    while(container && container !== document.body){
      const count = [...container.querySelectorAll('button')].filter(btn => {
        const text = cleanText(btn.textContent).replace(/^\[|\]$/g,'');
        return sectionNames.test(text);
      }).length;

      if(count >= 2) break;
      container = container.parentElement;
    }

    if(!container || container === document.body) return;

    container.classList.add('lyrics-section-nav-fixed');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(other => {
          other.classList.remove('is-section-active');
          other.setAttribute('aria-current','false');
        });
        btn.classList.add('is-section-active');
        btn.setAttribute('aria-current','true');
      }, {passive:true});
    });

    if(!buttons.some(btn => btn.classList.contains('is-section-active'))){
      buttons[0].classList.add('is-section-active');
      buttons[0].setAttribute('aria-current','true');
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', install, {once:true});
  }else{
    install();
  }

  // The song viewer is rendered dynamically, so retry briefly after navigation/rendering.
  let tries = 0;
  const timer = setInterval(() => {
    install();
    if(++tries > 20) clearInterval(timer);
  }, 300);
})();

'''

          if 'lyrics-section-nav-fixed' not in text:
              marker = '</style>'
              pos = text.rfind(marker)
              if pos == -1:
                  raise SystemExit('Could not find </style> in index.html')
              text = text[:pos] + css + text[pos:]

          if 'TEST: FROZEN LYRICS SECTION NAVIGATION JS' not in text:
              marker = '</script>'
              pos = text.rfind(marker)
              if pos == -1:
                  raise SystemExit('Could not find </script> in index.html')
              text = text[:pos] + js + text[pos:]

          path.write_text(text, encoding="utf-8")

      - name: Commit test change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          rm -f .github/workflows/apply-lyrics-nav-test.yml
          git add .github/workflows/apply-lyrics-nav-test.yml
          git commit -m "Fix frozen lyrics section navigation" || exit 0
          git push origin HEAD:test-lyrics-nav-freeze
