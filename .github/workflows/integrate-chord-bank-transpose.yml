name: integrate-chord-bank-transpose

on:
  push:
    paths:
      - .chordbank-trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old transpose system
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('/* =========================================================\n   KEY / TRANSPOSE SYSTEM')
          end=s.index('/* =========================================================\n   GENERAL FUNCTIONS', start)
          new=r'''/* =========================================================
   CHORD BANK / TRANSPOSE SYSTEM
   =========================================================

   The chord bank is the single authority for chord parsing.
   It separates root, chord quality/extensions, and optional
   slash bass. Transposition changes only the pitch-bearing
   root/bass and preserves the rest of the chord exactly.
   ========================================================= */

const CHORD_BANK = {
  pitch: {
    C:0, 'C#':1, Db:1, D:2, Eb:3, 'D#':3, E:4, F:5,
    'F#':6, Gb:6, G:7, Ab:8, 'G#':8, A:9, Bb:10,
    'A#':10, B:11
  },
  display: ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']
};

function normalizeChordText(text){
  return String(text ?? '')
    .replace(/[♯＃]/g,'#')
    .replace(/[♭]/g,'b')
    .trim();
}

function normalizeKey(k){
  k = normalizeChordText(k);
  if(k === 'A#') return 'Bb';
  if(k === 'D#') return 'Eb';
  if(k === 'Db') return 'C#';
  if(k === 'G#') return 'Ab';
  return CHORD_BANK.display.includes(k) ? k : 'C';
}

function getPitch(root){
  root = normalizeChordText(root);
  return CHORD_BANK.pitch[root] === undefined ? null : CHORD_BANK.pitch[root];
}

function pitchToKey(value){
  return CHORD_BANK.display[((value % 12) + 12) % 12];
}

function parseChord(chord){
  const text = normalizeChordText(chord);
  if(!text) return null;

  const match = text.match(/^([A-G](?:#|b)?)(.*)$/);
  if(!match || getPitch(match[1]) === null) return null;

  const root = match[1];
  const suffix = match[2];
  let bass = null;
  let quality = suffix;

  const slash = suffix.match(/\/([A-G](?:#|b)?)$/);
  if(slash){
    bass = slash[1];
    quality = suffix.slice(0, -slash[0].length);
    if(getPitch(bass) === null) return null;
  }

  return { text, root, quality, bass };
}

function transposeSingleChord(chord, interval){
  const parsed = parseChord(chord);
  if(!parsed) return chord;

  const root = pitchToKey(getPitch(parsed.root) + interval);
  const bass = parsed.bass
    ? '/' + pitchToKey(getPitch(parsed.bass) + interval)
    : '';

  return root + parsed.quality + bass;
}

function transposeChord(chord, interval){
  const text = String(chord ?? '');
  if(!text.trim()) return chord;

  return text.split(/(\s+)/).map(token => {
    if(/^\s+$/.test(token)) return token;
    return transposeSingleChord(token, interval);
  }).join('');
}

function transpose(){
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modalBody').innerHTML = `
    <div class="row">
      <div>
        <h2 style="margin:0">Transpose</h2>
        <div class="muted">Select the new song key</div>
      </div>
      <button type="button" class="btn" onclick="closeModal()">Close</button>
    </div>
    <div class="card" style="margin-top:15px;text-align:center">
      <div class="muted">Current Key</div>
      <div style="font-size:30px;font-weight:800;margin-top:5px">
        ${esc(normalizeKey(currentKey))}
      </div>
    </div>
    <div class="keygrid">
      ${CHORD_BANK.display.map(k => `
        <button type="button" class="keybtn ${k === normalizeKey(currentKey) ? 'selected' : ''}"
          onclick="applyTranspose('${k}')">${k}</button>
      `).join('')}
    </div>
  `;
}

function applyTranspose(target){
  target = normalizeKey(target);
  currentKey = normalizeKey(currentKey);

  const from = getPitch(currentKey);
  const to = getPitch(target);
  if(from === null || to === null){
    toast('Invalid key');
    return;
  }

  const interval = (to - from + 12) % 12;

  Object.keys(base).forEach(part => {
    base[part] = (base[part] || []).map(row => [
      transposeChord(row[0], interval),
      row[1]
    ]);
  });

  currentKey = target;
  closeModal();
  renderSong();
  saveLocal(false);
  toast('Song is now in the key of ' + target);
}

function detectKey(){
  for(const part of arrangement){
    for(const row of base[part] || []){
      const chord = String(row[0] || '');
      const match = chord.match(/^([A-G](?:#|b)?)/);
      if(match && getPitch(match[1]) !== null){
        return normalizeKey(match[1]);
      }
    }
  }
  return 'C';
}


'''
          s=s[:start]+new+s[end:]
          s=s.replace("let transposeSource = JSON.parse(JSON.stringify(base));\n\n", "")
          s=s.replace("    transposeSource =\n      JSON.parse(JSON.stringify(base));\n\n", "")
          s=s.replace("  transposeSource =\n    JSON.parse(JSON.stringify(base));\n\n", "")
          s=s.replace("        transposeSource,\n", "")
          old_load='''      /*\n         New saves contain transposeSource.\n         Old saves do not, so fall back to the loaded base.\n      */\n      transposeSource =\n        d.transposeSource\n          ? d.transposeSource\n          : JSON.parse(JSON.stringify(base));\n'''
          s=s.replace(old_load, '')
          p.write_text(s)
          PY
      - name: Validate integration
        run: |
          grep -q "const CHORD_BANK" index.html
          grep -q "function transposeSingleChord" index.html
          ! grep -q "transposeSource" index.html
          echo "Chord Bank integration checks passed"
      - name: Commit result and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .chordbank-trigger .github/workflows/integrate-chord-bank-transpose.yml
          git add index.html .chordbank-trigger .github/workflows/integrate-chord-bank-transpose.yml
          git commit -m 'Integrate chord bank based transposition'
          git push
